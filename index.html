他在火边坐下，火光照着他的肩膀、他的背、他手掌上的两道疤。他朝你伸出手。`,
    opts:[{t:'……', fx:{rom:{petr:3}, app:{petr:10}, mind:4}, run: S => { cm('petr').lastNight = S.day; return []; },
      r:'后来的事，篝火看见了。它烧得很旺，一直烧到天亮。\n\n他睡着的时候，你看着他的脸，忽然明白了他说的伊甸园是什么：不是一个地方，是一种不害怕的样子。\n\n<q>我不会只属于你，</q>他醒来时说，摸着你的脸，<q>我也不要你只属于我。爱不是一只杯子，装满了就要盖上。</q>'}]},
  {id:'q_petr_start', mode:'camp', party:['petr'], prio:24, if: S => S.f.act >= 2 && !S.q.q_petr, t:'岛上的人', la:'Insula', who:['petr'],
    text:'<q>林子里的人搬到河中间的岛上去了，</q>彼得说，<q>他们脱了衣服，不再干活，说他们已经回到了伊甸园。有人叫他们亚当派。</q>他笑了一下，<q>我有点想他们。</q>',
    opts:[{t:'<q>我们去看看。</q>', fx:{q:{q_petr:1}, set:{adamites:1}, app:{petr:5}}, r:'<q>你会喜欢他们的，</q>他说，<q>他们会吓到你，然后你会喜欢他们。</q>'}]}
);
def({
  id:'s_island', at:'river', act:[2, 3], prio:16, if: S => S.q.q_petr === 1 || (S.f.adamites && !S.q.q_petr), t:'岛', la:'Insula', hint:'河中间的岛上有人在唱歌', who: S => inParty('petr') ? ['petr'] : [],
  text:`你蹚水上了岛。岛上有四五十个人，男人女人，大都光着身子，在柳树下面坐着、躺着、唱着。他们没有害怕你，有一个女人朝你挥手，好像你是一个迟到的客人。

他们的首领是一个白胡子的老人，叫自己“亚当”。他说：<q>我们没有罪了。外面的人还在打仗，我们不打。外面的人还在怕，我们不怕。</q>

一个从塔博尔来的少年蹚水过来，脸色发白：<q>长老们说，你们是魔鬼的人。杰士卡的车阵，三天以后到。</q>`,
  chime:{petr:'彼得的手在你手心里攥紧了。', katka:'<q>他们疯了，</q>卡佳小声说，<q>可他们没伤过人。</q>', zden:'齐德涅克转过身去，背对着岛，脸红到了耳根。'},
  opts:[
    {t:'劝他们离开，往更深的林子去', chk:'grace', fx:{set:{adamitesWarned:1}, q:{q_petr:'done'}, app:{petr:12}, rep:{tabor:-3}}, ffx:{set:{adamitesStay:1}, q:{q_petr:2}},
      r:'老人听完你的话，沉默了很久，然后笑了。<q>伊甸园也可以搬家，</q>他说。第二天夜里，岛上的人蹚水上了对岸，往林子深处走了。三天后，杰士卡的车阵到了，岛上只有柳树。',
      f:'<q>我们不跑，</q>老人说，<q>跑，就是怕。</q>'},
    {t:'去找杰士卡，求他放过他们', chk:'grace', dc: S => S.n.zizka && S.n.zizka.tr >= 15 ? 1 : 0, fx:{set:{adamitesWarned:1}, q:{q_petr:'done'}, rep:{tabor:-5}, app:{petr:10, katka:4}}, ffx:{set:{adamitesStay:1}, q:{q_petr:2}},
      r:'杰士卡听你说完，用那只眼睛看着你。<q>他们不干活，不打仗，还要吃公社的粮，</q>他说，<q>可他们也没杀过人。</q>他沉默了很久，<q>给他们三天。三天以后，我不想再听见他们的名字。</q>',
      f:'<q>魔鬼不需要三天，</q>杰士卡说。他转过身去，接着修他的鼓。'},
    {t:'不管', fx:{q:{q_petr:2}, set:{adamitesStay:1}}, app:{petr:-8}, r:'你蹚水回了岸上。身后，他们还在唱歌。'}
  ]
});
def({
  id:'s_island_fire', mode:'auto', act:[2, 3], prio:40, if: S => S.f.adamitesStay && !S.f.adamitesDead && S.day >= (S.f.islandDay || (S.f.islandDay = S.day + 3)), t:'岛上的火', la:'Ignis', tag:'内扎尔卡河',
  text: S => `消息传来的时候，你${S.region === 'forest' ? '就在河边' : '在很远的地方'}。

杰士卡的人去了岛上。他们不肯走，也不肯穿上衣服。车阵围住了河岸，有人放了火。

${alive('petr') && cm('petr').met ? (inParty('petr') ? '彼得在你身边，看着那个方向，脸白得像纸。他没有哭。他说：<q>他们没有怕。</q>' : '彼得在岛上。') : ''}`,
  opts:[{t:'……', fx: S => inParty('petr') || !cm('petr').met ? {set:{adamitesDead:1}, q:{q_petr:'done'}, mind:-2, app:{petr:-5}} : {set:{adamitesDead:1}, q:{q_petr:'done'}, kill:'petr', why:'和岛上的人一起，死在了内扎尔卡河的火里。', mind:-3}, r:'那一夜，河上的火映红了半边天。和塔博尔那一夜北边的光，是同一种红。'}]
});

// ---------- 伊洛娜 ----------
def(
  {id:'c_ilona1', mode:'camp', party:['ilona'], prio:20, if: S => app('ilona') >= 8, t:'毡帐', la:'Tentorium', who:['ilona'],
    text:'伊洛娜在给你的老马梳鬃毛，一边梳一边用库曼话跟它说话。\n\n<q>我们的毡帐是白的，</q>她说，<q>冬天搬到河边，夏天搬到山上。我们不住房子，房子不会走。你们捷克人一辈子住在一个地方，不闷吗？</q>',
    opts:[{t:'<q>闷。可是走了，就回不来了。</q>', fx:{app:{ilona:6}}, r:'她停下梳子，看了你一眼。<q>你说得像个库曼老人，</q>她说，<q>他们也这么说，然后再走一次。</q>'},
      {t:'<q>你为什么来打仗？</q>', fx:{app:{ilona:4}}, r:'<q>国王给马，</q>她说，<q>一个人一匹，打完了就是你的。我弟弟想要一匹好马。</q>她把梳子插回腰带里，<q>我跟着他。</q>'}]},
  {id:'c_ilona2', mode:'camp', party:['ilona'], prio:21, if: S => app('ilona') >= 25, t:'异端', la:'Haeretici', who:['ilona'],
    text:'<q>我问过营里的神父，异端是什么，</q>伊洛娜说，<q>他说，是信错了上帝的人。我说，那库曼人呢？我们的祖父信天，信火，信祖先。他说，库曼人受过洗了，就不算。</q>她笑了，<q>那波希米亚人也受过洗啊。</q>',
    opts:[{t:'<q>他们吵的是杯子。</q>', fx:{app:{ilona:6}}, r:'<q>杯子？</q>她瞪大眼睛，<q>为了一只杯子，全欧洲的人走了两个月的路？</q>她笑得停不下来，<q>你们真是疯了。</q>'},
      {t:'<q>他们吵的不是杯子，是谁有资格拿杯子。</q>', fx:{app:{ilona:8}, xp:{lore:1}}, r:'她想了很久。<q>那我懂了，</q>她说，<q>那跟马一样。谁骑马，谁走路。</q>'}]},
  {id:'c_ilona_flirt', mode:'camp', party:['ilona'], prio:30, if: S => app('ilona') >= 35 && cm('ilona').rom === 0, t:'铜铃', la:'Tintinnabula', who:['ilona'],
    text:'伊洛娜在拆她的辫子。一根，两根，每根辫梢都有一个铜铃，拆一根，响一下。\n\n<q>库曼的女人，</q>她说，<q>只在一个人面前拆辫子。</q>她拆到第三根，停了下来，看着你。<q>帮我拆剩下的。</q>',
    opts:[{t:'帮她拆', fx:{rom:{ilona:1}, app:{ilona:8}}, r:'你的手指很笨，铜铃一直在响。她没有笑你。她背对着你坐着，一动不动，只有耳朵尖红了。拆完最后一根，她的头发散下来，一直垂到腰上，像一匹黑色的马鬃。'},
      {t:'<q>这是什么意思？</q>', fx:{app:{ilona:2}}, r:'<q>没什么意思，</q>她说，自己把剩下的辫子拆了，<q>库曼人的老规矩。你们不懂。</q>'}]},
  {id:'c_ilona_kiss', mode:'camp', party:['ilona'], prio:31, if: S => app('ilona') >= 50 && cm('ilona').rom === 1, t:'马背上', la:'In equo', who:['ilona'],
    text:'伊洛娜把你拉上了她的马，坐在她身后。<q>抱紧，</q>她说，然后马就跑起来了，在月光下的草地上，跑得像要飞起来。\n\n跑到河边，她勒住了马，没有下来。她转过身，你们的脸离得很近。',
    opts:[{t:'吻她', fx:{rom:{ilona:2}, app:{ilona:8}}, r:'她吻你的样子，像在马背上射箭：先屏住呼吸，然后一下子松开。\n\n<q>库曼人，</q>她喘着气说，<q>不在地上接吻。在地上，人会想太多。</q>'}]},
  {id:'c_ilona_night', mode:'camp', party:['ilona'], prio:32, if: S => app('ilona') >= 65 && cm('ilona').rom === 2, t:'皮袍', la:'Nox', who:['ilona'],
    text:'夜里很冷。伊洛娜把她的皮袍铺在草地上，铺得很平，然后钻进你的毯子里，冰凉的脚贴着你的腿。\n\n<q>库曼人冬天就是这么睡的，</q>她说，<q>两个人，一件皮袍。</q>\n\n<q>现在是夏天。</q>\n\n<q>我知道，</q>她说，把脸埋进你的脖子里，<q>我冷。</q>',
    opts:[{t:'……', fx:{rom:{ilona:3}, app:{ilona:10}, mind:3}, run: S => { cm('ilona').lastNight = S.day; return []; },
      r:'后来的事，只有马知道。它在不远的地方吃草，一直很安静。\n\n天快亮的时候，她用库曼话在你耳边说了一句什么。你问她是什么意思。她说：<q>“我的毡帐朝东开门”。</q>她没有解释。'}]},
  {id:'q_ilona_start', mode:'camp', party:['ilona'], prio:24, if: S => app('ilona') >= 20 && S.f.campUp && !S.q.q_ilona, t:'本采', la:'Frater', who:['ilona'],
    text:'<q>我弟弟本采还在营里，</q>伊洛娜说，<q>在匈牙利营。他十六岁。他想要一匹马，他会为了一匹马死在你们的山上。</q>',
    opts:[{t:'<q>我们去把他带出来。</q>', fx:{q:{q_ilona:1}, app:{ilona:8}}, r:'<q>夜里去，</q>她说，<q>库曼人夜里看得见。</q>'}]}
);
def({
  id:'s_bence', at:'hungarians', ph:[2], prio:18, party:['ilona'], if: S => S.q.q_ilona === 1, t:'马群', la:'Equi', who:['ilona'], hint:'和伊洛娜一起，夜里去匈牙利营',
  text:'匈牙利营里，库曼人围着火在唱歌。一个瘦高的少年坐在马群边上，在给一匹灰马喂草。伊洛娜用库曼话叫了他一声，他回过头，愣了很久，然后扑过来抱住了她。\n\n<q>跟我走，</q>伊洛娜说，<q>回家。</q>\n\n<q>可是马，</q>本采说，<q>国王答应给我一匹马。</q>',
  opts:[
    {t:'<q>带走那匹灰马。算国王给的。</q>', chk:'nerve', fx:{set:{ilonaHome:1, benceSaved:1}, q:{q_ilona:'done'}, app:{ilona:15}, rep:{crown:-8}}, ffx:{set:{benceSaved:1}, q:{q_ilona:'done'}, hurt:1, app:{ilona:10}, rep:{crown:-10}},
      r:'你们牵着灰马出了营，没有人拦。库曼人的哨兵看见了，转过了头，假装在看星星。\n\n在营地外面的草地上，伊洛娜抱着她弟弟，又看看你。<q>我要送他回家，</q>她说，<q>平原很远。</q>她停了一下，<q>可是我会回来。库曼人的毡帐，可以搬。</q>',
      f:'哨兵喊了起来。你们骑着马冲出了营地，身后箭飞得像下雨。你的胳膊上挨了一下。本采一路都在笑。'},
    {t:'<q>让他自己选。</q>', fx:{q:{q_ilona:'done'}}, run: S => { S.f.benceStays = 1; return applyFx({app:{ilona:4}}); },
      r:'本采看着他姐姐，又看着那匹灰马。<q>打完这一仗，</q>他说，<q>我就有马了。</q>\n\n伊洛娜没有再劝。她抱了他很久，把自己的一个铜铃系在他的辫梢上，然后转身走了。'}
  ]
});

// ---------- 马捷伊 ----------
def({
  id:'s_matej', at:'carolinum', act:[2, 3], prio:12, if: S => !cm('matej').met, t:'先生', la:'Magister', who:['matej'], hint:'学院的走廊里有人在吵架',
  text:`查理学院的走廊里，一个穿黑袍的先生正在和一群学生吵架，吵的是圣餐里的酒到底变没变成血。

他看见了你的剑，停了下来。<q>骑士，</q>他说，<q>来得正好。告诉这些孩子，一个人是怎么用剑证明圣餐的本质的。</q>学生们笑了。

他朝你伸出手。<q>马捷伊，文学硕士，神父，在这里教逻辑。他们说我是圣杯派里最不像圣杯派的人。</q>`,
  opts:[
    {t:'<q>用剑证明不了。可以用剑保护证明它的人。</q>', fx:{meet:'matej', t:{matej:10}}, r:'他眯起眼睛，像在看一个有趣的命题。<q>好答案，</q>他说，<q>错误，但是好。</q>'},
    {t:'<q>那就别用剑。用杯子。</q>', fx:{meet:'matej', t:{matej:8}}, r:'他大笑起来，学生们也笑了。<q>你会是我最好的学生，</q>他说，<q>要是你肯付学费的话。</q>'}
  ]
});
def({
  id:'s_matej_books', at:'carolinum', act:[2, 3], prio:13, if: S => cm('matej').met && !S.f.booksDone, t:'异教的书', la:'Libri', who:['matej'], hint:'马捷伊在搬书',
  text:'马捷伊在图书馆里搬书，抱着一摞摞羊皮书往地窖里走，满头是汗。\n\n<q>新城的人明天要来，</q>他说，<q>热利夫斯基讲了一次道，说大学里藏着异教的书：奥维德、维吉尔、亚里士多德。他们要来烧。</q>他抱着一本《变形记》，像抱着一个孩子，<q>胡斯是读着亚里士多德长大的。他们不知道。</q>',
  opts:[
    {t:'帮他把书藏进地窖', chk:'arm', fx:{set:{booksSaved:1, booksDone:1}, q:{q_matej:'done'}, t:{matej:15}, join:'matej'}, ffx:{set:{booksSaved:1, booksDone:1}, q:{q_matej:'done'}, t:{matej:10}, hurt:1, join:'matej'},
      r:'你们搬了一整夜。天亮的时候，地窖里堆满了书，马捷伊坐在书堆上，喘着气，笑了。<q>你知道吗，</q>他说，<q>这是我第一次觉得骑士有用。</q>\n\n第二天，新城的人来了，只找到几本账簿。他们烧了账簿，唱着歌走了。\n\n<q>我跟你走，</q>马捷伊说，<q>地窖的钥匙我带着。学院不需要我，这些书需要。</q>'},
    {t:'站在学院门口，和他们讲道理', chk:'grace', fx:{set:{booksSaved:1, booksDone:1}, q:{q_matej:'done'}, t:{matej:12}, rep:{prague:5}, join:'matej'}, ffx:{set:{booksDone:1}, q:{q_matej:'done'}, t:{matej:5}, rep:{tabor:-3}},
      r:'你站在门口，对拿着火把的人说：你们要烧的这些书，胡斯都读过。读过了，他才知道教士们在骗人。\n\n人群停住了。领头的人想了很久，问你：<q>真的？</q>\n\n马捷伊在你身后，用拉丁语说了一句什么，然后用捷克语说：<q>我跟你走。我想看看你还能说服谁。</q>',
      f:'人群没有停。他们冲进了图书馆。马捷伊抢出了一半的书。另一半，在广场上烧了一下午。灰飘起来，落在泰恩教堂的圣杯上。'}
  ]
});
def(
  {id:'c_matej1', mode:'camp', party:['matej'], prio:20, if: S => app('matej') >= 8, t:'逻辑', la:'Logica', who:['matej'],
    text:'<q>你知道我为什么当神父吗？</q>马捷伊问，<q>因为我十六岁的时候，想证明上帝不存在。我读了所有的书，写了一篇很长的论文。写到最后一页，我发现我证明不了。</q>他喝了一口酒，<q>证明不了不存在，也证明不了存在。我就当了神父。总得有人在中间站着。</q>',
    opts:[{t:'<q>中间冷吗？</q>', fx:{app:{matej:8}}, r:'他愣了一下，然后笑了，笑得有点难过。<q>冷，</q>他说，<q>你是第一个问的。</q>'},
      {t:'<q>那你现在信什么？</q>', fx:{app:{matej:5}, lens:-1}, r:'<q>我信可以被检验的东西，</q>他说，<q>还信几件不能被检验的。比如说，你是个好人。</q>'}]},
  {id:'c_matej2', mode:'camp', party:['matej'], prio:21, if: S => app('matej') >= 25, t:'康斯坦茨', la:'Constantia', who:['matej'],
    text:'<q>我在康斯坦茨，</q>马捷伊说，看着火，<q>胡斯被烧死那天。我站在人群里，离他二十步。他们把他的书先烧了，然后才烧他。</q>\n\n他沉默了很久。<q>他在火里唱歌。唱到第三句，烟呛住了他。我一直在想，第四句是什么。</q>',
    opts:[{t:'握住他的手', fx:{app:{matej:10}, mind:1}, r:'他没有抽回手。他的手很凉，一直在抖。过了很久，他说：<q>谢谢。我从来没跟人说过这件事。</q>'}]},
  {id:'c_matej_flirt', mode:'camp', party:['matej'], prio:30, if: S => app('matej') >= 35 && cm('matej').rom === 0, t:'奥维德', la:'Ovidius', who:['matej'],
    text:'马捷伊在念书，念的是奥维德，拉丁文，声音很低。念到一段，他停了下来，看了你一眼，又低下头去。\n\n<q>念的是什么？</q>\n\n<q>一个神父不该念的东西，</q>他说，脸红了，<q>关于……爱的技艺。</q>',
    opts:[{t:'<q>念给我听。用捷克语。</q>', fx:{rom:{matej:1}, app:{matej:8}}, r:'他念了。他的翻译很好，好得不像是第一次翻。念到一半，他停下来，把书合上了。<q>剩下的，</q>他说，<q>我要先去告解。</q>他没有去。'},
      {t:'<q>神父也是人。</q>', fx:{app:{matej:4}}, r:'<q>这是一个异端的命题，</q>他说，<q>也是我最喜欢的一个。</q>'}]},
  {id:'c_matej_kiss', mode:'camp', party:['matej'], prio:31, if: S => app('matej') >= 50 && cm('matej').rom === 1, t:'反证法', la:'Reductio', who:['matej'],

GREET.zden = ['齐德涅克朝你点了点头。', '<q>愿主保佑你。</q>', '他在擦剑，擦得很仔细。'];
ASK.zden = {end:{t:'<q>末日只属于上帝，</q>他说，<q>算日子的人，都是在偷上帝的东西。</q>'}, cup:{t:'<q>维特科夫……</q>他沉默了很久，<q>我不知道。我不想知道。</q>'}, lady:{t:'<q>白衣女人？</q>齐德涅克的脸色变了，<q>我小时候见过一次。第二天，我母亲死了。</q>'}, shaft:{t:'<q>那不是战争，</q>他说，<q>那是罪。不管是谁扔的，不管扔的是谁。</q>'}};

T('petr', [
  {k:'a', pr:3, t:'<q>今天的天很好，</q>彼得说，<q>你注意到了吗？你总是注意不到天。</q>'},
  {k:'forest', pr:5, if: S => S.region === 'forest', t:'彼得光着脚踩在青苔上，闭着眼睛。<q>回家了，</q>他说。'},
  {k:'camp', pr:6, if: S => S.region === 'camp', t:'<q>他们也是人，</q>彼得看着营地说，<q>只是穿着铁。铁很重。</q>'},
  {k:'dead', pr:8, if: S => S.f.adamitesDead, t:'彼得很久没有唱歌了。'},
  {k:'lover', pr:9, if: S => isLover('petr'), t:'彼得当着所有人的面吻了你，好像这是世界上最自然的事。也许是。'}
]);
GREET.petr = ['彼得朝你笑了笑。', '<q>你今天看起来很累。来，坐一会儿。</q>', '他在给一个陌生人包扎。'];
ASK.petr = {end:{t:'<q>世界每天都在结束，</q>彼得说，<q>也每天都在开始。你只是要醒着。</q>'}, touch:{clue:'t_herbs', t:'<q>柳树皮，缬草，一点蜂蜜，</q>彼得笑着说，<q>还有一双手。你觉得哪一样治的病？</q>'}, mill:{t:'<q>那个磨坊主很爱他的儿子，</q>彼得说，<q>爱到装不下，就装进杯子里。</q>'}, cup:{t:'<q>上帝不在杯子里，</q>他说，<q>在喝的人嘴里。</q>'}};

T('ilona', [
  {k:'a', pr:3, t:'<q>你的马，</q>伊洛娜说，<q>又瘦了。你自己吃饭，也要让它吃饭。</q>'},
  {k:'camp', pr:6, if: S => S.region === 'camp', t:'伊洛娜在营地里低着头走，把辫子藏在兜帽里。'},
  {k:'prague', pr:5, if: S => S.region === 'prague', t:'<q>这么多塔，</q>伊洛娜仰着头看，<q>你们是怕上帝看不见你们吗？</q>'},
  {k:'home', pr:7, if: S => S.f.ilonaHome, t:'<q>本采到家了吗？</q>伊洛娜望着东边，<q>平原上现在是夏天，草比马还高。</q>'},
  {k:'lover', pr:9, if: S => isLover('ilona'), t:'伊洛娜从马背上弯下腰，在你耳边说了一句库曼话，说完就跑了，铜铃响了一路。'}
]);
GREET.ilona = ['伊洛娜在喂马。', '<q>又是你。</q>她说，可是在笑。', '她在编辫子。'];
ASK.ilona = {end:{t:'<q>库曼人的老人说，世界是一顶毡帐，</q>伊洛娜说，<q>帐杆断了，就塌了。可是帐杆是木头，可以换。</q>'}, cup:{t:'<q>维特科夫那天，</q>她说，<q>我的马不肯往山上走。马比人聪明。</q>'}, lady:{t:'<q>我们那里也有，</q>她说，<q>白衣服的女人，在草原上走。我奶奶说，那是想家的人。</q>'}};

T('matej', [
  {k:'a', pr:3, t:'<q>今天我想通了一个问题，</q>马捷伊说，<q>然后又想出了三个新的。这就是学问。</q>'},
  {k:'tabor', pr:5, if: S => S.region === 'tabor', t:'<q>他们把书都烧了，</q>马捷伊看着塔博尔说，<q>说书是老爷的东西。可是没有书，他们怎么知道胡斯说了什么？</q>'},
  {k:'kutna', pr:6, if: S => S.region === 'kutna', t:'马捷伊在圣芭芭拉教堂前站了很久。<q>真美，</q>他说，<q>是用什么钱盖的，我不想知道。</q>'},
  {k:'lover', pr:9, if: S => isLover('matej'), t:'马捷伊在你的手心里写了一个拉丁词，写完就把手合上了，不让你看。'}
]);
GREET.matej = ['马捷伊在看书。', '<q>你又来打断我的思考了。</q>他说，把书合上了。', '<q>我有一个问题要问你。</q>他说，然后忘了是什么。'];
ASK.matej = {end:{clue:'e_cold', t:'<q>北方的火，</q>马捷伊说，<q>亚里士多德写过，叫“天上的裂缝”。冷的年份多。和末日没有关系，和冬天有关系。</q>'}, cup:{clue:'c_panic', t:'<q>那道山脊只有七个人宽，</q>马捷伊说，<q>几千个穿甲的人往后退。你算算。</q>他停了一下，<q>可是那个神父没有被射中。这个我算不出来。</q>'}, shaft:{clue:'s_water', t:'<q>矿井下面都有水，</q>马捷伊说，<q>水滴在空的东西上，就是敲击声。</q>他没有看你，<q>可我也不想下去看。</q>'}, touch:{t:'<q>柳树皮能退烧，</q>马捷伊说，<q>希腊人就知道。他不是骗子，他只是不告诉别人。</q>'}, lady:{t:'<q>疯病会在一个家族里传，</q>马捷伊说，<q>像眼睛的颜色。</q>'}};

T('eliska', [
  {k:'a', pr:3, t:'<q>你今天花了多少钱？</q>爱丽什卡问，<q>不，别告诉我。我会心疼。</q>'},
  {k:'prague', pr:5, if: S => S.region === 'prague', t:'爱丽什卡走在新城的街上，每走几步就有人朝她点头。她每一个都点回去，每一个都记着。'},
  {k:'camp', pr:6, if: S => S.region === 'camp', t:'<q>这里的啤酒很差，</q>爱丽什卡说，<q>我要是早来一个月，能赚一座房子。</q>'},
  {k:'lover', pr:9, if: S => isLover('eliska'), t:'爱丽什卡把一个小钱袋塞进你的腰带里。<q>别问，</q>她说，<q>就当是利息。</q>'}
]);
GREET.eliska = ['爱丽什卡朝你举了举杯。', '<q>有什么新消息吗？</q>', '她在算账，算得很快。'];
ASK.eliska = {end:{t:'<q>末日？</q>爱丽什卡说，<q>二月里，城里的面粉涨了三倍。有人赚了很多钱。我是其中一个。</q>'}, cup:{t:'<q>维特科夫那天，</q>她说，<q>迈森人的元帅前一晚喝醉了。这个，是我知道的。</q>'}, lady:{t:'<q>玫瑰堡的监护人，</q>她说，<q>每个月从布拉格买一种安眠的药。买给谁，我不知道。我猜得到。</q>', clue:'l_sister'}};

// ---------- 篝火边的闲话 ----------
BANTER.push(
  {who:['katka', 'zden'], t:'卡佳和齐德涅克在火边吵了一晚上，吵的是领主该不该存在。吵到最后，齐德涅克说：<q>至少，领主会记得自己的佃户叫什么名字。</q>卡佳愣了一下，没有再说话。'},
  {who:['katka', 'petr'], t:'彼得在教卡佳唱一首林子里的歌。卡佳唱得很难听，彼得笑得滚进了草里。'},
  {who:['katka', 'ilona'], t:'卡佳和伊洛娜在比谁的武器更好，连枷还是弓。比到最后，她们一起把齐德涅克的头盔当靶子。'},
  {who:['zden', 'matej'], t:'齐德涅克和马捷伊用拉丁语辩论了一晚上圣餐。你一句也没听懂，可你听出来，他们都很高兴。'},
  {who:['matej', 'eliska'], t:'马捷伊和爱丽什卡在算一道题：如果每个塔博尔人往木桶里放一个格罗申，一年能买多少铁。他们算出来的数不一样，吵了起来。'},
  {who:['petr', 'zden'], t:'彼得问齐德涅克，为什么总是数念珠。齐德涅克说，数着，手就不抖了。彼得握住了他的手。齐德涅克没有抽开。'},
  {who:['ilona', 'eliska'], t:'爱丽什卡想从伊洛娜那里买一匹库曼马。伊洛娜开了一个价，爱丽什卡笑了，说这是她这个夏天听过最好的笑话。'},
  {who:['katka'], t:'卡佳在火边哼歌，哼的是塔博尔人的歌。哼着哼着，她睡着了，连枷还抱在怀里。'},
  {who:['zden'], t:'齐德涅克念完晚祷，躺下来，看着星星。<q>它们和玫瑰堡上面的星星，是一样的，</q>他说，像是很意外。'},
  {who:['petr'], t:'彼得光着脚踩灭了一颗跳出来的火星，一点也不疼的样子。'},
  {who:['ilona'], t:'伊洛娜把马拴好，在马旁边睡下了。她说，马在旁边，她才睡得着。'},
  {who:['matej'], t:'马捷伊借着火光看书，看到很晚。你醒来一次，他还在看，嘴唇在动。'},
  {who:['eliska'], t:'爱丽什卡在火边记账，记的是这一路花了多少钱。记完了，她看了一会儿，又划掉了一行。'}
);
// ===== 路上：遭遇、闲话、旁人的话 =====
def(
  {id:'r_flagellants', mode:'road', w:3, t:'鞭笞者', la:'Flagellantes', tag:'路上',
    text:'路上过来一队人，赤着上身，一边走一边用带铁钩的鞭子抽自己的背，抽得血顺着腰往下流。他们在唱：<q>末日近了，末日近了。</q>\n\n领头的人看见你，停下来：<q>骑士，你的罪呢？你不抽你的罪吗？</q>',
    opts:[
      {t:'给他们水和布', fx:{rep:{home:1}, mind:1}, app:{petr:5, katka:3}, r:'他们接过水，喝了，又接着抽。一个年轻人临走时回头看了你一眼，眼睛里有一种很深的累。'},
      {t:'<q>上帝不要你们的血。</q>', chk:'grace', lens:-1, fx:{lens:-1, xp:{grace:1}}, app:{matej:6, petr:4, zden:-3}, r:'领头的人看了你很久。<q>那他要什么？</q>他问。你答不上来。他们唱着歌走了。', f:'他们没有听。他们唱得更响了。'},
      {t:'跟着他们唱一段', lens:2, fx:{lens:2, mind:-1}, app:{zden:3, matej:-4}, r:'你跟着唱了一段。唱着唱着，你也觉得背上疼了起来，像有人在抽你。他们走远了，你还站在路上，背疼了一整天。'}
    ]},
  {id:'r_relic', mode:'road', w:3, t:'胡斯的灰', la:'Reliquiae', tag:'路上',
    text:'一个货郎拦住你，打开一个小木盒，里面是一撮灰。<q>胡斯的骨灰，</q>他压低声音，<q>康斯坦茨的火堆上抢下来的。他们把骨灰撒进了莱茵河，可我的叔叔捞上来了一把。十个格罗申。</q>',
    opts:[
      {t:'买下来', cost:10, lens:1, fx:{lens:1, set:{husAsh:1}, mind:1}, app:{katka:2, matej:-5}, r:'你把那撮灰包在一块布里，揣在怀里。也许是胡斯，也许是货郎家的灶灰。揣着它，你觉得胸口暖了一点。'},
      {t:'<q>这是灶灰。</q>', chk:'lore', lens:-1, fx:{lens:-1, money:5}, app:{matej:6, eliska:4}, r:'你捏起一点灰闻了闻，有一股松木和羊油的味道。货郎的脸红了，塞给你五个格罗申，求你别说出去。', f:'你说那是灶灰。货郎赌咒发誓，说他叔叔亲眼看见的。你也说不准了。'},
      {t:'走开', r:'你走开了。走了很远，回头看，他已经在拦下一个人了。'}
    ]},
  {id:'r_bandits', mode:'road', w:3, t:'林间的人', la:'Latrones', tag:'路上',
    text:'林子里钻出来五个人，拿着棍子、斧头和一把生锈的剑。他们不像强盗，像饿坏了的农民。领头的说：<q>老爷，把马留下，钱留下，你走。</q>',
    opts:[
      {t:'拔剑', chk:'arm', fx:{xp:{arm:1}, honor:2}, ffx:{hurt:1, money:-15}, app:{zden:3, katka:-3}, r:'你的剑一出鞘，他们就散了，比来的时候还快。只有一个跑得慢的，被自己的斧头绊倒，坐在地上哭。', f:'他们比看上去会打。你挨了一棍，丢了十五个格罗申，才把他们赶跑。'},
      {t:'给他们一些钱', cost:15, fx:{rep:{home:1}}, app:{katka:8, petr:6, eliska:-6}, r:'你扔给他们一袋格罗申。领头的人愣了，然后跪下来，在泥里给你磕了一个头。<q>老爷，</q>他说，<q>我们是赫鲁比的人。地被烧了。</q>'},
      {t:'<q>去塔博尔吧。那里有饭吃。</q>', chk:'grace', fx:{rep:{tabor:4}}, app:{katka:6, zden:-2}, r:'他们互相看了看，放下了棍子。<q>真的有饭吃？</q>你说真的。他们往东走了。', f:'<q>塔博尔？</q>领头的人啐了一口，<q>那里的长老比老爷还狠。</q>他们还是抢走了你的一袋干粮。'}
    ]},
  {id:'r_nuns', mode:'road', w:2, if: S => S.f.act >= 1, t:'修女', la:'Moniales', tag:'路上',
    text:'路边的沟里躲着三个修女，最老的一个已经走不动了。她们的修院昨夜被烧了。看见你的剑，她们抱在一起，开始念玫瑰经。',
    opts:[
      {t:'把她们送到玫瑰堡', fx:{rep:{rose:6, tabor:-3}, honor:4}, app:{zden:10, katka:-5, petr:4}, r:'你把最老的那个扶上了你的马，自己牵着走。到玫瑰堡的时候，她一直握着你的手，说：<q>主会记得你。</q>'},
      {t:'给她们一些钱，指路', cost:10, fx:{honor:2}, app:{zden:4, eliska:2}, r:'你给了她们钱，告诉她们往南走，去玫瑰堡。她们走了。你不知道她们走到了没有。'},
      {t:'走开', vow:'abandon', app:{zden:-8, petr:-5, katka:2}, r:'你走开了。身后，她们的念珠声一直跟着你，跟了很远。'}
    ]},
  {id:'r_wedding', mode:'road', w:2, t:'婚礼', la:'Nuptiae', tag:'路上',
    text:'路边的村子里在办婚礼。新娘戴着麦穗编的花冠，新郎喝醉了，在跟一只鹅跳舞。一个老人拉住你的马缰：<q>骑士，喝一杯！今天不打仗！</q>',
    opts:[
      {t:'下马，喝一杯，跳一支舞', fx:{mind:3, rep:{home:1}}, app:{petr:6, katka:6, ilona:5, eliska:4, zden:2}, run: S => { const l = S.lovers.find(inParty); if (l) return applyFx({app:{[l]:5}}); return []; },
        r: S => { const l = S.lovers.find(inParty); return `你跳了一支舞，跳得很糟，所有人都在笑。${l ? `${nm(l)}拉着你又跳了一支，在所有人面前。新娘把她的花冠扔给了你们。` : '新娘把一朵麦穗插在你的头盔上。'}\n\n走的时候，天快黑了，村子里还在唱。你忽然觉得，这个夏天也许不全是仗。`; }},
      {t:'送新人一个格罗申，走了', cost:1, fx:{mind:1}, r:'新娘红着脸接过格罗申，说要把它缝在第一个孩子的襁褓里。'}
    ]},
  {id:'r_hanged', mode:'road', w:2, t:'十字路口', la:'Furcae', tag:'路上',
    text:'十字路口的老橡树上吊着四个人，身上挂着一块木牌：异端。乌鸦已经来过了。树下的草地上，有一只小小的木头杯子。',
    opts:[
      {t:'把他们放下来，埋了', takes:true, fx:{rep:{tabor:5, crown:-2}, mind:-1, honor:3}, app:{katka:8, petr:8, zden:4, matej:4}, r:'你挖了一下午。埋好以后，你把那只木头杯子放在了坟头上。'},
      {t:'把木牌摘下来', fx:{rep:{tabor:2}}, app:{katka:4}, r:'你把木牌摘下来，扔进了沟里。他们还挂在那里，可至少，不叫那个名字了。'},
      {t:'走开', r:'你走开了。乌鸦在你身后叫了一声。'}
    ]},
  {id:'r_lights', mode:'road', w:2, t:'沼泽里的光', la:'Ignes fatui', tag:'路上 · 黄昏',
    text: S => `天黑得早，你们还在沼泽边的路上。路边的芦苇里，亮起了几点小小的光，蓝的，一闪一闪，像有人提着灯在走。

${L('它们在等你。老人们说，那是没受洗就死了的孩子，在找回家的路。跟着它们，就会走进泥里。', '是沼气。你在修院的书里读过：烂泥里冒出来的气，遇上一点火星就会烧，烧得很冷，没有烟。', '光在芦苇里一闪一闪。')}`,
    opts:[
      {t:'跟上去看看', chk:'nerve', lens:1, fx:{lens:1, mind:-1}, ffx:{hurt:1, mind:-2}, app:{petr:4}, r:'你跟着光走了一段，光停在一个小水塘边，灭了。水塘边有一个很小的土堆，上面插着一根柳枝。你在土堆前站了一会儿，回到了路上。', f:'你一脚踩进了泥里，泥没过了膝盖。等你爬出来，光已经不见了。'},
      {t:'不看，赶路', lens:-1, fx:{lens:-1}, r:'你们没有回头。光在身后跟了一段，然后就落下了。'}
    ]},
  {id:'r_deserters', mode:'road', w:3, act:[2, 3], t:'逃兵', la:'Desertores', tag:'路上',
    text:'三个穿十字军号衣的人坐在路边烤一只偷来的鸡。看见你，他们跳起来，拔出了剑，可是剑在抖。一个年轻人用德语说：<q>我们不打了。我们只想回家。</q>',
    opts:[
      {t:'放他们走', fx:{rep:{crown:-2}, honor:2}, app:{petr:6, ilona:6, zden:4, katka:-4}, r:'你让开了路。年轻人把鸡腿塞给你，算是谢礼。他们往北走了，走得很快。'},
      {t:'雇下他们，给柳溪干活', cost:20, fx:{rep:{home:6}, set:{deserterHands:1}}, app:{eliska:6, ilona:4}, r:'他们愣了，然后笑了。<q>干活？</q>年轻人说，<q>我家里就是种地的。</q>他们跟着你的方向走了，去柳溪。'},

function gossipLine() {
  const f = S.f, pool = ['人们在说今年的麦子，说雨水，说谁家的牛下了双胞胎。好像没有在打仗。'];
  if (f.act === 1) pool.push('有人说，塔博尔山上的人把钱都放进木桶里，谁要谁拿。有人说，那是疯了。有人说，那才是对的。');
  if (f.sudomerDone) pool.push('人们在说苏多梅日。说着说着，就变成了：四十个人打退了两万个骑士，女人们的头巾变成了天使的翅膀。');
  if (f.act >= 2) pool.push('有人说，库特纳霍拉的矿井里，夜里有人在敲。没有人敢说是谁。');
  if (f.campUp) pool.push('人们在说十字军营里有一个法兰西骑士，走了两个月，到处问异端在哪里。说完了，大家都笑了。');
  if (f.adamites) pool.push('有人压低声音说起林子里光着身子的人。说的人脸红，听的人也脸红。');
  if (f.bohusDead) pool.push('有人说，赫鲁比的博胡斯拉夫死在了泥里。他家的佃户第二天就去塔博尔了，一个没剩。');
  if (f.vitkovDone) pool.push('人们在说维特科夫。每个人说的都不一样。');
  if (S.lovers.length) pool.push(`有人在背后说你和${nm(S.lovers[0])}的事。说的人没看见你，你也假装没听见。`);
  return pick(pool);
}

  id:'s_hrubi', mode:'here', at:'village', act:[2, 3], prio:20, if: S => (S.f.bohusDead || S.f.bohusSpared) && !S.q.q_hrubi, t:'赫鲁比的人', la:'Sine domino', tag:'柳溪',
  text: S => `村口来了七八个人，都是赫鲁比的老佃户，戴着帽子，攥在手里。领头的老人叫马捷，你小时候在溪边见过他钓鱼。

${S.f.bohusDead ? '<q>老爷死在苏多梅日了，</q>他说，<q>他没有儿子。赫鲁比现在没有主人。</q>' : '<q>老爷从苏多梅日回来以后，就去朝圣了，</q>他说，<q>他走之前说，赫鲁比的事，让我们来找你。他说，你从泥里拉过他。</q>'}

他们看着你，等你说话。年轻的都去了塔博尔，留下来的，都是走不动的。`,
  opts:[
    {t:'<q>我来做赫鲁比的领主。照旧交租，照旧有人管。</q>', fx:{set:{hrubi:'lord'}, q:{q_hrubi:'done'}, rep:{home:6, rose:4, crown:3}, money:30}, app:{katka:-10, eliska:6, zden:4},
      r:'老人们松了一口气，一个一个过来吻你的手。第一年的租子，他们提前交了一半。\n\n你看着那一小袋格罗申，忽然想起卡佳说过的话：做邻居，比做老爷好做。'},
    {t:'<q>去塔博尔吧。那里有人管饭。</q>', fx:{set:{hrubi:'tabor'}, q:{q_hrubi:'done'}, rep:{tabor:8}}, app:{katka:6, petr:3},
      r:'老人们互相看了看。马捷叹了口气：<q>走不动也得走。</q>第二天，赫鲁比的最后一缕炊烟灭了。你站在溪边看着那些空房子，看了很久。'},
    {t:'<q>地是你们种的。分了吧，按人头分。我替你们挡着。</q>', chk:'cmd', fx:{set:{hrubi:'free'}, q:{q_hrubi:'done'}, rep:{tabor:6, home:8, rose:-8, crown:-8}, honor:4}, ffx:{set:{hrubi:'free'}, q:{q_hrubi:'done'}, rep:{rose:-10, crown:-10}}, app:{katka:15, petr:8, zden:-6, eliska:-4, matej:4},
      r:'老人们愣住了，好像没听懂。你又说了一遍。马捷的帽子掉在了地上。\n\n那天晚上，赫鲁比的人在溪边点了一堆火，用绳子量地，量到半夜。他们请你去看。你站在火边，有一个老太太一直拉着你的袖子，不停地说：<q>我有地了。我七十岁了，我有地了。</q>',
      f:'他们分了地。可是消息传到了玫瑰堡，监护人写信来问你，是不是也去了塔博尔。'}
  ]
});

// ---------- 村里的圣杯 ----------
def(
  {id:'s_chalice1', mode:'here', at:'church', d:[3, 80], prio:15, who:['jan'], if: S => !S.q.q_chalice, t:'空的祭坛', la:'Altare vacuum',
    text:'扬神父站在祭坛前，看着空了的地方。那里本来放着一只银圣杯，是你祖父捐的，杯脚上刻着柳溪的柳树。\n\n<q>夜里被人偷了，</q>他说，没有看你，<q>门锁着，窗也关着。</q>他用一只木头杯子代替它，给人领圣餐。木头杯子很轻，像空的。',
    opts:[{t:'<q>我去查。</q>', fx:{q:{q_chalice:1}}, r:'扬神父点点头，又摇摇头。<q>别查得太用力，</q>他说，<q>有些东西丢了，就是丢了。</q>'}]},
  {id:'s_chalice2', at:'village', prio:12, if: S => S.q.q_chalice === 1, t:'问一问', la:'Inquisitio', hint:'在村里打听银圣杯的事',
    text:'你在村子里问了一圈。没有人看见贼。可是溪边的孩子们说，圣杯不见的前一天，扬神父背着一个包袱去了皮塞克，回来的时候，包袱空了，手里牵着一头驮着两袋麦子的驴。\n\n那两袋麦子，后来分给了从赫鲁比逃过来的几户人家。',
    opts:[{t:'……', fx:{q:{q_chalice:2}, xp:{lore:1}}, r:'你想起扬神父说的：门锁着，窗也关着。'}]},
  {id:'s_chalice3', at:'church', prio:16, who:['jan'], if: S => S.q.q_chalice === 2, t:'木头杯子', la:'Calix ligneus', hint:'去问扬神父',
    text:'你什么也没说，只是看着那只木头杯子。\n\n扬神父看了你很久，叹了口气，在台阶上坐了下来。<q>是我卖的，</q>他说，<q>卖给了皮塞克的一个银匠。三十个格罗申，买了两袋麦子。赫鲁比的那几家人，孩子饿得哭了一夜。</q>\n\n他看着自己的手。<q>我跟大家说是被偷的。我活了七十年，第一次在祭坛前撒谎。</q>',
    opts:[
      {t:'<q>这件事，就是被偷的。</q>', fx:{set:{chaliceKept:1}, q:{q_chalice:'done'}, t:{jan:20}}, app:{petr:6, katka:6, zden:-3},
        r:'扬神父抬起头，看着你，眼睛湿了。<q>上帝会怎么看这件事呢？</q>他问。\n\n<q>上帝用过木头杯子，</q>你说，<q>在最后的晚餐上。</q>\n\n他笑了，笑得很老。<q>你说得像个异端，</q>他说，<q>说得好。</q>'},
      {t:'去皮塞克，把它赎回来', cost:40, fx:{set:{chaliceBack:1}, q:{q_chalice:'done'}, t:{jan:15}, rep:{home:6}}, app:{zden:6, eliska:-3},
        r:'皮塞克的银匠还没来得及熔掉它。四十个格罗申，他赚了十个。\n\n你把银圣杯放回祭坛上的时候，扬神父没有说谢谢。他把木头杯子也留在了祭坛上，放在银杯旁边。<q>两只都用，</q>他说，<q>银的给富人，木头的给穷人。看他们自己选哪一只。</q>'},
      {t:'<q>你该告诉大家。</q>', vow:undefined, fx:{q:{q_chalice:'done'}, t:{jan:-10}, rep:{home:-3}, honor:2}, app:{matej:4, zden:4, katka:-4},
        r:'第二个星期天，扬神父在讲道的时候说了。教堂里很安静。散场的时候，赫鲁比逃过来的那几家人留了下来，一个一个地吻了他的手。\n\n村里有人说他是贼。也有人说，他是柳溪唯一一个真信上帝的人。'}
    ]}
);

// ---------- 桥上的金子 ----------

  opts:[
    {t:'<q>国王的河，国王来拿。你先松手。</q>', chk:'grace', fx:{q:{q_gold:'done'}, rep:{home:2, prague:2}, honor:3}, ffx:{q:{q_gold:'done'}, rep:{crown:2}}, app:{katka:6, eliska:3, petr:3},
      r:'收税的人看了看你的剑，看了看笑他的人群，松了手。寡妇把金子塞进嘴里，跑了。第二天，你在柳溪的门口发现了一小撮金砂，用一片树叶包着。',
      f:'收税的人把金子收走了，给了寡妇一张收据。寡妇看着那张她认不得的纸，哭了。'},
    {t:'替她交过桥税：<q>她过了这座桥，金子就是她的。</q>', cost:15, fx:{q:{q_gold:'done'}, rep:{home:2}, honor:2}, app:{eliska:6, katka:3},
      r:'收税的人收了钱，没话说了。寡妇看着你，不知道该谢你还是该骂你。<q>十五个格罗申，</q>她说，<q>我淘两个月的沙才挣得来。</q>她把金子攥得更紧了。'},
    {t:'不管', fx:{q:{q_gold:'done'}}, r:'你从桥上走过去了。身后，寡妇还在喊，喊的是国王的名字，后面跟着很难听的话。'}
  ]
});

// ---------- 换人 ----------
def(
  {id:'s_ransom1', at:'oldtown', act:[2, 3], prio:11, if: S => S.f.campUp && !S.q.q_ransom, t:'沃伊捷霍娃', la:'Vidua', hint:'一个老妇人在市政厅门口坐着',
    text:'市政厅门口的台阶上坐着一个老妇人，坐了三天了。她叫沃伊捷霍娃，是个寡妇，她儿子上个星期出城割草，被迈森人抓走了。\n\n<q>议员们说，等仗打完了一起换，</q>她说，<q>仗打完了，他还活着吗？</q>她看着你的剑，<q>你是骑士。骑士能进他们的营地。</q>',
    opts:[{t:'<q>我去问问。</q>', fx:{q:{q_ransom:1}}, r:'她从怀里掏出一块手帕，里面包着六个格罗申，塞给你。你没要。她又塞，你又推回去。最后她把手帕系在了你的剑柄上。'}]},
  {id:'s_ransom2', at:'tents', prio:14, once:false, if: S => S.q.q_ransom === 1, t:'迈森人的俘虏', la:'Captivus', hint:'去找沃伊捷霍娃的儿子',
    text:'迈森人的俘虏关在营地边上的一个羊圈里，十几个，脚上拴着铁链。你一个一个看过去，看见了一个脸上长着雀斑的年轻人，长得和那个老妇人一模一样。\n\n看守的迈森骑士用德语问你要干什么。',
    chime:{ilona:'伊洛娜在你耳边说：<q>夜里换岗的时候，羊圈后面没人。</q>', eliska:'<q>每个人都有价钱，</q>爱丽什卡说，<q>看守的价钱，一般比俘虏便宜。</q>', zden:'<q>骑士之间，可以谈赎金，</q>齐德涅克说，<q>这是老规矩。</q>'},
    opts:[
      {t:'付赎金', cost:50, fx:{set:{ransomDone:1}, q:{q_ransom:'done'}, rep:{prague:8}}, app:{zden:5, eliska:3},
        r:'迈森骑士数了钱，打开了铁链。年轻人跟着你走出营地的时候一直在回头看，看羊圈里剩下的人。'},
      {t:'和看守讲骑士的规矩', chk:'grace', dc: S => S.rep.crown >= 10 ? 1 : 0, fx:{set:{ransomDone:1}, q:{q_ransom:'done'}, rep:{prague:8, crown:2}, honor:3}, ffx:{rep:{crown:-3}}, app:{zden:8},
        r:'你说，一个割草的农夫不是战俘，扣着他，有失骑士的体面。迈森骑士想了很久，最后挥了挥手。<q>带走吧，</q>他说，<q>反正他吃得比我还多。</q>', f:'<q>规矩？</q>迈森骑士笑了，<q>这是十字军，没有规矩。</q>他把你推出了羊圈。'},
      {t:'夜里来，趁换岗把人带走', chk:'nerve', takes:true, fx:{set:{ransomDone:1}, q:{q_ransom:'done'}, rep:{prague:10, crown:-6}}, ffx:{hurt:1, rep:{crown:-8}, q:{q_ransom:'fail'}}, app:{ilona:10, katka:6},
        r:'换岗的时候，羊圈后面没有人。你用匕首撬开了铁链。年轻人跟着你钻过栅栏，跑进了黑暗里。羊圈里的其他人看着你们，没有一个人出声。',
        f:'你刚撬开铁链，就有人喊了起来。你翻过栅栏跑了，肩上挨了一箭。那个年轻人没跑出来。'}
    ]},
  {id:'s_ransom3', at:'oldtown', prio:12, if: S => S.f.ransomDone && !S.f.ransomThanked, t:'手帕', la:'Sudarium', hint:'沃伊捷霍娃还坐在台阶上',
    text:'沃伊捷霍娃还坐在市政厅的台阶上。她看见她儿子，没有站起来，也没有跑过去。她只是坐在那里，伸出两只手，像在等一个很小的孩子扑进怀里。\n\n他扑了进去。',
    opts:[{t:'……', fx:{set:{ransomThanked:1}, mind:3, rep:{prague:3}}, r:'你剑柄上那块手帕，她没有要回去。<q>留着，</q>她说，<q>打仗的时候系着。我在上面绣了一个圣杯，绣得不好，可上帝认得。</q>'}]}
);
// ===== 前后矛盾的修正（在剧情文件之后加载，直接改登记好的片段）=====
const wrapText = (id, after) => { const st = ST[id], orig = st.text; st.text = S => val(orig) + (val(after) || ''); };

// 一、博胡斯拉夫来要人的时候，卡佳可能就站在院子里
wrapText('s_bohus', S => inParty('katka') ? `

博胡斯拉夫的眼睛忽然停在了你身后。卡佳靠在马厩边，连枷扛在肩上，朝他笑了一下。<q>老爷，</q>她说，<q>车在塔博尔。你自己去拿。</q>

博胡斯拉夫的脸一下子紫了。` : '');
ST.s_bohus.opts[0].app = {katka:-12, zden:4};
ST.s_bohus.opts[1].app = {katka:10, zden:2};

// 二、跟着铁领主冲锋，卡佳不会跟你去
(o => {
  const r0 = o.r;
  o.run = S => { if (inParty('katka')) { leaveParty('katka'); cm('katka').wait = 'wagons'; S.f.katkaLeftSud = 1; return ['<span class="chip rubric">卡佳 离队</span>']; } return []; };
  o.r = S => val(r0) + (S.f.katkaLeftSud ? '\n\n卡佳勒住马，看了你很久。她什么也没说，调转车头，回了车阵。' : '');
})(ST.s_sudomer.opts[1]);
ST.s_sudomer.chime = {zden:'<q>罗森堡家的人在对面，</q>齐德涅克说，<q>我不能对他们拔剑。</q>他把马拴在柳树后面，没有往前走。', petr:'彼得在发抖。<q>两边的人都会死，</q>他说，<q>两边的。</q>', ilona:'<q>马会陷进去，</q>伊洛娜看着放干的塘底说，<q>谁让马下去，谁就是傻子。</q>'};

// 三、苏多梅日之后：站在铁领主那边的人，妹妹不会过来靠着你
ST.s_sud_after.text = S => `后来，人们把这一仗叫做苏多梅日。四百个人、十二辆车，打退了两千个骑士。

你坐在塘堤上，看着渔夫们划着小船，在满水的鱼塘里捞东西。捞上来的不只是鲤鱼。

${S.f.olenkaTabor ? (S.f.sudomerSide === 'lords' && !S.f.turnedCoat ? '车阵那边，奥莲卡站在一辆车上，在人群里找什么。她看见了你，看见了你身上铁领主的号衣。她没有走过来。' : '奥莲卡坐到了你旁边，膝盖上全是泥。她把头靠在你肩上，像小时候那样。<q>我还以为，</q>她说，<q>世界会在今天结束。</q>') : S.f.olenkaHome ? '奥莲卡在柳溪，在母亲身边。你想起她在你背上踢你的样子，忽然很想笑，又笑不出来。' : ''}

${S.f.sudomerSide === 'lords' && !S.f.turnedCoat ? '杰士卡的车队从塘堤上慢慢开走了。最后一辆车上，那个独眼的老人回头看了一眼你们这边。' : '杰士卡从你身边走过，停了一下。<q>记住今天的泥，</q>他说，<q>夏天还会有更多的泥。</q>'}`;

// 四、库特纳霍拉的那一车人：你不在，他们也不会等你
ST.s_vogt.opts.forEach(o => { const old = o.run; o.run = (S, t) => { S.f.prisonerDay = S.day + 1; return old ? old(S, t) : []; }; });
DAY_HOOKS.push(S => {
  if (S.q.q_kutna === 3 && S.f.prisonerDay && S.day > S.f.prisonerDay && !S.done.s_prisoners) {
    S.q.q_kutna = 'fail'; S.f.prisonersDied = 1;
    addLog('坎克矿井边的那一车人，你没有赶上。木栏上多了十二根布条。');
  }
});

// 五、第三幕开始时，人要真的走到他选的地方去
const ACT3_GO = [['prague', 'vitkov'], ['prague', 'oldtown'], ['prague', 'pbridge'], ['camp', 'tents'], ['liuxi', 'manor']];
ST.s_act3.opts.forEach((o, i) => {
  const old = o.run;
  o.run = (S, t) => {
    const [r, p] = ACT3_GO[i]; S.region = r; S.at = p; S.f['v_' + r] = 1;
    if (!S.f.olenkaHome && !S.f.olenkaDead && S.n.olenka) { S.f.olenkaTabor = 1; if (S.q.q_sister && S.q.q_sister !== 'done') S.q.q_sister = 6; }
    return old ? old(S, t) : [];
  };
});
// 维特科夫的前一夜，不管你在哪里，都赶回你该在的地方
DAY_HOOKS.push(S => {
  if (S.f.act === 3 && !S.f.vitkovDone && S.day === VIT_DAY - 1) {
    const go = {tabor:['prague', 'vitkov'], prague:['prague', 'oldtown'], rose:['prague', 'pbridge'], crown:['camp', 'tents'], home:['liuxi', 'manor']}[S.f.path || 'home'];
    if (S.region !== go[0] || S.at !== go[1]) { S.region = go[0]; S.at = go[1]; addLog(`七月十三日，你连夜赶回了${PLACE[go[1]].n}。`); }
  }
});
// 等待：每条路都有地方等
['vitkov', 'tents', 'manor', 'pbridge'].forEach((at, i) => {
  def(Object.assign({}, ST.s_wait_vitkov, {id:'s_wait_vitkov' + (i + 2), at,
    if: S => S.day < VIT_DAY - 1 && !S.f.vitkovDone && ({vitkov:'tabor', tents:'crown', manor:'home', pbridge:'rose'})[at] === S.f.path,
    opts:ST.s_wait_vitkov.opts}));
});
ST.s_wait_vitkov.if = S => S.day < VIT_DAY - 1 && !S.f.vitkovDone && S.f.path === 'prague';

// 六、维特科夫的山脊上：柳溪的人和玫瑰的人不在山上，不能去拉人
ST.s_vit2.opts[0].if = S => S.f.olenkaTabor && !S.f.olenkaDead && (S.f.path === 'tabor' || S.f.path === 'prague' || S.f.turnedVitkov);
ST.s_vit2.opts[2].if = S => ['tabor', 'prague', 'crown'].includes(S.f.path);
ST.s_vit2.opts[3].if = S => S.f.path !== 'home';
ST.s_vit2.opts.push({t:'……', if: S => S.f.path === 'home', fx:{mind:-1}, r:'你在井边站了很久。那个人喝完水，骑马走了。', next:'s_vit_end'});

ST.s_vit_end.text = S => {
  const p = S.f.path;

  text: S => `${S.f.campAt === 'home' ? '柳溪的夜很静，溪水在窗外响。大家还没睡，在厨房的炉子边坐着。' : S.f.campAt === 'inn' ? '客栈的楼下还有人在唱歌。你们在楼上的房间里，点着一支蜡烛，谁也不想先睡。' : '篝火噼啪地响。火光外面，林子黑得像墙。'}

${S.party.map(nm).join('、')}都还醒着。`,
  opts: COMP_IDS.map(id => ({t: S => `和${nm(id)}坐一会儿`, if: S => inParty(id) && alive(id),

    }, r: S => S.f.cfLine})).concat([{t:'早点睡', fx:{mind:1}, r:'你躺下了。火光在你闭着的眼皮上跳。别人还在小声说话，你听着听着，睡着了。'}])
});
// 没有特别的事的夜里，带着同伴就会围坐一会儿
const _restHere = restHere;
restHere = function () {
  const pl = PLACE[S.at], kind = pl.home ? 'home' : pl.inn ? 'inn' : 'camp';
  const camps = Object.values(ST).filter(st => st.mode === 'camp' && eligible(st));
  if (!camps.length && S.party.length && !(kind === 'inn' && S.money < pl.inn)) {
    if (kind === 'inn') applyFx({money:-pl.inn});
    S.f.rested = S.day; S.f.restKind = kind; S.f.campAt = kind;
    S.mind = clamp(S.mind + (kind === 'camp' ? 1 : 2), 0, 10);
    return openStory('s_campfire', true);
  }
  return _restHere();
};

compFate = function (id) {
  const c = cm(id), f = S.f, lover = isLover(id), withYou = f.futureWith === id;
  if (!c.met || !c.joined) return null;
  if (c.dead) return {katka:'她死在了这个夏天。她的连枷挂在柳溪庄园的壁炉上，挨着你父亲的剑。', zden:'他死在了这个夏天。他的十字架你一直戴着，虽然你不知道自己信不信它。', petr:'他死在了这个夏天，死在河中间的岛上。林子里的人说，他死的时候在唱歌。', ilona:'她死在了这个夏天。你把她的铜铃挂在了马笼头上，马一跑，它就响。', matej:'他死在了这个夏天。他的书，你一本一本搬回了柳溪。', eliska:'她死在了这个夏天。酿酒坊关了门，新城半条街的耳朵都聋了。'}[id];
  if (c.left) return {katka:'她背着包袱走了以后，你再也没有见过她。后来有人说，在塔博尔的车阵里见过一个用连枷的女人，笑起来很大声。', zden:'他走了以后，回了玫瑰堡。你们后来在一次宴会上远远地见过一面，他朝你点了点头，没有走过来。', petr:'他走进了晨雾里。很多年以后，你在一个陌生的村子里听人说起一个光脚的治病人。你没有去找。', ilona:'她牵着马往东走了。你再也没有见过她。有时候，你会看见天上一支孤零零的鸟，往东飞。', matej:'他回了布拉格。后来你托人给他捎过一封信，他回了一行拉丁文，你认不全。', eliska:'她回了酿酒坊。你后来去过一次，她给你倒了一杯酒，没有收钱，也没有坐下来。'}[id];
  const tail = withYou ? '那年八月，你们一起走了。' : lover && !['you', 'liuxi', 'together'].includes(f[id + 'Future']) ? '你们一直是恋人，隔着很远的路也是。' : '';
  const T = {
    katka:{farm:`她要了一头牛、一块地，在${f.hrubi === 'free' ? '赫鲁比，在那些分到了地的老人中间' : '塔博尔山下'}种萝卜。萝卜长得很难看，很甜。`, tabor:'她回了塔博尔，赶着她的车，跟着杰士卡打了很多年的仗。车里装的始终是石头，没有装过萝卜。', liuxi:'她跟你回了柳溪。母亲第一次见她，她把连枷靠在门外，进门之前在裙子上擦了很久的手。'}[f.katkaFuture] || '她回了塔博尔，赶着她的车。',
    zden:{rose:'他回了玫瑰堡，替少年领主守着城墙，一边守，一边问。监护人后来说，他是玫瑰家最难管的骑士，也是最好的。', free:'他离开了玫瑰堡，成了一个没有主人的骑士，在路上替人挡刀。他的盾上，玫瑰被涂掉了，什么也没画。', you:'他把剑横着捧在你面前宣过誓。后来的很多年里，那把剑只为你拔出过。'}[f.zdenFuture] || `他回了玫瑰堡。${f.zdenForgave ? '他再也没有去过新城。他说，他已经把那扇窗关上了。' : ''}`,
    petr:{preach:'他接着讲道，从一个林子走到另一个林子。听的人有时多，有时少。他讲的始终是同一件事：你生来没有罪。', heal:'他不再讲道了。他背着一个装满柳树皮和缬草的包，在村子之间走，给人治病。有人说他的手能治病，他从来不否认，也从来不承认。', you:'他只讲给你一个人听。讲了很多年，讲的始终是同一件事。'}[f.petrFuture] || '他回了林子。有人说，后来在很多地方见过他，光着脚，在给人治病。',
    ilona:{home:'她回了匈牙利的平原，回了她母亲那顶门朝东开的毡帐。每年夏天，她都会对着西边射一支箭。', stay:'她没有回去。她在柳溪附近找了一块草地，养了十几匹马。村里的孩子都跟她学骑马，没有一个学会用库曼话数到七以上。', together:'你们一起去了东方。平原上的星星，果然比柳溪多一倍。毡帐的门开了两扇。'}[f.ilonaFuture] || (f.ilonaHome ? '她回了匈牙利的平原。' : '她没有回去。她说，波希米亚的草不如家里的甜，可是马吃得惯。'),
    matej:{priest:'他回了查理学院，接着教逻辑，接着在小教堂里给人领圣杯。他的课上，学生们总是问他维特科夫的事。他说：那天山脊很窄。', teacher:'他脱了僧袍，在布拉格开了一间小学堂，教商人的孩子写字算账，教得很好，收得很少。', you:'他脱了僧袍，跟你回了柳溪，在扬神父的教堂旁边开了一间学堂。村里的孩子们都会写自己的名字了，用拉丁文。'}[f.matejFuture] || '他回了查理学院，接着教逻辑。',
    eliska:{stay:'她留着酿酒坊。这个夏天以后，新城的人说，她的啤酒变甜了。', sell:'她把酿酒坊卖给了纽伦堡的商人，去了威尼斯，然后是更远的地方。每年冬天，你都会收到一封她的信，信里只有账：她这一年花了多少钱，花在了哪里。', liuxi:'她卖了酿酒坊，来了柳溪，要了一间朝南的屋子。柳溪的磨坊旁边，后来多了一间酿酒房。母亲说，那是柳溪这一百年来最好的一件事。'}[f.eliskaFuture] || `${f.ledgerBurned ? '她把那本账烧了。' : '她的账本一直锁在酿酒坊的地窖里。'}新城的人说，这个夏天以后，她的啤酒变甜了。`
  };
  return T[id] + tail;

const CODEX = [
  // ---------- 人物 ----------
  {id:'hus', c:'people', n:'扬·胡斯', o:'Jan Hus', y:'约1370—1415',
    t:`布拉格伯利恒小教堂的传道人，查理大学的校长。他用捷克语讲道，批评教士的财富和赎罪券的买卖，深受英格兰神学家威克里夫的影响。

一四一四年，他带着西吉斯蒙德签发的安全通行证，去康斯坦茨大公会议为自己辩护，却在那里被捕。一四一五年七月六日，他以异端罪被烧死，骨灰撒进了莱茵河。

他的名字在捷克语里是“鹅”。他留下的一句话后来被缩成“真理必胜”，五百年后成了这个国家的箴言。`,
    g:'游戏里货郎卖的“胡斯的骨灰”是没有来历的东西。'},
  {id:'zizka', c:'people', n:'扬·杰士卡', o:'Jan Žižka z Trocnova', y:'约1360—1424', u: () => knows('zizka') || S.p.bg === 'veteran',
    t:`南波希米亚特罗茨诺夫的小贵族，早年当过雇佣兵，据说参加过一四一〇年的格伦瓦尔德之战。他很早就瞎了一只眼睛，怎么瞎的，说法不一。

他把农民的大车用铁链连成车阵，配上连枷、长钩和早期的火器，让没有受过训练的农民挡住了骑士的冲锋。苏多梅日、维特科夫、库特纳霍拉、德意志布罗德，他打过的仗没有一场输掉。

一四二一年围攻拉比城堡时，他失去了另一只眼睛，此后在完全失明的情况下继续指挥。一四二四年十月，他在围攻普日比斯拉夫时病死。传说他要人把自己的皮做成鼓，让敌人一听见鼓声就逃。`},
  {id:'zeliv', c:'people', n:'扬·热利夫斯基', o:'Jan Želivský', y:'1380—1422', u: () => knows('zeliv') || been('prague'),
    t:`原是热利夫修道院的修士，后来在布拉格新城的雪地圣母堂讲道，是布拉格激进派的领袖。

一四一九年七月三十日，他领着游行的人群冲进新城市政厅，把城市法官和几名议员从窗口扔了下去，史称第一次布拉格抛窗事件。此后几年，他几乎是新城的主人。

一四二二年三月九日，老城的议员们以议事为名把他请进老城市政厅，在那里砍了他的头。`,
    g:'游戏里他说自己“梦见过”怎么死，这是虚构的。'},
  {id:'sigis', c:'people', n:'西吉斯蒙德', o:'Sigismund von Luxemburg', y:'1368—1437',
    t:`卢森堡家族的王子，皇帝查理四世之子，瓦茨拉夫四世的弟弟。一三八七年成为匈牙利国王，一四一一年当选罗马人的国王，一四三三年加冕为神圣罗马帝国皇帝。

他召集了康斯坦茨大公会议，结束了教会的大分裂；也是他给了胡斯安全通行证，又在胡斯被处死时没有阻止。

瓦茨拉夫死后，他是波希米亚王位的合法继承人，可是胡斯派的波希米亚不认他。一四二〇年七月二十八日，他在圣维特大教堂加冕，随后撤军。直到一四三六年他才真正被接受为波希米亚国王，第二年就去世了。`,
    g:'他在游戏里说的话，都是想象的。'},
  {id:'wenceslas', c:'people', n:'瓦茨拉夫四世', o:'Václav IV.', y:'1361—1419',
    t:`查理四世的长子，波希米亚国王（1378—1419），也做过罗马人的国王，一四〇〇年被选帝侯废黜。他对胡斯时而庇护、时而放任，在宗教问题上始终摇摆。

一四一九年八月十六日，第一次抛窗事件两个多星期后，他在布拉格近郊去世。编年史家说是激愤引发的中风。他一死，波希米亚就失去了最后一个能在两边之间周旋的人。`,
    g:'“死在你怀里”是“王家侍从”这个出身的虚构情节。'},
  {id:'martin', c:'people', n:'教皇马丁五世', o:'Martinus V', y:'1369—1431',
    t:`罗马科隆纳家族出身。一四一七年在康斯坦茨大公会议上当选，结束了三位教皇并立的大分裂。

一四二〇年三月一日，他颁布诏书，号召讨伐威克里夫派、胡斯派和一切庇护他们的人，参战者罪得赦免。这就是第一次反胡斯十字军。`},
  {id:'wycliffe', c:'people', n:'约翰·威克里夫', o:'John Wycliffe', y:'约1328—1384', u: () => been('prague') || S.p.bg === 'scholar' || knows('matej'),
    t:`牛津的神学家。他主张圣经是信仰唯一的权威，批评教会的财富和教皇的权力，还主持把圣经译成英语。

一三八二年，波希米亚的安妮公主嫁给英格兰国王理查二世，两国的学者开始往来，他的书被一本本抄回布拉格，深深影响了胡斯。一四一五年，康斯坦茨大公会议判他为异端，后来他的遗骨被挖出来烧掉了。`},
  {id:'jakoubek', c:'people', n:'斯特日布罗的雅库贝克', o:'Jakoubek ze Stříbra', y:'约1370—1429', u: () => been('prague') || knows('matej'),
    t:`胡斯的同事，查理大学的教授。一四一四年秋，胡斯还在康斯坦茨的时候，他在布拉格开始让平信徒饼酒同领，这就是“圣杯”的由来。

他一生都是温和派，反对塔博尔的激进，也反对抛窗那样的暴力。`,
    g:'同伴马捷伊是虚构人物，身上有他的影子。'},
  {id:'rozmberk', c:'people', n:'罗森堡的奥尔德日赫二世', o:'Oldřich II. z Rožmberka', y:'1403—1462', u: () => been('rose'),
    t:`南波希米亚最强大的罗森堡家族的家主，纹章是一朵五瓣红玫瑰。

一四二〇年他才十七岁，曾经短暂接受饼酒同领、倾向胡斯派，但很快转向，成了天主教一方和西吉斯蒙德最重要的支持者之一，和塔博尔人打了很多年的仗。`,
    g:'游戏里玫瑰堡的“少年领主”和他的“监护人”，是以他为原型的虚构人物。'},
  {id:'krasa', c:'people', n:'扬·克拉萨', o:'Jan Krása', y:'?—1420', u: () => S.f.act >= 2,
    t:`布拉格的商人。一四二〇年三月，他在布雷斯劳拒绝放弃饼酒同领，被西吉斯蒙德下令绑在马后拖过全城，然后烧死。

消息传回布拉格，城里的人就知道，这一仗不会有妥协了。`},
  {id:'kanis', c:'people', n:'彼得·卡尼什', o:'Petr Kániš', y:'?—1421', u: () => knows('petr') || S.f.adamites,
    t:`塔博尔的激进传道人，比喀派的领袖之一，否认圣体里有基督的实在临在。一四二一年，他和追随者被塔博尔驱逐，同年被烧死。他的一部分追随者后来成了内扎尔卡河上的亚当派。`,
    g:'同伴彼得是虚构人物，部分取材于他和亚当派。'},
  {id:'konrad', c:'people', n:'韦希塔的康拉德', o:'Konrad von Vechta', y:'约1370—1431', u: () => S.f.act >= 3,
    t:`布拉格大主教，德意志人。一四二〇年七月二十八日，是他在圣维特大教堂为西吉斯蒙德加冕。

第二年，他接受了布拉格四条款，倒向胡斯派，因此被教皇革职。一顶王冠，两个阵营，他都站过。`},
  // ---------- 城市与地方 ----------
  {id:'liuxi', c:'places', n:'柳溪', o:'Vrbice（虚构）', y:'',
    t:`柳溪和邻近的赫鲁比都是虚构的地方。它们大概在皮塞克和塔博尔之间的某条小溪边，就像那时候南波希米亚成百上千的小庄园一样：几十户佃农，一座磨坊，一个小领主，一座村教堂。`},
  {id:'prague', c:'places', n:'布拉格', o:'Praha', y:'', u: () => S.f.act >= 2 || been('prague'),
    t:`波希米亚的首都。查理四世在位时，它是帝国的都城、欧洲最大的城市之一，号称“百塔之城”。伏尔塔瓦河把它分成两岸：右岸是老城和查理四世一三四八年新建的新城，左岸是小城和山上的布拉格城堡。

一四二〇年，布拉格是圣杯派的心脏，可是城堡和城南的维舍赫拉德还在国王的守军手里。老城的富裕市民主张温和，新城的手艺人和穷人追随热利夫斯基。`},
  {id:'oldtown', c:'places', n:'老城与泰恩教堂', o:'Staré Město · Týnský chrám', y:'', u: () => been('prague'),
    t:`老城是布拉格最古老、最富的部分。市政厅的天文钟是一四一〇年刚刚装上的。

广场边的泰恩教堂后来成了圣杯派的主教堂。十五世纪中叶，它的山墙上挂起了一只巨大的金色圣杯，一直挂到一六二〇年代天主教一方得胜之后才被拆下来，熔成了圣母像的光环。`,
    g:'游戏里墙上画的圣杯，是对后来那只金杯的提前想象。'},
  {id:'newtown', c:'places', n:'新城与雪地圣母堂', o:'Nové Město · Panna Maria Sněžná', y:'', u: () => been('prague'),
    t:`新城是查理四世一三四八年规划的，街道宽，广场大，住着手艺人和穷人。

雪地圣母堂本该是布拉格最高的教堂，可是只建成了巨大的唱诗堂，中殿始终没有盖起来。热利夫斯基在这里讲道，第一次抛窗事件的游行就是从这里出发的。`},
  {id:'stonebridge', c:'places', n:'石桥（查理桥）', o:'Kamenný most', y:'1357年动工', u: () => been('prague'),
    t:`一三五七年查理四世下令修建，取代被洪水冲毁的尤迪特桥。十五世纪的人只叫它“石桥”或“布拉格桥”，“查理桥”这个名字是十九世纪才有的。

今天桥上那一排巴洛克雕像，也是两三百年以后才立起来的。一四二〇年，桥头塔上只有查理四世和瓦茨拉夫四世的哥特式石像。`},
  {id:'vysehrad', c:'places', n:'维舍赫拉德', o:'Vyšehrad', y:'', u: () => been('prague'),
    t:`布拉格城南、伏尔塔瓦河边高岗上的要塞，传说中是波希米亚的女先知莉布舍预言布拉格的地方。

一四二〇年夏天，它仍在王家守军手中。同年十一月一日，胡斯派在维舍赫拉德城下击败了前来解围的西吉斯蒙德，饿了几个月的守军投降。`},
  {id:'carolinum', c:'places', n:'查理大学', o:'Univerzita Karlova', y:'1348年创立', u: () => been('prague') || S.p.bg === 'scholar',
    t:`查理四世创立，是中欧最早的大学。

一四〇九年，瓦茨拉夫四世颁布库特纳霍拉法令，把大学里的多数投票权交给捷克人，德意志师生愤而出走，去建了莱比锡大学。胡斯随后当选校长。胡斯战争期间，大学几乎只剩下文学院，成了圣杯派的思想中心。`},
  {id:'stvitus', c:'places', n:'圣维特大教堂', o:'Katedrála sv. Víta', y:'1344年动工', u: () => S.f.act >= 3 || been('prague'),
    t:`布拉格城堡里的主教座堂，波希米亚国王历来在这里加冕。它盖得很慢：到胡斯战争爆发时只建成了东半部，西半部要等到二十世纪才完工。

一四二〇年七月二十八日，西吉斯蒙德在这里加冕。那一天，城堡外面的整座布拉格都在反对他。`},
  {id:'vitkov', c:'places', n:'维特科夫山', o:'Vítkov', y:'', u: () => S.f.act >= 3,
    t:`布拉格城东的一道狭长山脊，控制着通往城里的道路。

一四二〇年七月十四日，杰士卡带着几十个人（其中有女人）在山上的简易工事里挡住了迈森骑士的进攻。城里的援军随后冲上山来，十字军溃退，许多人从北坡摔落。

后来这座山被叫作杰士卡山，山下的城区叫杰士卡区。今天山顶上立着一尊巨大的杰士卡骑马像。`},
  {id:'letna', c:'places', n:'莱特纳高地', o:'Letná', y:'', u: () => S.f.campUp,
    t:`布拉格北边、伏尔塔瓦河拐弯处的一片高地。一四二〇年夏天，西吉斯蒙德的十字军在这里扎营，来自德意志诸邦、奥地利、匈牙利、西里西亚，甚至更远的地方。编年史里的人数从几万到十几万不等，多半是夸大了。`},
  {id:'tabor', c:'places', n:'塔博尔', o:'Tábor', y:'1420年建城', u: () => been('tabor'),
    t:`一四二〇年春天，激进的胡斯派在卢日尼采河上一座废弃的旧城址“赫拉迪什捷”建起了一座新城，用圣经里耶稣显圣容的塔博尔山给它命名。

最初的塔博尔人放弃私产，把财物放进广场上的大木桶里共享，相信末日将近。塔博尔后来成了胡斯派激进一翼的中心，直到一四五二年才被波杰布拉德的伊日收服。`},
  {id:'pisek', c:'places', n:'皮塞克', o:'Písek', y:'', u: () => been('pisek'),
    t:`南波希米亚奥塔瓦河畔的王家城市。“皮塞克”在捷克语里是“沙子”，因为河沙里能淘出金子。

它的石桥建于十三世纪下半叶，是捷克现存最古老的石桥，比布拉格的石桥还老将近一百年。一四一九年起，皮塞克站到了胡斯派一边。`},
  {id:'sudomer', c:'places', n:'苏多梅日', o:'Sudoměř', y:'1420年3月25日', u: () => been('sudomer') || S.f.sudomerDone,
    t:`斯特拉科尼采附近的一个村子，周围是一串鱼塘。

一四二〇年三月二十五日，杰士卡带着大约四百人和十二辆车，在两个鱼塘之间的塘堤上，挡住了约两千名王党骑士。据后来的记载，女人们把头巾和衣物铺在放干的塘底，缠住了骑士的马刺。黄昏时，骑士们撤退了。这是胡斯派第一次用车阵打胜仗。`,
    g:'游戏里这一仗什么时候打，取决于你什么时候赶到。'},
  {id:'kutna', c:'places', n:'库特纳霍拉', o:'Kutná Hora · Kuttenberg', y:'', u: () => been('kutna'),
    t:`波希米亚的银城。十三世纪末发现大银矿，一度出产了欧洲很大一部分的白银。一三〇〇年起，王家铸币坊“意大利院”在这里铸造布拉格格罗申。城里的矿工多是德意志人，信天主教。

一四一九到一四二〇年间，库特纳霍拉的矿工把抓到或买来的胡斯派扔进废矿井，编年史记载死者有一千多人。城里的圣芭芭拉教堂一三八八年动工，直到二十世纪初才完工。`,
    g:'“坎克矿井”“韦伯矿长”和一个格罗申一个人的价钱，是游戏的虚构。'},
  {id:'rose', c:'places', n:'玫瑰堡（克鲁姆洛夫）', o:'Český Krumlov', y:'', u: () => been('rose'),
    t:`伏尔塔瓦河在这里绕出一个大弯，弯里是罗森堡家族的城堡，红色五瓣玫瑰的纹章挂满了城墙。罗森堡家是南波希米亚最强大的天主教领主，胡斯战争中长期与塔博尔为敌。`,
    g:'游戏里的“玫瑰堡”是以克鲁姆洛夫为原型的虚构地点。'},
  {id:'nezarka', c:'places', n:'内扎尔卡河', o:'Nežárka', y:'', u: () => been('forest'),
    t:`南波希米亚的一条小河，流经大片林地，注入卢日尼采河。一四二一年十月，杰士卡在内扎尔卡河的一座小岛上剿灭了亚当派。`,
    g:'游戏把亚当派的结局提前到了一四二〇年。'},
  {id:'constance', c:'places', n:'康斯坦茨', o:'Konstanz', y:'1414—1418',
    t:`博登湖边的帝国城市。一四一四到一四一八年，天主教会在这里召开大公会议，结束了三位教皇并立的大分裂，也在这里烧死了胡斯（1415）和他的朋友布拉格的耶罗米（1416）。`},
  {id:'breslau', c:'places', n:'布雷斯劳', o:'Breslau · Wrocław', y:'', u: () => S.f.act >= 2,
    t:`西里西亚的首府，当时属于波希米亚王冠领地，今天是波兰的弗罗茨瓦夫。

一四二〇年初，西吉斯蒙德在这里召开议会。三月十七日，教皇的十字军诏书在这里宣读，布拉格商人扬·克拉萨也在这里被处死。`},
  {id:'grunwald', c:'places', n:'格伦瓦尔德', o:'Grunwald · Tannenberg', y:'1410年7月15日', u: () => S.p.bg === 'veteran' || knows('zizka'),
    t:`普鲁士南部的一片田野，德意志人叫它坦能堡。一四一〇年七月十五日，波兰和立陶宛的联军在这里大败条顿骑士团，大团长战死。不少捷克雇佣兵参加了这一仗，传说杰士卡也在其中。`},
  {id:'lipany', c:'places', n:'利帕尼', o:'Lipany', y:'1434年5月30日', u: () => !!S.ending,
    t:`布拉格以东的一片丘陵。一四三四年五月三十日，圣杯派的贵族和布拉格老城与天主教贵族联手，在这里击溃了塔博尔派和“孤儿派”的军队，他们的统帅大普罗科普战死。

激进的胡斯派从此一蹶不振。两年后，西吉斯蒙德终于被接受为波希米亚国王。`},
  // ---------- 国家与势力 ----------
  {id:'bohemia', c:'realms', n:'波希米亚王国', o:'Království české', y:'',
    t:`中欧的一个王国，神圣罗马帝国的一部分，国王是七位选帝侯之一。“波希米亚王冠领地”还包括摩拉维亚、西里西亚和上下卢萨蒂亚。

王国里说捷克语和说德语的人杂居，城里的富商和矿工多是德意志人。十四世纪查理四世在位时，布拉格是帝国的都城。胡斯战争既是宗教战争，也夹杂着捷克人和德意志人之间的旧怨。`},
  {id:'hre', c:'realms', n:'神圣罗马帝国', o:'Sacrum Imperium Romanum', y:'',
    t:`从北海到意大利北部，由几百个公国、侯国、主教领和自由城市组成的松散帝国。皇帝由选帝侯选出，先称“罗马人的国王”，经教皇加冕后才称皇帝。

一四二〇年，西吉斯蒙德是罗马人的国王，十三年后才在罗马加冕为皇帝。`},
  {id:'papacy', c:'realms', n:'罗马教廷', o:'Curia Romana', y:'',
    t:`一三七八年起，教会分裂成两个、后来是三个互相开除教籍的教皇，史称“西方教会大分裂”。一四一七年康斯坦茨大公会议选出马丁五世，分裂才告结束。刚刚重新统一的教廷，把波希米亚的异端视为头等大事。`},
  {id:'hungary', c:'realms', n:'匈牙利王国', o:'Magyar Királyság', y:'', u: () => S.f.act >= 2 || knows('ilona'),
    t:`西吉斯蒙德从一三八七年起就是匈牙利国王，靠着匈牙利的财力和兵力争夺波希米亚。他的十字军里有不少匈牙利人，还有库曼人的轻骑兵。`},
  {id:'cumans', c:'realms', n:'库曼人', o:'Kunok · Cumani', y:'', u: () => knows('ilona'),
    t:`来自东方草原、说突厥语的游牧民族。一二三九年，库曼人的可汗科腾带着族人逃避蒙古人，进入匈牙利定居。到十五世纪，他们大多已经受洗，仍然保留着骑马射箭的传统，在匈牙利军中当轻骑兵。`,
    g:'同伴伊洛娜和她的弟弟本采是虚构人物。'},
  {id:'meissen', c:'realms', n:'迈森边区', o:'Markgrafschaft Meißen', y:'', u: () => S.f.campUp || S.f.act >= 3,
    t:`德意志东部的边区伯国，属于韦廷家族，和波希米亚北部接壤。它的领主“好战者”弗里德里希是西吉斯蒙德的盟友。一四二〇年七月十四日在维特科夫山上被击退的，主要就是迈森的骑士。`},
  {id:'austria', c:'realms', n:'奥地利公国', o:'Herzogtum Österreich', y:'', u: () => S.f.campUp,
    t:`哈布斯堡家族的公国。公爵阿尔布雷希特五世后来娶了西吉斯蒙德的女儿伊丽莎白，成了他的继承人。他带兵参加了反胡斯的十字军，和胡斯派打了很多年的仗。`},
  {id:'silesia', c:'realms', n:'西里西亚', o:'Śląsk · Schlesien', y:'', u: () => S.f.act >= 2,
    t:`奥得河上游的一片土地，当时属于波希米亚王冠领地。城市多由德意志人主导，坚定地站在西吉斯蒙德和天主教一边。`},
  {id:'poland', c:'realms', n:'波兰王国', o:'Królestwo Polskie', y:'', u: () => S.p.bg === 'veteran' || S.f.act >= 2,
    t:`瓦迪斯瓦夫二世·雅盖沃统治下的王国，十年前在格伦瓦尔德打败了条顿骑士团。

  {id:'taborites', c:'terms', n:'塔博尔派', o:'táborité', y:'', u: () => been('tabor'),

  {id:'defenestration', c:'terms', n:'第一次布拉格抛窗事件', o:'první pražská defenestrace', y:'1419年7月30日', u: () => been('prague') || knows('zden') || S.p.bg === 'page',

  {id:'fourarticles', c:'terms', n:'布拉格四条款', o:'Čtyři artikuly pražské', y:'1420年', u: () => been('prague'),

      return `<button class="tab ${cx.cat === c.k ? 'on' : ''}" data-cxcat="${c.k}">${c.n} <span class="dim" style="font-size:12px">${n}</span>${fresh ? '<span class="cx-dot"></span>' : ''}</button>`; }).join('')}</div>
    <div class="codex">
      <div class="cx-list">${on.map(x => `<button class="cx-btn ${x.id === cx.id ? 'on' : ''}" data-cx="${x.id}"><b>${x.n}</b>${x.y ? `<small>${x.y}</small>` : ''}${S && S.codex && S.codex[x.id] === 0 ? '<span class="cx-new">新</span>' : ''}</button>`).join('')}
        ${list.length > on.length ? `<p class="dim" style="font-size:12.5px;margin:6px 4px">还有 ${list.length - on.length} 条没有收录。走更多的路，认识更多的人。</p>` : ''}</div>
      <div class="cx-body">${e ? `<h3>${e.n}</h3>${e.o || e.y ? `<div class="lat" style="font-size:15px;margin-bottom:8px">${[e.o, e.y].filter(Boolean).join(' · ')}</div>` : ''}

    text:`你把那张抄件放在国王面前的桌子上。

<q>施派尔，</q>他说，<q>十月。那年秋天很冷，我的手指冻得握不住笔，是让文书写的，我只签了名。</q>他终于把它拿了起来，翻到背面，看见那行字，停了很久。

<q>我记得那个侍从，</q>他说，<q>柳树盾牌。胡斯被抓的那天夜里，他在我的门口站了一夜，手里就拿着这张纸。我的人赶他，他不走。天亮了，我出门，他把纸举起来，什么也不说，就那么举着。</q>他把纸放回桌上，<q>大公会议的神父们告诉我，对一个异端的承诺，不算承诺。我听了他们的。你知道我那天早上从他身边走过去的时候，在想什么吗？</q>`,
    opts:[
      {t:'<q>您在想什么？</q>', chk:'grace', dc: S => S.rep.crown >= 20 ? 1 : 0, fx:{set:{fatherPaper:'asked'}, q:{q_father:'done'}, mind:2, rep:{crown:3}}, ffx:{set:{fatherPaper:'asked'}, q:{q_father:'done'}, rep:{crown:-5}},
        r:'国王没有马上回答。帐篷外面，有人在给马钉掌，一下，一下。\n\n<q>我在想，</q>他说，声音很轻，轻得像不是一个国王的声音，<q>这个年轻人比我更相信我的名字。</q>\n\n他把抄件推回给你。<q>拿走吧。我不烧它。我已经烧过一次了。</q>\n\n你走出皇帐的时候，阳光很刺眼。你知道这句话他不会再说第二次，也不会有第二个人听见。你父亲站了一夜，等的也许就是这一句。',
        f:'<q>我在想今天的早饭，</q>国王笑了，笑声又响又好听。帐篷外的人听见笑声，又一个一个走了进来。<q>柳溪，</q>他说，<q>你父亲的东西，你自己收好。下一次拿出来，我就不笑了。</q>'},
      {t:'<q>那就请您收下它。它本来就是您的。</q>', fx:{set:{fatherPaper:'king'}, q:{q_father:'done'}, rep:{crown:10}, mind:-2}, app:{katka:-10, matej:-8, zden:4},
        r:'西吉斯蒙德把抄件折好，没有扔进火盆，而是塞进了自己的手套里。<q>好，</q>他说，<q>我收下。</q>\n\n后来你常常想，那张纸后来去了哪里。是在哪一天的哪一个火盆里，还是在那只手套里，跟着他去了匈牙利、去了罗马、去了很多年以后他终于戴上的那顶波希米亚的王冠底下。'},
      {t:'把它收回怀里，行个礼，退出去', fx:{}, r:'国王看着你把纸折好，放回怀里。他没有拦你。帐篷外面的说笑声又响了起来，好像刚才什么也没有发生过。'}

  {id:'f_zeliv', at:'newtown', prio:13, who:['zeliv'], if: S => S.q.q_father === 3 && !S.f.fatherPaper && alive('zeliv'), t:'讲台', la:'Ambo', hint:PAPER_HINT,

        r:'七月六号，你站在雪地圣母堂的人群里。热利夫斯基念完正面，教堂里很静。他翻过来，念背面。念到“直到死”的时候，他的声音哑了，下面有一个老人先哭了出来。\n\n那天下午，有人去砸了城里最后一座还挂着国王旗子的修院。你不知道该不该后悔。你父亲贴了六份，都被撕了。这一份，再也没有人撕得掉了。'},

        r:'热利夫斯基没有松手，你也没有。过了一会儿，他笑了，松开了。<q>你父亲也是这样的吧，</q>他说，<q>揣着一把刀，舍不得用。</q>'}

  {id:'f_univ', at:'carolinum', prio:12, if: S => S.q.q_father === 3 && !S.f.fatherPaper, t:'学院的箱子', la:'Archivum', hint:PAPER_HINT,

def(
  {id:'g_grave1', at:'grave', prio:8, t:'父亲', la:'Pater', hint:'坟上的土还是新的',
    text: S => `父亲的十字架是扬神父做的，用的是庄子后面那棵倒了的橡树。上面刻着他的名字和两个日子，第二个日子是上个月的。

你还记得他的手：很大，指节上有老茧，握剑的老茧和握笔的老茧。他教你骑马，教你读字，从来不教你打仗。你问过他为什么。他说：<q>打仗不用教。总有人会来教你的。</q>

${S.p.bg === 'page' ? '你在宫里当侍从的那五年，他每年来看你一次，每次都带一罐母亲做的椴树蜜。' : S.p.bg === 'veteran' ? '你从格伦瓦尔德回来那年，他在村口等你，看见你，第一句话是：<q>还有两只手？</q>' : '你离家的那天，他送你到村口，一句话也没说，最后拍了拍马屁股。'}`,
    opts:[

      {t:'问他：现在该怎么办？', lens:1, fx:{mind:1, lens:1}, r: S => S.lens > 0 ? '没有人回答。可是你站起来的时候，看见十字架上停着一只乌鸦，歪着头看你，看了很久，然后往东飞了。东边是塔博尔。' : '没有人回答。你知道不会有人回答。可是你站起来的时候，觉得腿没那么沉了。有时候，问出来就够了。'},

      {t:'把剑插在坟前，坐到天黑', fx:{mind:2, xp:{nerve:1}}, r:'剑插在土里，影子从左边慢慢转到右边，越来越长。天黑的时候，你把它拔出来，擦干净。父亲的剑，现在是你的了。你第一次觉得，这句话是真的。'}

  {id:'g_grave_paper', at:'grave', prio:13, if: S => S.f.fatherKnown && !S.f.graveKnown, t:'三十步', la:'Triginta passus', hint:'你现在知道他的事了',
    text:'你在坟前站着，不知道该先说哪一句。\n\n你想起他教你读字的那个冬天，用的是一本拉丁文的诗篇。他读得很好，比扬神父还好。你问他在哪里学的，他说：<q>在一个很远的地方，跟一个很好的人。</q>你那时候以为他在说上帝。',

      {t:'<q>你不是懦夫。你只是不知道。</q>', fx:{set:{graveKnown:'peace'}, mind:3}, r:'说完这句话，你才发现自己哭了。你已经很多年没哭过了。\n\n你想，他站在那里，离火堆三十步，怀里揣着一张没用的纸。没有一个人知道该怎么办。全欧洲的主教都在那里，也没有一个人知道。'},

    text: S => `母亲蹲在坟边，用一把小铲子挖坑。她身边放着一根柳枝，有手腕那么粗，皮还是青的。

    text: S => `奥莲卡蹲在坟前，在十字架上系一根布条。不是丝带，是一根灰色的粗布条，从车阵的帆布上撕下来的。

    1:'斯特拉科尼采的医院里藏着一个塔博尔的孩子，叫瓦谢克，腿断了。卢卡什修士让你什么也别说。',
    2:'有人来医院搜异端了。',
    done: S => S.f.vasek === 'taken' ? '瓦谢克被带走了。' : S.f.vasek === 'liuxi' ? '瓦谢克去了柳溪。' : '瓦谢克回了塔博尔。', fail:'瓦谢克被带去了布杰约维采。'}},
  q_vavra:{n:'城门塔', s:{
    1: S => `布杰约维采的城门塔里关着一个柳溪人：铁匠家的瓦夫拉。${S.f.vavraDay ? dateLabel(S.f.vavraDay) + '，' : ''}他们要在大广场上烧死他。`,
    2:'你见到了瓦夫拉。他身上搜出来的信，是写给玫瑰堡的。',
    done: S => S.f.vavraFree ? '瓦夫拉活着回了柳溪。' : '瓦夫拉的事了了。', fail:'瓦夫拉死在了大广场上。'}}
});

// ---------- 奥斯蒂：烧城 ----------
def(
  {id:'s_usti_arrive', mode:'arrive', region:'usti', prio:50, t: S => S.f.ustiBurned ? '灰' : '旧城', la:'Ústí', tag:'奥斯蒂',
    text: S => S.f.ustiBurned ? `你到奥斯蒂的时候，城已经烧过了。

${S.f.ustiSaved ? '教堂还在，河边的两条街也在。其余的地方是黑的。' : '烟囱一根一根地站在黑地里。教堂的钟掉下来，摔成了两半，一半埋在灰里，一半露在外面，像一只张开的嘴。'}几个从塔博尔下来的人在废墟里翻找，找锅，找钉子，找他们走的时候没带上的东西。

一个女人坐在一堆灰上，怀里抱着一只烧焦的木头摇篮。她说，这是她外婆的外婆传下来的。她说，她走的时候觉得用不着了。` : `奥斯蒂的街上全是人，扛着东西往山上走。有人扛着门板，有人扛着锅，有人什么也没扛，只是走。

城门口，一个塔博尔的传道人站在车上，手里举着火把。<q>巴比伦要倒了！</q>他喊，<q>上了山的人，不许回头！今夜，我们自己把它烧了，烧干净，让谁也回不去！</q>

车后面跟着几十个拿火把的人。他们看着你，等着看你是哪一边的。`,
    opts:[
      {t:'走过灰地', if: S => S.f.ustiBurned, fx:{mind:-1, set:{ustiSeen:1}}, r:'你从灰里走过去，靴子上沾满了黑的东西。那个抱摇篮的女人一直没有抬头。\n\n出城的时候，你看见城墙根下有人用炭写了一行字：<i>我们会回来的</i>。字写得很大。不知道是走的人写的，还是留下的人。'},
      {t:'接过一支火把', if: S => !S.f.ustiBurned, fx:{set:{ustiBurned:1}, q:{q_usti:'done'}, rep:{tabor:8, rose:-4}, lens:1}, app:{katka:8, petr:-4, zden:-8, matej:-6},
        r:'火从城门开始烧，烧了一夜。你站在山坡上看。火光里，你看见有一座房子的窗口里挂着一串洋葱，烧得噼啪响，满山都是洋葱的香味。\n\n天亮的时候，那个传道人在灰里跪下来祷告。他哭了。你不知道他是高兴，还是别的什么。'},
      {t:'先进教堂，把书和人搬出来', if: S => !S.f.ustiBurned, chk:'cmd', fx:{set:{ustiBurned:1, ustiBooks:1}, q:{q_usti:'done'}, rep:{prague:4, tabor:2}, honor:3}, pfx:{hurt:1}, ffx:{set:{ustiBurned:1}, q:{q_usti:'done'}, hurt:1}, app:{matej:10, zden:6},
        r:'你带着几个人冲进教堂。洗礼簿，弥撒书，一本用链子拴在讲台上的《圣经》，链子是你用剑劈断的。你们把它们扛出来，堆在河边的石头上。\n\n火烧过来的时候，那堆书坐在河边，像一群逃出来的老人，看着自己的家烧掉。洗礼簿里有七代奥斯蒂人的名字。',
        f:'你冲进教堂，烟太大了。你抓起了一本最近的书，退了出来，眉毛烧掉了一半。那是一本账簿，记着教堂一百年的蜡烛钱。'},
      {t:'<q>烧城可以，留下教堂和河边的街。</q>', if: S => !S.f.ustiBurned, chk:'grace', dc: S => S.rep.tabor >= 15 ? 1 : 0, fx:{set:{ustiBurned:1, ustiSaved:1}, q:{q_usti:'done'}, rep:{tabor:3, home:3}, honor:4}, ffx:{set:{ustiBurned:1}, q:{q_usti:'done'}, rep:{tabor:-4}}, app:{zden:6, eliska:5, katka:-3},
        r:'传道人瞪着你。你说：<q>上了山的人不会回头。可是会有人从别的地方来。他们要有个地方受洗，有个地方埋人。</q>\n\n车后面有个拿火把的老人点了点头：<q>我爹埋在教堂后面。</q>又有几个人点了头。传道人骂了一句，跳下车，把火把扔进了城门边第一座房子里。\n\n那一夜，火在河边的街口停住了。',
        f:'<q>巴比伦没有一块砖是干净的！</q>传道人喊。人群从你身边涌了过去。'},
      {t:'有一扇门关着。屋里还有人', if: S => !S.f.ustiBurned, vow:undefined, fx:{q:{q_usti:1}}, r:'你看见街角有一座房子，门窗都关着，烟囱里还在冒烟。整条街都空了，只有那里有人在烧晚饭。', next:'s_usti_dorota'}
    ]},
  {id:'s_usti_dorota', mode:'chain', t:'多罗塔', la:'Dorothea', tag:'奥斯蒂 · 夜',
    text:'屋里坐着一个老太太，在炉子边上煮豆子。她八十多岁，耳朵不好，你喊了三遍她才回头。\n\n<q>我在这间屋子里生的，</q>她说，<q>在这间屋子里嫁的，在这间屋子里埋了三个孩子。他们说上帝要来了，要我上山。上帝要来，就让他来这里找我。我认得路，他不认得？</q>\n\n外面的街上，火已经烧到了第三座房子。',
    opts:[
      {t:'把她背出去', chk:'nerve', fx:{set:{ustiBurned:1, dorota:1}, q:{q_usti:'done'}, rep:{home:4}, honor:5}, ffx:{set:{ustiBurned:1, dorota:1}, q:{q_usti:'done'}, hurt:1, honor:5}, app:{zden:8, katka:4, petr:5, eliska:3},
        r:'她骂你，打你，用一个老太太所有的力气。你背着她跑过烧着的街，她一直在骂，骂到城外，骂到河边，然后忽然不骂了。\n\n她坐在河边，看着她的房子烧掉。<q>豆子还没煮好，</q>她说。\n\n第二天，你带她回了柳溪。母亲给她收拾了一间屋子。她说那间屋子朝向不对。',
        f:'房梁塌下来的时候，你正背着她跨出门槛。一根着火的椽子砸在你背上。你没有松手。她在你背上一声不吭，后来你才发现，她是在用袖子扑你头发上的火。\n\n第二天，你带她回了柳溪。'},
      {t:'<q>那您就在这里等他吧。</q>', vow:'abandon', fx:{set:{ustiBurned:1}, q:{q_usti:'done'}, mind:-3}, app:{zden:-6, katka:-4, petr:-6},
        r:'你出去了。你在城外的山坡上站了一夜，看着那座房子的烟囱。它是最后一个倒的。\n\n后来，你常常想，她最后看见了谁。'}
    ]},
  {id:'s_usti_after', mode:'here', at:'utown', act:[2, 3], prio:8, if: S => S.f.ustiBurned, t:'找东西的人', la:'Quaerentes',
    text: S => `${S.f.ustiSaved ? '教堂前的空地上' : '灰地里'}，一个小女孩在找什么，用一根树枝翻着地上的灰。她说她在找她的猫。猫叫斑斑，三种颜色。火烧起来的那天夜里，猫跑了，她跟着大人上了山。

她已经找了三天了。她的母亲在山上，以为她在车阵里玩。`,
    opts:[
      {t:'帮她找', chk:'lore', fx:{mind:3, rep:{tabor:2}, xp:{lore:1}}, ffx:{mind:1},
        r:'你在河边一座没烧着的磨坊的阁楼里找到了它。三种颜色，瘦得只剩骨头，怀里还有四只小猫。\n\n女孩把它们装进了自己的围裙里，一只一只地数。<q>我们带它们上山，</q>她说，<q>山上有很多老鼠。末日也有老鼠的。</q>',
        f:'你们找到天黑，没有找到。你把她送回了塔博尔。她一路上都在回头。\n\n过了一个星期，你听说猫自己找上山来了，叼着一只小猫，走了三里路。'},
      {t:'把她送回塔博尔，交给她母亲', fx:{rep:{tabor:3}, mind:1}, r:'她母亲看见她，先打了她一巴掌，然后抱住她，抱得很紧。女孩在母亲怀里扭过头来，看着你，<q>猫，</q>她说，<q>你要帮我找猫。</q>'}
    ]},
  {id:'s_dorota_home', mode:'here', at:'manor', prio:6, if: S => S.f.dorota && !S.f.dorotaSettled && S.day >= 3, t:'多罗塔', la:'Dorothea', tag:'柳溪',
    text: S => `多罗塔在柳溪住下了。她嫌母亲的汤太淡，嫌扬神父讲道的声音太小，嫌柳溪的溪水太凉。她每天早上四点起床，把庄园的院子扫一遍，扫得比谁都干净。

今天早上，她把你叫住了。<q>你母亲人好，</q>她说，<q>人好的人都不会过日子。你们家的地窖，老鼠比土豆多。</q>她递给你一包东西，用干荷叶包着，<q>圣约翰草，金丝桃，晒干了的。睡不着的时候泡水喝。打仗打得心里乱，也喝。</q>`,
    opts:[{t:'收下', fx:{set:{dorotaSettled:1}, mind:3, rep:{home:2}}, r:'那包草药闻起来像夏天。多罗塔看你收下了，哼了一声，又去扫院子了。\n\n母亲后来跟你说，多罗塔每天晚上都在你父亲的坟前坐一会儿。她不认识他。她说，坟地里有个说话的伴，比屋子里好。'}]}
);
// 第十六天以后，奥斯蒂就烧掉了，不管你在不在
DAY_HOOKS.push(S => {
  if (!S.f.ustiBurned && S.day >= 15 && S.region !== 'usti') { S.f.ustiBurned = 1; S.f.ustiLate = 1; addLog('听说塔博尔人把奥斯蒂老城烧了。'); }
});

// ---------- 科齐堡 ----------
def(
  {id:'s_kozi', mode:'here', at:'kozi', prio:14, who:['betka'], t:'荒堡', la:'Kozí hrádek',
    text:`墙根下坐着一个老太太，身边围着七八只山羊。她没有牙，眼睛很亮，一看见你就笑了，好像等你很久了。

<q>来听讲道的？</q>她说，<q>讲道的人走了七年了。我还在。你要听，我讲给你听。</q>

她不等你回答，就闭上眼睛，开始背：一个富人每天穿着紫色的衣服吃饭，一个穷人躺在他家门口，身上全是疮，狗来舔他的疮。富人死了，穷人也死了……她背得很慢，每一个停顿都在同一个地方，像在模仿一个人说话的样子。`,
    opts:[
      {t:'坐下来听完', fx:{lens:1, xp:{faith:1}, t:{betka:10}, mind:1},
        r:'她背完了，睁开眼睛。<q>胡斯先生讲到这里，</q>她说，<q>就停下来问我们：你们说，那个富人下地狱，是因为他有钱，还是因为他没看见门口躺着一个人？</q>\n\n<q>我们说是因为他有钱。他摇头。我们说是因为他没看见。他还摇头。他说：是因为他看见了，可他觉得那不关他的事。</q>'},
      {t:'<q>您记得他长什么样吗？</q>', fx:{t:{betka:6}, xp:{lore:1}},
        r:'<q>瘦，</q>贝特卡说，<q>高，鼻子很大，说话的时候喜欢把手放在胸口。他不像个先生，像个赶车的。下雨的时候，他就站在那棵椴树底下讲，让我们站在墙底下躲雨。他自己淋着。</q>她指了指荒堡下面的坡，那里有一棵很老的椴树，树干要三个人才抱得过来。'},
      {t:'给她留一块面包，走开', fx:{t:{betka:3}}, r:'她接过面包，掰成两半，一半自己吃，一半喂了一只最瘦的山羊。你走下坡的时候，听见她又开始背了，背给山羊听。'}
    ]},
  {id:'s_kozi_night', at:'kozi', ph:[2], prio:13, t:'夜里的大厅', la:'Vox', hint:'塌了的大厅里有声音',
    text:'夜里，荒堡塌了一半的大厅里有人在说话。\n\n声音不大，很稳，一句一句的，用的是捷克语。你听得出来是在讲道，可是听不清讲的是什么。你走到门口，声音就停了。',
    opts:[
      {t:'走进去', lens:1, fx:{lensClue:['v_heard', 'v_wind'], xp:{nerve:1}},
        r: S => S.lens > 0 ? '大厅里没有人。月光从塌了的屋顶照下来，照在一块长满苔藓的地上。你站在那里，等了很久。\n\n然后，就在你身后，很近，有人清了一下嗓子，接着讲了下去：<q>……他看见了，可他觉得那不关他的事。</q>\n\n你没有回头。' : '大厅里没有人。你站在箭孔前面，西风正从外面灌进来，穿过一排箭孔，一个高，一个低，一个长，一个短。\n\n你站了很久。听久了，它确实像一个人在讲道。你甚至能听出它在哪里停顿。'},
      {t:'在门口坐下，听着', fx:{mind:2, lens:1}, r:'你没有进去。你在门口坐下，听那个声音讲了半夜。你一句也没听清。可你觉得，你不需要听清。\n\n快天亮的时候，声音停了。你听见有人在里面咳嗽了两声，很老，像一个老太太。'}
    ]},
  {id:'s_linden', mode:'here', at:'kozi', act:[1, 2], prio:12, if: S => S.done.s_kozi && !S.q.q_linden && S.day >= 8, t:'椴树', la:'Tilia', who:['betka'],
    text:'坡下的那棵老椴树边上，站着四个从塔博尔来的车匠，扛着斧子和锯。贝特卡站在树前面，张着手，像在拦一群羊。\n\n<q>车阵要车轮，</q>领头的车匠对你说，他看起来很为难，<q>椴木软，好削，这么大一棵，能做十二个轮子。杰士卡说下个月要再添二十辆车。</q>\n\n<q>胡斯先生在这棵树下讲过道！</q>贝特卡喊。\n\n<q>胡斯先生要是在这里，</q>车匠说，<q>他会让我们砍的。</q>',
    opts:[
      {t:'<q>砍吧。车轮能救人。</q>', fx:{set:{linden:'cut'}, q:{q_linden:'done'}, rep:{tabor:6}, t:{betka:-15}}, app:{katka:6, petr:-4, matej:-3},
        r:'砍了一下午。树倒下去的时候，声音很大，整个山坡都震了一下，山羊吓得四处跑。\n\n贝特卡没有哭。她坐在树桩上，用手摸着年轮，一圈一圈地数。数到一百多，她停下来，说：<q>他来讲道那年，是这一圈。</q>'},
      {t:'<q>这棵不行。</q>挡在贝特卡旁边', chk:'cmd', fx:{set:{linden:'kept'}, q:{q_linden:'done'}, t:{betka:15}, rep:{tabor:-3, home:2}}, ffx:{set:{linden:'cut'}, q:{q_linden:'done'}, rep:{tabor:-5}, t:{betka:5}}, app:{petr:5, matej:4, katka:-3, zden:3},
        r:'车匠看着你的剑，又看着贝特卡，叹了口气。<q>好吧，</q>他说，<q>我去跟杰士卡说，有个骑士不让砍。他会骂我。</q>\n\n他们走了。贝特卡在树下坐下，把头靠在树干上。<q>谢谢你，</q>她说，是对着树说的。',
        f:'<q>骑士老爷，</q>车匠说，<q>车阵里的人要是因为少了十二个轮子死了，你去跟他们的老婆说。</q>你说不出话。他们开始砍树。'},
      {t:'<q>林子里有一棵雷劈过的椴树，比这棵还大。我带你们去。</q>', chk:'lore', if: S => S.f.v_forest, fx:{set:{linden:'swap'}, q:{q_linden:'done'}, t:{betka:12}, rep:{tabor:4}, xp:{lore:1}}, ffx:{set:{linden:'cut'}, q:{q_linden:'done'}, t:{betka:-5}},
        r:'你带他们去了内扎尔卡河边的林子。那棵树去年夏天被雷劈了，半边是黑的，可木头还是好的。车匠们绕着它转了三圈，敲了敲，点点头。\n\n<q>这棵更好，</q>领头的说，<q>干透了，不会裂。</q>他看了你一眼，<q>你是故意的吧？</q>你说是。他笑了。',
        f:'你领着他们在林子里转了半天，没有找到你记得的那棵树。车匠们回到科齐堡的时候，太阳已经偏西了，他们一句话也没说，就开始砍。'}
    ]}
);

// ---------- 渡口 ----------
def(
  {id:'s_ferry_night', at:'ferry', ph:[2], prio:10, t:'夜渡', la:'Transitus', hint:'渡工说，今夜有个客人要过河',
    text:'渡工在等一个客人。他说，每个月的这一天，都有一个人夜里来过河，从不说话，付的钱很老。\n\n快半夜的时候，那个人来了。穿着一件很长的斗篷，兜帽压得很低，手里提着一盏没点的灯。他上了船，坐在船头，背对着你们。',
    opts:[
      {t:'帮渡工撑船，什么也不问', fx:{mind:1, set:{ferryCoin:1}, t:{vavrin:8}},
        r:'船到对岸，那个人下了船，往黑地里走了，没有回头。他坐过的地方放着一枚银币，很薄，边磨得很光，上面是一个戴王冠的人和一只狮子。\n\n<q>奥托卡国王的钱，</q>渡工说，把它给了你，<q>一百多年前的。你拿着吧。我已经有一罐子了。</q>'},
      {t:'<q>您要去哪里？</q>', lens:1, fx:{lensClue:['v_heard', 'v_wind'], set:{ferryCoin:1}, lens:1},
        r: S => S.lens > 0 ? '那个人没有回头。他说：<q>去听讲道。</q>声音很年轻。\n\n船到对岸，他下了船，往科齐堡的方向走了。他坐过的地方放着一枚很老的银币。渡工把它给了你，说：<q>他说话了。四十年了，他第一次说话。</q>' : '那个人没有回答。渡工用胳膊肘碰了你一下，摇了摇头。\n\n船到对岸，他下了船。他坐过的地方放着一枚很老的银币。<q>是个走私盐的，</q>渡工说，<q>从林子里的小路走，躲过桥上的税。付老钱，是因为老钱的银子足。</q>他把银币给了你，眨了眨眼。'}
    ]}
);
TALK.vavrin = [
  {k:'a', pr:2, t:'<q>这条河，</q>渡工说，<q>从南边的沼泽里来，到塔博尔拐个弯，往西流到伏尔塔瓦。它不管两岸的人信什么。</q>'},
  {k:'b', pr:3, t:'<q>上个月我渡了一车塔博尔的人去南边，</q>渡工说，<q>这个月我渡了一车玫瑰家的人去北边。他们坐的是同一条船，坐在同一个地方。</q>'},
  {k:'c', pr:4, if: S => S.f.ustiBurned, t:'<q>奥斯蒂烧的那天夜里，</q>渡工说，<q>河是红的。我渡了一夜的人。有一个人上了船，又下去了，跑回去拿什么东西。他没有再回来。</q>'}
];
GREET.vavrin = ['渡工在补船。', '<q>过河？</q>', '他朝你点了一下头。'];

// ---------- 斯特拉科尼采：骑士团 ----------
def(
  {id:'s_strak_arrive', mode:'arrive', region:'strak', prio:40, t:'白十字', la:'Ordo Sancti Iohannis', tag:'斯特拉科尼采', who:['hubert'],
    text: S => `骑士团城堡的门口，一个白胡子的老修士骑士拦住了你。黑袍子，左胸上一个白色的八角十字。他看了看你的盾牌，又看了看你的脸。

<q>柳溪，</q>他说，捷克语里带着很重的巴伐利亚口音，<q>这里是圣约翰的医院。病人可以进，朝圣的可以进，骑士也可以进。</q>他顿了一下，<q>你领什么样的圣餐？</q>

${S.p.faith === 'chalice' ? '你身后，有个年轻的修士手按在了剑柄上。' : ''}`,
    opts:[
      {t:'<q>饼和酒都领。</q>', vow:undefined, fx:{t:{hubert:5}, meet:['hubert', 'lukas']}, app:{katka:3},
        r:'老人看了你很久，点点头。<q>说实话的人，</q>他说，<q>可以进。我们这里有一张床上躺着一个领圣杯的，一张床上躺着一个烧过圣杯派村子的。他们在一个屋檐下喝一样的汤。</q>\n\n<q>我叫胡贝特，</q>他说，<q>进来吧。把剑留在门口，出来的时候再拿。这是规矩，对谁都一样。</q>'},
      {t:'<q>我父亲怎么领，我就怎么领。</q>', fx:{t:{hubert:2}, meet:['hubert', 'lukas']},
        r:'老人笑了一下，胡子动了动。<q>聪明的回答，</q>他说，<q>在尼科波利斯，聪明的人都活下来了。</q>他让开了门。<q>我叫胡贝特。进来吧。剑留在门口。</q>'},
      {t:'<q>这和您有什么关系？</q>', fx:{t:{hubert:-3}, meet:['hubert', 'lukas']}, app:{ilona:4, katka:4},
        r:'<q>没有关系，</q>老人说，<q>我只是想知道，今晚的汤要不要多放一个人的。</q>他让开了门，<q>我叫胡贝特。剑留在门口。</q>'}
    ]},
  {id:'s_hubert', at:'cmdry', prio:12, who:['hubert'], t:'尼科波利斯', la:'Nicopolis', hint:'胡贝特修士在井边磨剑',
    text:`胡贝特修士在井边磨一把剑，磨得很慢，磨一下，看一下。

<q>二十四年前，</q>他说，没有抬头，<q>我跟着匈牙利国王去打土耳其人。全欧洲的骑士都去了，法兰西的、勃艮第的、巴伐利亚的，像现在莱特纳山上那样，帐篷连成一片海。</q>

<q>在多瑙河边上，一个叫尼科波利斯的地方。法兰西人不肯等，先冲了上去，冲进了苏丹的木桩阵里。我们在后面看着。后来，整个阵就垮了。</q>他把剑翻过来，磨另一面，<q>国王上了一条船，顺着多瑙河跑了。我们这些在岸上的人，看着那条船。</q>

<q>那个国王，</q>他说，<q>就是现在莱特纳山上那位。</q>`,
    opts:[
      {t:'<q>您恨他吗？</q>', fx:{t:{hubert:8}, xp:{lore:1}},
        r:'胡贝特想了很久。<q>恨过，</q>他说，<q>后来我当了修士，照顾病人，见过很多人在床上死。我发现，所有人到最后都想上那条船。国王只是比别人先找到了船。</q>\n\n他把剑举起来，对着太阳看刃口。<q>我不恨他。我只是再也不跟着他了。</q>'},
      {t:'<q>教我用剑。</q>', fx:{t:{hubert:4}}, r:'老人终于抬起头来看你。<q>拿木剑，</q>他说，<q>我老了，不想杀人，也不想被杀。</q>', duel:'d_hubert'},
      {t:'<q>您怎么活下来的？</q>', fx:{t:{hubert:5}, mind:-1},
        r:'<q>我躺在死人堆里，</q>胡贝特说，<q>躺了一天一夜。土耳其人来砍俘虏的头，一个一个地砍，砍了一整天。砍到我前面第三个人的时候，苏丹说够了。</q>\n\n<q>我那天就发了誓，</q>他说，<q>如果我活下来，我就去照顾那些躺着的人。不管他们是谁。</q>'}
    ]},
  {id:'s_hubert_sword', at:'cmdry', prio:14, who:['hubert'], if: S => tr('hubert') >= 25 && (S.f.hubertWon || S.f.vasek) && S.gear.weapon !== 'nicopolis', t:'那把剑', la:'Gladius', hint:'胡贝特修士叫你过去',
    text:'胡贝特修士把那把他磨了很多天的剑递给你，剑柄朝着你。\n\n<q>尼科波利斯的剑，</q>他说，<q>我从死人堆里爬出来的时候，手里就握着它。修士不该有剑，可是骑士团的规矩里也没说要扔掉。</q>\n\n<q>我老了，</q>他说，<q>拿着它，我总是梦见那条船。你拿着吧。你还没见过那条船。等你见到的时候，你就知道该站在哪里了。</q>',
    opts:[
      {t:'双手接过来', fx:{gear:{weapon:'nicopolis'}, t:{hubert:10}, honor:3}, app:{zden:8},
        r:'剑很沉，比看起来沉。剑脊上刻着一个很小的十字，磨得快看不见了。\n\n<q>它砍过土耳其人，</q>胡贝特说，<q>也砍过一个想抢我水壶的法兰西人。它不挑。你要挑。</q>'},
      {t:'<q>您留着吧。它是您的船。</q>', fx:{t:{hubert:15}, mind:2},
        r:'老人愣了一下，然后大笑起来，笑得咳嗽，咳得弯下了腰。<q>我的船，</q>他说，<q>好。好。</q>他把剑插回了鞘里，<q>那就让它跟我一起沉吧。</q>'}
    ]}
);
DUELS.d_hubert = {name:'胡贝特修士', look:() => NPCS.hubert.look, hp:3, my:3, hurt:0, yield:true,
  w:{heavy:1, thrust:2, feint:3, guard:4, rush:0}, intro:'木剑。老人站得很稳，剑尖低着，像一根插在地里的木桩。<q>先动的人先输，</q>他说。',
  win:{fx:{set:{hubertWon:1}, t:{hubert:12}, xp:{arm:2}, honor:3}, r:'你的木剑点在了他的胸口上。胡贝特低头看了一眼，点点头。<q>好，</q>他说，<q>你会等。年轻人都不会等。在尼科波利斯，法兰西人就是不会等。</q>'},
  lose:{fx:{t:{hubert:6}, xp:{arm:1}}, r:'他的木剑在你的手腕上轻轻敲了一下，你的剑就掉了。<q>你太想赢了，</q>胡贝特说，<q>想赢的人，脚会先动。明天再来。</q>'}};

// ---------- 斯特拉科尼采：医院里的孩子 ----------
def(
  {id:'s_infirm1', at:'infirm', prio:13, who:['lukas'], if: S => !S.q.q_hosp, t:'最里面那张床', la:'Lectus', hint:'卢卡什修士在给一个孩子换药',
    text: S => `医院最里面的那张床上躺着一个男孩，十四五岁，一条腿用木板夹着，脸瘦得只剩一双眼睛。卢卡什修士在给他换药。

<q>他叫瓦谢克，</q>卢卡什修士低声说，<q>塔博尔车阵里的赶车的。${S.f.sudomerDone ? '苏多梅日那天，一匹马踩断了他的腿。' : '前几天在皮塞克外面，一匹惊了的马踩断了他的腿。'}他的人以为他死了，把他留在了路边。是我们的人把他抬回来的。</q>

他压低了声音：<q>院里的老修士们，有一半不知道他是谁。另一半知道，假装不知道。你也假装吧。</q>

男孩看着你。${S.f.olenkaTabor ? `<q>你是柳溪的，</q>他忽然说，<q>你的盾牌上有柳树。车阵里有个剪了短头发的姐姐，也是柳溪的。她教我认字，教到“鱼”，还没教到“马”。</q>` : '他什么也没说，只是把被子往上拉了拉，盖住了胸口挂着的一只小木头杯子。'}`,
    opts:[
      {t:'<q>我什么也没看见。</q>', fx:{q:{q_hosp:1}, set:{hospDay:0}, t:{lukas:8}}, run: S => { S.f.hospDay = S.day; },
        r:'卢卡什修士点点头，接着换药。男孩一直看着你，直到你走出那间长长的屋子。'},
      {t:'坐在床边，教他认“马”字', fx:{q:{q_hosp:1}, t:{lukas:10}, xp:{lore:1}, mind:2}, run: S => { S.f.hospDay = S.day; S.f.vasekTaught = 1; },
        r:'你用手指在他的被子上写：马。他跟着写了一遍，写得歪歪扭扭的，马的四条腿写成了五条。\n\n<q>多一条，</q>他说，<q>跑得快。</q>'}
    ]},
  {id:'s_infirm2', mode:'here', at:'infirm', prio:16, if: S => S.q.q_hosp === 1 && S.day >= (S.f.hospDay || 0) + 2, t:'搜查', la:'Inquisitio', who:['lukas'], tag:'医院',
    text:'医院的门被推开了。进来的是四个兵，前面一个穿着皮外套的人，腰上挂着布杰约维采的城徽。\n\n<q>国王的法官要找异端，</q>他说，手里拿着一张纸，<q>有人说，塔博尔的一个小崽子在这里养腿。</q>\n\n卢卡什修士站在最里面那张床前面，脸是白的。男孩把被子拉到了下巴上。',
    chime:{zden:'<q>骑士团的屋檐下，</q>齐德涅克低声说，<q>国王的法官管不着。这是老规矩。</q>', katka:'卡佳的手在连枷上，你按住了它。', eliska:'<q>那个人的靴子是新的，</q>爱丽什卡说，<q>新官上任。新官最怕出错。</q>'},
    opts:[
      {t:'<q>这里只有病人。没有异端。</q>', chk:'grace', vow:'lie', fx:{q:{q_hosp:3}, rep:{crown:-2}, t:{lukas:10}}, ffx:{q:{q_hosp:'fail'}, set:{vasek:'taken'}, rep:{crown:2}, mind:-3},
        r:'皮外套看着你，又看着屋里的两排床。床上的人有的在咳嗽，有的在呻吟，一个老头在床上骂人，骂的是法官的娘。\n\n<q>你担保？</q>他问。你说你担保。他啐了一口，带着兵走了。卢卡什修士一下子坐在了地上。', next: (S, tier) => tier === 'bad' ? null : 's_infirm3',
        f:'<q>是吗？</q>皮外套笑了，走到最里面那张床前，一把掀开了被子。木头杯子从男孩的胸口滚了下来，掉在地上，响了一声。\n\n他们把瓦谢克抬走了，连着那块夹腿的木板。'},
      {t:'去叫胡贝特修士', if: S => tr('hubert') >= 15, fx:{q:{q_hosp:3}, rep:{crown:-4}, t:{hubert:5, lukas:10}}, app:{zden:6},
        r:'胡贝特修士来的时候，手里还拿着那把磨了一半的剑。他什么也没做，只是站在医院的门口，挡住了门。\n\n<q>这座房子是圣约翰的，</q>他说，<q>国王的法官在门槛外面。门槛里面，只有病人和仆人。</q>他看着那个皮外套，<q>我在尼科波利斯给国王打过仗。你回去告诉他，胡贝特在这里。他记得。</q>\n\n皮外套走了。胡贝特修士转身回去磨剑，一句话也没多说。', next:'s_infirm3'},
      {t:'<q>夜里，我从河上把他带走。</q>先把他们稳住', chk:'nerve', takes:true, fx:{q:{q_hosp:3}, rep:{crown:-3}, t:{lukas:8}}, ffx:{q:{q_hosp:3}, hurt:1, rep:{crown:-6}}, app:{ilona:6, katka:6},
        r:'白天，卢卡什修士跟皮外套说，那个男孩发着高烧，会传染，等烧退了再交人。\n\n半夜，你背着瓦谢克从医院的后窗爬出去，下到河边。渡船是胡贝特修士安排的，船上已经铺好了干草。男孩在你背上一直没出声，只有夹板碰在窗框上的时候，他咬了你的肩膀一口。', p:'半夜，你背着瓦谢克从后窗爬出去。一个兵听见了，追到河边。你把他推进了河里。船走了，你的肩膀上挨了一棍子。', f:'半夜，你背着瓦谢克从后窗爬出去。兵追到了河边。你们跳上船的时候，你的腿上挨了一刀。可船还是走了。', next:'s_infirm3'},
      {t:'让开', fx:{q:{q_hosp:'fail'}, set:{vasek:'taken'}, rep:{crown:6}, mind:-3, t:{lukas:-20}}, app:{katka:-10, petr:-8, zden:-4, eliska:2},
        r:'你往旁边站了一步。兵从你身边过去，把瓦谢克连着那块夹腿的木板一起抬走了。男孩没有喊。他经过你身边的时候，看了你一眼。\n\n卢卡什修士站在空了的床边，手里还拿着换下来的绷带。<q>布杰约维采，</q>他说，<q>他们会把他带去布杰约维采。</q>'}
    ]},
  {id:'s_infirm3', mode:'chain', t:'瓦谢克', la:'Venceslaus', who:['lukas'],
    text: S => `瓦谢克的腿还要再养一个月。卢卡什修士说，在哪里养都行，只要有人看着他别下地。

<q>我想回车阵，</q>男孩说，<q>可是车阵里没人看着我。他们都在打仗。</q>${S.f.vasekTaught ? '他用手指在被子上写了一个“马”字，还是五条腿。' : ''}`,
    opts:[
      {t:'<q>去柳溪吧。我母亲会看着你。</q>', fx:{q:{q_hosp:'done'}, set:{vasek:'liuxi'}, rep:{home:3}, inc:{eMen:1}}, app:{katka:5, petr:4},
        r:'你把他送回了柳溪。母亲给他收拾了一张床，多罗塔骂他腿上的木板绑得太难看，拆了重新绑。\n\n过了一个月，他能走了，一瘸一拐的，跟着村里的佃户们练连枷。他说柳溪的连枷没有塔博尔的好，可是柳溪的粥比塔博尔的稠。'},
      {t: S => S.f.olenkaTabor ? '<q>回塔博尔吧。去找那个剪短头发的姐姐，让她接着教你认字。</q>' : '<q>回塔博尔吧。我送你。</q>', fx:{q:{q_hosp:'done'}, set:{vasek:'tabor'}, rep:{tabor:5}, t:{olenka:6}}, app:{katka:6},
        r: S => S.f.olenkaTabor ? '你把他送到塔博尔的车阵。奥莲卡看见他，叫了一声，跑过来，看了看他的腿，又看了看你，什么也没说，把他抱了起来，抱得他直叫疼。\n\n后来你听说，她教他认完了“马”，接着教“车”，接着教“家”。' : '你把他送到塔博尔的车阵。车阵里的人看见他，以为看见了鬼。一个女人冲过来抱住了他，哭得说不出话。是他的母亲。他们以为他死在了路边。'}
    ]}
);
// 你一直不回来，搜查的人也会来
DAY_HOOKS.push(S => {
  if (S.q.q_hosp === 1 && S.day >= (S.f.hospDay || 0) + 6 && S.region !== 'strak') {
    if (tr('hubert') >= 15) { S.q.q_hosp = 'done'; S.f.vasek = 'tabor'; addLog('听说有人去斯特拉科尼采的医院搜异端，胡贝特修士挡在了门口。瓦谢克后来回了塔博尔。'); }
    else { S.q.q_hosp = 'fail'; S.f.vasek = 'taken'; addLog('听说布杰约维采的人从斯特拉科尼采的医院里抬走了一个塔博尔的孩子。'); }
  }
});

TALK.hubert = [
  {k:'a', pr:2, t:'<q>修士的剑，</q>胡贝特说，<q>是用来守门的。门里面是谁，不归剑管。</q>'},
  {k:'b', pr:3, t:'<q>你知道医院骑士团最早是干什么的吗？</q>胡贝特说，<q>在耶路撒冷开一间医院，给朝圣的人治病。后来才有了剑。我有时候想，我们是不是走反了。</q>'},
  {k:'c', pr:5, if: S => S.f.campUp, t:'<q>莱特纳山上的营地，</q>胡贝特说，<q>和尼科波利斯一模一样。每个人都以为自己是来打一场必胜的仗的。</q>'},
  {k:'d', pr:6, if: S => S.f.vitkovDone, t:'<q>我听说了维特科夫，</q>胡贝特说，<q>听说他们从山脊上往下滚。</q>他沉默了一会儿，<q>那条船，又开走了。</q>'}
];
GREET.hubert = ['胡贝特修士在磨剑。', '<q>上帝保佑你，柳溪。</q>', '老人在井边打水，动作很慢。'];
ASK.hubert = {cup:{min:10, t:'<q>苏多梅日？</q>胡贝特说，<q>我在尼科波利斯见过一样的事：骑兵冲进了他们不该冲的地方。上帝在不在那里，我不知道。烂泥在。</q>'}, lady:{t:'<q>每座老城堡里都有一个白衣女人，</q>他说，<q>罗德岛上也有。骑士团的人说，那是没有人记得的人。</q>'}, bones:{t:'<q>耶路撒冷的土？</q>胡贝特笑了，<q>我在耶路撒冷待过两年。那里的土和这里一样，种豆子长豆子。</q>'}};

TALK.lukas = [
  {k:'a', pr:2, t:'<q>骑士团的规矩，</q>卢卡什修士说，<q>病人是主人，修士是仆人。我做了十年仆人，没有一个主人问过我信什么。</q>'},
  {k:'b', pr:3, t:'<q>柳树皮煮水能退烧，</q>卢卡什说，<q>缬草能睡觉，金丝桃能让人不那么难过。你要是心里乱，我给你一包。</q>', fx:{mind:1}},
  {k:'c', pr:5, if: S => S.f.vasek && S.f.vasek !== 'taken', t:'<q>瓦谢克的腿会好的，</q>卢卡什说，<q>就是会短一点。走路会有点瘸。以后他走到哪里，人家都知道他打过仗。</q>'}
];
GREET.lukas = ['卢卡什修士在洗绷带。', '<q>你又受伤了？</q>', '他在给一个老人喂汤。'];
ASK.lukas = {touch:{clue:'t_herbs', t:'<q>柳树皮，缬草，</q>卢卡什修士笑了，<q>我也有一双手。可是没有人说我的手能治病。也许是因为我长得不好看。</q>'}};

// ---------- 布杰约维采 ----------
def(
  {id:'s_budej_arrive', mode:'arrive', region:'budej', prio:45, t:'城门', la:'Porta', tag:'布杰约维采',
    text: S => `布杰约维采的城门口排着长队。卫兵是德意志人，一个一个地问，问的都是同一句话：<q>你怎么领圣餐？</q>

前面一个农民说，饼和酒都领。卫兵让他站到了一边。那一边已经站了七八个人，手腕上绑着绳子。

轮到你了。${S.f.budejWanted ? '\n\n卫兵看了你一眼，又低头看了看手里的一张纸。纸上画着一个盾牌，盾牌上是一棵柳树。' : ''}`,
    opts:[
      {t:'<q>和教皇一样。</q>', if: S => !S.f.budejWanted, vow:'lie', fx:{set:{budejIn:1}}, r:'卫兵挥了挥手。你走进城门，没有回头看那一边站着的人。'},
      {t: S => S.p.faith === 'roman' ? '<q>和我父亲一样。</q>' : '<q>饼和酒都领。</q>', if: S => !S.f.budejWanted, fx: S => ({set:{budejIn:1, budejMarked:S.p.faith !== 'roman' ? 1 : 0}, honor:2, money:S.p.faith !== 'roman' ? -10 : 0}),
        r: S => S.p.faith === 'roman' ? '卫兵想了一下，似乎觉得这个回答没有问题，挥了挥手。' : '卫兵看着你的剑，看着你的马，又看了看你的脸。<q>骑士，</q>他说，<q>双倍的入城税。在城里，有人会看着你。</q>你交了钱。从那以后，你在城里走到哪里，身后都有一双眼睛。'},
      {t:'亮出你和王冠的交情', if: S => S.rep.crown >= 15, fx:{set:{budejIn:1}, rep:{crown:2}}, r:'你说出了几个莱特纳山上的名字。卫兵的脸色变了，对你行了个礼。你走进城门，那一边站着的人看着你，你没有看他们。'},
      {t:'绕到城墙的排水口，钻进去', if: S => S.f.budejWanted, fx:{set:{budejIn:1}, mind:-1}, r:'排水口很臭，很窄。你钻进去的时候，听见城墙上的卫兵在笑，笑的是别的事。'},
      {t:'塞给他十个格罗申', cost:10, fx:{set:{budejIn:1}}, app:{eliska:4, zden:-3}, r:'卫兵把钱收了，什么也没问。在布杰约维采，这也是一种回答。'}
    ]},
  {id:'s_vavra1', mode:'here', at:'bsq', act:[2, 3], prio:20, if: S => !S.q.q_vavra, t:'告示', la:'Edictum', tag:'布杰约维采',
    text: S => `广场中间的刑柱旁边，一个公告员在念告示，先念德语，再念捷克语。

<q>……下列异端，拒不悔改，于本月第一个星期天，在本广场执行火刑……</q>他念了五个名字。第三个名字是：<q>瓦夫拉，铁匠之子，柳溪人。</q>

你认识他。柳溪铁匠家的二儿子，比你小六岁，小时候跟在你后面跑，摔了跤从来不哭。${S.f.olenkaTabor ? '他是跟着奥莲卡一起上的山。' : '二月里，他跟着村里一半的人上了塔博尔的山。'}`,
    opts:[{t:'去城门塔', fx:{q:{q_vavra:1}}, run: S => { S.f.vavraDay = S.day + 5; },
      r: S => `公告员念完了，卷起了告示。离那个星期天还有五天：${dateLabel(S.day + 5)}。`}]},
  {id:'s_vavra_jail', at:'bjail', prio:15, if: S => S.q.q_vavra === 1, t:'小窗口', la:'Fenestella', hint:'城门塔下面关着瓦夫拉',
    text: S => `塔楼底下的牢房只有一个小窗口，开在街面上，比脚踝高不了多少。你蹲下来，往里看。

<q>柳溪的？</q>里面有人说。是瓦夫拉。他的脸贴在铁栏上，瘦了，可他笑了，<q>${S.p.g === '女' ? '小姐' : S.p.g === '男' ? '少爷' : '骑士老爷'}。你父亲教我骑过马。</q>

他说，他是替塔博尔的长老送信的，走的是南边的小路，被巡逻的人抓住了。<q>信他们拿走了，</q>他压低声音，<q>信是写给玫瑰堡的，给那个监护人。长老们和玫瑰家在谈，我不知道谈什么。多明我会的那个修士问了我三天，问的都是这个。我说我不认得字。我是真不认得。</q>${S.f.vasek === 'taken' ? '\n\n牢房的角落里，有人躺在干草上，一条腿夹着木板。是斯特拉科尼采医院里的瓦谢克。他也认出了你，把脸转向了墙。' : ''}`,
    opts:[
      {t:'<q>我会把你弄出来。</q>', fx:{q:{q_vavra:2}, rep:{home:2}}, r:'他点点头，又笑了一下。<q>别告诉我爹，</q>他说，<q>就说我在塔博尔，在车阵里，吃得很好。</q>'},
      {t:'<q>那些信里写的是什么，你真的不知道？</q>', chk:'grace', fx:{q:{q_vavra:2}, set:{knowsRoseLetters:1}, xp:{grace:1}}, ffx:{q:{q_vavra:2}},
        r:'瓦夫拉看了看街上，没有人。<q>我听长老们说过一句，</q>他说，<q>玫瑰家答应，十字军来的时候，他们的兵不动。塔博尔答应，不烧玫瑰家的修院。</q>\n\n你想起了玫瑰堡大厅里那张长桌，和那个替少年领主做主的人。',
        f:'<q>真不知道，</q>他说，<q>我要是知道，早就说了，好少挨几鞭子。</q>'}
    ]},
  {id:'s_heinrich', at:'dominic', prio:14, who:['heinrich'], if: S => S.q.q_vavra === 2, t:'审讯官', la:'Inquisitor', hint:'去见审瓦夫拉的多明我会修士',
    text: S => `海因里希修士在回廊的尽头等你，好像早就知道你会来。他请你坐，给你倒了一杯水。

<q>你是为那个铁匠的儿子来的，</q>他说，声音很轻，很有礼貌，<q>在我们谈他之前，请允许我先问你几个问题。只是习惯，请不要介意。</q>

他把手指交叉放在桌上。<q>第一个问题：你领圣餐的时候，领一样，还是两样？</q>${S.f.budejMarked ? '\n\n他的桌上放着一张纸，你看见上面写着你的名字和你入城的日子。' : ''}`,
    opts:[
      {t:'<q>两样。</q>', fx:{set:{heinrichSaw:'honest'}, t:{heinrich:6}}, r:'<q>谢谢你的诚实，</q>海因里希修士说，好像你回答的是今天的天气，<q>在这座城里，诚实的人不多了。</q>', next:'s_heinrich2'},
      {t:'<q>一样。</q>', vow:'lie', fx:{set:{heinrichSaw:'liar'}}, r:'<q>是吗，</q>海因里希修士说，看了你一会儿，在面前的纸上写了一个字，<q>好的。</q>', next:'s_heinrich2'},
      {t:'<q>您先告诉我，您领几样。</q>', chk:'lore', fx:{set:{heinrichSaw:'clever'}, t:{heinrich:8}, xp:{lore:1}}, ffx:{set:{heinrichSaw:'liar'}},
        r:'海因里希修士笑了，这是你第一次看见他真的笑。<q>一样，</q>他说，<q>按照康斯坦茨大公会议的决议，平信徒领一样就足够了，因为基督完整地存在于每一种形式之中。你瞧，我回答了你。现在轮到你。</q>\n\n你说：<q>那么，我领两样，得到的也是同一个基督。您有什么损失呢？</q>他看着你，很久，很久。<q>你应该去读神学，</q>他说。', f:'<q>我领的是教会让我领的，</q>他说，<q>就像你应该领的那样。</q>他在纸上写了一个字。', next:'s_heinrich2'}
    ]},
  {id:'s_heinrich2', mode:'chain', t:'第二个问题', la:'Quaestio secunda', who:['heinrich'],
    text: S => `<q>第二个问题，</q>海因里希修士说，<q>其实不是问题，是一个提议。</q>

<q>那个孩子身上搜出来的信，是塔博尔的长老写给玫瑰堡的。信没有署名，收信的人也没有写名字。我很想知道，在玫瑰堡，是谁在读塔博尔的信。</q>他喝了一口水，<q>你告诉我这个名字，那个孩子明天就可以和你一起出城。我以神父的名义担保。</q>

${S.f.knowsRoseLetters || S.done.s_warden_choice ? '你知道那个名字。你见过那张长桌。' : '你不确定，可是你猜得到。在玫瑰堡，替少年领主做主的只有一个人。'}`,
    opts:[
      {t:'说出监护人的名字', fx:{set:{vavraFree:1, roseBetrayed:1}, q:{q_vavra:'done'}, rep:{crown:12, rose:-20, home:5}, t:{heinrich:10, warden:-30}}, app:{zden:-15, eliska:5, katka:3},
        r:'海因里希修士点点头，在纸上写下了那个名字，吹干了墨水，折好。<q>你救了一个人，</q>他说，<q>也许还会害死几个。这就是我们这一行的算术。我做了二十年，还是算不清。</q>\n\n第二天早上，瓦夫拉站在城门口等你，手腕上还有绳子的印子。他什么也没问。\n\n后来你听说，玫瑰堡派了一个信使去了莱特纳山，带着很多银子，和一封很长的道歉信。'},
      {t:'<q>我不知道。</q>', vow:'lie', if: S => S.f.knowsRoseLetters || S.done.s_warden_choice, fx:{t:{heinrich:-5}}, r:'<q>你知道，</q>海因里希修士温和地说，<q>可是你选择不说。这很好，忠诚是一种美德。只是这种美德，要由那个孩子来付钱。</q>他站起来，送你到回廊的门口。<q>星期天之前，你随时可以回来。</q>'},
      {t:'和他辩：<q>一个不识字的孩子送一封他读不懂的信，算什么异端？</q>', chk:'lore', dc: S => (S.f.heinrichSaw === 'clever' ? 1 : 0) + (inParty('matej') ? 1 : 0) + (S.f.heinrichSaw === 'liar' ? -1 : 0), fx: S => ({set:{vavraFree:1, vasekFreed:S.f.vasek === 'taken' ? 1 : 0}, q:{q_vavra:'done'}, rep:{home:5, crown:-3}, t:{heinrich:12}, xp:{lore:1}}), ffx:{t:{heinrich:-3}}, app:{matej:10, zden:4},
        r: S => `你们辩了一个下午。你说，异端是坚持错误的人，一个不认字的人坚持不了任何东西，他只是一个信差，像一匹驮信的马。海因里希修士说，马不会选择驮什么。你说，穷人也不会。\n\n天快黑的时候，他叹了一口气，合上了面前的书。<q>好吧，</q>他说，<q>我会写信给法官，说这个孩子是一个无知的信差，不是异端。${S.f.vasek === 'taken' ? '那个断了腿的赶车的孩子也一样。' : ''}不是因为你说服了我。是因为我已经很久没有和人这样辩过了。</q>\n\n第二天，瓦夫拉出了城门塔。`,
        f:'<q>马不会选择驮什么，</q>海因里希修士说，<q>可是马的主人会被问罪。你是他的主人吗，柳溪？</q>你没有回答好。他客客气气地送你出了回廊。'}
    ]},
  {id:'s_vavra_bribe', at:'bjail', ph:[2], prio:13, if: S => S.q.q_vavra === 2, t:'看守', la:'Custos', hint:'夜里换岗的看守爱喝酒',
    text: S => `夜里，城门塔的看守坐在门口喝酒。他喝的是行会的啤酒，喝得很快，像是有什么事要忘掉。${inParty('eliska') ? '\n\n爱丽什卡看了他一眼，在你耳边说：<q>他欠酿酒行会的钱。我闻得出来。欠钱的人喝酒都这么快。</q>' : ''}`,
    opts:[
      {t: S => `给他钱${inParty('eliska') ? '（爱丽什卡替你讲价）' : ''}`, cost:0, need: S => S.money >= (inParty('eliska') ? 30 : 60), hint: S => `${inParty('eliska') ? 30 : 60} 格罗申`, fx: S => ({money:inParty('eliska') ? -30 : -60, set:{vavraFree:1}, q:{q_vavra:'done'}, rep:{home:5}}), app:{eliska:6, zden:-3},
        r:'看守数了钱，数了两遍，然后站起来，把钥匙挂在门边的钉子上，走开去撒尿了。他撒了很久。\n\n瓦夫拉从塔里出来的时候，腿软得站不住。你把他扶上马，天亮之前出了城。'},
      {t:'撬开门锁', chk:'nerve', takes:true, fx: S => ({set:{vavraFree:1, budejWanted:1, vasekFreed:S.f.vasek === 'taken' ? 1 : 0}, q:{q_vavra:'done'}, rep:{home:6, crown:-10, tabor:4}}), ffx:{hurt:2, rep:{crown:-6}}, app:{ilona:8, katka:8, zden:-4},
        r: S => '你等看守喝醉了，从他腰上摘下钥匙。牢房里的五个人，你全放了出来。他们光着脚，跑过空荡荡的大广场，跑过那根刑柱，跑出了城墙上的一个排水口。\n\n天亮以后，布杰约维采的城门口贴出了一张新的告示，上面画着一个盾牌，盾牌上是一棵柳树。' + (S.f.vasekFreed ? '\n\n瓦谢克是你背出来的。他的腿还夹着木板，一路上一声不吭。' : ''),
        f:'锁刚开，看守就醒了。他喊了起来，塔楼上的卫兵冲了下来。你跑出了城，身上挨了两下。瓦夫拉还在里面。'}
    ]},
  {id:'s_vavra_burn', mode:'auto', prio:70, if: S => S.q.q_vavra && S.q.q_vavra !== 'done' && S.q.q_vavra !== 'fail' && S.f.vavraDay && S.day >= S.f.vavraDay, t:'星期天', la:'Dominica', tag: S => S.region === 'budej' ? '布杰约维采 · 大广场' : '消息',
    text: S => S.region === 'budej' ? '星期天，大广场上挤满了人。五根木桩，五堆柴。瓦夫拉是第三个。\n\n他被绑上去的时候，在人群里找了一会儿，找到了你。他没有喊，也没有哭。火点起来的时候，他在唱歌，唱的是柳溪的人割麦子时唱的那支。唱到第二段，就听不见了。' + (S.f.vasek === 'taken' ? '\n\n第五根木桩上的人是被抬上去的，一条腿还夹着木板。' : '') : `从南边来的人说，${dateLabel(S.f.vavraDay)}那天，布杰约维采的大广场上烧了五个人。第三个是柳溪铁匠家的二儿子。\n\n他们说，他在火里唱歌，唱的是割麦子时唱的那支。`,
    opts:[{t:'……', fx: S => ({q:{q_vavra:'fail'}, set:{vavraDead:1, vasekDead:S.f.vasek === 'taken' && !S.f.vasekFreed ? 1 : 0}, mind:S.f.vasek === 'taken' ? -5 : -3, rep:{home:-6, tabor:-2}, t:{olenka:-5}}), r:'回到柳溪，你去了一趟铁匠家。铁匠在打铁，你站在门口，他没有停下来。他打完了那把镰刀，淬了火，才抬头看你。\n\n<q>他唱了吗？</q>他问。你说唱了。他点点头，又拿起了一块铁。'}]},
  {id:'s_vavra_home', mode:'here', at:'village', prio:18, if: S => S.f.vavraFree && !S.f.vavraHome, t:'铁匠铺', la:'Fabrica', tag:'柳溪',
    text:'瓦夫拉回到柳溪的那天，他父亲在打铁。铁匠看见儿子走进来，手里的锤子停在半空，停了很久，然后落下去，打在铁砧上，打偏了，火星溅了一地。\n\n他什么也没说，把锤子递给了儿子。瓦夫拉接过来，接着打那把没打完的镰刀。',
    opts:[
      {t:'<q>留在柳溪吧。村里需要会打铁的人。</q>', fx:{set:{vavraHome:'liuxi'}, inc:{eMen:1}, rep:{home:6}}, r:'瓦夫拉留下了。他给柳溪的佃户们打了二十把连枷，都没收钱。他说，塔博尔的连枷是用来打仗的，柳溪的连枷是用来打麦子的，可是打仗的时候，打麦子的也能用。'},
      {t:'<q>你想回山上，就回去。</q>', fx:{set:{vavraHome:'tabor'}, rep:{tabor:4, home:3}}, r:'第二天一早，他又走了。走之前，他在父亲的铁砧上留了一枚钉子，钉子上刻着一个杯子。铁匠把那枚钉子钉在了门框上，钉得很深。'}
    ]}
);

TALK.heinrich = [
  {k:'a', pr:2, t:'<q>人们以为审讯官喜欢烧人，</q>海因里希修士说，<q>其实我们最喜欢的是说服。一个被说服的人，比一堆灰有用得多。</q>'},
  {k:'b', pr:3, t:'<q>我年轻的时候读过威克里夫，</q>海因里希修士说，<q>读得很仔细。要驳倒一个人，你得比他的学生更懂他。</q>'},
  {k:'c', pr:5, if: S => S.f.vavraFree, t:'<q>那个铁匠的儿子，</q>海因里希修士说，<q>我梦见过他一次。他在我的回廊里打铁。我醒过来，不知道这算是一个好梦还是一个坏梦。</q>'}
];
GREET.heinrich = ['海因里希修士在抄书。', '<q>愿主的平安与你同在。真的。</q>', '他朝你微笑，很有礼貌。'];

// ===== 柳溪的庄子：粮仓、民兵、木栅、磨坊、租子 =====
// 每七天结一次账。租子放进租箱，回家才能拿；收留的人要吃粮；粮吃完了，村里会饿
const EST_RENT = {full:{n:'照旧收', r:1.5}, half:{n:'减半', r:.75}, none:{n:'免租', r:0}};
function estInit() {
  const f = S.f;
  if (f.eInit) return;
  Object.assign(f, {eInit:1, eGrain:40, eMen:f.eMen || 0, eWall:0, eRefugees:0, eRent:'full', eChest:0});
}
const millOk = () => !S.f.millBurned || S.f.millRebuilt;
const estTenants = () => 22 + (S.f.hrubi === 'lord' ? 10 : 0);
function estLine() {
  estInit();
  const f = S.f;
  return `粮仓 ${Math.max(0, f.eGrain)} 斗${f.eGrain <= 10 ? '（快见底了）' : ''} · 民兵 ${f.eMen} 队 · 木栅 ${['没有', '半圈', '一圈'][f.eWall]} · 磨坊${millOk() ? '在转' : '烧坏了'} · 租子${EST_RENT[f.eRent].n}${f.eRefugees ? ` · 收留了 ${f.eRefugees} 户` : ''} · 租箱里 ${f.eChest} 格罗申`;
}
DAY_HOOKS.push(S => {
  if (!S.f.eInit || (S.day + 1) % 7) return;
  const f = S.f, rent = Math.round(estTenants() * EST_RENT[f.eRent].r) + (millOk() ? 6 : 0);
  f.eChest += rent;
  f.eGrain -= Math.ceil(f.eRefugees * 1.2);
  if (f.eRent === 'full') S.rep.home = clamp(S.rep.home - 1, -100, 100);
  if (f.eRent === 'none') S.rep.home = clamp(S.rep.home + 2, -100, 100);
  addLog(`柳溪的账：这七天收了 ${rent} 格罗申的租子，粮仓还剩 ${Math.max(0, f.eGrain)} 斗。`);
  if (f.eGrain <= 0 && !f.eHungry) f.eHungry = 1;
});
// 第一次回家就开账
DAY_HOOKS.push(S => { if (S.region === 'liuxi') estInit(); });

};
