@keyframes fxBrk{0%{background:var(--rubric); border-color:var(--rubric); transform:rotate(45deg) scale(1.2)} 35%{transform:rotate(45deg) scale(1.7); box-shadow:0 0 12px var(--rubric); opacity:.7} 100%{transform:rotate(45deg) scale(.75); opacity:1}}
@keyframes fxWin{0%{text-shadow:0 0 0 rgba(227,169,72,0); transform:scale(1.6); opacity:0} 40%{text-shadow:0 0 24px rgba(227,169,72,.9); transform:none; opacity:1} 100%{text-shadow:0 0 8px rgba(227,169,72,.35)}}

/* 地图 */
.map .road.mine{stroke-dasharray:7 5; animation:fxDash 1.4s linear infinite}
@keyframes fxDash{to{stroke-dashoffset:-24}}
.map .node.here circle:first-of-type{transform-box:fill-box; transform-origin:center; animation:fxBeat 2.6s ease-in-out infinite}
@keyframes fxBeat{0%,100%{transform:scale(1)} 50%{transform:scale(1.18); filter:drop-shadow(0 0 5px rgba(208,64,46,.8))}}
.map .fx-trip{stroke:var(--flame); stroke-width:3.4; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(227,169,72,.85))}
.map .fx-rider circle{fill:#fff3d6; stroke:var(--flame); stroke-width:2}
.map .fx-rider .halo{fill:rgba(227,169,72,.3); stroke:none; transform-box:fill-box; transform-origin:center; animation:fxHalo .7s ease-out infinite}
@keyframes fxHalo{from{transform:scale(.4); opacity:1} to{transform:scale(1.4); opacity:0}}
.map .node.fx-dest circle:first-of-type{fill:var(--flame-bg); stroke-width:3; transform-box:fill-box; transform-origin:center; animation:fxBeat .7s ease-in-out infinite}

/* 主界面 */
.place.fx-arrive h2{animation:fxInk 1.1s .1s ease-out both}
@keyframes fxInk{from{clip-path:inset(0 100% 0 0); opacity:.3} to{clip-path:inset(0 0 0 0); opacity:1}}
.place.fx-arrive .emblem{animation:fxEmblem 1s ease-out both}
@keyframes fxEmblem{from{opacity:0; transform:rotate(-80deg) scale(.4)} to{opacity:1; transform:none}}
.place.fx-arrive .place-d, .place.fx-arrive .echo{animation:fxUp .6s .4s ease-out both}
.place.fx-moved > :not(.fx-cv):not(.emblem){animation:fxFade .4s ease-out both}
.place.fx-phase > .fx-cv{animation:fxFade 1.8s ease-out both}
.place .echo.fx-echo{animation:fxUp .45s ease-out both}
#fx-wash{position:fixed; inset:0; z-index:40; pointer-events:none; opacity:0; background-size:300% 100%;
  background-image:linear-gradient(100deg, transparent 20%, rgba(255,214,150,.17) 50%, transparent 80%)}
#fx-wash.go{animation:fxWash 1.6s ease-in-out both}
@keyframes fxWash{0%{opacity:0; background-position:100% 0} 25%{opacity:1} 100%{opacity:0; background-position:0 0}}
.topbar.fx-newday .when b{display:inline-block; animation:fxDate .9s ease-out both}
@keyframes fxDate{0%{opacity:0; transform:translateY(-8px)} 60%{opacity:1; color:var(--flame)} 100%{transform:none}}
.top-btns .badge{animation:fxBadge 2.6s ease-in-out infinite}
@keyframes fxBadge{0%,100%{box-shadow:0 0 0 0 rgba(208,64,46,0)} 50%{box-shadow:0 0 0 4px rgba(208,64,46,.25)}}

/* 标题、序幕、结局 */
.chalice svg{animation:fxChalice 4.2s ease-in-out infinite}
@keyframes fxChalice{0%,100%{filter:drop-shadow(0 6px 18px rgba(192,57,43,.25))} 50%{filter:drop-shadow(0 4px 30px rgba(222,78,52,.6))}}
.fx-title .chalice{animation:fxRise 1.1s ease-out both}
.fx-title .title-h{animation:fxTitle 1.6s .2s ease-out both}
@keyframes fxTitle{from{opacity:0; letter-spacing:.5em; filter:blur(6px)} to{opacity:1; letter-spacing:.2em; filter:none}}
.fx-title .title-lat, .fx-title .orn-div{animation:fxFade 1s .9s both}
.fx-title .title-p{animation:fxUp .8s 1.1s ease-out both}
.fx-title .title-p + .title-p{animation-delay:1.3s} .fx-title .title-p + .title-p + .title-p{animation-delay:1.5s}
.fx-title .heraldry, .fx-title .motto, .fx-title .title-btns{animation:fxFade .8s 1.7s both}
.fx-page > :not(.fx-cv){animation:fxUp .7s ease-out both}
.fx-page > .proto-art{animation:fxRise 1s ease-out both}
.fx-page > .proto-where{animation:fxTitle 1.2s .15s ease-out both}
.fx-page > .proto-text{animation-delay:.45s}
.fx-end > :not(.fx-cv){animation:fxRise .8s ease-out both}
#toast.fx-pop{animation:fxToast .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fxToast{from{opacity:0; transform:translateX(-50%) translateY(18px) scale(.95)} to{opacity:1; transform:translateX(-50%)}}

@media (prefers-reduced-motion:reduce){
  .fx-cv, #fx-wash{display:none}
  .chalice svg, .map .road.mine, .map .node.here circle, .top-btns .badge, .ch::after{animation:none!important}
}`;
  // 主样式表在 body 里，要排在所有样式后面才压得住
  const last = [...document.querySelectorAll('style')].pop();
  if (last) last.after(st); else document.head.appendChild(st);
})();

try { window.claude?.hot?.snapshot?.(() => ({S})); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
