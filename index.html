        {t:'<q>我会告诉他你很好。</q>', fx: () => jobEnd(j, .5, 1, {app:{ilona:5}, mind:1}), r:'弓手从帐篷里拿出一只小皮袋，塞给你。<q>聘礼，</q>他用很生硬的德意志话说，<q>给她父亲。</q>皮袋里是十个匈牙利金币。行会长后来说，那是他见过最体面的聘礼。'}]},
    fail:'你没有去找莉泽尔。后来有人说，十字军撤走的时候，库曼人的马群里有一个编着歪辫子的姑娘。'},
  cow:{kind:'find', from:['liuxi'], to:'pisek', at:'square', pay:12, n:'村里的牛', if: S => S.f.act >= 1,
    give:'村长沃伊塔很生气：<q>斯特拉卡，老雅库布家的花牛，昨天夜里被人牵走了。有人看见一个当兵的牵着一头花牛往皮塞克去了。</q>他顿了顿，<q>斯特拉卡认得自己的名字。您叫它，它会回头。</q>',
    end:{t:'斯特拉卡', la:'Vacca', text:'皮塞克的集市上，一个满脸胡子的大兵正在卖一头花牛，开价很低，低得让人起疑。花牛低着头，嚼着地上的草，看起来很不高兴。\n\n<q>这是我的牛，</q>大兵说，<q>我从迈森牵来的。</q>',
      opts: j => [{t:'喊一声：<q>斯特拉卡！</q>', chk:'nerve', fx: () => jobEnd(j, 1, 1, {rep:{home:2}}), ffx: () => jobEnd(j, 0, 0, {money:-12, rep:{home:2}}),
          r:'花牛抬起头，哞了一声，朝你走过来，把脑袋顶在你的胸口上。满集市的人都笑了。大兵骂了一句迈森话，钻进了人群。', f:'花牛没有抬头。也许它不叫斯特拉卡，也许它在生气。最后你掏钱把它买了回来。老雅库布说，就是它，它从小就这样，生气了谁都不理。'},
        {t:'把它买回来', cost:12, fx: () => jobEnd(j, 1, 1, {rep:{home:3}}), r:'大兵数了钱，很高兴。你牵着斯特拉卡回柳溪，它一路上都在吃路边的草，走得很慢。老雅库布在村口等着，看见它，哭了。'}]},
    fail:'斯特拉卡没有回来。老雅库布说，那个大兵会遭报应的。'}
};
// 骑士讨债时的决斗

  intro:'他走路有点晃，可是剑一拔出来，手就不晃了。<q>我喝了一年的酒，</q>他说，<q>也练了一年的剑。</q>',

// ----- 每天都有的：运货和悬赏 -----
const BANDIT_N = {first:['独眼的', '红胡子', '瘸腿的', '会唱歌的', '黑', '高个子', '迈森来的'], name:['马丁', '库诺', '迪特里希', '沃伊捷赫', '翁德拉', '汉斯', '彼什']};

  robber:{n:'强盗骑士', d:'一个没有领地的骑士，带着几个骑兵守在河边的浅滩上，过路的车都要给他交“保护费”。不交的，车和人都下了河。'},
  thief:{n:'偷马贼', d:'一伙偷马贼，专偷营地边上拴着的马，偷了就往林子里赶，第二天在别的集市上卖。'},
  ghoul:{n:'盗墓的', d:'几个人夜里去坟地里挖东西，挖棺材里的戒指、腰带扣，连死人的牙都拔。'}
};
const bountyKind = r => ({camp:'thief', prague:'thief', kutna:'ghoul', liuxi:'ghoul', rose:'robber', budej:'robber', strak:'robber', pisek:'robber'})[r] || 'deserter';
DUELS.d_bandit = {name:'头目', look: () => LOOKS.bandit, hp:3, my:3, hurt:1, yield:true, w:{heavy:2, thrust:2, feint:2, guard:1, rush:2},
  intro: () => { const j = jobCur(); return j ? `${j.x.name}把剑横过来。<q>${pick(['一个人来的？胆子不小。', '你是来送钱的，还是来送命的？', '骑士老爷，我们也是有过老爷的人。'])}</q>` : ''; },
  win:{fx: () => { const j = jobCur(); return j ? jobEnd(j, 1, 1, {honor:3}) : {}; }, r: () => `${(jobCur() || {x:{}}).x.name || '他'}倒下了。他手下的人四散跑开。你把他捆起来，交给了当地的人。他们说，赏钱会派人送来——赏钱真的来了，这在这一年是件稀罕事。`},

const HAUL_TXT = ['商人自己病了，躺在床上起不来。', '商人得留在家里看铺子，他老婆说，他一走，伙计就偷。', '商人不敢走那条路，上个月他表兄在那条路上丢了一车货和两颗门牙。', '这一车本来是商人儿子要送的，可是他儿子上了塔博尔。'];
const HAUL = {kind:'haul', n: j => `运${cnQ(j.x.k)}担${GOODS[j.x.g].n}`,
  end:{t:'交货', la:'Merces', text: j => `${RECIP[j.to]}掀开麻布，一担一担地验${GOODS[j.x.g].n}。${pick(['验完了，点点头。', '验了很久，挑出了一担说不好，又放了回去。', '验完了，在账本上画了一道，问你路上太平不太平。'])}${j.x.short ? '\n\n<q>钱不凑手，</q>他说，<q>城里的钱都被十字军和塔博尔人吓跑了。给你一半的钱，另一半给货行不行？</q>' : ''}`,
    opts: j => j.x.short ? [{t:'一半钱，一半货', fx: () => { const g = pick(MARKET[j.to].stock.filter(x => !GOODS[x].contra)) || 'grain'; const room = cargoCap() - cargoN() + j.sz; const k = Math.max(0, Math.min(2, room)); if (k) { mkInit(); const c = S.cargo[g] || (S.cargo[g] = {n:0, c:0, d:S.day}); if (!c.n) c.d = S.day; c.n += k; } j.x.gave = k ? `${cnQ(k)}担${GOODS[g].n}` : ''; return jobEnd(j, .5, 1, {}); },
        r: () => j.x.gave ? `他给了你${j.x.gave}，帮你捆上了驮子。` : '你的驮子装不下了，他只好给了你一半的钱，另一半记了一张欠条。'},
      {t:'<q>说好了是钱。</q>', chk:'grace', fx: () => jobEnd(j, 1, 1, {}), ffx: () => jobEnd(j, .5, 0, {}), r:'他叹了口气，进了里屋，拿出一只小罐子，从罐子底下数出了剩下的钱。', f:'他把空空的钱袋翻过来给你看。你只拿到了一半。'}]
      : [{t:'收钱', fx: () => jobEnd(j), r:'他数了钱给你。你的驮子一下子轻了，轻得有点不习惯。'}]}};
const BOUNTY = {kind:'bounty', n: j => `悬赏：${j.x.name}`,
  end:{t: j => BOUNTY_K[j.x.b].n, la:'Proscriptus', dark:true, text: j => `${j.to === j.from ? '天还没黑' : `你一进${REGION[j.to].n}地界`}，就有人来报信：${j.x.name}${pick(['就在河边', '就在林子边上', '昨夜又来过', '在路口的十字架下面歇脚'])}。${BOUNTY_K[j.x.b].d}\n\n你找到他们的时候，他们正围着一堆火，火上烤着一只不知道是谁家的鹅。`,
    opts: j => [{t:'拔剑', takes:true, run: () => { DUELS.d_bandit.name = j.x.name; DUELS.d_bandit.hp = foeHp(3); }, r:'你走进火光里。他们站起来，鹅掉进了火里。', duel:'d_bandit'},
      {t:'<q>散了吧。头目跟我走，别的人回家。</q>', chk:'grace', dc:-1, takes:true, fx: (S, t) => jobEnd(j, t === 'mid' ? .4 : .6, 1, {honor:2, mind:1}), ffx: () => ({}), run: () => { DUELS.d_bandit.name = j.x.name; DUELS.d_bandit.hp = foeHp(3); }, duel: (S, tier) => tier === 'bad' ? 'd_bandit' : null,
        r:'他们互相看了看。有几个人放下了武器，最后连头目也放下了。<q>回家，</q>一个年轻的说，<q>家都烧了。</q>可是他们还是走了。头目跟着你，一路上一句话也没说。', p:'有一半人走了，另一半跟着头目跑进了林子。你只带回来两个人，赏钱只拿到了一部分。', f:'他们大笑起来。头目拔出了剑。'},
      {t:'改天再来', run: () => { j.snooze = S.day; }, r:'你退出了火光。他们没有追。'}]}};

// ----- 状态 -----
function jbInit() { if (!S) return; S.jb = S.jb || {seq:0, act:[], bd:{}, n:{}, seen:{}, done:0, fail:0, earned:0}; }
const jobCur = () => S && S.jb ? (S.jb.act.find(j => j.u === S.jb.cur) || (S.jb.last && S.jb.last.u === S.jb.cur ? S.jb.last : null)) : null;
const specOf = j => j.kind === 'local' ? null : j.kind === 'haul' ? HAUL : j.kind === 'bounty' ? BOUNTY : RUNS[j.id];
const standing = r => S.jb.n[r] || 0;
const payMul = r => 1 + clamp(standing(r) * .05, -.15, .3);
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const arriveAt = r => r === 'liuxi' ? 'manor' : r === 'prague' ? 'oldtown' : placesIn(r)[0].id;
function roadDist(a, b) {
  const d = {[a]:0}, done = new Set(), q = [a];
  while (q.length) {

  liuxi:'柳溪往北，赫鲁比那边的村子在冒烟。来的是一队穿着杂色号衣的骑兵，说是来“征粮”的，可是他们连教堂的蜡烛都要。',
  pisek:'皮塞克城外的磨坊在冒烟。一队骑兵把磨坊主绑在了水轮上，问他把粮食藏在哪里。',
  tabor:'塔博尔山下的一个村子在冒烟。来的是玫瑰家的骑兵，说这些人是异端的佃户，粮食是异端的粮食。'
};
wev({id:'w_burn', t:'冒烟的村子', la:'Incendium', once:false, prio:7, dark:true, if: S => S.f.campUp && Object.keys(BURN_TXT).includes(S.region) && S.day - (S.f.burnDay ?? -9) >= 6,
  text: S => { S.f.burnDay = S.day; return BURN_TXT[S.region]; },
  opts:[
    {t:'拔剑，冲过去', takes:true, run: S => { DUELS.d_forager.hp = foeHp(2); }, r:'你骑马冲进了浓烟里。', duel:'d_forager'},
    {t:'帮村里的人往外跑', takes:true, fx: S => { if (S.region === 'liuxi' || S.f.eInit) { estInit(); S.f.eRefugees = (S.f.eRefugees || 0) + 1; return {honor:2, mind:1, rep:{home:2}}; } return {honor:2, mind:1}; }, app:{petr:4, katka:3, eliska:2},
      r: S => `你把孩子一个一个抱上马，把老人扶进林子里。等抢粮的人走了，村子也烧完了。${S.f.eInit ? '有几户人家没有地方可去，你让他们去柳溪。母亲会给他们一个睡觉的地方。' : '他们站在林子边上看着烟，谁也没有哭。'}`},
    {t:'拿钱赎回他们的牛', cost:20, fx:{honor:1, mind:1}, app:{eliska:3},
      r:'抢粮队的头目数了钱，很爽快地把牛还了回去，又顺手牵走了一头羊，说那是利息。'},
    {t:'绕开', fx:{mind:-1}, app:{katka:-3}, r:'你绕开了。烟在你身后很久都看得见，像一根黑色的柱子。'}
  ]});

// ---------- 布拉格城里（六月、七月） ----------
wev({id:'w_spy', t:'奸细', la:'Explorator', tag:'布拉格', if: S => S.region === 'prague' && S.day >= 60,
  text:'老城的一条小街上，一群人揪着一个面包师傅往外拖。他是德意志人，在这里烤了二十年的面包。有人说他夜里往城堡那边打信号，有人说他往面包里掺了石灰，还有人只是跟着喊。\n\n一根绳子已经甩上了路灯的铁架。',
  opts:[
    {t:'挡在他前面', chk:'grace', fx:{honor:4, rep:{prague:-1}}, ffx:{hurt:1, mind:-2}, app:{zden:5, petr:6, matej:4, katka:-2},
      r:'你说：要吊人，先过市政厅。你说：吊错了人，主会记账。你说了很多，最后说服他们的是一个老太太，她说这个面包师傅二十年来从没短过她一两面包。\n\n人群慢慢散了。面包师傅坐在地上，浑身发抖，第二天一早，他托人给你送来了一篮还热着的面包。',
      f:'你挡在他前面，有人用棍子打在你的背上。你没能挡住。'},
    {t:'先搜他的身', chk:'lore', fx:{rep:{prague:4}, set:{spyFound:1}}, ffx:{mind:-2}, app:{eliska:4},
      r:'你从他的鞋底里搜出一封信，用油纸包着，写给城堡里的守军队长：城墙东边哪一段的人最少。人群安静了一下。你把信交给了市政厅的人，他们把面包师傅带走了，没有吊在路灯上。\n\n后来你听说，他在老城的地牢里关到了秋天。',
      f:'你什么也没搜到。人群等不及了。'},
    {t:'走开', fx:{mind:-2}, r:'你走过下一个街角的时候，听见身后的人群安静了一下，然后欢呼起来。'}
  ]});
wev({id:'w_bread', t:'面包', la:'Panis', tag:'布拉格', if: S => S.region === 'prague' && S.f.campUp,
  text:'十字军把布拉格围了三面，城外的粮食运不进来。面包一天一个价，老城广场上的面包铺门口挤满了人，有人在砸门。一个女人抱着孩子，站在人群外面，什么也没抢，只是看着。',
  opts:[
    {t:'把驮着的黑麦按三倍的价钱卖掉', if: S => S.cargo && S.cargo.grain && S.cargo.grain.n, fx: S => { const n = S.cargo.grain.n; delete S.cargo.grain; S.f.trN = (S.f.trN || 0) + n; return {money:n * GOODS.grain.p * 3, rep:{prague:-3}, honor:-2}; }, app:{eliska:2, katka:-6, petr:-4},
      r:'黑麦一会儿就卖光了。你的钱袋鼓了起来。那个抱孩子的女人没有买，她买不起。'},
    {t:'把驮着的黑麦分给排队的人', if: S => S.cargo && S.cargo.grain && S.cargo.grain.n, fx: S => { const n = S.cargo.grain.n; delete S.cargo.grain; return {rep:{prague:Math.min(10, 3 + n)}, honor:4, mind:2}; }, app:{katka:6, petr:6, matej:4},
      r:'你站在车上，一斗一斗地往外分。第一斗给了那个抱孩子的女人。分完了，有人开始唱歌，唱的是你听不懂的老歌。'},
    {t:'拿出二十五个格罗申，替穷人买面包', cost:25, fx:{rep:{prague:4}, honor:2, mind:1}, app:{petr:4, katka:3},
      r:'面包师傅收了你的钱，把一筐面包从窗口递出来。人群安静了一点。二十五个格罗申，买了六十个面包。不够，可是够那个女人和她的孩子。'},
    {t:'走开', fx:{mind:-1}, r:'你走开了。身后传来门被砸开的声音。'}
  ]});
wev({id:'w_articles', t:'四条款', la:'Quattuor articuli', tag:'布拉格', if: S => S.region === 'prague' && S.f.campUp && (S.f.act >= 3 || S.day >= 80) && S.f.path !== 'crown',
  text:'查理学院的硕士们写完了一份东西，四条，每条都很短：神的道要自由地传讲；圣餐要饼和酒一起领；教士不该有世俗的财产和权力；犯了大罪的人，不管是谁，都要受罚。\n\n他们要找一个人，举着白旗，把它送到莱特纳的营地里去，念给诸侯们听。<q>他们不会听，</q>一个硕士说，<q>可是他们会听见。</q>',
  opts:[
    {t:'举着白旗去', chk:'nerve', takes:true, fx:{honor:5, rep:{prague:4, crown:2}, set:{articlesCarried:1}}, ffx:{hurt:1, honor:3, rep:{prague:3}}, app:{matej:8, zden:3, eliska:3},
      r:'你在营地门口念了。来听的人不多：一个迈森的骑士，两个匈牙利的贵族，一个红衣主教的书记。书记听到第三条，冷笑了一声。迈森的骑士一直听到最后，问你能不能把那张纸给他。\n\n你给了他。他把纸折好，塞进了胸甲里面。',
      f:'你还没走到营地，就有人朝你放箭。箭射中了你的马鞍。你还是念完了，对着一排没有表情的帐篷。'},
    {t:'<q>找别人吧。</q>', r:'硕士们没有勉强。第二天去的是一个年轻的神父，回来的时候，袖子上多了一个箭洞，脸上的笑却没有少。'}
  ]});
wev({id:'w_images', t:'圣像', la:'Imagines', tag:'布拉格', if: S => S.region === 'prague' && S.day >= 60 && (S.f.marched || S.day >= 62),
  text:'塔博尔人进了城，第一件事是去修院。他们冲进一座修院的教堂，把墙上的画用石灰刷掉，把雕像推倒，把彩色玻璃一块一块敲下来。<q>上帝不住在画里，</q>领头的人喊，<q>上帝住在人心里！</q>\n\n祭坛旁边，还剩下一幅画：一个圣母，抱着孩子，金色的背景已经旧了。一个人正举着斧子朝它走过去。',
  opts:[
    {t:'帮他们', fx:{rep:{tabor:4}, lens:1}, app:{katka:5, zden:-8, matej:-3},
      r:'你推倒了一个木头的圣徒。它倒下来的时候，脸朝上，表情很平静，像是早就知道会有今天。'},
    {t:'<q>住手。</q>', chk:'grace', fx:{rep:{prague:2, tabor:-2}, honor:2}, ffx:{rep:{tabor:-4}}, app:{zden:6, matej:5, katka:-4},
      r:'你说：画是穷人画的，玻璃是穷人烧的，砸了它们，穷人的手艺就没了。拿斧子的人停下来，想了想，把斧子放下了。<q>那就留着，</q>他说，<q>留着让人看看，他们以前是怎么骗我们的。</q>',
      f:'他们不听。斧子落下来的时候，你转过了脸。'},
    {t:'趁乱把那幅圣母像卷起来带走', chk:'nerve', fx:{set:{madonnaSaved:1}, rep:{rose:2}, mind:1}, ffx:{rep:{tabor:-3}}, app:{zden:8, eliska:2},
      r:'你用刀把画布从框子上割下来，卷起来塞进斗篷里。没有人看见，或者有人看见了，没有说。\n\n后来，这幅画挂在了柳溪的村教堂里。扬神父说，它比原来的那幅好看。',
      f:'你刚把画布卷起来，就被人抓住了胳膊。画布被扯了回去，扔进了火里。'}
  ]});
wev({id:'w_bells', t:'钟', la:'Campanae', tag:'七月', ph:[2], if: S => S.region === 'prague' && S.f.act >= 3 && S.day < VIT_DAY,
  text:'半夜，山上城堡里的钟响了，是守军在为国王祈祷。过了一会儿，老城泰恩教堂的钟也响了起来，然后是新城的，然后是城里所有的钟。\n\n两边的钟隔着一条河，你响一声，我响一声，像两个人在吵架，又像在说悄悄话。',
  opts:[
    {t:'听着', fx:{mind:2}, r:'你听着，听到最后，分不清哪一声是山上的，哪一声是城里的。'},
    {t:'跪下祈祷', fx:{xp:{faith:1}, lens:1}, r:'你为城里的人祈祷，也为山上的人祈祷。你不知道上帝在听哪一边的钟。'},
    {t:'数钟声', fx:{xp:{lore:1}, lens:-1}, r:'城里的钟比山上的多，可是山上的钟比城里的响。你数到第一百零七下，钟停了。'}
  ]});
wev({id:'w_gun', t:'铁管子', la:'Píšťala', if: S => ['prague', 'tabor'].includes(S.region) && S.day >= 75 && (S.f.marched || S.region === 'tabor' || S.f.act >= 3),
  text: S => `一个塔博尔的铁匠在城墙底下试他的新东西：一根铁管子，钉在一块木托上，后面有一个小孔。他往管子里倒了一撮黑粉，塞进一颗铅丸，用一根烧红的铁丝去点那个小孔。\n\n砰的一声，二十步外的一块木板上多了一个洞，所有人都往后跳了一步。${S.f.dealDay && S.f.dealDay['tabor:sell:saltpeter'] !== undefined ? '\n\n<q>硝石是你卖给公社的那一批，</q>铁匠说，<q>好东西。</q>' : ''}`,
  opts:[
    {t:'<q>让我试试。</q>', chk:'nerve', fx:{xp:{nerve:1}, rep:{tabor:2}}, ffx:{mind:-1},
      r:'你点了火。管子在你手里跳了一下，像一头小牛。木板上没有洞，可是木板后面的鸡窝塌了。铁匠大笑，说你打中了。', f:'你点了火，什么也没发生。你凑过去看，砰的一声，你的眉毛没了一半。'},
    {t:'<q>它叫什么？</q>', fx:{xp:{lore:1}}, r:'<q>píšťala，</q>铁匠说，<q>笛子。你听它的声音，像不像一根笛子？</q>\n\n不像。可是后来，全欧洲的人都学着这么叫它。'}
  ]});

// ---------- 十字军营里 ----------
wev({id:'w_pyre', t:'营地里的火', la:'Rogus', tag:'莱特纳', dark:true, if: S => S.region === 'camp',
  text:'营地边上堆起了柴堆。几个迈森人押着一串波希米亚的农民走过来，都是在城外的村子里抓的。一个神父举着十字架，问他们领圣餐用几样东西。\n\n他们说两样。神父点了点头，往后退了一步。',
  opts:[
    {t:'去找匈牙利的贵族说情', chk:'grace', dc: S => S.rep.crown >= 20 ? 1 : -1, fx:{honor:5, rep:{tabor:3}, mind:1, set:{pyreSaved:1}}, ffx:{rep:{crown:-3}, mind:-3}, app:{ilona:6, katka:6, zden:3},
      r:'匈牙利的老伯爵听你说完，叹了一口气，派了两个骑兵过去。<q>国王要的是王冠，</q>他说，<q>不是灰。</q>那几个农民被带走了，带到哪里去，你不知道。至少不是柴堆上。',
      f:'老伯爵听你说完，摇了摇头：<q>那是教会的事。</q>你回来的时候，柴堆已经点着了。'},
    {t:'塞钱给看守，放走一个', cost:30, fx:{honor:3, mind:1, rep:{tabor:2}}, app:{katka:4, petr:4},
      r:'看守收了钱，在点火之前，把队伍最末的那个人推进了旁边的沟里。是个女人。她在沟里一直趴到天黑。'},
    {t:'看着', fx:{mind:-3, lens:1}, app:{katka:-6, petr:-4}, r:'火烧起来的时候，有人在唱歌，唱的是你在塔博尔听过的那一首。歌声比火先停。'},
    {t:'走开', fx:{mind:-1}, r:'你走开了。烟往营地这边飘，飘了一整夜。'}
  ]});
wev({id:'w_quarrel', t:'分赃', la:'Rixa', tag:'莱特纳', if: S => S.region === 'camp',
  text:'迈森人和匈牙利人为了一车抢来的东西打起来了：一车铁锅、几匹布、一只镀金的圣物匣。迈森人说是他们先看见的，匈牙利人说是他们的马先跑到的。刀已经拔出来了。',
  opts:[
    {t:'站到中间去，替他们分', chk:'grace', fx:{rep:{crown:4}, honor:2}, ffx:{hurt:1}, app:{zden:3, ilona:3},
      r:'你说：锅归迈森人，他们要做饭；布归匈牙利人，他们要过冬；圣物匣归教会，谁拿了谁下地狱。两边都骂你，骂完了，都照你说的做了。',
      f:'两边的刀都朝着你来了。你挨了一下，躲到了马车底下。'},
    {t:'帮匈牙利人', fx:{rep:{crown:-1}}, app:{ilona:6, zden:-2}, r:'匈牙利人赢了。他们把那车东西分了，分给你一口铁锅。伊洛娜要是在，会说那口锅是她见过最好的锅。'},
    {t:'看热闹', r:'最后谁也没赢。圣物匣不见了，第二天出现在一个随军商贩的摊子上，标价三十格罗申。'}
  ]});

// ---------- 乡下的夏天 ----------
wev({id:'w_hay', t:'割草', la:'Fenisecium', once:false, prio:6, ph:[0, 1], if: S => ['liuxi', 'sudomer', 'pisek', 'strak', 'usti', 'forest'].includes(S.region) && S.day >= 50 && S.day - (S.f.hayDay ?? -9) >= 9,
  text: S => { S.f.hayDay = S.day; return pick(['草长到膝盖了。一排农民在坡上割草，镰刀一起一落，像一排在鞠躬的人。他们缺人手：男人们都去了塔博尔，或者去了布拉格，或者哪里也没去，只是不在了。', '路边的草场上，几个女人在翻晒干草，一个老头在磨镰刀。<q>骑士老爷，</q>老头说，<q>您会使镰刀吗？跟使剑差不多，就是别往人身上招呼。</q>']); },
  opts:[
    {t:'下地帮忙', chk:'arm', takes:true, fx: S => ({money:8, mind:2, rep:{home:S.region === 'liuxi' ? 3 : 0}}), ffx:{mind:1, hurt:1},
      r:'你割到太阳落山，手上起了一排泡。晚上，他们在草垛边上请你吃黑面包和酸奶，一个孩子把一朵矢车菊插在了你的帽子上。', f:'你的镰刀割进了自己的靴子。他们笑了很久，给你包扎的时候还在笑。'},
    {t:'坐下来，和他们喝一口', fx:{mind:2}, r:'他们的酒是用接骨木的花泡的，甜得发腻。你们坐在草垛的阴影里，谁也没提打仗的事。'},
    {t:'赶路', r:'你走过去的时候，他们直起腰来看你，看了很久。'}
  ]});
const STORM_TXT = {
  katka:'卡佳挤在你旁边，浑身湿透，头发贴在脸上。<q>小时候我最怕打雷，</q>她说，<q>老爷家的厨娘说，雷公专劈说谎的人。</q>又一个雷打下来，她往你身上靠了靠，<q>我那时候说了很多谎。</q>',
  zden:'齐德涅克站在谷仓门口，背对着你，看着雨。<q>我哥哥被扔出窗子那天，</q>他说，<q>也下着雨。</q>过了很久，他才转过身来，<q>谢谢你没有说话。</q>',
  petr:'彼得没有进谷仓。他站在雨里，张开双臂，仰着脸，雨水顺着他的头发流下来。<q>进来！</q>你喊。他笑着摇头。最后你出去把他拉了进来，自己也湿透了。他说，这是今年最好的一场雨。',
  ilona:'伊洛娜把马牵进了谷仓，一边给它擦身子，一边用库曼话跟它说话。<q>它怕雷，</q>她说。马不怕，是她怕。你没有说穿。',
  matej:'马捷伊抱着他的书，书比他湿得少。<q>雷电是天上的蒸汽相撞，</q>他说，<q>亚里士多德说的。</q>又一个雷，他吓了一跳，书掉在了地上。<q>亚里士多德没在波希米亚淋过雨。</q>',
  eliska:'爱丽什卡拧着裙子上的水，骂了一长串，骂的是天气、道路、十字军，和那个说今天不会下雨的车夫。骂完了，她从包袱里摸出一小瓶酒，先递给了你。'
};
wev({id:'w_storm', t:'雷雨', la:'Tempestas', once:false, prio:6, ph:[1, 2], if: S => S.party.length > 0 && S.day >= 55 && S.day - (S.f.stormDay ?? -9) >= 14,
  text: S => { S.f.stormDay = S.day; return '天一下子黑了。风从林子那边压过来，第一个雷打下来的时候，你们离最近的村子还有半里路。你们冲进了路边一座没人的谷仓，谷仓里全是干草的味道，雨打在屋顶上，像有一千只手在敲门。'; },

        ['<q>麻绳也挺好看。</q>', '<q>嘴甜，</q>卡佳说，又把头发甩到了你脸上。', 3]]},
    {k:'k11', c:'love', o:'卡佳抓起你的手，翻过来看手心。<q>老爷的手，以前是软的吧，</q>她说，<q>现在有茧子了。</q>她用拇指摸着那些茧子，没有马上放开。',
      r:[['<q>是你的连枷磨的。</q>', '<q>那就再磨磨，</q>她说，这才松开，脸有点红。', 4],
        ['握住她的手', '她的手比你的还粗糙。你们就这样站着，谁也没说话，直到车阵里有人喊她的名字。', 4]]},
    {k:'k12', c:'heart', o:'夜里，卡佳枕着你的胳膊，看着车篷上的破洞。<q>你说，我们以后会有一个家吗？</q>她说，<q>不是老爷家，也不是车阵。就是一个家，有一口锅，有一只鹅。</q>',
      r:[['<q>有。柳溪有鹅。</q>', '<q>柳溪的鹅凶吗？</q><q>凶。</q><q>那好，</q>她说，<q>凶的鹅看家。</q>', 5, {mind:2}],
        ['<q>车阵就是家。</q>', '<q>车阵会拆的，</q>卡佳说，<q>可是你不会。对吧？</q>', 3]]},
    {k:'k13', c:'heart', o:'<q>我从来没跟人说过，</q>卡佳的声音很小，<q>每次打仗之前，我都想吐。苏多梅日那天早上，我吐了三回。</q>',
      r:[['<q>我也是。</q>', '她转过来看着你：<q>真的？</q><q>真的。</q>她笑了，笑着笑着就哭了，哭得很小声。这是她第一次让你看见。', 5],
        ['<q>可你还是去了。</q>', '<q>对，</q>她说，<q>吐完了，就去了。</q>她把脸埋进你的肩膀里，<q>下回你陪我吐。</q>', 4]]}
  ],
  zden:[
    {k:'z1', c:'past', o:'<q>我哥哥比我大十岁，</q>齐德涅克说，<q>他教我骑马、读书、念主祷文。他当上议员那天，请全家吃了一只天鹅。天鹅很难吃。</q>他停了一下，<q>我们都说好吃。</q>',
      r:[['<q>他是个什么样的人？</q>', '<q>一个太相信规矩的人，</q>他说，<q>他以为只要按规矩办事，就没有人会把他扔出窗子。</q>', 3],
        ['<q>天鹅真的那么难吃？</q>', '齐德涅克愣了一下，嘴角动了动。<q>像煮过头的鹅，</q>他说，<q>又老又腥。</q>这是你第一次看见他差点笑出来。', 4]]},
    {k:'z2', c:'past', o:'<q>十九岁那年，我去维也纳比武，</q>齐德涅克说，<q>第一场就被一个施蒂利亚人挑下了马。我躺在沙地上看着天，想：原来天这么高。</q>',
      r:[['<q>后来呢？</q>', '<q>后来我练了三年。第二回去维也纳，我把他挑下了马。</q>他想了想，<q>他躺在沙地上，大概也在想天有多高。</q>', 3],
        ['<q>天确实很高。</q>', '<q>是，</q>他说，<q>坐在马上看不出来。</q>', 2]]},
    {k:'z3', c:'past', o:'<q>受封骑士那天，我发了三个誓，</q>齐德涅克说，<q>保护弱者，忠于主君，永不说谎。</q>他看着自己的手，<q>这个夏天，这三个誓一直在打架。</q>',
      r:[['<q>哪一个赢了？</q>', '<q>还没打完，</q>他说，<q>等打完了，我告诉你。</q>', 2],
        ['<q>保护弱者应该赢。</q>', '他看了你很久。<q>我哥哥也这么说过，</q>他说，<q>在他当上议员以前。</q>', 3]]},
    {k:'z4', c:'now', if: S => S.region === 'prague', o:'齐德涅克在石桥上停下来，看着河。<q>小时候我在这座桥上丢过一只手套，</q>他说，<q>哥哥跳下去替我捞，捞上来的是别人的一只。我们一直不知道是谁的。</q>',
      r:[['<q>那只手套呢？</q>', '<q>还在我的箱子里，</q>他说，<q>一只陌生人的手套。我留着它，好像在替哥哥保管什么。</q>', 3],
        ['陪他站一会儿', '你们站在桥上，看着河水往北流。过了很久，他说：<q>谢谢。</q>你不知道他谢的是什么。', 4]]},
    {k:'z5', c:'now', if: S => S.region === 'tabor', o:'<q>我原以为塔博尔的人都是野兽，</q>齐德涅克说，<q>可是昨天有个女人给了我一碗汤。她知道我是玫瑰家的人。</q>他把那只空碗翻来覆去地看，<q>我不知道该怎么还她。</q>',
      r:[['<q>喝完了，就是还了。</q>', '<q>你们这些人，</q>他摇摇头。可是他把碗洗干净了，亲手送了回去。', 3],
        ['<q>他们也是这么看你们的。</q>', '<q>我知道，</q>他说，<q>这才是最难受的。</q>', 2]]},
    {k:'z6', c:'now', if: S => S.f.act >= 2, o:'<q>你注意到没有，</q>齐德涅克说，<q>这一路上的村子，十个里有三个是空的。门开着，锅还在灶上。人都去哪里了？</q>',
      r:[['<q>去塔博尔了。或者去了更远的地方。</q>', '<q>更远的地方，</q>他重复了一遍，<q>我哥哥也去了更远的地方。</q>', 2],
        ['<q>他们会回来的。</q>', '<q>你总是这么说，</q>齐德涅克说，<q>我开始有点信了。</q>', 3]]},
    {k:'z7', c:'mind', o:'<q>你领圣杯，我不领，</q>齐德涅克说，<q>可是我们跪下去的时候，跪的是同一个人。你觉得，他会在乎杯子吗？</q>',
      r:[['<q>他在乎跪下去的人。</q>', '<q>你说话像我母亲，</q>他说，<q>她每天晚上都在为全家所有的人祈祷，不管他们领几样。</q>', 4],
        ['<q>杯子很重要。</q>', '<q>对你们重要，</q>他说，<q>我尊重这一点。尊重比同意难。</q>', 2]]},
    {k:'z8', c:'mind', o:'<q>那天把我哥哥扔出窗子的人，</q>齐德涅克说，<q>后来有人告诉我，大半是屠夫和织工，喝了酒。</q>他握着剑柄，<q>他们第二天早上醒来，还记得自己做了什么吗？</q>',
      r:[['<q>记得。他们会记一辈子。</q>', '<q>那就好，</q>他说，又摇摇头，<q>不，那也不好。</q>', 3],
        ['<q>你恨他们吗？</q>', '<q>每天，</q>他说，<q>每天早上祈祷完，我都要再原谅他们一次。像擦剑。</q>', 3]]},
    {k:'z9', c:'joke', o:'你念玫瑰经又念错了一个地方。齐德涅克这一回没有停下来等你，而是轻轻地咳了一声。',
      r:[['<q>主不会在意的。</q>', '<q>主不会，</q>他说，<q>我会。</q>他的嘴角又动了一下。', 2],
        ['从头再念一遍', '你从头念了一遍，这一回没有错。他点了点头，像一个很严厉、又很高兴的先生。', 3]]},
    {k:'z10', c:'joke', o:'<q>你从来不笑，</q>你说。齐德涅克想了想：<q>我笑过。</q><q>什么时候？</q><q>去年复活节。</q>',
      r:[['<q>为什么笑？</q>', '<q>神父讲道的时候打了一个喷嚏，把蜡烛吹灭了，</q>他说，<q>我笑了一整台弥撒。我母亲到现在都没原谅我。</q>说完，他又差点笑了。', 4],
        ['<q>那今年的份呢？</q>', '<q>还没用，</q>齐德涅克说，<q>我在攒。</q>', 3]]},
    {k:'z11', c:'love', o:'齐德涅克替你把松了的护手系紧，系得很慢，手指碰到你手腕的时候停了一下。<q>系得太紧了吗？</q>他问，没有抬头。',
      r:[['<q>刚好。</q>', '他点点头，可是手没有马上拿开。<q>刚好，</q>他又说了一遍，好像在记住这个词。', 4],
        ['<q>你的手很暖。</q>', '他的耳朵一下子红了。<q>是天热，</q>他说。那天是阴天。', 4]]},
    {k:'z12', c:'love', o:'<q>我年轻的时候写过一首诗，</q>齐德涅克说，<q>给一个……一个人。用德语写的，韵押得很糟糕。</q>',
      r:[['<q>念给我听。</q>', '他念了。韵真的押得很糟糕，可是你没有笑。念完了，他说：<q>那个人后来嫁到了奥地利。</q>他看着你，<q>我以为我再也不会写了。</q>', 5],
        ['<q>现在还写吗？</q>', '<q>不写了，</q>他说，停了一下，<q>也许会再写。</q>', 3]]},
    {k:'z13', c:'heart', o:'齐德涅克躺在你身边，很久没有睡着。<q>我该去告解的，</q>他终于说，<q>可我不知道怎么说。神父会问我，后悔吗。</q>他转过头来，<q>我不后悔。</q>',
      r:[['<q>那就不用说。</q>', '<q>上帝都知道，</q>他说，<q>那就让他知道吧。</q>他把你的手按在自己的胸口上，那里的心跳得很稳。', 5],
        ['<q>我陪你去。</q>', '<q>你会被神父赶出来的，</q>他说，第一次真正笑出了声，<q>你领的是圣杯。</q>', 4]]},
    {k:'z14', c:'heart', o:'<q>你说，</q>齐德涅克说，<q>我哥哥要是还活着，会怎么看你？</q>',
      r:[['<q>会请我吃天鹅。</q>', '他笑了，笑得肩膀都在抖。<q>是，</q>他说，<q>他会的。难吃的天鹅。我们都会说好吃。</q>', 5],
        ['<q>会把我扔出窗子。</q>', '<q>别这么说，</q>他的声音很轻，可是握住了你的手，<q>不会了。再也不会了。</q>', 3]]}
  ],
  petr:[
    {k:'p1', c:'past', o:'<q>我在磨坊里推了十年的磨，</q>彼得说，<q>每天三千圈。有一天我数到两千九百九十九，停下了。磨坊主问我怎么了。我说，我想看看第三千圈不转，世界会怎么样。</q>',
      r:[['<q>世界怎么样了？</q>', '<q>世界没怎么样，</q>彼得说，<q>磨坊主给了我一巴掌。可我从那天起就不推了。</q>他笑了，<q>那一巴掌，是我得到过最好的东西。</q>', 3],
        ['<q>那你是被赶出来的。</q>', '<q>是我走出来的，</q>他说，<q>被赶和走出来，看你往哪边看。</q>', 2]]},
    {k:'p2', c:'past', o:'<q>我在塔博尔讲过道，</q>彼得说，<q>讲人生来没有罪。长老们问：那末日来了，谁下地狱？我说，没有人。他们就让我走了。</q>',
      r:[['<q>你还恨他们吗？</q>', '<q>恨要花力气，</q>彼得说，<q>我的力气都拿去爱人了，不够用。</q>', 3],
        ['<q>是真的吗？没有人下地狱？</q>', '<q>我不知道，</q>他说，<q>可要是我错了，我宁可在地狱里错，也不在天堂里对。</q>', 3]]},
    {k:'p3', c:'past', o:'你问他的手是不是真能治病。彼得把手伸给你看：很普通的一双手，指甲缝里有泥。<q>你说呢？</q>',
      r:[['<q>能。</q>', '<q>那它就能，</q>他说，握了握你的手，<q>对你能。</q>', 3, {lens:1}],
        ['<q>是柳树皮能。</q>', '彼得笑出了声。<q>你看见了，</q>他说，<q>柳树皮，缬草，一点蜂蜜，还有让人相信自己会好的那一点东西。最后那一点，最难找。</q>', 3, {lens:-1}]]},
    {k:'p4', c:'now', if: S => S.region === 'forest', o:'<q>听，</q>彼得说。你们站在林子里，他闭着眼睛，<q>啄木鸟。三只。一只在左边，两只在右边，右边那两只在吵架。</q>',
      r:[['闭上眼睛听', '你闭上眼睛。过了很久，你也听出来了：右边那两只，真的在吵架。彼得在你旁边轻轻地笑。', 4, {mind:1}],
        ['<q>我只听见风。</q>', '<q>风也好，</q>他说，<q>风是林子在喘气。</q>', 2]]},
    {k:'p5', c:'now', if: S => !!S.q.q_petr, o: S => `<q>岛上有个女孩，七岁，叫马尔塔，</q>彼得说，<q>她问我，伊甸园里有没有冬天。</q>${S.f.adamitesDead ? '他停了很久，<q>我没来得及回答她。</q>' : ''}`,
      r:[['<q>你会怎么回答？</q>', '<q>有，</q>他说，<q>可是伊甸园里的冬天，大家挤在一起取暖。</q>', 3],
        ['握住他的手', '他的手很凉。过了很久，才暖过来。', 4]]},
    {k:'p6', c:'mind', o:'<q>你觉得你身上有罪吗？</q>彼得问，问得很认真。',
      r:[['<q>有。很多。</q>', '<q>那你一定很累，</q>彼得说，<q>背着那么多东西走路。放下来一点吧，就今天。</q>', 2, {mind:2}],
        ['<q>没有。</q>', '<q>那你比所有的神父都诚实，</q>他笑了，<q>或者比他们都会说谎。</q>', 2],
        ['<q>我不知道。</q>', '<q>这是最好的回答，</q>彼得说，<q>知道的人，都在烧别人。</q>', 3]]},
    {k:'p7', c:'mind', o:'彼得在河里洗澡，叫你也下来。<q>你为什么总是穿那么多？</q>他问，<q>都夏天了。</q>',
      r:[['下河', '水很凉，凉得你叫了一声。彼得大笑，往你身上泼水。你们像两个孩子一样打了一场水仗。', 4, {mind:2}],
        ['<q>骑士不在河里脱衣服。</q>', '<q>骑士也是娘生的，</q>彼得说，<q>生下来的时候，谁也没穿甲。</q>', 1]]},
    {k:'p8', c:'joke', o:'你的靴子又磨破了。彼得看着它，表情很严肃。<q>你知道我为什么不穿靴子吗？</q>',
      r:[['<q>为了感受大地？</q>', '<q>为了省钱，</q>彼得说，<q>大地是后来想出来的理由。</q>他笑得在草地上打滚。', 3],
        ['<q>为什么？</q>', '<q>我的靴子被塔博尔的一个长老借走了，</q>他说，<q>他再也没还。我想，这大概是上帝的意思。</q>', 3]]},
    {k:'p9', c:'joke', o:'彼得又在唱那首没有词的歌。你跟着哼了一段，跑调了。',
      r:[['<q>这首歌本来就没有调。</q>', '<q>对，</q>彼得说，<q>所以你唱得完全正确。</q>', 3],
        ['接着哼', '你们一起哼，一个在调上，一个不在。一只鸟落在树枝上听了一会儿，飞走了。<q>它喜欢你唱的那一半，</q>彼得说。', 3]]},
    {k:'p10', c:'love', o:'<q>你知道亚当给每样东西起名字吗？</q>彼得躺在草地上看着你，<q>我也给你起了一个。</q>',
      r:[['<q>叫什么？</q>', '<q>不告诉你，</q>他说，<q>名字说出来，就是别人的了。我想让它只是我的。</q>他拉起你的手，在你手心里画了一个你看不懂的记号。', 4, {set:{petrName:1}}],
        ['<q>我也给你起一个。</q>', '<q>好，</q>他说，闭上眼睛等着。你在他耳边说了。他睁开眼，笑了很久。<q>这个好，</q>他说，<q>比彼得好。</q>', 5]]},
    {k:'p11', c:'love', o:'彼得一直看着你，看到你不自在。<q>你看什么？</q><q>你，</q>他说，<q>你好看的时候，自己不知道。</q>',
      r:[['<q>你才好看。</q>', '<q>我知道，</q>彼得说，一点也不谦虚，<q>可是我好看，对我没用。你好看，对我有用。</q>', 4],
        ['转过脸去', '他伸手把你的脸转了回来，很轻。<q>别躲，</q>他说，<q>伊甸园里没有人躲。</q>', 4]]},
    {k:'p12', c:'heart', o:'<q>如果有一天，</q>彼得说，<q>他们抓住我，要烧死我，你会怎么办？</q>',
      r:[['<q>我会把你抢出来。</q>', '<q>那你也会被烧死，</q>彼得说，<q>两个人一起烧，至少暖和。</q>他笑了，可是把你抱得更紧了。', 5],
        ['<q>我会记得你。</q>', '<q>那就够了，</q>他说，<q>被一个人记得，就不算死。</q>', 4]]},
    {k:'p13', c:'heart', if: S => !!S.f.petrName, o:'<q>你还记得我给你起的那个名字吗？</q>彼得说，<q>现在可以告诉你了。</q>',
      r:[['<q>告诉我。</q>', '他在你耳边说了。那是一个很短的词，不是捷克话，不是德意志话，也不是拉丁话。<q>是什么意思？</q><q>意思是‘回来的路’。</q>', 5],
        ['<q>别说。留着。</q>', '<q>好，</q>彼得说，<q>那它就一直是我的。也一直是你的。</q>', 4]]}
  ],
  ilona:[
    {k:'i1', c:'past', o:'<q>平原上的草，</q>伊洛娜说，<q>夏天比马还高。小时候我骑在马上，伸手就能摸到草尖。草里有鹌鹑，马一过，它们就扑棱棱地飞起来，像有人往天上撒豆子。</q>',
      r:[['<q>我想去看看。</q>', '<q>你会迷路的，</q>她说，<q>平原上没有路，只有马知道怎么回家。</q>她顿了顿，<q>我的马知道。</q>', 4],
        ['<q>你想家了。</q>', '<q>库曼人不想家，</q>伊洛娜说，<q>家在马背上。</q>可是她很久没有说话。', 2]]},
    {k:'i2', c:'past', o:'<q>本采小时候，</q>伊洛娜说，<q>骑羊。不是骑马，是骑羊。他摔下来一百次，哭了九十九次。</q>',
      r:[['<q>第一百次呢？</q>', '<q>第一百次他没哭，</q>她说，<q>他爬起来，打了羊一拳。羊也没哭。</q>她笑了，又不笑了，<q>他现在在国王的营里，学会打人了。</q>', 3],
        ['<q>你很疼他。</q>', '<q>他是我弟弟，</q>伊洛娜说，好像这句话解释了一切。', 3]]},
    {k:'i3', c:'past', o:'<q>国王的人到我们村子里来，</q>伊洛娜说，<q>说要去打异端。我问什么是异端。他说，就是喝错了酒的人。</q>她耸耸肩，<q>库曼人喝马奶。我想，那我们也是异端。</q>',
      r:[['<q>那你为什么还来？</q>', '<q>国王给钱，给马，</q>她说，<q>还有，我想看看喝错了酒的人长什么样。</q>她看着你，<q>长你这样。</q>', 4],
        ['<q>你们确实是。</q>', '伊洛娜大笑：<q>对！所以我站在你这边。异端和异端站一边。</q>', 3]]},
    {k:'i4', c:'now', if: S => S.region === 'camp', o:'伊洛娜指着库曼人的营地：<q>那个穿红袍子的，是我舅舅。他要是看见我跟你在一起，会把我捆在马上拖回家。</q>',
      r:[['<q>那我们离远一点。</q>', '<q>不用，</q>她说，<q>他眼睛不好，只认得马。</q>', 2],
        ['<q>我去跟他说。</q>', '伊洛娜愣住了，然后笑弯了腰。<q>你？跟他说？</q>她擦着眼泪，<q>他会先问你有几匹马。你有几匹？</q><q>一匹。</q><q>那就别去了。</q>', 3]]},
    {k:'i5', c:'now', o:'<q>你的马，</q>伊洛娜一边给它擦身子一边问，<q>叫什么名字？</q>',
      r:[[S => S.gear.horse === 'nag' ? '<q>灰子。</q>' : '<q>还没起。</q>', S => S.gear.horse === 'nag' ? '<q>灰子，</q>她念了一遍，<q>好名字。它喜欢。你看它的耳朵。</q>' : '<q>马没有名字，就不知道你在叫它，</q>伊洛娜说，<q>我给它起一个：‘快腿’。库曼话。</q>她用库曼话叫了一声，马真的转过了头。', 3],
        ['<q>马还要名字？</q>', '伊洛娜瞪着你，像你说了一句渎神的话。<q>你有名字吗？</q><q>有。</q><q>那它凭什么不能有？</q>', 1]]},
    {k:'i6', c:'mind', o:'<q>你们的神，</q>伊洛娜说，<q>为什么要人吵架？吃饼、喝酒、领几样，吵了这么多年。</q>',
      r:[['<q>神没让吵，是人自己吵的。</q>', '<q>那就是人的错，</q>她说，<q>那为什么要打神的仗？</q>你答不上来。她也没再问。', 3],
        ['<q>你们的神呢？</q>', '<q>我们有天，</q>伊洛娜说，<q>天很大，不管人喝什么。</q>', 2]]},
    {k:'i7', c:'mind', o:'<q>我见过国王的人怎么对俘虏，</q>伊洛娜说，<q>在库特纳霍拉。往井里扔。</q>她的手握紧了弓，<q>库曼人打仗，打完了，俘虏要么换钱，要么回家。没有往井里扔的。</q>',
      r:[['<q>所以你离开了他们。</q>', '<q>所以我离开了他们，</q>她重复了一遍，好像第一次听人把这件事说出来。', 4],
        ['<q>我们这边也有人这么做。</q>', '<q>我知道，</q>伊洛娜说，<q>所以我不说你们好。我只说你好。</q>', 3]]},
    {k:'i8', c:'joke', o:'伊洛娜把弓递给你：<q>射那棵树。</q>',
      r:[['射', '箭飞出去，射中了树后面的一个草垛。伊洛娜看了看树，又看了看草垛，严肃地说：<q>你瞄的是草垛吧？</q><q>……是。</q><q>那你射得很准。</q>', 3],
        ['<q>你先射。</q>', '她头也不回地射了三支，三支都钉在同一个树疤上。然后把弓塞回你手里：<q>该你了。</q>', 2]]},
    {k:'i9', c:'joke', o:'你问她，辫子上的铃铛不会把敌人引来吗。',
      r:[['<q>会吗？</q>', '<q>会，</q>伊洛娜说，<q>敌人听见铃铛，就知道是我来了。然后他们就跑了。</q>', 3],
        ['<q>铃铛很好听。</q>', '她摇了摇头，铃铛响成一片。<q>那就多听几声，</q>她说，<q>不收钱。</q>', 3]]},
    {k:'i10', c:'love', o:'伊洛娜坐在你旁边，拿起你的一绺头发，编了起来。<q>库曼的男人也编辫子，</q>她说，<q>编给喜欢他们的人看。</q>',
      r:[['让她编', '她编了一根细细的辫子，编完了，从自己的辫梢上摘下一个铜铃，系在了你的辫子上。<q>现在你也会响了，</q>她说。', 5],
        ['<q>我又不是库曼的男人。</q>', '<q>我知道，</q>伊洛娜说，手没停，<q>所以才要编。</q>', 3]]},
    {k:'i11', c:'love', o:'<q>上来，</q>伊洛娜拍拍她的马背，<q>坐我后面。带你去一个地方。</q>',
      r:[['上马', '她带你跑到一片没有人的高地上，停下来，什么也没说，只是看着天边。过了很久，她说：<q>这里像平原。</q>你从后面抱着她，下巴搁在她的肩上，铜铃在你耳边轻轻地响。', 5, {mind:2}],
        ['<q>我有自己的马。</q>', '<q>你的马太慢，</q>她说，<q>而且你的马背后面，没有我。</q>', 3]]},
    {k:'i12', c:'heart', o:'<q>你还记得那天我说的那句话吗？</q>伊洛娜说，<q>‘我的毡帐朝东开门’。</q>',
      r:[['<q>是什么意思？</q>', '<q>库曼的姑娘出嫁，毡帐就搬到男人家的东边，</q>她说，<q>门朝东开，太阳一出来就照进来。</q>她看着你，<q>我说那句话的时候，是在问你要不要我的毡帐。</q>', 5],
        ['<q>我记得。一直记得。</q>', '<q>那你就知道意思了，</q>她说，把脸埋进你的脖子里，<q>别让我说出来。</q>', 5]]},
    {k:'i13', c:'heart', o:'<q>如果我要回家，</q>伊洛娜说，<q>回平原上去，你跟我走吗？</q>',
      r:[['<q>跟你走。</q>', '<q>你会想你的柳树的，</q>她说，<q>平原上没有柳树。</q><q>那就种。</q>她想了很久。<q>……好，</q>她说，<q>那就种。</q>', 5],
        ['<q>柳溪需要我。</q>', '<q>我知道，</q>伊洛娜说，<q>所以我没问你要不要我留下，我问的是你会不会走。</q>她笑了一下，<q>你不会。没关系。</q>', 2]]}
  ],
  matej:[
    {k:'m1', c:'past', o:'<q>我十五岁进大学，</q>马捷伊说，<q>穷得只有一件袍子。冬天，我和另外两个学生睡一张床，轮流睡中间。</q>',
      r:[['<q>谁睡中间最多？</q>', '<q>我，</q>他说，<q>因为我会背整本《修辞学》，背到他们睡着为止。他们宁可让我睡中间，也不想再听一遍。</q>', 4],
        ['<q>那时候你想当什么？</q>', '<q>主教，</q>他说，一点也不害臊，<q>后来遇见了胡斯先生，就只想当一个好老师了。这是降级，也是升级。</q>', 3]]},
    {k:'m2', c:'past', o:'<q>胡斯先生考过我的逻辑，</q>马捷伊说，<q>我答错了一道题。他没有说我错，只是问：‘你确定吗？’我说确定。他说：‘那就再确定一次。’</q>',
      r:[['<q>后来你确定了吗？</q>', '<q>我花了五年，</q>他说，<q>发现我是错的。那时候他已经在康斯坦茨了。我一直没能告诉他。</q>', 4],
        ['<q>他是个怎样的人？</q>', '<q>一个很固执的人，</q>马捷伊说，<q>固执到肯为一个‘确定’去死。我做不到。我会再确定一次，再确定一次，然后活下来。</q>他停了一下，<q>这也许算不上美德。</q>', 3]]},
    {k:'m3', c:'past', o:'马捷伊眯着眼睛看一张告示，看了很久。<q>我需要一副眼镜，</q>他说，<q>威尼斯人做的那种。太贵了。</q>',
      r:[['<q>我念给你听。</q>', '你念了。他靠在你肩上听，像个老人。<q>你的拉丁文发音很糟糕，</q>他说，<q>可是很好听。</q>', 4],
        ['<q>攒钱买。</q>', '<q>攒了三年，</q>他说，<q>去年拿去赎一个学生了。</q>他又眯起眼睛，<q>人比书重要。这个道理，我是拿眼睛换的。</q>', 3]]},
    {k:'m4', c:'now', if: S => S.region === 'prague', o:'<q>那边，</q>马捷伊指着查理学院的屋顶，<q>我的房间在顶楼，窗户朝西。下午的太阳照进来，正好照在书桌上。我在那里坐了十九年。</q>',
      r:[['<q>想回去吗？</q>', '<q>想，</q>他说，<q>可回去了，就不能跟你走了。逻辑上，这是一个两难。</q>他看着你，<q>情感上，不是。</q>', 4],
        ['<q>十九年，你都在读什么？</q>', '<q>前十年读别人的书，</q>他说，<q>后九年读学生的脸。脸比书难读。</q>', 3]]},
    {k:'m5', c:'now', if: S => S.region === 'tabor', o:'马捷伊看着塔博尔的布道场，叹了口气。<q>他们讲道，</q>他说，<q>三句里有一句是《圣经》，一句是胡斯，一句是自己编的。最糟糕的是，最后那一句往往最好。</q>',
      r:[['<q>那就让他们编。</q>', '<q>你说得对，</q>他说，<q>真理不是大学里的人独有的。</q>他想了想，<q>可是脚注是。</q>', 3],
        ['<q>你也去讲一场。</q>', '<q>我一讲，他们就睡着了，</q>马捷伊说，<q>我讲的是三段论。三段论不能让人拿起连枷。这是它的缺点，也是它的优点。</q>', 3]]},
    {k:'m6', c:'now', if: S => S.f.act >= 2, o:'<q>你写日记吗？</q>马捷伊问，<q>应该写。以后的人会想知道这个夏天的事。他们会读到很多主教和国王写的东西，没有一个字是骑马走在泥里的人写的。</q>',
      r:[['<q>那你替我写。</q>', '<q>我写的会太漂亮，</q>他说，<q>漂亮的东西都是假的。你自己写，写难看一点。</q>', 3],
        ['<q>我认不得几个字。</q>', '<q>那我教你，</q>马捷伊的眼睛一下子亮了，<q>从今晚开始。第一个字：‘雨’。这个夏天，雨最多。</q>', 4, {xp:{lore:1}}]]},
    {k:'m7', c:'mind', o:'<q>你知道为什么要烧书吗？</q>马捷伊问，<q>不是因为书里写了错的东西，是因为书会让人犹豫。拿着火把的人，最怕犹豫。</q>',
      r:[['<q>那书就是最好的武器。</q>', '<q>最慢的武器，</q>他说，<q>要几百年才打得赢。可是它们会赢。</q>', 4],
        ['<q>犹豫也会害死人。</q>', '他想了很久。<q>你说得对，</q>他说，<q>维特科夫上不能犹豫。可是维特科夫之后，得有人犹豫。</q>', 3]]},
    {k:'m8', c:'mind', o:'<q>你信奇迹吗？</q>马捷伊问，<q>别急着说信。神父问这个问题的时候，最怕听见的就是‘我信’。</q>',
      r:[['<q>我信我看见的。</q>', '<q>经验主义者，</q>马捷伊很满意，<q>亚里士多德会喜欢你。</q>', 3, {lens:-1}],
        ['<q>我信。</q>', '<q>那你比我勇敢，</q>他说，<q>我每天早上都要重新决定一次。</q>', 2, {lens:1}],
        ['<q>你信吗？</q>', '<q>礼拜一、三、五信，</q>他说，<q>礼拜二、四不信。礼拜六在想。主日我在讲道，没空想。</q>', 4]]},
    {k:'m9', c:'joke', o:'马捷伊给自己倒了第三杯。你看着他。<q>圣杯派的神父，</q>他说，<q>要习惯酒的味道。这是职业训练。</q>',
      r:[['<q>那我也该训练一下。</q>', '<q>平信徒不用这么刻苦，</q>他说，可还是给你倒了一杯，<q>不过刻苦是美德。</q>', 3],
        ['<q>这是第三杯了。</q>', '<q>逻辑上，</q>马捷伊说，<q>第三杯和第一杯没有本质的区别。</q><q>那第十杯呢？</q><q>第十杯是另一个问题了，</q>他说，<q>得另开一门课。</q>', 3]]},
    {k:'m10', c:'joke', o:'<q>我们来辩论，</q>马捷伊说，<q>题目：骑士比神父有用。你是正方。</q>',
      r:[['<q>骑士能保护神父。</q>', '<q>神父能为骑士祈祷，</q>他说，<q>骑士死了上天堂，神父死了还是上天堂。所以骑士多死了一回。</q><q>这是什么逻辑？</q><q>神学逻辑，</q>他说，<q>你输了。</q>', 3],
        ['<q>骑士会骑马。</q>', '马捷伊愣了三秒，笑出了声。<q>无法反驳，</q>他说，<q>我上回骑马，马把我驮进了河里。正方胜。</q>', 4]]},
    {k:'m11', c:'love', o:'<q>奥维德说，</q>马捷伊的眼睛没有离开书，<q>‘每一个恋爱的人都是士兵’。</q>他翻了一页，<q>我一直觉得这句话很蠢。最近不太确定了。</q>',
      r:[['<q>为什么不确定了？</q>', '<q>因为我认识了一个士兵，</q>他说，终于抬起头来看你，<q>证据变了，结论也得变。这是学者的义务。</q>', 5],
        ['<q>我就是士兵。</q>', '<q>是，</q>他合上书，<q>那么根据奥维德……</q>他没有说完，脸先红了。', 4]]},
    {k:'m12', c:'love', o:'马捷伊拉过你的手，在你的手心里写了一个字，写得很慢。<q>猜，</q>他说，<q>拉丁文，三个字母。</q>',
      r:[['<q>猜不出来。</q>', '他又写了一遍。你还是猜不出来。他也没告诉你，只是把你的手合上，握了一会儿。', 4],
        ['<q>Amo？</q>', '马捷伊的手停住了。<q>……你的拉丁文，</q>他的声音有点哑，<q>比我以为的好。</q>', 5]]},
    {k:'m13', c:'heart', o:'<q>神父不能结婚，</q>马捷伊躺在你身边，看着屋顶，<q>这是规矩。可胡斯先生说，规矩是为人定的，人不是为规矩生的。</q>他转过头来，<q>我在找一个能说服我自己的论证。</q>',
      r:[['<q>找到了吗？</q>', '<q>找到了，</q>他说，<q>前提一：我爱你。前提二：上帝是爱。结论……</q>他停住了，<q>结论我还没敢写下来。</q>', 5],
        ['<q>不用找。</q>', '<q>学者不找论证就睡不着，</q>马捷伊说，<q>不过今晚，我想试试。</q>他闭上眼睛，握着你的手，很快就睡着了。', 4]]},
    {k:'m14', c:'heart', o:'<q>我以前跟你说过，我最怕有人拿着我的书去烧别人，</q>马捷伊说，<q>现在换了。</q>',
      r:[['<q>现在怕什么？</q>', '<q>怕你在山上，我在山下，什么也做不了，只能想一个论证，</q>他说，<q>论证救不了人。</q>', 4],
        ['<q>我在这里。</q>', '<q>对，</q>他说，<q>你在这里。这是一个事实。我很喜欢事实。</q>', 5]]}
  ],
  eliska:[
    {k:'e1', c:'past', o:'<q>我丈夫叫雅罗斯拉夫，</q>爱丽什卡说，<q>酿了一辈子酒，一滴不沾。他说酿酒的人喝酒，就像屠夫吃生肉，不体面。</q>',
      r:[['<q>你想他吗？</q>', '<q>想他的时候，我就去尝一口他最后酿的那桶，</q>她说，<q>那桶还剩一半。我喝得很慢。</q>', 4],
        ['<q>那你呢？你喝吗？</q>', '<q>我喝，</q>爱丽什卡说，<q>我是寡妇，不用体面了。</q>她举起杯子，<q>这是当寡妇唯一的好处。</q>', 3]]},
    {k:'e2', c:'past', o:'<q>我十六岁嫁到新城，</q>爱丽什卡说，<q>头一天，婆婆给了我一本账，问：‘认字吗？’我说不认。她说：‘那就学。学会了，这个家就是你的。’</q>',
      r:[['<q>你学会了。</q>', '<q>三个月就学会了，</q>她说，<q>半年以后，我发现婆婆的账算错了三十年。我没告诉她。</q>她笑了，<q>她死的时候，还以为自己是全新城最会算账的女人。</q>', 4],
        ['<q>她待你好吗？</q>', '<q>她待账本好，</q>爱丽什卡说，<q>我待账本好，所以她待我好。这就是新城。</q>', 2]]},
    {k:'e3', c:'past', o:'<q>那天街上在喊，</q>爱丽什卡说，<q>我在试一种新麦芽，没有出去。后来他们把他抬回来，说是被人挤倒的，就在新市政厅门口。他去那里，是给议员们送一桶酒。</q>',
      r:[['<q>不是你的错。</q>', S => `<q>我知道，</q>她说，<q>可那桶酒是我让他送的。</q>她把杯子转了一圈，<q>那一桶，后来他们赔给我了，账上记得清清楚楚。</q>${inParty('zden') ? '\n\n齐德涅克在不远的地方，听见了，没有回头。那天他也在找一个人。' : ''}`, 4],
        ['握住她的手', '她没有抽回手。<q>你的手很暖，</q>她说，<q>我很久没跟人说过这件事了。说出来，也就是一件事。</q>', 5]]},

      ['<q>他配不上你。</q>', '<q>你又没见过他，</q>卡佳说，<q>配不配得上，不是这么算的。</q>可她看了你一眼，那一眼里没有生气。', 1]]},
  {k:'k15', c:'past', o:'<q>二月里，传道人说末日要来了，只有五座城能活，</q>卡佳说，<q>我从赫鲁比走了三天到塔博尔。路上看见一个老头，背着一扇门。</q><q>门？</q><q>他说，到了新耶路撒冷，总得有个门。</q>',
    r:[['<q>他后来装上了吗？</q>', '<q>装上了，装在公社的仓房上，</q>卡佳说，<q>门比墙宽一截，冬天漏风。大家都说那是全塔博尔最好的门。</q>', 3],
      ['<q>末日没来。</q>', '<q>没来，</q>她说，<q>可我们已经走出来了。走出来的人，回不去了。末日不来，我们就自己当末日。</q>', 2, {lens:1}]]},
  {k:'k16', c:'now', if: S => S.f.sudomerDone, o:'<q>苏多梅日以后，车阵里的孩子都在玩‘苏多梅日’，</q>卡佳说，<q>一半人当铁老爷，一半人当车。没人愿意当铁老爷。最后让最小的那个当，他哭了。</q>',
    r:[['<q>下回我去当铁老爷。</q>', '<q>你本来就是，</q>卡佳说，<q>你去，孩子们会高兴死的。他们终于能打一个真的了。</q>她想了想，<q>别穿甲。他们下手没轻没重。</q>', 3],
      ['<q>孩子们不该玩这个。</q>', '<q>那该玩什么？</q>卡佳问。你答不上来。过了一会儿，她轻轻地说：<q>等仗打完了，就让他们玩鹅。</q>', 2]]},
  {k:'k17', c:'now', if: S => S.f.campUp, o:'<q>莱特纳上那些帐篷，你数过吗？</q>卡佳说，<q>我数了。数到四百，就不敢往下数了。</q>',
    r:[['<q>帐篷多，不等于人心齐。</q>', '<q>这话是杰士卡说的，</q>她说，<q>你也学会了。</q>她把连枷扛回肩上，好像轻了一点。', 3],
      ['<q>我也怕。</q>', '<q>怕好，</q>卡佳说，<q>怕的人会把车链子拴紧。不怕的人，第一个死。</q>她碰了碰你的胳膊，<q>我们都拴紧点。</q>', 3]]},
  {k:'k18', c:'now', if: S => S.region === 'liuxi', o:'<q>你家的佃户看我的眼神，</q>卡佳说，<q>像看一只闯进鸡窝的狐狸。</q>',
    r:[['<q>他们怕塔博尔人。</q>', '<q>他们怕的不是塔博尔人，是塔博尔人说的话，</q>她说，<q>‘没有老爷’。这句话在柳溪说出来，就像在教堂里放屁。</q>', 2],
      ['<q>去帮他们干一天活。</q>', '卡佳真去了。晚上回来，手里拎着一篮鸡蛋。<q>那个瞎了一只眼的老太太给的，</q>她说，<q>她说我打麦子的样子，像她死去的女儿。</q>她把篮子放下，很久没说话。', 4, {rep:{home:2}}]]},
  {k:'k19', c:'mind', o:'<q>塔博尔的长老说，什么都是大家的，</q>卡佳说，<q>地是大家的，粮是大家的，木桶里的钱是大家的。</q>她低头看着手里的连枷，<q>那它呢？</q>',
    r:[['<q>连枷是你的。</q>', '<q>那我就不是一个好塔博尔人，</q>她说，摸着连枷柄，<q>这根柄是我自己削的，削了一个冬天。我不给。</q>她笑了，<q>你别告诉长老。</q>', 3],
      ['<q>连枷也是大家的。</q>', '<q>那谁想用，就让他来拿，</q>卡佳说，<q>看他拿不拿得动。</q>', 2]]},
  {k:'k20', c:'mind', o:'<q>你杀的第一个人，</q>卡佳问，<q>你记得他的脸吗？</q>',
    r:[['<q>记得。</q>', '<q>我也记得，</q>她说，<q>我觉得该记得。记不住的人，就会杀第二个、第三个，杀到一个也记不住为止。</q>', 3, {mind:-1}],
      ['<q>不记得。我不去想。</q>', '<q>那你比我聪明，</q>卡佳说，<q>也比我难过。</q>', 1],
      ['<q>你呢？</q>', '<q>一个管家，</q>她说，<q>鼻子上有一颗痣。他倒下去的时候，嘴里在喊他娘。</q>她不说了，你也没有再问。', 2]]},
  {k:'k21', c:'joke', o:'卡佳戴上你的头盔，从里面瓮声瓮气地说：<q>我是骑士，我来收租。</q>',
    r:[['<q>交租！三只鹅！</q>', '<q>鹅不给，</q>她摘下头盔，<q>鹅是大家的。</q>她把头盔扣回你头上，扣反了。', 3],
      ['把头盔抢回来', '你追着她绕车阵跑了三圈，车阵里的人都在起哄。最后是一个老太太伸出拐杖，把她绊倒了。你们俩一起倒在草里，笑得爬不起来。', 3]]},
  {k:'k22', c:'joke', o:'<q>你骂人太文雅了，</q>卡佳说，<q>你说‘愿上帝惩罚你’。塔博尔人不这么骂。</q>',
    r:[['<q>那怎么骂？</q>', '她教了你一句。你学着说了一遍。旁边赶车的老头差点从车上掉下去。<q>别在你娘面前说，</q>卡佳说，<q>也别在扬神父面前说。</q>', 3],
      ['<q>骑士不骂人。</q>', '<q>骑士不骂人，骑士砍人，</q>她说，<q>我觉得还是骂人好一点。</q>', 2]]},
  {k:'k23', c:'you', if: S => S.f.olenkaTabor && !S.f.olenkaHome && !S.f.olenkaDead, o:'<q>你妹妹在布道场那边，</q>卡佳说，<q>天天去听讲道。她让我告诉你，她过得好。</q>她顿了一下，<q>她没让我说的是，她夜里会哭。</q>',
    r:[['<q>我去看她。</q>', '<q>别说是我告诉你的，</q>卡佳说，<q>她会恨我。你们柳溪人，骄傲得像鹅。</q>', 3],
      ['<q>她自己选的。</q>', '<q>是，</q>卡佳说，<q>我也是自己选的。自己选的路，也可以哭。</q>', 1]]},
  {k:'k24', c:'you', o:'<q>你娘是什么样的人？</q>卡佳问，<q>老爷家的太太，我只见过一种：手很白，不看人。</q>',
    r:[['<q>父亲死后，她一个人撑着柳溪。</q>', '<q>那她跟我娘一样，</q>卡佳说，<q>天底下撑着东西的，都是女人。男人们出去打仗，打完了回来，说是他们撑的。</q>她看了你一眼，<q>你别这样。</q>', 3],
      ['<q>她领圣杯，可从不跟我父亲吵这个。</q>', '<q>那她比塔博尔的长老们聪明，</q>卡佳说，<q>长老们为了一只杯子，能吵到天亮。</q>', 2]]},
  {k:'k25', c:'you', if: knowsFather, o:'<q>你说你爹跟着胡斯去过康斯坦茨，</q>卡佳说，<q>他回来以后，还收租吗？</q>',
    r:[['<q>收。</q>', '<q>那就是了，</q>她说，<q>见过圣人的人，回来也还是要收租。</q>她没有恶意，只是有点累。', 1],
      ['<q>收得很少。佃户们说他心软。</q>', '<q>心软的老爷，</q>卡佳想了想，<q>我没见过。下辈子投胎，我投到柳溪去。</q>', 3]]},
  {k:'ko_z', c:'others', if: S => knowsC('zden'), o:'<q>那个玫瑰家的骑士，</q>卡佳说，<q>每天早上念经，要念半个时辰。我数过了，他念错一个字，就从头再念。</q>',
    r:[['<q>他是个认真的人。</q>', '<q>认真的人最可怕，</q>卡佳说，<q>他要是认真地恨一个人，能恨一辈子。要是认真地……</q>她没说完，耸了耸肩。', 2],
      ['<q>你数他念经干什么？</q>', '卡佳的脸红了一下。<q>闲的，</q>她说，<q>赶车的时候没事干。</q>她赶着车走远了，走得有点快。', 2]]},
  {k:'ko_p', c:'others', if: S => knowsC('petr'), o:'<q>彼得说人生来没有罪，</q>卡佳说，<q>我听了很高兴。然后我想起了那个收租的管家。他也没有罪吗？</q>',
    r:[['<q>去问彼得。</q>', '<q>我问了，</q>她说，<q>他说管家也没有罪，只是被教坏了。</q>她看着自己的连枷，<q>那我打他的时候，打的是一个被教坏的人。这样一想，下手就轻了。</q>', 2],
      ['<q>管家有罪。</q>', '<q>对，</q>卡佳说，<q>彼得是个好人。可好人有时候不会算账。</q>', 2]]},
  {k:'ko_i', c:'others', if: S => knowsC('ilona'), o:'<q>那个库曼姑娘，</q>卡佳说，<q>她的马比我的车值钱，她的弓比我的命值钱。可她吃饭的样子，跟赫鲁比的孩子一模一样，用手抓，抓得很香。</q>',
    r:[['<q>你喜欢她。</q>', '<q>我喜欢吃饭香的人，</q>卡佳说，<q>吃饭香的人，心里没鬼。</q>', 2],
      ['<q>她以前是国王那边的人。</q>', '<q>以前是，</q>卡佳说，<q>人是会走过来的。我也是从老爷家走过来的。</q>', 2]]},
  {k:'ko_m', c:'others', if: S => knowsC('matej'), o:'<q>马捷伊先生在教我写名字，</q>卡佳说，<q>写了三天，我会写‘卡’了。</q>',
    r:[['<q>写给我看。</q>', '她用树枝在泥地上写了一个字，写得很大，歪歪扭扭的。你看了很久，没看出来那是“卡”。可你说：<q>写得好。</q>她高兴了一整天，走到哪儿都在地上写。', 4],
      ['<q>剩下那几个字呢？</q>', '<q>先生说慢慢来，</q>她说，<q>他学拉丁文学了十年。我学捷克字，学三年总够了吧。</q>', 2]]},
  {k:'ko_e', c:'others', if: S => knowsC('eliska'), o:'<q>那个酿酒的寡妇说，她什么都记账，</q>卡佳说，<q>我不信。昨天夜里，她给赶车的老约什卡盖了一条毯子。我看见了。那条毯子她可没记。</q>',
    r:[['<q>说不定她记在心里了。</q>', '<q>记在心里的账，</q>卡佳说，<q>那就不叫账了。</q>', 3],
      ['<q>她就是嘴硬。</q>', '<q>嘴硬心软的人，我认识好几个，</q>卡佳说，看着你，<q>其中一个就是你。</q>', 3]]},
  {k:'k26', c:'love', o:'卡佳从怀里掏出一个苹果，去年的，皱巴巴的。她咬了一口，递给你。<q>就这一个，</q>她说，<q>一人一半。</q>',
    r:[['咬她咬过的那一边', '她看见了，脸一下子红到了耳根。<q>那边有虫眼，</q>她说。其实没有。', 4],
      ['<q>你吃吧。</q>', '<q>老爷就是这样，</q>她说，硬把苹果塞进你嘴里，<q>让来让去的。吃。</q>', 3]]},
  {k:'k27', c:'love', o:'<q>守夜冷，</q>卡佳掀开了她的斗篷，<q>进来。别多想，就是冷。</q>',
    r:[['钻进去', '斗篷里很暖，有麦草和铁的味道。你们俩挤着，看着黑漆漆的路。过了很久，她小声说：<q>多想一点，也行。</q>', 5],
      ['<q>我不冷。</q>', '<q>你的牙在打架，</q>卡佳说，<q>骑士说谎，是要下地狱的。</q>她一把把你拽了进去。', 3]]},
  {k:'k28', c:'heart', o:'<q>我给我们的鹅起好名字了，</q>卡佳说，<q>以后的那只。叫‘老爷’。</q><q>为什么？</q><q>这样我每天都能使唤老爷了。</q>',
    r:[['<q>那我叫什么？</q>', '<q>你叫‘当家的’，</q>她说，把脸埋进你的肩膀里，<q>这个名字，我在心里叫了好久了。</q>', 5],
      ['<q>鹅会生气的。</q>', '<q>让它生气，</q>她说，<q>凶的鹅看家。</q>她笑着笑着，握住了你的手，握得很紧。', 4]]},
  {k:'k29', c:'heart', if: S => S.f.act >= 2, o:'<q>要是我死在仗里，</q>卡佳说，<q>把我的连枷挂在柳溪的教堂里。别挂在塔博尔。塔博尔的连枷太多了，没人认得哪一根是我的。</q>',
    r:[['<q>你不会死。</q>', '<q>你又不是上帝，</q>她说，<q>不过你这么说，我爱听。再说一遍。</q>你说了一遍，又说了一遍。她数着，数到第七遍，睡着了。', 5],
      ['<q>好。挂在祭坛旁边。</q>', '<q>扬神父会气死的，</q>卡佳说，笑了，<q>不，他不会。他会给它祝圣。</q>', 4]]}
]);

addChat('zden', [
  {k:'z15', c:'past', o:'<q>我做侍童的时候，</q>齐德涅克说，<q>老领主让我们每天早上把他的猎鹰带出去放。有一只叫‘玛格丽特’，只肯站在我的手上。我十五岁那年，它飞走了，再也没有回来。</q>',
    r:[['<q>你难过吗？</q>', '<q>哭了一夜，</q>他说，<q>第二天老领主对我说：鹰是借来的，不是你的。</q>他看着天，<q>很多东西都是借来的。</q>', 3],
      ['<q>它去找别的手了。</q>', '<q>也许，</q>他说，<q>我希望那只手比我的暖。</q>', 3]]},
  {k:'z16', c:'past', o:'<q>我二十一岁那年，跟着条顿骑士团去了普鲁士，</q>齐德涅克说，<q>在格伦瓦尔德。我们输了。对面波兰人的营里也有捷克人，唱着我们的歌冲过来。</q>',
    r:[['<q>你跟自己人打过仗？</q>', '<q>那一天，谁也不知道谁是自己人，</q>他说，<q>后来有人跟我说，对面唱得最响的那个，叫杰士卡。我不知道是不是真的。</q>', 3],
      ['<q>输了以后呢？</q>', '<q>走回家，</q>他说，<q>走了两个月。一路上的十字架我都数了，三百一十二个。每一个底下都祈祷了一回。</q>', 2]]},
  {k:'z17', c:'now', if: S => S.region === 'rose', o:'<q>长廊尽头那扇窗户下面，</q>齐德涅克说，<q>我小时候在那里罚站过一整天。因为我在弥撒上问神父，为什么只有他能喝那杯酒。</q>',
    r:[['<q>你小时候就是个圣杯派。</q>', '<q>别让监护人听见，</q>他压低了声音，嘴角却动了，<q>我后来想明白了，我那时候只是渴。</q>', 4],
      ['<q>神父怎么回答？</q>', '<q>他说，因为他是神父，</q>齐德涅克说，<q>我那时候觉得这个回答很好。现在也还这么觉得。</q>他停了一下，<q>大部分时候。</q>', 3]]},
  {k:'z18', c:'now', if: S => S.f.campUp, o:'<q>我在十字军营里看见了我的表兄，</q>齐德涅克说，<q>他跟着迈森人来的。他朝我挥手，像在比武场上一样。</q>',
    r:[['<q>你挥手了吗？</q>', '<q>挥了，</q>他说，<q>挥到一半，我想起来，下回见面，我们手里可能拿着剑。我就把手放下了。</q>', 3],
      ['<q>他也许会帮我们。</q>', '<q>他会帮他的主君，</q>齐德涅克说，<q>跟我一样。我们这些人，一辈子都在帮别人。</q>', 2]]},
  {k:'z19', c:'now', if: S => S.f.sudomerDone, o:'<q>苏多梅日的铁老爷里，有我在维也纳比武时认识的人，</q>齐德涅克说，<q>一个施蒂利亚人，枪法很好，喝酒很慢。他们说他的马陷进了塘底的烂泥里，然后……</q>他没有说下去。',
    r:[['<q>他是来打仗的。</q>', '<q>是，我知道，</q>他说，<q>可一个骑士，不该死在烂泥里。</q>他想了想，<q>也许谁都不该。</q>', 2],
      ['<q>你替他祈祷过吗？</q>', '<q>每天晚上，</q>他说，<q>也替那些拿连枷的人祈祷。上帝会分清楚的。我分不清楚。</q>', 4]]},
  {k:'z20', c:'mind', o:'<q>荣誉是什么？</q>齐德涅克突然问，<q>小时候我以为是马、剑和纹章。后来以为是誓言。现在……</q>',
    r:[['<q>是没人看着的时候，你还做的事。</q>', '他想了很久。<q>那我这个夏天的荣誉，比以前多了，</q>他说，<q>因为没有人看着我。</q>', 4, {honor:1}],
      ['<q>是让人去死的好借口。</q>', '<q>你这话，</q>他皱起眉头，<q>像那些大学里的人说的。</q>他停了一下，<q>……也许也对。</q>', 1]]},
  {k:'z21', c:'mind', o:'<q>你说，</q>齐德涅克说，<q>要是哪天我领了那杯酒，我母亲还会认我吗？</q>',
    r:[['<q>母亲总会认的。</q>', '<q>她会先给我一巴掌，</q>他说，<q>然后认我。</q>他笑了一下，<q>我不是说我要领。我只是……想过。</q>', 3],
      ['<q>你不必领。</q>', '<q>对，</q>他说，像是松了一口气，<q>我不必。谢谢你这么说。</q>', 3]]},
  {k:'z22', c:'joke', o:'<q>你会唱歌吗？</q>你问。齐德涅克犹豫了很久：<q>我会唱一首。骑士团的进行曲。</q>',
    r:[['<q>唱。</q>', '他唱了。唱得很认真，很响，跑调跑得像一匹惊了的马。队伍里所有人都停下来看他。他唱完了，严肃地说：<q>这首歌本来就是这样的。</q>', 4],
      ['<q>还是别唱了。</q>', '<q>你没听过，怎么知道不好听？</q>他说，有点受伤。过了一会儿，他小声哼了两句，自己停了。<q>……好吧。确实不好听。</q>', 2]]},
  {k:'z23', c:'joke', o:'齐德涅克的马又咬了你的马一口。<q>它叫‘忏悔者’，</q>他说，<q>因为它每回咬完，都会低下头。</q>',
    r:[['<q>那它现在在忏悔吗？</q>', '你们一起看那匹马。它正在吃你的马的草料，头一点也没低。<q>它在攒，</q>齐德涅克说，<q>攒多了一起忏悔。</q>', 3],
      ['<q>让它给我的马赔罪。</q>', '齐德涅克真的牵着他的马走到你的马面前，严肃地说了一句拉丁文。两匹马互相看了一眼，各吃各的去了。<q>和解了，</q>他说。', 3]]},
  {k:'z24', c:'you', if: knowsFather, o:'<q>你父亲跟着赫卢姆的扬大人去过康斯坦茨，</q>齐德涅克说，<q>我哥哥那年也在那里，替布拉格的议会送信。他们说不定见过。</q>',
    r:[['<q>说不定一起喝过酒。</q>', '<q>我哥哥不喝酒，</q>他说，<q>你父亲大概喝。那他们就是一个喝，一个看着。</q>他想了想，<q>很像我们。</q>', 3],
      ['<q>那年的事，我父亲到死都没说过。</q>', '<q>我哥哥也是，</q>齐德涅克说，<q>见过那场火的人，回来都不太说话了。</q>', 3]]},
  {k:'z25', c:'you', o:'<q>你领圣餐，是领一样，还是两样？</q>齐德涅克问，<q>我一直没问过你。我怕问了，就得想该怎么看你。</q>',
    r:[['<q>两样都领。</q>', '<q>那我们跪下去的时候，你比我多一样东西，</q>他说，<q>我不嫉妒。我只是有时候会想，那杯酒是什么味道。</q>', 2],
      ['<q>只领饼。跟你一样。</q>', '<q>那你为什么跟他们一起走？</q><q>因为他们是我的邻居。</q>齐德涅克看了你很久。<q>邻居，</q>他重复了一遍，好像这个词他从来没有好好想过。', 3],
      ['<q>我还不知道该怎么领。</q>', '<q>那就先跪着，</q>他说，<q>跪着的时候想清楚，再站起来。这是我母亲说的。</q>', 3]]},
  {k:'z26', c:'you', o:'<q>柳溪的佃户，</q>齐德涅克问，<q>你记得他们每个人的名字吗？</q>',
    r:[['<q>记得。</q>', '<q>说三个，</q>他说。你说了：瓦夫拉，老约什卡，磨坊主家的小女儿。<q>好，</q>他点点头，<q>记得名字的领主，就还没坏。</q>', 3],
      ['<q>不全记得。</q>', '<q>那就回去一个一个地问，</q>齐德涅克说，<q>我母亲记得玫瑰堡每个厨娘的名字，连她们孩子的名字也记得。她说，这是她唯一能给她们的东西。</q>', 3]]},
  {k:'zo_k', c:'others', if: S => knowsC('katka'), o:'<q>卡特日娜，</q>齐德涅克说——他是唯一叫她全名的人——<q>她今天又叫我‘玫瑰少爷’了。</q>',
    r:[['<q>你不喜欢？</q>', '<q>我三十一岁了，</q>他说，<q>不是少爷。</q>他停了一下，<q>……可她叫别人的时候，什么都不叫。</q>', 3],
      ['<q>她在跟你开玩笑。</q>', '<q>我知道，</q>他说，<q>我在想该怎么开回去。我不太会。你教我。</q>', 3]]},
  {k:'zo_p', c:'others', if: S => knowsC('petr'), o:'<q>那个彼得，</q>齐德涅克压低了声音，<q>今天早上又光着身子在河里。我替他把衣服看着，免得被人拿走。</q>',
    r:[['<q>你人真好。</q>', '<q>我是怕他光着身子进城，</q>齐德涅克说，<q>那样我们都得被烧死。</q>可是他的耳朵红了一点。', 2],
      ['<q>你也该下去洗洗。</q>', '齐德涅克看你的眼神，像你刚叫他去亲主教的脚。<q>我在岸上洗，</q>他说，<q>用一只桶。像一个基督徒那样。</q>', 2]]},
  {k:'zo_i', c:'others', if: S => knowsC('ilona'), o:'<q>伊洛娜问我，骑士为什么要穿这么重的甲，</q>齐德涅克说，<q>我说为了保护自己。她说，那为什么不骑快一点？</q>',
    r:[['<q>她说得有道理。</q>', '<q>我想了一整天，</q>齐德涅克说，<q>没想出反驳的话。库曼人打仗，没有一个是站着不动的。</q>他看着自己的胸甲，<q>也许我们才是错的那一边。只是错得很体面。</q>', 2],
      ['<q>甲是骑士的体面。</q>', '<q>对，</q>他说，有点高兴，<q>我也是这么跟她说的。她笑了。</q>他想了想，<q>她笑起来很好听。</q>', 2]]},
  {k:'zo_m', c:'others', if: S => knowsC('matej'), o:'齐德涅克看着马捷伊在火边看书的背影。<q>他看书的时候，嘴唇会动，</q>他说，<q>跟我哥哥一模一样。</q>',
    r:[['<q>你想你哥哥了。</q>', '<q>每天都想，</q>他说，<q>可是看着他，好像没有那么难受了。这是不是很奇怪？</q>', 3],
      ['<q>去跟他说说话。</q>', '<q>说什么？</q><q>随便。</q>齐德涅克犹豫了很久，走过去，在马捷伊身边坐下了。你听见他问：<q>这是什么书？</q>马捷伊抬起头，像是吓了一跳，然后开始讲，讲了很久。', 3]]},
  {k:'zo_e', c:'others', if: S => knowsC('eliska'), o:'<q>爱丽什卡夫人知道我哥哥死的那天是几点，</q>齐德涅克说，<q>她丈夫也是那天死的。她说，我们俩在同一天失去了一个人，这让我们成了……</q>他找着那个词，<q>同一本账上的人。</q>',
    r:[['<q>她说话总是这样。</q>', '<q>是，</q>他说，<q>可这一回，我觉得她没有在算账。</q>', 3],
      ['<q>你们可以一起去给他们点支蜡烛。</q>', '他点了点头。后来你听说，他们去了两座教堂，一座领圣杯，一座不领，每座各点了两支。', 4]]},
  {k:'z27', c:'love', o:'<q>你握剑的手不对，</q>齐德涅克说，站到你身后，握住了你的手。<q>手腕放松……对……</q>他的声音停在你耳边。',
    r:[['<q>然后呢？</q>', '<q>然后……</q>他好像忘了。过了好一会儿，他松开手，退后一步，<q>然后你自己练。</q>他走得很快，差点被自己的剑鞘绊倒。', 4],
      ['转过身去', '你转过身，离他很近。他没有退。<q>这一招，</q>他低声说，<q>骑士团没有教过。</q>', 5]]},
  {k:'z28', c:'love', o:'齐德涅克递给你一朵野玫瑰，五片花瓣，和玫瑰家纹章上的一样。<q>路边摘的，</q>他说，<q>不是……不是家里的。</q>',
    r:[['别在衣襟上', '<q>不对，</q>他说，替你重新别了一回。别好了，他的手在那里停了一会儿。<q>这样就对了。</q>', 5],
      ['<q>玫瑰家的人送玫瑰？</q>', '<q>我不是作为玫瑰家的人送的，</q>他说，第一次没有躲开你的眼睛，<q>是作为齐德涅克。</q>', 5]]},
  {k:'z29', c:'heart', o:'<q>我母亲会喜欢你的，</q>齐德涅克说，<q>她会先问你领几样，然后问你会不会做蜂蜜饼。第一个问题，你可以撒谎。第二个不行。</q>',
    r:[['<q>我不会做蜂蜜饼。</q>', '<q>那我教你，</q>他说，<q>我会。小时候在厨房里偷学的。这件事你不能告诉任何人。</q>', 5],
      ['<q>那我先学怎么撒第一个谎。</q>', '<q>不用学，</q>他说，<q>她看得出来。她也看得出我在想谁。</q>他把你的手拉过去，贴在自己的脸上。', 5]]},
  {k:'z30', c:'heart', o:'<q>我发过誓，永不说谎，</q>齐德涅克说，<q>所以有一句话，我说出来，就收不回去了。</q>',
    r:[['<q>那就说。</q>', '他说了。说得很慢，一个字一个字的，像在礼拜堂里宣誓。说完了，他闭上眼睛，像一个刚从河里爬上岸的人。<q>好了，</q>他说，<q>现在上帝也知道了。</q>', 5],
      ['<q>我知道。不用说。</q>', '<q>不，</q>他说，<q>得说。没说出口的誓，不算誓。</q>他说了。', 5]]}
]);
// ===== 更多的话：彼得和伊洛娜 =====
addChat('petr', [
  {k:'p14', c:'past', o:'<q>我娘生了十一个孩子，活下来四个，</q>彼得说，<q>我是第九个。她叫我彼得，因为前面那个彼得死了。我是第二个彼得。</q>',
    r:[['<q>第一个彼得呢？</q>', '<q>活了三天，</q>彼得说，<q>我替他多活了二十几年。所以我得活得高兴一点，替我们两个。</q>', 3],
      ['<q>你娘还在吗？</q>', '<q>在天上，或者在地里，或者在风里，</q>他说，<q>在哪儿我不太在乎。她在。</q>', 2]]},
  {k:'p15', c:'past', o:'你问起他手掌上的两道疤。彼得摊开手：<q>十二岁那年，磨坊的绳子断了，我想拉住磨盘。</q>他笑了，<q>拉住了。那一天，我以为自己什么都拉得住。</q>',
    r:[['<q>现在呢？</q>', '<q>现在知道了，有些东西拉不住，</q>他说，<q>可是还会伸手。手比脑子笨，记不住疼。</q>', 3],
      ['<q>人们说那是圣伤。</q>', '<q>让他们说，</q>彼得说，<q>说是圣伤的人，会给我面包。说是绳子的人，只会说一句‘哦’。</q>他眨了眨眼。', 3]]},
  {k:'p16', c:'now', if: S => S.f.adamitesDead, o:'彼得站在河边，看着水。<q>岛上那棵柳树底下，</q>他说，<q>我们埋过一只死狐狸。大家围着它唱了歌。</q>他停了很久，<q>现在没有人给他们唱了。</q>',
    r:[['<q>你唱。</q>', '他唱了，唱的是那首没有词的歌。唱到一半，他的声音断了。你接着哼，跑着调，哼完了。他没有看你，可是他的手伸过来，抓住了你的袖子。', 5, {mind:-1}],
      ['陪他站着', '你们一直站到太阳落山。走的时候，他说：<q>谢谢你没有说‘这是上帝的旨意’。</q>', 4]]},
  {k:'p17', c:'now', if: S => S.f.adamitesWarned, o:'<q>岛上的人往南走了，</q>彼得说，<q>有个猎人说，在林子最深的地方看见了炊烟。光着身子的人，得在下雪之前学会做衣服。</q>他笑了，<q>他们会学会的。</q>',
    r:[['<q>你想去找他们吗？</q>', '<q>想，</q>他说，<q>可我去找他们，塔博尔的人就会跟着我。我在这里，他们才安全。</q>', 3],
      ['<q>他们活下来了。</q>', '<q>是你让他们活下来的，</q>彼得说，<q>我会告诉每一棵树。</q>', 4]]},
  {k:'p18', c:'now', if: S => S.region === 'tabor', o:'彼得在塔博尔的城门口停下来，不肯进去。<q>他们说，被赶出去的人再进来，要先跪下，</q>他说，<q>我不想跪。不是骄傲，是膝盖疼。</q>',
    r:[['<q>我背你进去。</q>', '他大笑，笑得守门的人都看过来了。<q>那他们就得对着你跪，</q>他说，<q>你背着一个异端。</q>最后他自己走了进去，没有跪，也没有人拦他。', 4],
      ['<q>那就在外面等我。</q>', '<q>好，</q>他说，在城门外的草地上躺下来，<q>天底下哪里都是教堂，这里也是。</q>', 2]]},
  {k:'p19', c:'mind', o:'<q>塔博尔的人在等末日，</q>彼得说，<q>我觉得末日早就来过了，只是没人注意到。</q>',
    r:[['<q>什么时候来的？</q>', '<q>每一回有人对另一个人好，</q>他说，<q>旧的世界就完了一点点。你没注意到吗？</q>', 3, {lens:1}],
      ['<q>那我们现在在哪儿？</q>', '<q>在后面，</q>彼得说，<q>在新的世界里。只是很多人还穿着旧衣服。</q>', 3]]},
  {k:'p20', c:'mind', o:'<q>你知道亚当和夏娃为什么要用无花果叶子吗？</q>彼得说，<q>因为他们第一次觉得冷。羞耻，就是冷。</q>',
    r:[['<q>那暖和，就是不羞耻。</q>', '<q>对，</q>他高兴地说，<q>你看，你比塔博尔的长老们懂神学。</q>', 3, {lens:1}],
      ['<q>也可能是因为蚊子。</q>', '彼得愣了一下，笑得在草地上打滚。<q>蚊子！</q>他喘着气说，<q>伊甸园里有蚊子。这个异端，连我都没想到。</q>', 4, {lens:-1}]]},
  {k:'p21', c:'joke', o:'彼得披着你的斗篷走了一圈，走得很别扭，像一只穿了鞋的猫。<q>你们穿衣服的人，</q>他问，<q>每天都这么难受吗？</q>',
    r:[['<q>习惯了。</q>', '<q>人什么都会习惯，</q>彼得说，把斗篷还给你，<q>这才最可怕。</q>说完他自己先笑了，<q>不过斗篷挺暖的。</q>', 2],
      ['<q>你穿着好看。</q>', '<q>是吗？</q>他又转了一圈，转得更别扭了，<q>那我先穿着，等你冷了再还你。</q>他穿了一整天。', 3]]},
  {k:'p22', c:'joke', o:'你让彼得骑你的马。他爬上去，马往前走了三步，他就从另一边滑了下来。',
    r:[['<q>再来。</q>', '他又试了三回，三回都从另一边滑下来。第四回，他干脆趴在马背上，像趴在一张床上。马驮着他慢慢地走，他睡着了。', 3],
      ['<q>你还是走路吧。</q>', '<q>马不喜欢我，</q>彼得揉着屁股说，<q>它知道我不吃肉，把我当成了抢草吃的。</q>', 3]]},
  {k:'p23', c:'you', o:'<q>你小时候是什么样的？</q>彼得问，<q>我猜，你是那种会把死鸟埋起来的孩子。</q>',
    r:[['<q>你怎么知道？</q>', '<q>你看蚂蚁的样子，</q>彼得说，<q>不像要踩它们，像在数它们。</q>', 3],
      ['<q>不，我是拿弹弓打鸟的那种。</q>', '<q>后来呢？</q><q>后来打中了一只。</q><q>然后你把它埋了，</q>彼得说。你没有反驳，因为他说对了。', 4]]},
  {k:'p24', c:'you', if: S => S.f.olenkaTabor && !S.f.olenkaHome && !S.f.olenkaDead, o:'<q>你妹妹在塔博尔听讲道，</q>彼得说，<q>坐在最前面，眼睛亮得吓人。那种眼睛我见过。我以前也有。</q>',
    r:[['<q>你会去跟她说说吗？</q>', '<q>说什么？说末日不会来？</q>彼得摇摇头，<q>她现在需要末日。等她不需要了，自己会走出来。到时候，你在门口等着就行。</q>', 3],
      ['<q>后来你的眼睛怎么变了？</q>', '<q>我看见一个快死的孩子，</q>彼得说，<q>她不在乎末日，只想要一碗热汤。从那以后，我就只信热汤了。</q>', 3]]},
  {k:'p25', c:'you', o:'<q>你睡着了会说梦话，</q>彼得说，<q>你知道吗？</q>',
    r:[['<q>我说了什么？</q>', '<q>你说‘别关门’，说了三遍，</q>彼得说。他看着你，<q>我没有关。我一直开着。</q>', 4],
      ['<q>不许说出去。</q>', '<q>我只告诉树，</q>彼得说，<q>树不会说出去。树只会长。</q>', 2]]},
  {k:'po_k', c:'others', if: S => knowsC('katka'), o:'<q>长老们赶我下山那天，卡佳也举了手，</q>彼得说，<q>你知道吗？</q>',
    r:[['<q>你怪她吗？</q>', '<q>那天广场上所有的人都举了手，</q>彼得说，<q>后来只有她来跟我说了。</q>他笑了，<q>举手的人很多，说出来的人很少。</q>', 3],
      ['<q>她现在对你好吗？</q>', '<q>她给我留饭，</q>彼得说，<q>不说是给我的，放在车板上，说是喂鸟的。鸟一回也没吃过。</q>', 3]]},
  {k:'po_z', c:'others', if: S => knowsC('zden'), o:'<q>齐德涅克念经的时候，手指在念珠上走，</q>彼得说，<q>走得很快，像在逃。</q>',
    r:[['<q>他在逃什么？</q>', '<q>一扇窗，</q>彼得说，<q>每个人都有一扇窗。他的那扇特别高。</q>', 3],
      ['<q>你去握住他的手。</q>', '<q>我握过，</q>彼得说，<q>他没有抽开。可是第二天早上，他念得更快了。</q>他想了想，<q>那也没关系。慢慢来。</q>', 3]]},
  {k:'po_i', c:'others', if: S => knowsC('ilona'), o:'<q>伊洛娜的天没有名字，</q>彼得说，<q>不要祷告，不要教堂，只要你别在河里撒尿。</q>他叹了口气，<q>我讲了两年道，讲的都没有她这一句好。</q>',
    r:[['<q>那你去当库曼人。</q>', '<q>我骑不了马，</q>彼得说，<q>他们会把我横着驮在马背上，像驮一袋面粉。</q>他想了想，<q>其实也不坏。</q>', 3],
      ['<q>你讲的也好。</q>', '<q>我的话太多了，</q>彼得说，<q>好的道理，一句就够。</q>', 2]]},
  {k:'po_m', c:'others', if: S => knowsC('matej'), o:'<q>马捷伊先生说，柳树皮能退烧，是因为里面有某种东西，</q>彼得说，<q>他想知道是什么东西。</q>',
    r:[['<q>你想知道吗？</q>', '<q>不想，</q>彼得说，<q>知道了，就会有人把它装进罐子里卖。</q>他想了想，<q>不过先生想知道，就让他知道吧。他不会卖的。他不会算账。</q>', 3],
      ['<q>他是想帮你。</q>', '<q>我知道，</q>彼得说，<q>他帮人，是先把人拆开，看看里面是什么。我帮人，是先把人抱住。</q>他笑了，<q>两样都要有。</q>', 3]]},
  {k:'po_e', c:'others', if: S => knowsC('eliska'), o:'<q>爱丽什卡问我，给人治病收多少钱，</q>彼得说，<q>我说不收。她说，那你是全波希米亚最差的生意人。</q>',

  {k:'i20', c:'mind', o:'<q>你们把死人埋在地底下，</q>伊洛娜说，<q>上面压一块石头，好像怕他们跑出来。我们把死人放在高处，让鹰带走。</q>',

  {k:'i22', c:'joke', o:'<q>我学会了一句捷克话，</q>伊洛娜很得意，<q>‘愿上帝保佑你的胡子’。</q>',

  {k:'io_k', c:'others', if: S => knowsC('katka'), o:'<q>卡佳教我用连枷，我教她射箭，</q>伊洛娜说，<q>她射箭的时候，两只眼睛都闭上。</q>',

  {k:'io_z', c:'others', if: S => knowsC('zden'), o:'<q>齐德涅克每天早上都要把他的甲擦一遍，</q>伊洛娜说，<q>擦得能照见人。我在他的胸甲上编过一根辫子。</q>',

  {k:'io_e', c:'others', if: S => knowsC('eliska'), o:'<q>爱丽什卡想买我的马，</q>伊洛娜说，<q>我说不卖。她说，什么东西都有价钱。</q>',

  {k:'i25', c:'love', o:'伊洛娜骑马跑在前面，突然掉头冲回来，在你的马旁边猛地勒住，近得你们的膝盖碰在了一起。<q>你刚才在看我，</q>她说。',

  {k:'i27', c:'heart', o:'<q>库曼的姑娘出嫁以前，</q>伊洛娜说，<q>要给喜欢的人缝一只箭袋。</q>她从马鞍后面拿出一只箭袋，皮子的，针脚很密，上面缝着一棵歪歪扭扭的树。<q>柳树，</q>她说，<q>我没见过几棵，缝得不像。</q>',

      ['<q>喊了也没用。</q>', '<q>是没用，</q>马捷伊说，<q>可他们喊了。那三个声音我一直记得，比我读过的书记得清楚。</q>', 2]]},
  {k:'m17', c:'now', if: S => S.f.booksSaved, o:'<q>我昨晚做了个梦，</q>马捷伊说，<q>梦见奥维德在地窖里跟亚里士多德吵架，吵谁睡上铺。</q>',
    r:[['<q>谁赢了？</q>', '<q>奥维德，</q>马捷伊说，<q>他说亚里士多德太重，会把下铺压塌。亚里士多德说这在逻辑上不成立。然后我就醒了。</q>他笑了，<q>谢谢你。它们还能吵架，是因为你。</q>', 4],
      ['<q>你做梦都在读书。</q>', '<q>梦里的书不用翻页，</q>他说，<q>这是做梦唯一的好处。</q>', 2]]},
  {k:'m18', c:'now', if: S => S.region === 'kutna', o:'<q>库特纳霍拉的银子，一半进了国王的钱库，一半上了教堂的祭坛，</q>马捷伊说。他看着城里那座还没盖完的大教堂，<q>胡斯先生说，基督生在马槽里。马槽可没有用银子做的。</q>',
    r:[['<q>他们说这是献给上帝的。</q>', '<q>上帝不缺银子，</q>马捷伊说，<q>缺银子的是矿井里的人。他们挖了一辈子银子，下葬的时候口袋里一枚也没有。</q>', 3],
      ['<q>那座教堂很美。</q>', '马捷伊看了很久。<q>是很美，</q>他承认，<q>这就是麻烦。美的东西，让人不想问它是用什么换来的。</q>', 3]]},
  {k:'m19', c:'now', if: S => S.f.campUp, o:'<q>十字军营里有个巴黎大学的硕士，</q>马捷伊说，<q>我认得他，一四一一年我们辩论过，他输了。现在他带着一千个骑兵来了。</q>他推了推鼻梁上并不存在的眼镜，<q>看来他终于找到了一个更好的论证。</q>',
    r:[['<q>那你就再赢他一回。</q>', '<q>用什么赢？</q>他说。他看看你，看看车阵，看看卡佳在磨的连枷。<q>……哦，</q>他说，<q>用你们。</q>', 3],
      ['<q>剑不是论证。</q>', '<q>对，</q>马捷伊说，<q>可是剑能让论证停下来。死人不会反驳。这是我最怕的。</q>', 3]]},
  {k:'m20', c:'mind', o:'<q>威克里夫说，真理就是真理，不管是谁说的，</q>马捷伊说，<q>教皇说错了，就是错了。农夫说对了，就是对了。</q>',
    r:[['<q>那谁来判断对错？</q>', '<q>每一个人自己，</q>他说，<q>所以他们要烧他。一个自己判断的人，比一千个异端还可怕。</q>', 3],
      ['<q>可农夫说话没人听。</q>', '<q>所以要教他们写字，</q>马捷伊说，<q>写下来的话就有人听了。哪怕要等一百年。</q>', 4]]},
  {k:'m21', c:'mind', o:'<q>你知道我为什么当神父吗？</q>马捷伊问，<q>不是因为我信得最多，是因为我疑得最多。我想离那个答案近一点。</q>',
    r:[['<q>近了吗？</q>', '<q>近了一点，</q>他说，<q>近到能看见它有多大。越近，越看清自己有多小。</q>', 3, {lens:1}],
      ['<q>疑心重的人当神父，不怕吗？</q>', '<q>该怕的是从来不疑的神父，</q>马捷伊说，<q>他们手里拿着火把。</q>', 3, {lens:-1}]]},
  {k:'m22', c:'joke', o:'马捷伊要帮忙套车。套了半天，他把马套在了车的后面。',
    r:[['<q>先生，马在后面。</q>', '马捷伊看看马，又看看车。<q>理论上，</q>他说，<q>马也可以推着车走。</q><q>实际上呢？</q><q>实际上，</q>他叹了口气，<q>请你来。</q>', 3],
      ['不出声，看他什么时候发现', '他发现的时候，马已经推着车倒着走了二十步。马捷伊站在原地，严肃地说：<q>这是一个很好的反例。</q>', 3]]},
  {k:'m23', c:'joke', o:'马捷伊的脚趾踢在了石头上，他骂了一句。是拉丁文，很长，有主语，有谓语，还带一个从句。',
    r:[['<q>翻译一下。</q>', '<q>大意是，</q>他揉着脚说，<q>‘愿这块石头的祖宗被罗马的法官审三回。’</q><q>为什么是三回？</q><q>因为前两回都判错了。</q>', 3],
      ['<q>神父也骂人？</q>', '<q>用拉丁文骂，不算，</q>马捷伊说，<q>上帝听拉丁文的时候，比较宽容。</q>', 3]]},
  {k:'m24', c:'you', if: knowsFather, o:'<q>你父亲跟着赫卢姆的扬大人去了康斯坦茨，</q>马捷伊说，<q>那他一定见过胡斯先生最后几个月的样子。</q>他看着你，<q>他给你留下了什么吗？我是说，他看见过的东西？</q>',
    r:[['<q>只有一张纸，和一片树叶。</q>', '<q>椴树叶，</q>马捷伊说，<q>康斯坦茨城外有一排椴树，胡斯先生被带出城的那天……</q>他停住了。<q>对不起。这些，该由你自己去知道。</q>', 3],
      ['<q>他什么也没留下。</q>', '<q>他留下了你，</q>马捷伊说，<q>你现在走的这条路，就是他看见过的东西。</q>', 4]]},
  {k:'m25', c:'you', o:'<q>你小时候听过的故事里，</q>马捷伊问，<q>最喜欢哪一个？</q>',
    r:[['<q>布兰尼克山里睡着的骑士。</q>', '<q>圣瓦茨拉夫的骑士，睡在山里，等波希米亚最黑的时候醒过来，</q>马捷伊说。他看了看四周，<q>你觉得，现在够黑了吗？</q><q>不知道。</q><q>我也不知道，</q>他说，<q>也许我们就是醒过来的那些人，只是没人告诉我们。</q>', 4],
      ['<q>不记得了。</q>', '<q>那我讲一个给你，</q>马捷伊说。他讲了奥维德的一个故事：一个姑娘被追得没处跑，变成了一棵月桂树。讲完了，他说：<q>以后你就记得这一个。</q>', 3]]},
  {k:'mo_k', c:'others', if: S => knowsC('katka'), o:'<q>卡佳学写字学得很快，</q>马捷伊说，<q>比我教过的大部分学生都快。她说，因为她知道字是拿来干什么的。</q>',
    r:[['<q>拿来干什么？</q>', '<q>记谁欠了谁，</q>马捷伊说，<q>她要把老爷欠赫鲁比的，一笔一笔写下来。</q>他推了推不存在的眼镜，<q>这是我听过最好的识字理由。</q>', 3],
      ['<q>你是个好老师。</q>', '<q>是她是个好学生，</q>马捷伊说，<q>好学生让老师看起来像个好老师。这是教书的秘密。</q>', 2]]},
  {k:'mo_z', c:'others', if: S => knowsC('zden'), o:'<q>齐德涅克大人今天问我，在读什么书，</q>马捷伊说。',
    r:[['<q>你怎么说？</q>', '<q>我说是波伊提乌的《哲学的慰藉》，一个等着被处死的人写的书，</q>马捷伊说，<q>他听了，说：‘借我。’</q>他看着火，<q>我借给他了。</q>', 4],
      ['<q>他想跟你说话。</q>', '<q>我知道，</q>马捷伊说，<q>我也想。可我们俩都不知道该从哪里说起。也许就从一本书说起。</q>', 3]]},
  {k:'mo_p', c:'others', if: S => knowsC('petr'), o:'<q>彼得不识字，</q>马捷伊说，<q>可他能把《雅歌》从头背到尾。他说是在林子里听一个老修士念的，听一遍就记住了。</q>',
    r:[['<q>他记性好。</q>', '<q>不是记性，</q>马捷伊说，<q>他是用身子记的。我读了二十年书，用的是脑子。他用的是别的东西。</q>他有点嫉妒，又有点高兴，<q>我想知道那是什么。</q>', 3, {lens:1}],
      ['<q>你信他说的吗？</q>', '<q>我信他信，</q>马捷伊说，<q>这在逻辑上是两回事，在日子里常常是一回事。</q>', 3]]},
  {k:'mo_i', c:'others', if: S => knowsC('ilona'), o:'<q>伊洛娜教了我四十个库曼词，</q>马捷伊说，<q>‘马’有十一种说法，‘雨’只有一种，‘罪’一种也没有。</q>',
    r:[['<q>没有‘罪’这个词？</q>', '<q>她想了很久，说最接近的是‘在河里撒尿’，</q>马捷伊说，<q>我记下来了。以后的学者会以为这是一个很深的神学概念。</q>', 4],
      ['<q>你要把这些写成书？</q>', '<q>一本小书，</q>他说，<q>没人会读。可是两百年以后，也许会有一个人读。那就够了。</q>', 3]]},
  {k:'mo_e', c:'others', if: S => knowsC('eliska'), o:'<q>爱丽什卡给我看过她账本上的一页，</q>马捷伊说。他犹豫了一下，<q>一四一五年的冬天，她往雪地圣母堂的木桶里放了一笔钱。数目很大。没写名字。</q>',
    r:[['<q>她从来不说。</q>', '<q>她从来不说，</q>马捷伊同意，<q>她让所有人都以为她只认钱。这是她的盔甲。</q>他想了想，<q>很好的盔甲。我也想要一副。</q>', 3],
      ['<q>你不该看别人的账。</q>', '<q>是她自己给我看的，</q>马捷伊说，<q>她说：‘先生，你欠我十四个格罗申，我欠全城一个解释。我们俩都还没还。’</q>', 3]]},
  {k:'m26', c:'love', o:'马捷伊用他的笔，在你的手背上写了一行很小的字。<q>先别看，</q>他说，<q>等墨干了。</q>',
    r:[['等墨干了再看', '墨干了。是一句拉丁文，你认得其中一个词：<i>tuus</i>，“你的”。你抬头看他，他正在很认真地读一本拿倒了的书。', 5],
      ['马上看', '墨还没干，被你的手指蹭花了。马捷伊叹了口气：<q>不耐心的读者，永远读不到最后一页。</q>可他又写了一遍，写得更慢。', 4]]},
  {k:'m27', c:'love', o:'<q>我在想一个问题，</q>马捷伊说，<q>亚里士多德说，人是有理性的动物。可是我看着你的时候，理性就不太管用了。</q>',
    r:[['<q>那你是动物？</q>', '<q>根据定义，</q>他说，脸红了，<q>是的。</q>', 4],
      ['<q>那就别管理性了。</q>', '<q>学者不能不管理性，</q>马捷伊说，往你身边挪了挪，<q>可是可以……请一天假。</q>', 5]]},
  {k:'m28', c:'heart', o:'<q>我写了一封信，给胡斯先生，</q>马捷伊说，<q>我知道他读不到了。我在信里告诉他，我找到了一个答案。</q>',
    r:[['<q>什么答案？</q>', '<q>他问过我的那道题，‘你确定吗’，</q>马捷伊说，<q>现在我确定了一件事。</q>他看着你，<q>只有一件。够了。</q>', 5],
      ['<q>我能读吗？</q>', '<q>不能，</q>他说，<q>那是写给死人的。写给活人的，我当面说。</q>然后他当面说了。', 5]]},
  {k:'m29', c:'heart', if: S => S.f.act >= 2 && !S.f.vitkovDone, o:'<q>等维特科夫过去了，</q>马捷伊说，<q>要是我们都还活着，我想带你去看大学的图书馆。不是夜里偷偷去，是白天，从正门进去。</q>',
    r:[['<q>白天去，被人看见怎么办？</q>', '<q>那就让他们看见，</q>马捷伊说，<q>一个神父，带着……带着你，去看书。他们会写一份报告。报告也是一种文献。</q>', 5],
      ['<q>一言为定。</q>', '<q>一言为定，</q>他说，像辩论开始前那样跟你握了握手，<q>论题：我们都会活下来。我是正方。</q>', 5]]}
]);

addChat('eliska', [
  {k:'e14', c:'past', o:'<q>我爹是赶车的，</q>爱丽什卡说，<q>从库特纳霍拉往布拉格拉银子。他说他这辈子拉过的银子，能买下半个布拉格。他死的时候，口袋里有三个格罗申。</q>',
    r:[['<q>所以你学会了算账。</q>', '<q>所以我学会了，银子从谁的车上过，跟银子是谁的，是两回事，</q>她说，<q>我要做银子是她的那个人。</q>', 3],
      ['<q>三个格罗申，够喝一顿。</q>', '<q>他就是拿去喝了，</q>爱丽什卡笑了，<q>在新城一家酿酒坊。后来，我嫁进了那一家。</q>她转着杯子，<q>那三个格罗申，现在还在我们家的钱箱里。我认得出来，有一个缺了角。</q>', 4]]},
  {k:'e15', c:'past', o:'<q>我结婚那天，</q>爱丽什卡说，<q>雅罗斯拉夫酿了一桶新酒，叫‘爱丽什卡’。酸得要命。客人们都喝了，都说好。</q>',
    r:[['<q>他是故意的？</q>', '<q>他说是故意的，说新娘子要先酸后甜，</q>她说，<q>第二年他又酿了一桶，还叫‘爱丽什卡’，那一桶很甜。</q>她喝了一口自己的酒，<q>第三桶，他没来得及酿。</q>', 4],
      ['<q>你也说好？</q>', '<q>我说太酸了，当着所有客人的面，</q>爱丽什卡说，<q>婆婆差点把我退回娘家。雅罗斯拉夫笑了一整晚，说他娶对了人。</q>', 3]]},
  {k:'e16', c:'now', if: S => S.f.ledgerBurned, o:'<q>那本账烧了以后，</q>爱丽什卡说，<q>我夜里睡得着了。可是早上醒来，手还会去摸枕头底下。摸不到，才想起来。</q>',
    r:[['<q>你后悔吗？</q>', '<q>账本不会后悔，人才会，</q>她说，<q>我不后悔。我只是……习惯它在那儿。像习惯一个人。</q>', 3],
      ['<q>你心里还记得。</q>', '<q>每一笔都记得，</q>爱丽什卡说，<q>可是心里的账，谁也拿不去用。这就是烧了它的意思。</q>', 4]]},
  {k:'e17', c:'now', if: S => S.f.ledgerGiven, o:'<q>议会的人拿到我的账本，翻得很快，像在找自己的名字，</q>爱丽什卡说，<q>找到了的，脸就白了。没找到的，脸也白了，因为他们在想，为什么没有自己。</q>',
    r:[['<q>你做了对的事。</q>', '<q>对的事，往往很贵，</q>她说，<q>我付得起。这一回付得起。</q>', 3],
      ['<q>他们会报复你吗？</q>', '<q>想会想，</q>爱丽什卡说，<q>可我知道的不止那一本。他们也知道我知道。这叫平衡。</q>', 3]]},
  {k:'e18', c:'now', if: S => S.region === 'budej', o:'<q>布杰约维采的人，领圣餐只领一样，</q>爱丽什卡说，<q>酒也一样。淡。</q>',
    r:[['<q>你说的是神学，还是酒？</q>', '<q>酒，</q>她说，<q>神学我不评论，神学不卖钱。</q>她想了想，<q>不对，神学很卖钱。只是不归我卖。</q>', 3],
      ['<q>也许只是酿法不一样。</q>', '<q>酿得不一样，就是酿得差，</q>爱丽什卡说，<q>这是酿酒人的神学。</q>', 2]]},
  {k:'e19', c:'now', if: S => S.f.campUp, o:'<q>我把酿酒坊的酒价涨了一倍，</q>爱丽什卡说，<q>只对穿好靴子的人。穿破鞋的，还是老价钱。</q>',
    r:[['<q>他们不会生气吗？</q>', '<q>穿好靴子的人，生着气也会买，</q>她说，<q>围城的时候，酒比面包还要紧。面包让人活着，酒让人觉得活着值得。</q>', 3],
      ['<q>你在帮穷人。</q>', '<q>我在做生意，</q>爱丽什卡说，<q>穷人记得谁在难的时候对他们好。仗打完了，他们只来我这儿喝。</q>她眨了眨眼，<q>这叫远见。</q>', 3]]},
  {k:'e20', c:'mind', o:'<q>你知道布拉格最值钱的东西是什么吗？</q>爱丽什卡问，<q>不是银子，不是圣物。是‘谁知道什么’。</q>',
    r:[['<q>那你很有钱。</q>', '<q>我很有钱，也很危险，</q>她说，<q>这两样总是一起来。</q>', 3],
      ['<q>那人心呢？</q>', '爱丽什卡看了你很久。<q>人心不值钱，</q>她说，<q>因为没人卖。也没人买得起。</q>', 4]]},
  {k:'e21', c:'mind', o:'<q>你说，上帝也记账吗？</q>爱丽什卡问，<q>神父说，最后审判那天，每个人的账都要摊开。</q>',
    r:[['<q>那你的账最清楚。</q>', '<q>我的账最清楚，</q>她说，<q>所以我最怕。账清楚的人，知道自己欠了多少。</q>', 3],
      ['<q>上帝不记账。上帝免债。</q>', '<q>‘免我们的债’，</q>爱丽什卡念了一遍，<q>主祷文我念了一辈子，从来没想过，这是放债的人最不想听的一句话。</q>她笑了，<q>上帝是个很差的生意人。我喜欢他。</q>', 4]]},
  {k:'e22', c:'joke', o:'爱丽什卡把一枚格罗申扣在桌上：<q>猜，哪一面朝上？猜对了，归你。猜错了，你欠我两枚。</q>',
    r:[['<q>国王那一面。</q>', '她掀开手，是国王那一面。<q>运气好，</q>她说，把格罗申推给你。你后来才发现，那枚格罗申两面都是国王。', 3, {money:1}],
      ['<q>这赌法不公平。</q>', '<q>你学会了，</q>爱丽什卡很满意，<q>这一课值两枚格罗申。我只收你一枚。</q>', 3]]},
  {k:'e23', c:'joke', o:'你喝了一口爱丽什卡的新酒，脸上的表情没藏住。',
    r:[['<q>好喝。</q>', '<q>你撒谎的时候，左边眉毛会动，</q>爱丽什卡说，<q>这桶确实不好。我只是想看看你会不会骗我。</q>她把酒倒了，<q>你会。骗得很温柔。</q>', 3],
      ['<q>太苦了。</q>', '<q>对，</q>爱丽什卡很高兴，<q>苦了。整个酿酒坊只有你敢说。伙计们都说好喝，因为工钱是我发的。</q>', 4]]},
  {k:'e24', c:'you', o:'<q>柳溪一年能收多少麦子？</q>爱丽什卡问，<q>别误会，我不是要跟你做生意。我只是想知道你值多少钱。</q>',
    r:[['<q>不多。够吃，够交什一税。</q>', '<q>够吃，</q>她点点头，<q>这比布拉格一半的老爷都强。他们不够吃，所以要打仗。</q>', 3],
      ['<q>你为什么想知道我值多少？</q>', '<q>做生意的人，喜欢上一个人以前，都会先算一算，</q>爱丽什卡说，<q>算完了发现算不清，就麻烦了。</q>她没有说她算清了没有。', 4]]},
  {k:'e25', c:'you', o:'<q>你母亲一个人管着柳溪，</q>爱丽什卡说，<q>我想认识她。管家的寡妇，都是一个行会的。</q>',
    r:[['<q>她会喜欢你的。</q>', '<q>她会先看我的手，看有没有茧子，</q>爱丽什卡说，<q>然后看我的账。然后，也许，会喜欢我。</q>', 3],
      ['<q>她不太喜欢布拉格人。</q>', '<q>没有人喜欢布拉格人，</q>爱丽什卡说，<q>连布拉格人自己都不喜欢。可是大家都来布拉格买东西。</q>', 2]]},
  {k:'eo_k', c:'others', if: S => knowsC('katka'), o:'<q>那个车夫姑娘的木桶，我算过，</q>爱丽什卡说，<q>一个月进来多少，出去多少，中间漏掉多少。</q>',
    r:[['<q>漏掉多少？</q>', '<q>三成，</q>她说，<q>在新城，三成算很清白了。我没告诉她，她会难过的。她以为那是天堂。</q>', 2],
      ['<q>她知道你在算吗？</q>', '<q>知道，</q>爱丽什卡说，<q>她骂了我一顿，然后问我：‘能不能教我算？’</q>她笑了，<q>这是我这个夏天听过最好的一句话。</q>', 3]]},
  {k:'eo_z', c:'others', if: S => knowsC('zden'), o:'<q>齐德涅克大人吃饭的时候，</q>爱丽什卡说，<q>会把盘子里的东西分成三份：一份自己吃，一份给穷人，一份给上帝。</q>',
    r:[['<q>给上帝的那份呢？</q>', '<q>最后还是他自己吃了，</q>爱丽什卡说，<q>他说上帝不会介意。我看了他半个月，上帝一回也没介意过。</q>', 3],
      ['<q>他是个虔诚的人。</q>', '<q>他是个整齐的人，</q>爱丽什卡说，<q>虔诚的人我见多了，整齐的很少。整齐的人可靠。</q>', 2]]},
  {k:'eo_p', c:'others', if: S => knowsC('petr'), o:'<q>那个光脚的，昨天在集市上，摸了一个卖鱼的老太太的手，</q>爱丽什卡说，<q>老太太哭了，把一整筐鱼都送给了他。他又把鱼分给了一群孩子。</q>她叹了口气，<q>一个上午，一筐鱼，谁也没赚到钱，可每个人都很高兴。我看不懂。</q>',
    r:[['<q>不是什么都要赚钱。</q>', '<q>你说话像他，</q>爱丽什卡说，<q>我不喜欢。</q>可她说完，朝集市那边看了很久。', 2],
      ['<q>你也想要一筐鱼？</q>', '<q>我想知道那个老太太为什么哭，</q>爱丽什卡说，<q>知道了，我就能卖给她别的东西。</q>她停了一下，<q>……开玩笑的。</q>', 3]]},
  {k:'eo_i', c:'others', if: S => knowsC('ilona'), o:'<q>算钱这件事，伊洛娜比你强，</q>爱丽什卡说，<q>她不会算，可她知道自己值多少。这比会算还难。</q>',
    r:[['<q>她值多少？</q>', '<q>她说，她的命等于她的马，她的马等于国王一年的饷钱，</q>爱丽什卡说，<q>然后她把一年的饷钱扔了，跟着你走了。</q>她喝了一口酒，<q>这笔账，我算了三天，没算明白。</q>', 3],
      ['<q>你喜欢她。</q>', '<q>我喜欢清楚的人，</q>爱丽什卡说，<q>她清楚得像一杯水。水不好卖，可谁都离不开。</q>', 2]]},
  {k:'eo_m', c:'others', if: S => knowsC('matej'), o:'<q>马捷伊先生昨晚喝多了，</q>爱丽什卡说，<q>站在桌子上，背了一整首奥维德。拉丁文的。酒馆里没一个人听得懂，可是大家都鼓了掌。</q>',
    r:[['<q>他背的是什么？</q>', '<q>他说是《爱的艺术》，</q>爱丽什卡说，<q>背到一半，他朝院子里看了一眼，就背不下去了。</q>她看着你，<q>那时候你在院子里喂马。你不知道。</q>', 3],
      ['<q>你也鼓掌了？</q>', '<q>我先收了他的酒钱，</q>爱丽什卡说，<q>然后鼓了掌。顺序很重要。</q>', 3]]},
  {k:'e26', c:'love', o:'爱丽什卡替你把领口理了理，理得很仔细，像在摆一桌要卖的货。<q>你这个样子出门，</q>她说，<q>人家会以为你没人照顾。</q>',
    r:[['<q>我是没人照顾。</q>', '<q>现在有了，</q>她说，手在你的领口上停了一会儿，<q>收费的。</q>', 5],
      ['<q>那你照顾我。</q>', '<q>我已经在照顾了，</q>爱丽什卡说，<q>你没发现，是因为我照顾得好。</q>', 4]]},
  {k:'e27', c:'love', o:'<q>我今天把你记进了账本，</q>爱丽什卡说，<q>在‘意外进账’那一栏。</q>',
    r:[['<q>我是进账？</q>', '<q>你是这个夏天唯一一笔我没算到的进账，</q>她说，<q>做生意的人最怕意外。可是这一笔……</q>她没说完，喝了一口酒。', 5],
      ['<q>该记在‘支出’。我花了你不少钱。</q>', '爱丽什卡笑出了声，差点把酒洒了。<q>那也是我愿意花的，</q>她说，<q>愿意花的钱不叫支出，叫……</q>她想了想，<q>叫心意。这个词我刚学会。</q>', 5]]},
  {k:'e28', c:'heart', o:'<q>雅罗斯拉夫死后，我在他那半边床上堆满了账本，</q>爱丽什卡说，<q>堆得很高，睡觉的时候就不会滚过去。</q>她看着你，<q>昨天，我把账本搬走了。</q>',
    r:[['<q>那半边我来占着。</q>', '<q>占着可以，</q>她说，<q>不许滚到我这边来。</q>说完，她自己先滚了过来。', 5],
      ['<q>你想好了？</q>', '<q>没想好，</q>爱丽什卡说，<q>做生意的人从来想不好，我们只是下注。</q>她握住你的手，<q>我下在你身上了。全下了。</q>', 5]]},
  {k:'e29', c:'heart', if: S => S.f.act >= 2, o:'<q>我从来不哭，</q>爱丽什卡说，<q>雅罗斯拉夫下葬那天也没哭。婆婆说我心硬。</q>她靠着你，<q>昨天夜里，我梦见你在维特科夫。醒来的时候，枕头是湿的。</q>',
    r:[['<q>我会回来的。</q>', '<q>我知道，</q>她说，<q>你的房钱我已经收到八月了。你得回来住完。</q>', 5],
      ['抱住她', '她在你怀里待了很久，一句话也没说。然后她用袖子擦了擦脸。<q>好了，</q>她说，<q>这件事，不记账。</q>', 5]]}
]);
// ===== 同伴之间的话：夜里火边听他们俩说（你可以插一句）；路上他们俩拌嘴；再多一些路上和火边的话 =====
// 火边：两个人都在队里、好感都到 5，一天最多听一回。r 是你插的话 [你说的, 后来怎样, {谁:好感}, 其他效果]
const PAIR_TALK = [
  {k:'kz', w:['katka', 'zden'], t:'谁走前面', la:'Ordo agminis',
    o:'明天走哪条路，已经定了。谁走在前面，还没定。\n\n<q>骑马的走前面，</q>齐德涅克说，<q>前面要是有埋伏，骑马的人穿着甲，挨得住第一箭。</q>\n\n<q>车走前面，</q>卡佳说，<q>前面要是有埋伏，车一横就是一堵墙。你那匹马一横，就是一匹横着的马。</q>\n\n<q>车走前面，跑不快。</q>\n\n<q>马走前面，跑得快。跑得快的，都先死。</q>\n\n两个人一起看着你。',
    r:[['<q>车走前面。</q>', '卡佳朝齐德涅克扬了扬下巴。齐德涅克没说话。可是第二天早上，他骑着马跟在头一辆车旁边，一步也没离开过。<q>车是墙，</q>他说，<q>墙也得有人守。</q>', {katka:3, zden:-1}],
      ['<q>马走前面。</q>', '<q>好，</q>卡佳说，<q>那你们先死。</q>她翻身躺下了。可是第二天，她把车赶得飞快，一直紧紧地跟在齐德涅克的马屁股后面。', {zden:3, katka:-1}],
      ['<q>齐德涅克骑马贴着头一辆车走。谁也不在前面。</q>', '两个人都张嘴想反驳，又都闭上了。<q>……也行，</q>卡佳说。<q>勉强可以，</q>齐德涅克说。他们说的是同一个意思。', {katka:2, zden:2}, {xp:{cmd:1}}]]},
  {k:'kp', w:['katka', 'petr'], t:'二月里那一天', la:'Dies irae',
    o:'<q>二月里，说好天要裂开的那一天，</q>卡佳说，<q>你在哪儿？</q>\n\n<q>在林子里，</q>彼得说，<q>那天有雾，雾里有鹿。</q>\n\n<q>我在塔博尔的山上，跟三千个人一起跪着，等天裂开，</q>卡佳说，<q>从天亮跪到天黑。我膝盖上的疤，就是那天跪出来的。</q>她看着彼得，<q>天没裂。你说，我们是不是傻子？</q>\n\n彼得没有马上回答。',
    r:[['<q>你们不傻。你们只是太想要一个新世界了。</q>', '卡佳没有说话，把膝盖抱得更紧了。彼得说：<q>想要新世界的人不傻。以为新世界会从天上掉下来的，傻一点点。</q>卡佳哼了一声：<q>就一点点？</q><q>就一点点。</q>', {katka:3, petr:2}],
      ['<q>彼得，你那天看见了鹿。这就是你的答案吧？</q>', '<q>是，</q>彼得说，<q>天没裂，可是鹿来了。我觉得这就够了。</q>卡佳看了他很久。<q>下回末日，</q>她说，<q>我去林子里看鹿。</q>', {petr:3, katka:1}, {lens:1}],
      ['<q>天没裂。可你们第二天还是起来了，把车连上了。</q>', '卡佳愣了一下，然后笑了，笑得很累，也很轻松。<q>对，</q>她说，<q>跪了一整天，第二天还得喂牛。</q>彼得在旁边轻轻地拍手。', {katka:4, petr:2}]]},
  {k:'ki', w:['katka', 'ilona'], t:'谁守夜', la:'Vigilia',
    o:'<q>今晚我守夜，</q>伊洛娜说。\n\n<q>昨晚是你，</q>卡佳说，<q>今晚轮到我。</q>\n\n<q>你守夜的时候打呼噜，</q>伊洛娜说，<q>敌人在三里地外就能听见。</q>\n\n<q>你守夜的时候跟马说话，</q>卡佳说，<q>说一整夜，马都烦了。</q>\n\n<q>马没烦。</q>\n\n<q>马跟我说它烦了。</q>',
    r:[['<q>一起守。</q>', '她们一起守了。后半夜你醒过来，看见两个人背靠着背坐着，伊洛娜在跟马说话，卡佳在打呼噜。敌人没有来。来了大概也会被吓回去。', {katka:2, ilona:2}, {mind:1}],
      ['<q>我来守。你们都去睡。</q>', '<q>你？</q>两个人同时说。然后她们都去睡了。睡之前，一个把弓放在你左手边，一个把连枷放在你右手边。', {katka:1, ilona:1}, {mind:-1, xp:{nerve:1}}],
      ['<q>马说什么了？</q>', '<q>马说，</q>伊洛娜很严肃，<q>卡佳的车轴该上油了。</q>卡佳张着嘴愣了半天，最后说：<q>……它说得对。</q>那天夜里谁也没守夜，两个人都在给车轴上油。', {ilona:3, katka:2}]]},
  {k:'km', w:['katka', 'matej'], t:'第一句话', la:'Prima sententia',
    o:'马捷伊教卡佳写字，已经教到第十天了。\n\n<q>今天，</q>马捷伊说，<q>我们写一整句话。你想写什么？</q>\n\n<q>‘没有老爷’，</q>卡佳说。\n\n马捷伊推了推鼻梁上并不存在的眼镜。<q>这句话缺一个主语。是谁没有老爷？</q>\n\n<q>谁都没有。</q>\n\n<q>那就写‘谁都没有老爷’。</q>\n\n<q>太长了，</q>卡佳说，<q>写那么长，老爷都跑了。</q>',
    r:[['<q>写短的。意思到了就行。</q>', '<q>好吧，</q>马捷伊叹了口气，<q>语法向起义让步。</q>卡佳在泥地上写了四个字，歪歪扭扭的，可是写完了。她看了很久，用脚抹掉了。<q>记住了，</q>她说，<q>不用留着。</q>', {katka:3, matej:1}],
      ['<q>写长的。写清楚了，以后的人才看得懂。</q>', '<q>听见了吗？</q>马捷伊很高兴，<q>以后的人！</q>卡佳咬着树枝想了很久。<q>以后的人，</q>她说，<q>也会有老爷吗？</q>马捷伊没答上来。可她把长的那句写完了。', {matej:3, katka:1}, {xp:{lore:1}}],
      ['<q>先写你自己的名字。</q>', '两个人都看着你。然后卡佳低下头，在泥地上一笔一笔地写：卡，特，日，娜。写了很久。写完了，她不说话了。马捷伊轻声说：<q>这是最好的第一句话。</q>', {katka:5, matej:3}]]},
  {k:'ke', w:['katka', 'eliska'], t:'面包的价钱', la:'Pretium panis',
    o:'<q>新城的面包又涨了，</q>卡佳把一块黑面包摔在桌上，<q>一块四个小钱。上个月才两个。</q>\n\n<q>面粉涨了，</q>爱丽什卡说，<q>城外有十字军，磨坊在城外。磨坊主要过河，过河要钱。船夫要钱，船夫的老婆要吃面包。</q>\n\n<q>你就是在替他们说话。</q>\n\n<q>我在替算术说话，</q>爱丽什卡说，<q>算术不站在哪一边。</q>',
    r:[['<q>算术不站边。可是人站边。</q>', '爱丽什卡沉默了一会儿。<q>说得好，</q>她承认。第二天，酿酒坊门口多了一块牌子：带孩子来的，面包和酒都减一半。牌子上没写是谁的主意。', {katka:4, eliska:1}],
      ['<q>爱丽什卡说得对。骂面包师傅没用。</q>', '<q>那骂谁有用？</q>卡佳问。爱丽什卡想了想：<q>骂把桥堵上的人。</q>两个人对看了一眼，第一次站在了同一边。', {eliska:3, katka:1}],
      ['把那块黑面包掰成三份', '你掰开了，递给她们一人一块。两个人都愣了一下，都吃了。吃完了，爱丽什卡说：<q>四个小钱，三个人吃，一个人才一个多小钱。</q>卡佳说：<q>你连这个也算？</q><q>算出来了，挺便宜的。</q>', {katka:2, eliska:2}, {mind:1}]]},
  {k:'zp', w:['zden', 'petr'], t:'一天不穿甲', la:'Sine lorica',
    o:'<q>你能不能一天不穿甲？</q>彼得问齐德涅克，<q>就一天。</q>\n\n<q>为什么？</q>\n\n<q>我想看看你本来的样子。</q>\n\n<q>我本来的样子，</q>齐德涅克说，<q>就是一个穿着甲的骑士。</q>\n\n<q>不对，</q>彼得说，<q>你本来的样子，是一个怕冷的人。甲是你的冬天。</q>',
    r:[['<q>齐德涅克，试一天。</q>', '齐德涅克看了你很久，真的解开了胸甲。那一整天他都不自在，走路老是想去摸胸口。晚上，他说：<q>原来风是这样吹的。</q>第二天早上，他又把甲穿上了。可是系带子的时候，比以前慢。', {petr:3, zden:2}, {lens:1}],
      ['<q>彼得，路上有十字军。甲不是冬天，是命。</q>', '<q>你说得对，</q>彼得说，<q>我忘了还有人想杀他。</q>他想了想，对齐德涅克说：<q>那等仗打完了，再脱一天。我等你。</q>齐德涅克没说好，也没说不好。', {zden:3, petr:1}],
      ['<q>彼得，你先穿一天甲。</q>', '彼得套上了齐德涅克的备用胸甲，走了十步，坐在了地上。<q>好重，</q>他喘着气，<q>你每天都背着这么重的东西走路？</q><q>每天，</q>齐德涅克说。彼得看着他，眼神变了。<q>那你一定很累，</q>他说。齐德涅克没说话。可是那天夜里，他让彼得替他解了甲。', {zden:3, petr:3}]]},
  {k:'zi', w:['zden', 'ilona'], t:'冲锋', la:'Impetus',
    o:'<q>骑士冲锋，</q>齐德涅克用树枝在地上画，<q>排成楔子，枪放平，对准敌人最厚的地方。冲进去，冲穿，再回头。</q>\n\n<q>然后呢？</q>伊洛娜问。\n\n<q>然后就赢了。</q>\n\n<q>库曼人看见你们排成楔子，就往后跑，</q>伊洛娜说，<q>你们追，我们跑。跑到你们的马累了，我们回头射箭。</q>她用脚把他画的楔子抹了，<q>你们冲的是你们看得见的。我们让你们冲我们想让你们冲的。</q>',
    r:[['<q>伊洛娜说得对。</q>', '齐德涅克看着被抹掉的楔子，很久没说话。然后他问：<q>你们往后跑的时候，怎么知道该在哪儿回头？</q>伊洛娜笑了。那天夜里，她给他讲了半宿。', {ilona:3, zden:1}, {xp:{cmd:1}}],
      ['<q>楔子也好，回头射箭也好，到了苏多梅日都不管用。烂泥比你们俩都厉害。</q>', '两个人都看着你，然后都笑了。<q>烂泥，</q>伊洛娜说。<q>烂泥，</q>齐德涅克叹了口气，<q>骑士团没教过这个。</q>', {zden:2, ilona:2}],
      ['<q>你们俩一起上。一个跑，一个冲。</q>', '<q>那敌人就不知道该看哪边了，</q>伊洛娜想了想，眼睛亮了。齐德涅克也想了想。<q>这在骑士团的书里，</q>他说，<q>叫‘不体面’。</q><q>赢了就体面，</q>伊洛娜说。他们在地上画到了半夜。', {zden:3, ilona:3}, {xp:{cmd:1}}]]},
  {k:'zm', w:['zden', 'matej'], if: S => pairOf('matej', 'zden') !== 'broken', t:'拉丁文的念法', la:'Pronuntiatio',
    o:'<q>‘Pater noster’，</q>齐德涅克念。\n\n<q>‘Pater noster’，</q>马捷伊念。\n\n你听不出有什么不一样。可是他们俩已经为这个吵了一刻钟。\n\n<q>教会念的是罗马的音，</q>齐德涅克说，<q>上帝听了一千年的音。</q>\n\n<q>西塞罗可不是这么念的，</q>马捷伊说，<q>上帝要是只听得懂一种念法，他就听不懂西塞罗。</q>\n\n<q>西塞罗是异教徒。</q>\n\n<q>可他的拉丁文比教皇好。</q>',
    r:[['<q>上帝听得懂捷克话。</q>', '两个人同时停下来看你。过了一会儿，齐德涅克用捷克话念了一遍主祷文，念得很慢。马捷伊跟着念。念完了，谁也没再吵。', {zden:2, matej:2}, {lens:1}],
      ['<q>齐德涅克说得对。念了一千年的音，就是对的音。</q>', '<q>一千年的错，还是错，</q>马捷伊说，可是他笑了，<q>不过你们骑士，向来投旧规矩一票。</q>齐德涅克很满意，难得地给马捷伊倒了一杯酒。', {zden:3, matej:-1}],
      ['<q>马捷伊说得对。西塞罗的拉丁文更好。</q>', '<q>西塞罗也没保住他自己的脑袋，</q>齐德涅克说。<q>那是另一个问题，</q>马捷伊说，很高兴，<q>明天再吵。</q>齐德涅克叹了口气：<q>好。明天。</q>看得出来，他们俩都在等明天。', {matej:3, zden:-1}]]},
  {k:'ze', w:['zden', 'eliska'], t:'规矩是谁定的', la:'De legibus',
    o:'<q>新城的规矩，都是有钱人定的，</q>爱丽什卡说。\n\n<q>规矩是上帝定的，</q>齐德涅克说，<q>上帝交给国王，国王交给领主，领主交给……</q>\n\n<q>交给收税的，</q>爱丽什卡说，<q>收税的交给我，我交给伙计，伙计交给他老婆。他老婆交给谁？</q>\n\n齐德涅克想了想。<q>交给上帝。</q>\n\n<q>所以绕了一圈，</q>爱丽什卡说，<q>上帝收的，是一个洗碗女人的税。</q>',
    r:[['<q>那上帝收得最少。因为她最穷。</q>', '齐德涅克不说话了。爱丽什卡给你倒满了一杯。<q>你说话越来越像布拉格人了，</q>她说，<q>这是夸你。</q>', {eliska:3, zden:-1}],
      ['<q>齐德涅克的链子没错，只是中间有人偷。</q>', '<q>对，</q>齐德涅克说，像是抓住了一根绳子，<q>链子没错，是人坏了。</q>爱丽什卡耸耸肩：<q>链子要是好的，就不会让人偷。</q>可她没有再往下说。', {zden:3, eliska:1}],
      ['<q>爱丽什卡，那她交给上帝的，你记在哪一栏？</q>', '爱丽什卡愣住了，然后笑得把酒都洒了。<q>记在‘坏账’，</q>她说，<q>收不回来的那一栏。</q>齐德涅克第一次被她逗笑了，笑得很小声，可是笑了。', {eliska:2, zden:2}]]},
  {k:'pi', w:['petr', 'ilona'], t:'交换', la:'Permutatio',
    o:'<q>你教我骑马，</q>彼得说，<q>我教你光脚走路。</q>\n\n<q>光脚走路有什么好学的？</q>伊洛娜说。\n\n<q>你试试。</q>\n\n伊洛娜脱了靴子，在草地上走了三步，踩到一个刺果，叫了一声，用库曼话骂了很长的一句。\n\n<q>好，</q>彼得说，<q>现在你学会了。该你教我了。</q>',
    r:[['看伊洛娜教彼得骑马', '彼得骑上去，摔下来；骑上去，摔下来。第七回，他在马背上坐稳了，马慢慢地走了一圈。伊洛娜跟在旁边跑，笑得眼泪都出来了。<q>你骑得像一袋会唱歌的面粉，</q>她说。<q>可是我在骑，</q>彼得说。', {petr:2, ilona:3}, {mind:1}],
      ['也脱了靴子，跟伊洛娜一起踩', '你也踩到了刺果。然后伊洛娜又踩到一个。你们俩单脚跳着，彼得笑得躺进了草里。<q>你们两个，</q>他说，<q>是伊甸园里最吵的两个人。</q>', {petr:3, ilona:2}, {mind:1}],
      ['<q>伊洛娜，你刚才骂的那句是什么意思？</q>', '伊洛娜的脸红了。<q>不能说，</q>她说。彼得说：<q>我猜是‘天啊，为什么要让刺长在草里’。</q>伊洛娜瞪着他：<q>你怎么知道？</q><q>因为我头一回光脚的时候，也是这么说的。</q>', {ilona:3, petr:2}]]},
  {k:'pm', w:['petr', 'matej'], t:'给草起名字', la:'Nomina',
    o:'<q>这是‘风的耳朵’，</q>彼得指着一种草说。\n\n<q>这是车前草，</q>马捷伊说，<q>拉丁文叫 Plantago。普林尼写过它。</q>\n\n<q>普林尼见过它早上是怎么张开叶子的吗？</q>\n\n<q>普林尼见过很多东西。</q>\n\n<q>那他一定没有工夫看一棵草看一个早上。</q>彼得蹲下来，把叶子翻过来，<q>你看，叶子背面有几条筋。普林尼数过吗？</q>\n\n马捷伊蹲下来，开始数。',
    r:[['<q>几条？</q>', '<q>七条，</q>马捷伊说，抬起头来，眼睛亮亮的，<q>普林尼没写。</q>他从笔袋里掏出笔，在纸边上记了一行。彼得看着他记，很高兴，像送出去了一件礼物。', {matej:3, petr:3}, {xp:{lore:1}}],
      ['<q>名字重要吗？草不在乎。</q>', '<q>草不在乎，</q>马捷伊说，<q>可是下一个发烧的人在乎。他得知道该去找哪一棵。</q>彼得想了想：<q>那就两个名字都教给他。一个拿来找，一个拿来喜欢。</q>', {matej:2, petr:2}],
      ['<q>‘风的耳朵’好听。</q>', '<q>好听没用，</q>马捷伊说。可是那天夜里，你看见他在小本子上，在 Plantago 旁边，用很小的字写了：<i>auris venti</i>。', {petr:3, matej:1}, {lens:1}]]},
  {k:'pe', w:['petr', 'eliska'], t:'谁来酿酒', la:'Quis braxat',
    o:'<q>天下的东西，都该是白给的，</q>彼得说，<q>水，风，太阳。上帝从来不收钱。</q>\n\n<q>好，</q>爱丽什卡说，<q>那啤酒呢？</q>\n\n<q>啤酒也该白给。</q>\n\n<q>那谁来酿？</q>爱丽什卡说，<q>大麦要种，要收，要泡，要发芽，要烘，要煮，要等。等的那四十天，酿酒的人吃什么？</q>\n\n彼得想了想。<q>吃大家白给她的面包。</q>\n\n<q>那面包是谁烤的？</q>',
    r:[['<q>彼得，她说得对。白给的东西，也得有人做。</q>', '彼得想了很久，然后很认真地对爱丽什卡说：<q>那我去帮你泡大麦。不要钱。</q><q>你会把我的大麦泡烂的。</q><q>那就算我欠你的。</q><q>你总算学会欠账了，</q>她说，很满意。', {eliska:3, petr:1}],
      ['<q>爱丽什卡，你自己也说过，有些账不记。</q>', '爱丽什卡瞪了你一眼。彼得笑得很开心：<q>你看，</q>他对她说，<q>你本来就是我们这边的。</q><q>我是我自己这边的，</q>爱丽什卡说。可那天夜里，彼得的杯子一直是满的。', {petr:3, eliska:1}],
      ['<q>面包大家一起烤，啤酒大家一起喝。</q>', '<q>那就是塔博尔了，</q>爱丽什卡说，<q>塔博尔的啤酒很难喝。</q>彼得说：<q>那是因为那里没有你。</q>爱丽什卡张了张嘴，头一回没话可回。', {petr:2, eliska:2}]]},
  {k:'im', w:['ilona', 'matej'], t:'猎人', la:'Venator',
    o:'<q>那是猎户座，</q>马捷伊指着天，<q>俄里翁，一个猎人。那三颗星是他的腰带。</q>\n\n<q>不对，</q>伊洛娜说，<q>那是三匹马，被一个小偷牵走了。前面那颗亮的是小偷，后面那颗红的是追他的人。追了一千年，还没追上。</q>\n\n<q>希腊人说是猎人。</q>\n\n<q>希腊人没有马，</q>伊洛娜说。',
    r:[['<q>希腊人有马。</q>', '<q>有马的人，不会把三颗星看成一根腰带，</q>伊洛娜很坚定。马捷伊想了想，在本子上写：<i>猎户座，库曼人以为是三匹被偷走的马</i>。写完了，他说：<q>这比腰带好。</q>', {ilona:2, matej:2}, {xp:{lore:1}}],
      ['<q>追的人会追上吗？</q>', '<q>每年秋天，他都快追上了，</q>伊洛娜说，<q>然后天就亮了。</q>马捷伊看着天，看了很久。<q>这是一个关于希望的故事，</q>他说。<q>不是，</q>伊洛娜说，<q>是关于看好你的马。</q>', {ilona:3, matej:2}],
      ['<q>那颗红的，在我们这儿叫什么？</q>', '两个人想了想，都不知道。最后马捷伊说：<q>那我们给它起一个。</q>伊洛娜说：<q>叫柳溪。</q><q>为什么？</q><q>因为它在追，</q>伊洛娜说，<q>一直在追。</q>她没有看你。', {ilona:3, matej:3}]]},
  {k:'ie', w:['ilona', 'eliska'], t:'嫁妆', la:'Dos',
    o:'<q>库曼姑娘出嫁，带多少嫁妆？</q>爱丽什卡问，问得很内行。\n\n<q>马，</q>伊洛娜说，<q>好人家带二十匹，一般的十匹。</q>\n\n<q>一匹马在布拉格值三十个格罗申，</q>爱丽什卡算着，<q>二十匹就是六百。比新城议员女儿的嫁妆还多。</q>\n\n<q>可是马会跑，</q>伊洛娜说，<q>嫁过去的姑娘不高兴了，就骑着自己的嫁妆回家。</q>\n\n爱丽什卡停下了算。',
    r:[['<q>这是我听过最好的嫁妆。</q>', '<q>是，</q>爱丽什卡慢慢地说，<q>能跑回家的嫁妆。</q>她看着酒杯，<q>我嫁过去的时候，带的是一张床和两口锅。哪样都跑不了。</q>伊洛娜把手放在了她的手上。', {eliska:3, ilona:3}],
      ['<q>你有几匹？</q>', '伊洛娜看了你一眼，脸红了。<q>我还没嫁，</q>她说，<q>我有一匹。一匹就够了，跑得快。</q>爱丽什卡在旁边笑：<q>一匹马，三十个格罗申。便宜。</q>伊洛娜朝她扔了一块面包。', {ilona:2, eliska:2}],
      ['<q>爱丽什卡，你在算伊洛娜值多少？</q>', '<q>我在算我自己值多少，</q>爱丽什卡说，<q>算出来，两口锅。</q>伊洛娜大笑：<q>那我给你五匹马，你跟我回平原。</q><q>成交，</q>爱丽什卡说。她们碰了杯。', {eliska:3, ilona:2}]]},
  {k:'me', w:['matej', 'eliska'], t:'利息是不是罪', la:'De usura',
    o:'<q>教会说，放债收利息是罪，</q>马捷伊说，<q>钱不会生钱，就像石头不会生石头。亚里士多德说的。</q>\n\n<q>亚里士多德没开过酿酒坊，</q>爱丽什卡说，<q>我把钱借给磨坊主，他拿去修了水车。水车转了一年，磨了一千袋面。这一千袋面，是不是我的钱生出来的？</q>\n\n<q>是水车生的。</q>\n\n<q>没有我的钱，就没有水车。</q>\n\n<q>那你该分他的面，不该收他的钱。</q>\n\n<q>先生，</q>爱丽什卡说，<q>你还欠我十四个格罗申。要我收面吗？</q>',
    r:[['<q>马捷伊，你输了。</q>', '<q>我没输，</q>马捷伊说，<q>只是暂时没想出反驳。</q>他从口袋里摸出一枚格罗申，放在桌上：<q>先还一枚，不付利息。这是原则问题。</q>爱丽什卡把那枚格罗申推了回去：<q>留着。等你有了原则以外的东西，再还。</q>', {eliska:3, matej:1}],
      ['<q>可教会自己也在收利息。</q>', '<q>对！</q>马捷伊一拍桌子，<q>修院放的债，利钱比谁都狠！</q>爱丽什卡耸耸肩：<q>所以我说，规矩是有钱人定的。</q>两个人吵着吵着，发现在骂同一拨人，就不吵了，一起骂。', {matej:3, eliska:2}],
      ['<q>一个欠了十一年不还，一个十一年不催。这叫什么？</q>', '两个人都看着你。过了很久，马捷伊说：<q>这叫……</q>爱丽什卡接着说：<q>交情。</q>她给他倒满了一杯，<q>这一杯，记在交情上。</q>', {matej:3, eliska:3}]]}
];
const PT_BY = Object.fromEntries(PAIR_TALK.map(p => [p.k, p]));
const ptAvail = () => PAIR_TALK.filter(p => !(S.f.ptSaid || {})[p.k] && p.w.every(id => inParty(id) && alive(id) && app(id) >= 5) && (!p.if || p.if(S)));
const ptCur = () => S && S.f.ptCur ? PT_BY[S.f.ptCur] : null;
def({id:'pt_talk', mode:'chain', once:false, if: S => !!ptCur(), t: S => ptCur() ? ptCur().t : '', la:'',
  who: S => ptCur() ? ptCur().w : [], text: S => ptCur() ? val(ptCur().o) : ''});
Object.defineProperty(ST.pt_talk, 'opts', {get: () => { const p = ptCur(); if (!p) return [];
  return p.r.map(r => ({t:r[0], app:r[2], fx:r[3] || {}, run: S => { (S.f.ptSaid = S.f.ptSaid || {})[p.k] = 1; }, r:r[1]})); }});
Object.defineProperty(ST.pt_talk, 'la', {get: () => { const p = ptCur(); return p ? p.la : ''; }});
ST.s_campfire.opts.splice(ST.s_campfire.opts.length - 1, 0, {
  t: S => { const p = ptAvail()[0]; return p ? `听${nm(p.w[0])}和${nm(p.w[1])}说话` : ''; },
  if: S => S.f.ptDay !== S.day && ptAvail().length > 0,
  run: S => { const p = ptAvail()[0]; S.f.ptCur = p.k; S.f.ptDay = S.day; },
  next:'pt_talk', r: S => { const p = PT_BY[S.f.ptCur]; return `${nm(p.w[0])}和${nm(p.w[1])}在火的另一边说着话，声音越来越大。你没有出声，往那边挪了挪。`; }
});

// ---------- 路上：两个人拌嘴（到了地方，写在地点描述下面） ----------
ROAD_PAIR.push(
  {k:'kz1', w:['katka', 'zden'], t:'<q>你的马又咬我的牛了，</q>卡佳说。<q>它在跟你的牛打招呼，</q>齐德涅克说。<q>你们玫瑰家打招呼用牙？</q><q>用剑。马没有剑。</q>'},
  {k:'kz2', w:['katka', 'zden'], to:'rose', t:'离玫瑰堡还有一里地，齐德涅克就开始整理他的号衣，越整越歪。卡佳看了一会儿，伸手替他把领子翻正了。两个人都没说话。'},
  {k:'kz3', w:['katka', 'zden'], if: S => S.f.campUp, t:'路上遇见一队往南逃的人。卡佳把车上的面包分了一半，齐德涅克把水囊给了一个老太太。走出去很远，卡佳说：<q>你的水囊。</q><q>我知道。</q><q>你今天喝什么？</q><q>喝你的。</q>卡佳哼了一声，把水囊递了过去。'},
  {k:'kp1', w:['katka', 'petr'], t:'卡佳赶着车，彼得光着脚跟在车边走。<q>上来坐，</q>卡佳说。<q>走着好，</q>彼得说。<q>走着脚疼。</q><q>疼也好。</q><q>你们林子里的人，什么都好。</q><q>对，</q>彼得说，<q>你也好。</q>卡佳把车赶快了，可是没有甩开他。'},
  {k:'kp2', w:['katka', 'petr'], to:'tabor', t:'上塔博尔的山路上，卡佳一直把车赶在彼得旁边，不快也不慢。<q>他们要是再赶你，</q>她说，<q>我就再举一回手。</q><q>举哪只手？</q><q>拿连枷的那只。</q>'},
  {k:'ki1', w:['katka', 'ilona'], t:'伊洛娜骑着马绕着卡佳的车转圈，一圈，两圈，三圈。<q>你晕不晕？</q>卡佳问。<q>不晕。</q><q>我晕。</q>'},
  {k:'km1', w:['katka', 'matej'], t:'一路上，卡佳每看见一块路碑，就念上面的字。念错了，马捷伊就在后面纠正。到了地方，她一块也没念错了。马捷伊说这是他教过最快的一堂课。卡佳说，那是因为路碑上的字都一样。'},
  {k:'ke1', w:['katka', 'eliska'], to:'prague', t:'进布拉格之前，爱丽什卡把卡佳车上的东西点了一遍。<q>进城门要交税，</q>她说，<q>连枷算兵器，一根两个小钱。</q>卡佳把连枷塞进了干草堆里。爱丽什卡点点头：<q>学得快。</q>'},
  {k:'zp1', w:['zden', 'petr'], t:'下雨了。齐德涅克把斗篷递给彼得，彼得不要。齐德涅克又递了一回。彼得接过去，转手披在了马背上。齐德涅克看着自己的斗篷在马背上淋雨，很久没说话。最后他说：<q>……也行。</q>'},
  {k:'zi1', w:['zden', 'ilona'], t:'齐德涅克和伊洛娜赛马，从这个村子跑到下一个村子。齐德涅克的马重，跑得稳；伊洛娜的马轻，跑得飞。等你们赶到，伊洛娜已经坐在井边喝水了。<q>你的马很好，</q>她说，<q>就是背上的东西太多。</q><q>背上是我。</q><q>对。</q>'},
  {k:'zi2', w:['zden', 'ilona'], to:'camp', t:'莱特纳的营火已经看得见了。伊洛娜把兜帽压得很低。齐德涅克骑到了她的左边，挡在她和营地之间。他什么也没说，伊洛娜也没说谢谢。'},
  {k:'zm1', w:['zden', 'matej'], if: S => pairOf('matej', 'zden') !== 'broken', t:'一路上，马捷伊在给齐德涅克讲波伊提乌。齐德涅克听得很认真，偶尔问一句。到了地方，他说：<q>那个人在牢里等着砍头，还能写得那么平静。</q><q>因为他有哲学，</q>马捷伊说。齐德涅克想了想：<q>不，是因为他有纸。</q>'},
  {k:'ze1', w:['zden', 'eliska'], t:'爱丽什卡在马背上算账，齐德涅克在马背上念经，两个人的嘴都在动，快慢也差不多。走到一半，你发现他们在比谁先念完。爱丽什卡赢了。齐德涅克说，那是因为她的账比他的经短。'},
  {k:'pi1', w:['petr', 'ilona'], t:'彼得坐在伊洛娜的马后面，搂着她的腰，唱了一路那首没有词的歌。伊洛娜一开始想把他推下去，后来跟着哼了起来。到了地方，马一直在点头，像在打拍子。'},
  {k:'pm1', w:['petr', 'matej'], t:'<q>先生，你走路的时候在想什么？</q>彼得问。<q>三段论，</q>马捷伊说，<q>你呢？</q><q>我在想脚底下的土是热的还是凉的。</q>马捷伊走了几步，低头看了看自己的靴子。<q>我不知道，</q>他说，有点难过。'},
  {k:'pm2', w:['petr', 'matej'], to:'forest', t:'一进林子，彼得就指着各种草给马捷伊看。马捷伊一样一样地记。走了一里路，本子记满了，彼得的话还没说完。'},
  {k:'pe1', w:['petr', 'eliska'], t:'路过一个讨饭的，彼得把自己的面包给了他。爱丽什卡看着，叹了口气，从钱袋里掏出一个小钱，也给了。<q>我不是学你，</q>她对彼得说，<q>我是在投资。</q><q>投资什么？</q><q>投资我夜里睡得着。</q>'},
  {k:'im1', w:['ilona', 'matej'], t:'伊洛娜在马上教马捷伊说库曼话。马捷伊把每个词都记在手背上，记满了一只手，又记另一只。到了地方，他两只手都是墨，像刚从墨缸里爬出来。伊洛娜说，他现在是半个库曼人了。'},
  {k:'ie1', w:['ilona', 'eliska'], to:'kutna', t:'<q>库特纳霍拉的井，</q>伊洛娜说。<q>我知道，</q>爱丽什卡说，<q>我有个表哥就在那口井里。</q>她们骑着马，靠得很近，谁也没再说话。'},
  {k:'me1', w:['matej', 'eliska'], to:'prague', t:'<q>每回看见布拉格，</q>马捷伊说，<q>我都想起西塞罗说罗马：一座什么都能买卖的城。</q><q>西塞罗说得对，</q>爱丽什卡说，<q>可他没说价钱。价钱是我说的。</q>'}
);

const roadMore = {
  katka:[{k:'f', to:'usti', if: S => S.f.ustiBurned, t:'远远看见奥斯蒂的城墙，卡佳不说话了。过了很久，她说：<q>我在这儿点过火。那时候觉得火是干净的。</q>'},
    {k:'g', t:'卡佳把一根麦秆叼在嘴里赶了一路车。到了地方，麦秆还在，被嚼成了一根细绳。'},
    {k:'h', to:'sudomer', if: S => S.f.sudomerDone, t:'经过苏多梅日的塘堤，卡佳把车停了，看了很久。<q>那天这里全是水和叫声，</q>她说，<q>现在只有青蛙。</q>'},
    {k:'i', to:'budej', t:'<q>布杰约维采的人看我们，</q>卡佳压低声音说，<q>像看麻风病人。</q>她把连枷塞进干草底下，自己坐在了上面。'}],
  zden:[{k:'f', to:'strak', t:'<q>我小时候在斯特拉科尼采的骑士团学过一年剑，</q>齐德涅克说，<q>那时候的先生，现在大概在城墙上。</q>他整了整衣领。'},
    {k:'g', to:'kutna', t:'进库特纳霍拉的时候，齐德涅克在城门口画了个十字，又朝矿井那边看了一眼，又画了一个。'},
    {k:'h', t:'路过一座烧了一半的教堂，齐德涅克下了马，走进去，在没有屋顶的祭坛前跪了一会儿。出来的时候，他手里拿着一块烧黑的木头，放进了马鞍袋。'},
    {k:'i', to:'camp', t:'离莱特纳越近，齐德涅克擦剑擦得越勤。<q>那边有我认识的人，</q>他说，<q>剑干净一点，他们好认出来。</q>'}],
  petr:[{k:'f', to:'kutna', t:'彼得在库特纳霍拉城外停下来，在一块石头上坐了很久。<q>这里的地底下有很多人，</q>他说，<q>我陪他们坐一会儿。</q>'},
    {k:'g', t:'一路上，彼得在每一棵大树前都停一下，用手摸摸树皮，像在跟老朋友打招呼。你问他是不是认识这么多树。<q>现在认识了，</q>他说。'},
    {k:'h', to:'usti', t:'<q>烧过的地方，第二年草长得最好，</q>彼得看着奥斯蒂说，<q>地不记仇。人记。</q>'},
    {k:'i', to:'prague', t:'进布拉格的城门时，守门的人盯着彼得的光脚看了很久。彼得朝他笑了笑。守门的人也笑了，挥挥手让你们过去了，一个小钱也没收。'}],
  ilona:[{k:'f', to:'sudomer', t:'在苏多梅日的鱼塘边，伊洛娜下了马，蹲在塘堤上看了很久。<q>好地方，</q>她说，<q>马在这里一点用都没有。我喜欢想出这个主意的人。</q>'},
    {k:'g', t:'伊洛娜一路上都在吹一片草叶，吹出来的声音像一只鸟。后来真有一只鸟回了她一声。她高兴了一整天。'},
    {k:'h', to:'liuxi', t:'<q>这就是柳溪？</q>伊洛娜在马镫上站起来看，<q>小，</q>她说，然后又看了很久，<q>可是柳树真多。</q>'},
    {k:'i', to:'budej', t:'进布杰约维采之前，伊洛娜把铜铃一个一个从辫子上摘下来，放进了口袋。<q>这座城的人不喜欢响的东西，</q>她说。'}],
  matej:[{k:'f', to:'strak', t:'<q>斯特拉科尼采的骑士团有一本十二世纪的《诗篇》抄本，</q>马捷伊说，<q>我十年前来借过，他们没借给我。</q>他整了整衣服，<q>也许今天运气好。</q>'},
    {k:'g', t:'马捷伊在马背上看书。看到一半，马停下来吃草，他也没发现。你们走出去半里地，回头一看，他还在原地，书又翻了一页。'},
    {k:'h', to:'tabor', t:'<q>塔博尔这个名字，是从《圣经》里来的，</q>马捷伊看着山上的车阵说，<q>基督在塔博尔山上显了圣容。</q>他想了想，<q>这里的人，也在等着什么显出来。</q>'},
    {k:'i', to:'liuxi', t:'<q>柳溪的扬神父，在祭坛上同时摆着饼和酒？</q>马捷伊点点头，像在给一篇论文打分，<q>一个乡下神父，比大学里一半的先生都有胆子。</q>'}],
  eliska:[{k:'f', to:'kutna', t:'<q>全波希米亚的钱都是从库特纳霍拉出来的，</q>爱丽什卡说，<q>可这里的酒是全波希米亚最难喝的。</q>她想了想，<q>有钱的地方，人都不在乎喝的是什么。</q>'},
    {k:'g', to:'tabor', t:'进塔博尔的时候，爱丽什卡往广场的木桶里放了一枚格罗申。你看见了。她瞪着你：<q>看什么？我在打听行情。</q>'},
    {k:'h', t:'一路上，爱丽什卡跟每一个迎面过来的车夫都搭了话，问他们拉的是什么，去哪儿，多少钱。到了地方，她说：<q>下个月盐要涨。</q>'},
    {k:'i', to:'rose', t:'<q>玫瑰家的人喝奥地利的酒，</q>爱丽什卡说，<q>他们觉得捷克的酒不够体面。</q>她哼了一声，<q>等仗打完了，我让他们求着来买。</q>'}]
};

const campMore = {
  katka:[{k:'n1', t:'卡佳在火边替你补好了靴子，补丁是一块旧车篷，很硬，很丑。<q>穿三天就软了，</q>她说，<q>跟人一样。</q>'},
    {k:'n2', if: S => S.f.act >= 2, t:'<q>你知道车阵为什么用铁链，不用绳子吗？</q>卡佳说，<q>绳子会烂，会被砍断。铁链只会生锈。</q>她看着火，<q>人也该像铁链。锈了可以，断了不行。</q>'}],
  zden:[{k:'n1', t:'齐德涅克在火边磨剑。磨完了，用剑身照了照自己的脸。<q>老了，</q>他说，又拿剑照了照你，<q>你没有。</q>'},
    {k:'n2', t:'<q>我小时候怕黑，</q>齐德涅克说，<q>母亲教我念玫瑰经，说念完一串，天就亮了。</q>他摸着念珠，<q>后来我发现，念完一串天也没亮。可是我不怕了。</q>'}],
  petr:[{k:'n1', t:'彼得用草叶编了一只小鸟，放在你手心里。<q>它不会飞，</q>他说，<q>可是它也不会死。</q>'},
    {k:'n2', t:'<q>萤火虫为什么会亮？</q>彼得问，<q>它们在找对方。</q>火光外面的黑暗里，有几点绿光一闪一闪。<q>人也一样，只是我们的光得用火来点。</q>'}],
  ilona:[{k:'n1', t:'伊洛娜在火边给她的马唱歌，库曼话的，很低。马的耳朵转过来，又转过去。<q>它说，</q>伊洛娜说，<q>这首听过了，换一首。</q>'},
    {k:'n2', t:'<q>平原上的夜里，星星一直落到地上，</q>伊洛娜说，<q>你会以为自己站在天的正中间。</q>她看着头顶被树枝切碎的天，<q>这里的天太小了。可是火很暖。</q>'}],
  matej:[{k:'n1', t:'马捷伊在火边读一封很旧的信。读完了，折好，放回怀里。<q>胡斯先生写给学生的，</q>他说，<q>我不是那个学生。可是每回读，都觉得是写给我的。</q>'},
    {k:'n2', t:'<q>火是最好的先生，</q>马捷伊说，<q>它从来不重复，每一根柴烧出来的样子都不一样。</q>他往火里添了一根，<q>可是学生们都只想要答案。</q>'}],
  eliska:[{k:'n1', t:'爱丽什卡在火边把今天的账算了一遍，把小本子递给你：<q>你也算一遍。</q>你算了，跟她的不一样。<q>你对了，</q>她说，<q>我故意错了一笔，看你发不发现。</q>'},
    {k:'n2', t:'<q>酿酒最难的是等，</q>爱丽什卡说，<q>麦芽在桶里，你什么都做不了，只能等。等急了，酒就酸了。</q>她看着火，<q>人也是。</q>'}]
};

const VAVRA_LOOK = {skin:'#d6aa82', hair:'crop', hairColor:'#3a2618', eye:'#4a2a1a', outfit:'gambeson', outfitColor:'#5a5040', build:'broad', acc:['freckles']};
const VASEK_LOOK = {skin:'#e9c9a6', hair:'wild', hairColor:'#a8552e', eye:'#3a5a3a', outfit:'gambeson', outfitColor:'#7a1f24', build:'slim', acc:['freckles']};

function fatherEnd() {
  const f = S.f;
  if (!S.q.q_father) return '';
  const paper = {king:'那张纸交给了写它的人。你始终不知道它最后去了哪里：火盆，手套，还是那顶他十六年以后才戴上的王冠底下。',
    asked:'你让那个国王说了一句话，只有你听见。你回到柳溪，在父亲的坟前把那句话又说了一遍。说完，你觉得有人在柳树底下松了一口气。',
    zeliv:'那张纸在雪地圣母堂的讲台上念了出来。后来，背面那一行字被刻在了很多地方，刻的人都不知道，它最早是写在一个人的膝盖上的。',
    univ:'那张纸锁在查理学院的箱子里，和胡斯从康斯坦茨写回来的信扎在一起。绳子底下塞着一张小纸条，写着你父亲的名字。',
    grave:'那张纸和父亲埋在了一起。每年春天，那里会长出一丛很小的蓝花。',
    kozi:'那张纸留在了科齐堡的石头上，第二天早上就不见了。贝特卡说是西风。你没有反驳她。'}[f.fatherPaper]
    || (f.fatherKnown ? '那张纸你一直揣在怀里，揣了很多年，像他一样。有一天你的孙辈翻出了它，问你这是什么。你说：是一个国王的承诺。' : '父亲箱子里的那张纸，你后来一直没有弄明白。你把它放回了箱子里，和那片椴树叶在一起。');
  const heart = {peace:'你在他的坟前说过，他不是懦夫。你后来一直这样相信。', angry:'你在他的坟前冲他喊过。后来，你一直想再去喊一次，换一句别的话。', vow:'你在他的坟前说过，要替他把它用掉。'}[f.graveKnown] || '';
  return paper + heart;
}
function estateEnd() {
  const f = S.f;
  if (!f.eInit) return '';
  const out = [];
  if (f.eHarvest === 'good') out.push('那年的黑麦收得很好，粮仓一直满到了房梁。');
  else if (f.eHarvest === 'thin') out.push('那年的麦子收得很稀，可是够吃到第二年开春。');
  if (f.eRefugees > 0) out.push(`收留来的${cnNum(f.eRefugees)}户人家后来都留在了柳溪。赫拉夫卡的儿子长大以后，当了柳溪的磨坊主。`);
  else if (f.eRefugeesSent) out.push('那些被你送去塔博尔的人家，你后来再也没有见过。');
  if (f.eMen >= 3 || f.eWall >= 2) out.push('村口的木栅一直立着。柳溪的佃户每年秋天都要在打谷场上练一次连枷，练到后来，成了一个节日。');
  if (f.eRent === 'none') out.push('那一年柳溪没有收租。佃户们记了一辈子，讲给他们的孙子听。');
  if (f.millBlessed === 'cup') out.push('水闸边那只倒扣的陶杯一直在那里，没有人敢翻开。');
  if (f.dorota) out.push('多罗塔在柳溪活到了九十岁，到死都嫌溪水太凉。');
  if (f.vasek === 'liuxi') out.push('瓦谢克留在了柳溪，瘸着腿，后来娶了老伊日的一个孙女。');
  if (f.vavraHome === 'liuxi') out.push('瓦夫拉在柳溪打了一辈子铁，打的连枷，都是用来打麦子的。');
  return out.join('');
}
