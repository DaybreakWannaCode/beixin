def({
  id:'e_refugees', mode:'here', at:'village', act:[1, 2], prio:16, if: S => S.day >= 6 && (S.f.ustiBurned || S.f.sudomerDone), t:'逃难的人', la:'Profugi', tag:'柳溪',
  text: S => { estInit(); return `村口来了一群人，十几户，推着小车，背着包袱，孩子坐在包袱上。有${S.f.ustiBurned ? '从奥斯蒂来的，城烧了，山上又住不下' : '从南边来的，村子被抢了'}，有从赫鲁比来的，有的说不清自己是从哪里来的。

领头的是一个瘦高的女人，抱着一个婴儿。<q>我们能干活，</q>她说，<q>割麦子，打谷子，修房子。我们只要一个屋顶，和每天一碗粥。</q>

柳溪空了一半的房子，门都开着。粮仓里还有 ${S.f.eGrain} 斗粮。`; },
  opts:[
    {t:'<q>空房子都住满。</q>（收留八户）', fx:{inc:{eRefugees:8}, rep:{home:4, tabor:3}, honor:3}, app:{katka:8, petr:6, zden:4, eliska:-4},
      r:'他们住进了空房子。第二天早上，柳溪的烟囱里又冒烟了，比原来还多。母亲煮了一大锅粥，煮了三次才够。\n\n抱婴儿的女人叫赫拉夫卡。她说，等孩子会走路了，就叫他柳溪。'},
    {t:'<q>能干活的留下。</q>（收留三户）', fx:{inc:{eRefugees:3}, rep:{home:1}}, app:{eliska:3, katka:-2},
      r:'你挑了三户，男人能扛、女人能纺的。其余的人在村口站了一会儿，又推着小车走了。赫拉夫卡没有被挑上。她走的时候没有回头，婴儿在她怀里一直看着你。'},
    {t:'<q>柳溪的粮只够柳溪的人吃。</q>', fx:{rep:{home:-2}, mind:-1}, app:{katka:-8, petr:-6, eliska:4},
      r:'他们走了。往塔博尔的方向。你在村口站着，看着那一溜小车在路上越来越小。\n\n老伊日在你身后说：<q>老爷，您做得对。</q>他说得很小声，像是在说服自己。'}
  ]
});

// ---------- 粮吃完了 ----------
def({
  id:'e_hunger', mode:'here', at:'village', prio:22, once:false, if: S => S.f.eHungry && S.f.eGrain <= 0, t:'粮仓见底', la:'Fames', tag:'柳溪',
  text: S => `粮仓见底了。老伊日拿着一把扫帚，把最后一点麦粒从墙角里扫出来，扫了小半碗。

收留来的人家已经开始挖野菜。孩子们在溪边捞小鱼，捞上来就生吃。赫拉夫卡把自己的那一碗粥分给了别人家的孩子，自己的婴儿哭了一夜。`,
  opts:[
    {t:'去皮塞克买粮', cost:40, fx:{inc:{eGrain:30}, set:{eHungry:0}, rep:{home:3}}, r:'三十斗黑麦，贵得像银子。可是那天晚上，柳溪家家户户都在煮粥。粥的味道飘满了整个村子。'},
    {t:'打开庄园自己的地窖', fx:{inc:{eGrain:15}, set:{eHungry:0}, rep:{home:6}, mind:-1, t:{anna:5}}, app:{katka:6, petr:4},
      r:'地窖里有父亲存的麦子，有母亲腌的酸菜，有两桶留着过冬的猪油。你把门打开，让老伊日一样一样往外搬。\n\n母亲站在旁边，看着那两桶猪油被抬出去。<q>你父亲会这么做的，</q>她说，<q>他会先犹豫一下，然后这么做。</q>'},
    {t:'让收留来的人去塔博尔', if: S => S.f.eRefugees > 0, fx: S => ({set:{eHungry:0, eRefugeesSent:S.f.eRefugees}, rep:{home:-4, tabor:4}, mind:-2}), run: S => { S.f.eRefugees = 0; S.f.eGrain = Math.max(S.f.eGrain, 5); }, app:{katka:-6, petr:-5, eliska:3},
      r:'他们走的那天早上，没有人说话。赫拉夫卡抱着孩子走在最后面，走到村口，回头看了一眼柳溪。\n\n<q>他会走路了，</q>她说，<q>就不叫柳溪了。</q>'}
  ]
});

// ---------- 抢粮的兵 ----------
def({
  id:'e_raid', mode:'here', at:'village', act:[2], prio:30, if: S => S.f.eInit && S.day >= 45 && !S.f.eRaid, t:'牛', la:'Abigei', tag:'柳溪',
  text: S => `天刚亮，放牛的孩子哭着跑回村里：${S.f.bohusDead || S.f.bohusSpared ? '一队不知道是哪边的兵' : '赫鲁比的人'}在溪对岸，把柳溪的牛往南边赶。十几个人，骑着马。

${S.f.eMen ? `佃户们已经拿着连枷在村口站好了，${cnNum(S.f.eMen)}队，一队五个人。` : '佃户们站在村口，手里拿着草叉和镰刀，看着你。'}${S.f.eWall ? '木栅后面，女人们在往外递石头。' : ''}`,
  opts:[
    {t:'带上民兵去追', chk:'cmd', dc: S => Math.min(3, S.f.eMen) - 1 + (S.f.eWall >= 2 ? 1 : 0), fx:{set:{eRaid:'held'}, rep:{home:8}, honor:4}, pfx:{hurt:1}, ffx:{set:{eRaid:'lost'}, inc:{eGrain:-10}, rep:{home:2}, hurt:1}, app:{katka:6, zden:5, ilona:6},
      r: S => `你们在溪边的浅滩上追上了他们。${S.f.eMen >= 2 ? '佃户们的连枷甩得比你想的整齐，一下就打下来两匹马。' : '你冲在最前面，一个人拦住了他们的去路。'}他们丢下牛跑了。\n\n回村的路上，佃户们一路都在说话，声音很大，说的都是刚才谁打中了谁。你没有插嘴。你知道，从今天起，他们觉得自己也能打仗了。`,
      f:'他们人多，马快。你们追到浅滩，只抢回了三头牛。剩下的，连同半个粮仓的麦子，都被赶过了溪。'},
    {t:'让他们走。牛没了还能再买', fx:{set:{eRaid:'let'}, inc:{eGrain:-5}, rep:{home:-4}, money:-30}, app:{eliska:3, petr:3, katka:-5},
      r:'你看着他们把牛赶过了溪。放牛的孩子一直在哭，你把他抱起来，他咬了你一口。\n\n后来你从皮塞克买了六头牛，花了三十个格罗申，比原来的瘦。'}
  ]
});
// 你不在家的时候，兵也会来
DAY_HOOKS.push(S => {
  if (!S.f.eInit || S.f.eRaid || S.f.act !== 2 || S.day < 52 || S.region === 'liuxi') return;
  const power = S.f.eMen + S.f.eWall * 1.5 + (S.rep.home >= 40 ? 1 : 0);
  if (power >= 3) { S.f.eRaid = 'heldAway'; S.rep.home = clamp(S.rep.home + 4, -100, 100); addLog('柳溪来信：有兵来抢牛，佃户们在木栅后面把他们打跑了。'); }
  else { S.f.eRaid = 'lostAway'; S.f.eGrain -= 15; S.rep.home = clamp(S.rep.home - 4, -100, 100); addLog('柳溪来信：有兵来抢了牛，还搬走了半个粮仓。'); }
});
def({
  id:'e_raid_news', mode:'here', at:'manor', prio:25, if: S => ['heldAway', 'lostAway'].includes(S.f.eRaid), t:'你不在的时候', la:'Absente domino', who:['anna'],
  text: S => S.f.eRaid === 'heldAway' ? '母亲在门口等你。她说，你走后第三天，有一队兵来抢牛。佃户们关上了木栅，在后面甩连枷、扔石头，打了一个上午，那些人就走了。\n\n<q>他们打得很好，</q>母亲说，<q>他们说是你教的。</q>' : '母亲在门口等你。她说，你走后第三天，有一队兵来抢牛。佃户们拿着草叉站在村口，被人家骑着马冲散了。牛没了，粮仓空了一半，铁匠的胳膊断了。\n\n<q>没有死人，</q>母亲说，<q>这已经很好了。</q>她没有怪你。你宁愿她怪你。',
  opts:[{t:'……', fx: S => S.f.eRaid === 'heldAway' ? {set:{eRaid:'held'}, mind:2} : {set:{eRaid:'lost'}, mind:-2}, r:'你去村口看了看。木栅上有几处新的刀痕，地上的血已经被雨冲淡了。'}]
});

// ---------- 磨坊重新转起来 ----------
def({
  id:'e_mill_wheel', mode:'here', at:'village', prio:14, if: S => S.f.millRebuilt && !S.f.millBlessed, t:'水轮', la:'Rota', tag:'柳溪',
  text: S => `新水轮转了三天，第四天早上，溪边来了一个人：绿眼睛，衣角湿的。是林子里水磨坊的那个老人。${S.done.s_mill ? '' : '你不认识他，可是佃户们都往后退了一步。'}

他站在溪边，看了水轮很久，然后蹲下来，把手伸进水里，像在摸一匹马的脖子。

<q>好轮子，</q>他说，<q>橡木的，水喜欢橡木。</q>他从怀里掏出一只小陶杯，倒扣着放在水闸边的石头上，<q>放在这里。别翻开它。水闸边上每年都要淹死一个人，有了这个，就不淹了。</q>`,
  opts:[
    {t:'<q>谢谢。</q>不碰那只杯子', lens:1, fx:{set:{millBlessed:'cup'}, lens:1, rep:{home:2}, t:{miller:10}},
      r:'老人点点头，走了，沿着溪往下游走，走着走着就看不见了。\n\n那只杯子一直扣在水闸边。佃户们洗衣服的时候绕着它走。那一年，柳溪的水闸边没有淹死人。第二年也没有。'},
    {t:'等他走了，把杯子翻开看看', lens:-1, fx:{set:{millBlessed:'looked'}, lens:-1, xp:{lore:1}},
      r: S => S.lens > 0 ? '杯子底下什么也没有。只有一点水汽，在石头上画了一个很小的圈，像一个人呼出来的气。你看着它慢慢干掉。\n\n你把杯子扣回去，扣得很小心。' : '杯子底下什么也没有，一块湿了的石头。陶杯是皮塞克集市上卖的那种，一个铜板一对。\n\n你把杯子扣回去。不管它是什么，佃户们看见它在那里，洗衣服的时候就会离水闸远一点。这就够了。'}
  ]
});

// ---------- 收麦子 ----------
def({
  id:'e_harvest', mode:'here', at:'fields', act:[3], prio:28, if: S => S.f.eInit && S.day >= 110 && !S.f.eHarvest, t:'收麦子', la:'Messis', tag:'柳溪 · 七月',
  text: S => { const hands = estTenants() + S.f.eRefugees, good = hands >= 26 && S.f.eRaid !== 'lost' && S.f.eRaid !== 'lostAway';
    return `黑麦黄了。七月的太阳底下，整片麦田是一种很重的金色，风吹过去，不起浪，只是沉沉地晃。

全村的人都下了地。${S.f.eRefugees ? `收留来的${cnNum(S.f.eRefugees)}户人家也来了，赫拉夫卡把婴儿放在田埂上的篮子里，一边割一边回头看。` : ''}${S.f.vasek === 'liuxi' ? '瓦谢克瘸着腿，跟在后面捡麦穗。' : ''}${S.f.dorota ? '多罗塔坐在田头，骂每一个捆得不紧的麦捆。' : ''}

${good ? '今年的麦子长得好。老伊日一捆一捆地数，数到后来，他不数了，只是笑。' : '今年的麦子长得稀。人手不够，有一片地来不及割，麦穗就落在了地里。老伊日数着麦捆，数得很慢，好像数慢一点，数字就会多一点。'}`; },
  opts:[
    {t:'自己也下地割', fx: S => ({set:{eHarvest:estTenants() + S.f.eRefugees >= 26 && !['lost', 'lostAway'].includes(S.f.eRaid) ? 'good' : 'thin'}, inc:{eGrain:60}, rep:{home:6}, mind:3, xp:{arm:1}}), run: S => applyFx({app:Object.fromEntries(S.party.map(id => [id, 4]))}),
      r: S => `你割了一天，手上起了三个泡，腰直不起来。佃户们一开始不好意思，后来就不管你了，跟你比谁割得快。你输了。\n\n傍晚，最后一捆麦子扎好的时候，女人们用最后一把麦穗编了一个花环，戴在了${S.lovers.filter(alive).length && inParty(S.lovers.filter(alive)[0]) ? nm(S.lovers.filter(alive)[0]) : '你'}的头上。这是柳溪的老规矩。花环扎得很紧，麦芒扎得头皮痒。`},
    {t:'站在田头看着', fx: S => ({set:{eHarvest:estTenants() + S.f.eRefugees >= 26 && !['lost', 'lostAway'].includes(S.f.eRaid) ? 'good' : 'thin'}, inc:{eGrain:50}, rep:{home:3}, mind:2}),
      r:'你站在田头，看了一整天。看着麦子一片一片倒下去，看着麦捆一个一个立起来，看着太阳从这一头走到那一头。\n\n你想起父亲也是这样站在田头的。你以前觉得他是在偷懒。现在你知道了，他是在看。总要有一个人站在那里，看着这一切发生。'}
  ]
});

// ---------- 抢粮的人：你有民兵和木栅的时候 ----------
(function () {
  const st = ST.s_vit_home;
  if (!st) return;
  const _text = st.text;
  st.text = S => val(_text) + (S.f.eWall || S.f.eMen ? `\n\n${S.f.eWall ? `村口的木栅${S.f.eWall >= 2 ? '围满了一圈' : '立了半圈'}。` : ''}${S.f.eMen ? `佃户里练过连枷的有${cnNum(S.f.eMen)}队。` : ''}` : '');
  st.opts[0].dc = S => (S.f.eMen >= 2 ? 1 : 0) + (S.f.eWall >= 1 ? 1 : 0) + (S.f.eMen >= 4 ? 1 : 0);
  st.opts.unshift({t:'关上木栅，让民兵上去', if: S => S.f.eWall >= 2 && S.f.eMen >= 3, fx:{set:{homeRaid:'held'}, rep:{home:15}, honor:5}, app:{katka:8, zden:6, ilona:5},
    r:'木栅关上了。佃户们站在木栅后面，连枷举起来，一排，整整齐齐的，像塔博尔的车阵。\n\n那些兵在溪对岸停下了，看了很久。领头的人骂了一句什么，调转马头走了。一枪一箭都没有放。\n\n你从木栅上下来的时候，老伊日在下面等你。<q>老爷要是看见，</q>他说，然后就说不下去了。'});
})();
// ===== 一年里的日子：复活节、柳条节、圣乔治节、烧女巫夜、五旬节、圣约翰夜、胡斯忌日 =====
const FEAST = {easter:dayOf('四月', 7), george:dayOf('四月', 23), witches:dayOf('四月', 30), whitsun:dayOf('五月', 26), stjohn:dayOf('六月', 23), hus:dayOf('七月', 6)};
const loverHere = () => S.lovers.find(id => inParty(id) && alive(id));
const bestComp = () => S.party.slice().sort((a, b) => app(b) - app(a))[0];

// ---------- 复活节 ----------
const EASTER_AT = {
  liuxi: S => `复活节的早上，柳溪的教堂里挤满了人。扬神父在祭坛上摆着饼，也摆着酒杯。${S.f.olenkaHome ? '奥莲卡站在母亲身边，头发还是短的。' : '母亲身边空着一个位置。她没有让任何人站过去。'}

扬神父举起杯子的时候，手在抖。三年了，他每一次举起它，手都在抖。`,
  tabor: S => '塔博尔没有教堂。复活节的弥撒在广场上做，神父没有穿祭衣，穿着和农民一样的灰袍子。祭坛是一辆大车，车板上摆着几十只木头杯子。\n\n杰士卡跪在最前面，跪在泥里。他领完了圣杯，站起来，用袖子擦了擦嘴，像喝完了一碗汤。',
  prague: S => '复活节的早上，布拉格所有的钟都响了，响得乱七八糟，因为每一座教堂都在和别的教堂赌气。泰恩教堂里，神父在给每一个人递杯子；圣维特大教堂里，只递饼。\n\n街上的人领完了圣餐，互相看一眼，就知道对方是从哪座教堂出来的。',
  rose: S => '玫瑰堡的小教堂里，弥撒用拉丁文做，香炉里的烟很浓。少年领主跪在最前面，监护人跪在他身后半步。\n\n神父只递饼。酒杯在祭坛上，只有他自己喝。',
  forest: S => '林间空地上没有神父。人们围成一圈坐在草地上，一块黑面包从一只手传到另一只手，一罐苹果酒也是。彼得说：<q>基督复活了。在每一张嘴里。</q>\n\n有人哭了，有人笑了，有人在草地上睡着了。',
  strak: S => '骑士团的小教堂里，老修士们穿着黑袍跪成两排，唱得很慢，嗓子都哑了。胡贝特修士唱错了一个音，没有人回头看他。\n\n弥撒做完，他们去医院里给每一个病人送了一个染红的鸡蛋，不问病人领的是饼还是酒。',
  usti: S => '奥斯蒂的教堂烧了。复活节的早上，从山上下来的几个人，在灰地里用石头垒了一个祭坛，用一只捡来的破碗当圣杯。\n\n没有神父。一个老人念了他记得的那几句。念错了好几处，可是没有人纠正他。',
  def: S => '复活节的早上，你在路边的一座小礼拜堂里。乡下神父的祭衣破了一个洞，他用手捂着。他问来领圣餐的人：<q>一样，还是两样？</q>问得很轻，像在问要不要加盐。'
};
def({
  id:'f_easter', mode:'auto', d:[FEAST.easter, FEAST.easter + 1], ph:[0, 1], prio:35, t:'复活节', la:'Pascha', tag:'四月七日',
  text: S => val(EASTER_AT[S.region] || EASTER_AT.def),
  chime:{katka:'卡佳把袖子卷了起来，像是要去干活。<q>今天谁也不许只领一样，</q>她说。', zden:'齐德涅克低着头，手里捏着念珠。他没有看你。', matej:'<q>康斯坦茨的神父们说，基督完整地存在于饼里，</q>马捷伊说，<q>那他为什么还要说“你们都喝这个”？</q>', petr:'<q>复活节，</q>彼得说，<q>是上帝说：我死了，可是没关系。</q>'},
  opts:[
    {t:'领饼，也领杯', fx:{mind:2, lens:1, rep:{tabor:2, prague:2, crown:-1}}, app:{katka:5, matej:5, petr:3, zden:-3},
      r:'酒是酸的，乡下的酒都是酸的。可是杯子从一只手传到另一只手，你接过来的时候，杯沿上还有前一个人嘴唇的温度。\n\n你忽然明白了，他们要的不是酒。他们要的是这一只杯子，从神父的手里，传到佃户的手里。'},
    {t:'只领饼', fx:{mind:1, rep:{rose:2, crown:2, tabor:-1}}, app:{zden:6, katka:-3, matej:-2},
      r:'饼很薄，放在舌头上就化了。你闭上眼睛。不管这个春天的人们为了杯子吵成什么样，饼还是那块饼，和你小时候领的一样。'},
    {t:'站在门口，不进去', fx:{lens:-1}, app:{ilona:4, eliska:2},
      r:'你站在门口，看着里面的人一个一个走上去，又一个一个走下来。他们的脸都差不多，领一样的和领两样的，下来的时候都是一样的脸。\n\n你想，上帝要是也站在门口看，大概也分不出来。'}
  ]
});
// 复活节第二天：柳条节。男孩们拿柳条去轻轻抽女孩的腿，祝她们这一年健康；女孩们回赠染了色的鸡蛋
def({
  id:'f_pomlazka', mode:'here', at:'village', d:[FEAST.easter + 1, FEAST.easter + 3], prio:20, t:'柳条节', la:'Pomlázka', tag:'柳溪 · 复活节第二天',
  text: S => `复活节第二天的早上，柳溪的男孩们一人拿着一根柳条编的鞭子，满村子追女孩，追到了就在她们腿上轻轻抽一下，说：<q>祝你这一年又健康又新鲜！</q>女孩们尖叫着跑，跑得不太快，然后从围裙里掏出染成红色的鸡蛋给他们。

老人说，柳条是春天最早发芽的东西，抽一下，春天就进了人的身体。柳溪的柳条最好，别的村子的孩子都来这里折。

一个小男孩跑过来，把一根编好的柳条鞭子塞到你手里。<q>老爷也要！</q>他喊。`,
  opts:[
    {t: S => loverHere() ? `去找${nm(loverHere())}` : '去给母亲送一下', fx:{mind:2}, run: S => { const l = loverHere(); return l ? applyFx({app:{[l]:6}}) : applyFx({t:{anna:6}}); },
      r: S => { const l = loverHere(); return l ? ({katka:'卡佳看见你拿着柳条走过来，抱着胳膊站着不动。你抽了一下，很轻。她低头看了看自己的腿，又看了看你，<q>就这样？</q>她说，一把抢过柳条，追着你满村子跑。', zden:'齐德涅克说这是异教的风俗。你抽了他一下。他愣了很久，然后从怀里掏出一个鸡蛋，涂得歪歪扭扭的，是他昨晚偷偷染的。', petr:'彼得笑着让你抽，然后接过柳条，在你手背上也抽了一下。<q>春天进去了吗？</q>他问。你说进去了。<q>那就好，</q>他说，<q>我刚才那一下，放进去的不止春天。</q>', ilona:'伊洛娜看了一会儿孩子们，说：<q>我们那里，是男人抽马。</q>你抽了她一下。她跳上马，绕着村子跑了一圈，回来的时候，手里拿着一个从哪家女孩那里抢来的红鸡蛋，塞进了你嘴里。', matej:'马捷伊说奥维德写过类似的风俗，罗马人二月里用羊皮抽女人。他还没说完，你就抽了他一下。他停下来，清了清嗓子：<q>论证有效。</q>', eliska:'爱丽什卡伸出腿，让你抽，抽完了，从篮子里掏出一个鸡蛋：<q>一个鸡蛋一个铜板，</q>她说，然后又掏出一个，<q>这个不要钱。</q>'})[l] : '母亲在院子里，看见你拿着柳条，笑弯了腰。你在她的裙子上轻轻抽了一下。<q>你父亲每年都来这一下，</q>她说，<q>抽完了就要鸡蛋。</q>她从围裙里掏出了一个红鸡蛋，好像早就准备好了。'; }},
    {t:'教孩子们编八股的柳条鞭', fx:{rep:{home:3}, mind:1}, r:'你小时候编得最好，八股的，编出来像一条小蛇。孩子们围着你看，看得嘴都张开了。\n\n那天中午，柳溪的女孩们被抽得最多，抽得最响，抽完了都在笑。'}
  ]
});

// ---------- 圣乔治节：皮塞克的比武 ----------
def({
  id:'f_george_news', mode:'auto', d:[FEAST.george - 7, FEAST.george - 2], prio:12, if: S => S.region !== 'pisek', t:'圣乔治节', la:'Sanctus Georgius', tag:'消息',
  text:'一个过路的小贩说，皮塞克的市民今年还是要在圣乔治节办比武，就在石桥下的河滩上。仗归仗，节归节。\n\n头奖是一匹快马，皮塞克的马商捐的。小贩说，那匹马跑起来，四个蹄子都不沾地。',
  opts:[{t:'记下日子：四月二十三日', fx:{set:{georgeKnown:1}}, r:'圣乔治是骑士的圣人。他杀了一条龙。小贩说，皮塞克的龙比较小，是一条从河里捞上来的大鲶鱼，比武完了，大家一起吃。'}]
});
def({
  id:'f_george', at:'bridge', d:[FEAST.george - 1, FEAST.george + 1], ph:[0, 1], prio:30, t:'河滩上的比武', la:'Hastiludium', hint:'圣乔治节，皮塞克的比武',
  text: S => `石桥下的河滩上围了一圈人，有市民，有农民，有领圣杯的，也有不领的。一面圣乔治的红十字旗插在中间，旗子下面拴着那匹快马，黑色的，四蹄雪白。

报名的骑士有七个。司仪说，用钝剑，打到一方认输或者倒地为止。不许打马，不许打脸，不许在对方的盾牌上吐口水。

${loverHere() ? `${nm(loverHere())}挤到你身边，把一样东西系在你的胳膊上。${({katka:'是一根车阵帆布上撕下来的灰布条。', zden:'是他的一只手套。', petr:'是一根草编的绳子，编得很好看。', ilona:'是她辫子上的一只小铜铃。', matej:'是一条写着一句拉丁文的羊皮纸条。他不告诉你写的是什么。', eliska:'是一条丝帕，熏过香，闻起来像她的酿酒坊。'})[loverHere()]}` : ''}`,
  opts:[
    {t:'报名', r:'你的第一个对手是皮塞克粮商的儿子，二十岁，盔甲是新买的，亮得晃眼。他母亲在人群里喊他的名字，喊得他脸都红了。', duel:'d_george1'},
    {t:'只是看看', fx:{mind:2}, r:'你在人群里看了一下午。最后赢的是一个从玫瑰堡来的骑士，他把快马牵走的时候，皮塞克的马商哭了。\n\n那条鲶鱼很大，烤得很香。'}
  ]
});
const GEORGE_FINAL = () => alive('bohus') && !S.f.bohusSpared && S.n.bohus && S.n.bohus.met !== false ? 'bohus' : 'captain';
DUELS.d_george1 = {name:'粮商的儿子', look:() => ({skin:'#f3dcc4', hair:'wavy', hairColor:'#a8552e', eye:'#4f6f9a', outfit:'plate', outfitColor:'#d9a441', build:'slim', acc:['freckles']}), hp:2, my:3, hurt:0, yield:true,
  w:{heavy:3, thrust:1, feint:1, guard:1, rush:3}, intro:'他冲上来的样子像一头刚学会顶人的小牛。',
  win:{fx:{honor:2}, r:'他躺在沙滩上，看着天，过了一会儿笑了起来。<q>我娘让我来的，</q>他说，<q>她说穿着这身甲不比一场，钱就白花了。</q>你把他拉起来，他母亲在人群里松了一口气。', next:'f_george2'},
  lose:{fx:{honor:-2}, r:'你在沙滩上滑了一跤，他的钝剑敲在你的头盔上，当的一声。人群笑了。他母亲笑得最响。'}};
DUELS.d_george2 = {name:'决赛的对手', look:() => GEORGE_FINAL() === 'bohus' ? NPCS.bohus.look : ({skin:'#d6aa82', hair:'crop', hairColor:'#6a6a72', beard:'short', eye:'#3a3a3a', outfit:'mail', outfitColor:'#3a3328', build:'broad', acc:['scar']}),
  hp:3, my:3, hurt:0, yield:true, w:{heavy:3, thrust:2, feint:2, guard:2, rush:2},
  intro: () => GEORGE_FINAL() === 'bohus' ? '博胡斯拉夫戴着他的黑盔，盔上的羽毛有一尺长。<q>柳溪的，</q>他隔着面甲说，<q>你父亲在比武场上从来没赢过我。</q>' : '城防队长是个老兵，左脸上一道疤。他不说话，只是把钝剑在手里转了一圈。',
  win:{fx: () => ({honor:8, rep:{home:3}, gear:S.gear.horse === 'courser' ? undefined : {horse:'courser'}, money:S.gear.horse === 'courser' ? 80 : 0, set:{georgeWon:1}, t:GEORGE_FINAL() === 'bohus' ? {bohus:-10} : {}}),
    r: () => `${GEORGE_FINAL() === 'bohus' ? '博胡斯拉夫倒在河滩上，盔上的羽毛浸在水里。他躺了很久，才爬起来，没有看你，走了。人群里，赫鲁比逃过来的几户佃户在拼命鼓掌。' : '队长单膝跪地，把钝剑横放在地上。<q>好手，</q>他说，<q>苏多梅日要是有你这样的人，就不用女人们去铺头巾了。</q>'}\n\n司仪把快马的缰绳交给你。${S.gear.horse === 'courser' ? '你已经有一匹快马了，你把它卖回给了马商，马商高兴得又哭了。' : '那匹马低头闻了闻你的手，打了个响鼻。'}${loverHere() ? `\n\n${nm(loverHere())}在人群里，比谁都喊得响。` : ''}`},
  lose:{fx:{honor:1}, r: () => GEORGE_FINAL() === 'bohus' ? '博胡斯拉夫的钝剑砸在你的盾牌上，砸得你半边身子都麻了。你倒在沙滩上，他用剑尖点了点你的胸口，大笑着去牵那匹马了。\n\n<q>你父亲也是这么倒的，</q>他说，<q>一模一样。</q>' : '队长的钝剑在你的手腕上敲了一下，你的剑就飞了出去。他把你扶起来，<q>第二个，</q>他说，<q>已经不错了。</q>'}};
def({
  id:'f_george2', mode:'chain', t:'决赛', la:'Certamen', tag:'圣乔治节',
  text: () => `你赢了三场。太阳偏西的时候，河滩上只剩下两个人。

${GEORGE_FINAL() === 'bohus' ? '另一个是博胡斯拉夫。他骑着他的大黑马走进场子，人群安静了一下。赫鲁比的老佃户们站在最后面，没有出声。' : '另一个是皮塞克的城防队长，一个不说话的老兵。他赢的每一场都很快，快得人群来不及喊。'}`,
  opts:[{t:'上场', run: S => { DUELS.d_george2.name = GEORGE_FINAL() === 'bohus' ? '博胡斯拉夫' : '皮塞克的城防队长'; }, r:'司仪敲了一下锣。', duel:'d_george2'}]
});

// ---------- 四月三十日：烧女巫的夜 ----------
def({
  id:'f_witches', mode:'auto', d:[FEAST.witches, FEAST.witches], ph:[2], prio:30, t:'烧女巫的夜', la:'Nox strigum', tag:'四月三十日 · 夜',
  text: S => `四月的最后一夜，${S.region === 'liuxi' ? '柳溪' : S.region === 'tabor' ? '塔博尔' : REGION[S.region].n}周围所有的山头上都点起了火。

老人们说，今夜女巫们要骑着扫帚，飞到很远的山上去开会。人们在火上烧稻草扎的女巫，烧完了，年轻人一个一个地从火上跳过去，跳过去的人，这一年不生病。母亲们把牛关进牛棚，在门槛上撒盐，免得女巫来偷奶。

${S.region === 'tabor' ? '塔博尔的传道人说这是异教的风俗，要禁。没有人听。传道人自己站在火边，看了一会儿，也跳了。' : S.region === 'forest' ? '林子里的人不烧女巫。他们说，女巫是会治病的老太太，烧她们的人才该烧。他们围着火跳舞，跳到天亮。' : ''}`,
  chime:{katka:'卡佳已经在往后退了，要助跑。', petr:'<q>人们烧稻草人，</q>彼得说，<q>是因为上一次，烧的不是稻草。</q>', ilona:'伊洛娜看着火，说：<q>我们那里也跳火。跳过去的人，祖先就认得你了。</q>', zden:'齐德涅克在胸前画了一个十字，又画了一个。'},
  opts:[
    {t: S => S.party.length ? `和${nm(bestComp())}一起从火上跳过去` : '从火上跳过去', chk:'nerve', fx: S => ({mind:2, app:S.party.length ? {[bestComp()]:5} : {}}), ffx: S => ({hurt:1, app:S.party.length ? {[bestComp()]:3} : {}}),
      r: S => S.party.length ? `你们手拉着手，助跑，起跳。火舌在脚底下舔了一下，热气冲上来，冲进了袖子里。落地的时候，${nm(bestComp())}没站稳，把你也拽倒了，两个人滚在草地上，笑得爬不起来。\n\n周围的人都在鼓掌。有一个老太太说：<q>手拉手跳的，今年要成亲。</q>` : '你助跑，起跳。火舌在脚底下舔了一下。落地的时候，围观的孩子们一齐欢呼。你忽然觉得，自己还没有老。',
      f:'你跳得太早了，一只脚踩进了火堆的边上。靴子着了，你在草地上打滚，周围的人一边笑一边往你身上泼水。'},
    {t:'帮母亲们守牛棚', fx:{rep:{home:2}, lens:1}, r: S => S.lens > 0 ? '半夜，你坐在牛棚门口，看着月亮。一个影子从月亮前面飞过去，很大，翅膀很长，往北边去了。\n\n第二天早上，母亲说牛奶比平时多。她说，是你守得好。' : '半夜，你坐在牛棚门口，看着月亮。一只苍鹭从月亮前面飞过去，翅膀很长，往溪边去了。\n\n第二天早上，母亲说牛奶比平时多。你想，是因为牛睡了个好觉。'},
    {t:'坐在远处看着', fx:{mind:1}, r:'你坐在远处的草坡上，看着一座一座山头上的火。南边的，东边的，北边的。领圣杯的和不领的，都在烧同一个稻草人，跳同一堆火。\n\n今夜，整个波希米亚都在做同一件事。你想，这样的夜，以后还会有吗？'}
  ]
});

// ---------- 五旬节：柳溪的婚礼 ----------
def({
  id:'f_wedding', mode:'here', at:'village', d:[FEAST.whitsun - 1, FEAST.whitsun + 3], prio:24, t:'五旬节的婚礼', la:'Nuptiae', tag:'柳溪 · 五旬节',
  text: S => `五旬节，柳溪有人成亲。是管家老伊日的孙女玛丽扬卡，嫁给铁匠的大儿子。${S.f.vavraDead ? '铁匠家的二儿子死在了布杰约维采，婚礼原本要推迟。铁匠说，不推，日子要往前过。' : S.f.vavraHome === 'liuxi' ? '新郎的弟弟瓦夫拉站在旁边，手腕上还有绳子的印子，笑得比新郎还开心。' : ''}

打谷场上摆了长桌，${S.f.eGrain !== undefined && S.f.eGrain < 10 ? '桌上的东西不多，每家拿了一样来：一碗豆子，一块奶酪，一罐酸菜。' : '桌上有烤猪，有面包，有一大桶酸啤酒。'}扬神父主持了婚礼，新郎新娘领了圣杯。然后风笛吹起来了。

按照老规矩，柳溪的主人要跳第一支舞。`,
  opts:[
    {t: S => loverHere() ? `和${nm(loverHere())}跳第一支舞` : '和新娘跳第一支舞', fx: S => ({mind:3, rep:{home:4}, app:loverHere() ? {[loverHere()]:8} : {}}),
      r: S => loverHere() ? `你拉着${nm(loverHere())}走到打谷场中间。全村的人都安静了一下，然后有人吹了一声口哨，接着所有人都开始鼓掌。\n\n${({katka:'卡佳跳舞像打连枷，又快又狠，踩了你三次脚。第四次，她故意的。', zden:'齐德涅克跳得很规矩，是宫里的跳法，一步一步。跳到第二圈，他忘了规矩，笑了出来。', petr:'彼得跳舞的时候闭着眼睛，像在祷告。佃户的女人们看得脸都红了。', ilona:'伊洛娜不会跳这种舞。她跳的是草原上的，转圈，拍手，跺脚。跳到后来，全村的年轻人都跟着她转圈。', matej:'马捷伊说他从来没跳过舞。他说的是实话。可是他学得很快，第二支舞的时候，他已经在纠正你的步子了。', eliska:'爱丽什卡跳舞的时候一直在你耳边说话，说新娘的嫁妆值多少钱，说新郎家的酒兑了多少水。说着说着，她不说了，把头靠在了你肩上。'})[loverHere()]}\n\n母亲坐在长桌的一头，看着你们，一直在笑。` : '新娘玛丽扬卡十六岁，脸红得像复活节的鸡蛋。你领着她转了三圈，她一直低着头，踩了你两次脚。跳完了，她小声说：<q>谢谢老爷。</q>然后跑回了新郎身边。\n\n老伊日在长桌那头，用袖子擦眼睛。',
    },
    {t:'送一份贺礼：二十个格罗申', cost:20, fx:{rep:{home:6}, mind:2}, r:'老伊日接过钱袋，手在抖。<q>老爷在的时候，</q>他说，<q>给我女儿成亲，也送了二十个。</q>他说的是你父亲。他好像一直没有习惯，现在的老爷是你。'},
    {t:'坐在长桌边，喝酒，看着', fx:{mind:2}, run: S => applyFx({app:Object.fromEntries(S.party.map(id => [id, 3]))}),
      r: S => `你坐在长桌边，喝着酸啤酒。${S.party.length ? S.party.map(nm).join('和') + '都被拉去跳舞了。' : ''}风笛吹了一支又一支，月亮升起来了，孩子们在桌子底下睡着了。\n\n你想，今年夏天，波希米亚到处都在打仗。可是今天晚上，柳溪有人成亲。`}
  ]
});

// ---------- 圣约翰夜 ----------
def({
  id:'f_stjohn', mode:'auto', d:[FEAST.stjohn, FEAST.stjohn], ph:[2], prio:32, t:'圣约翰夜', la:'Vigilia Sancti Iohannis', tag:'六月二十三日 · 夜',
  text: S => `一年里最短的一夜。

人们在河边点起了火，女孩们把花环放进水里，看它漂向谁的家。老人们在采草药：圣约翰草，艾蒿，车前草，今夜采的，治病最灵。

${S.region === 'forest' ? '林子里的人说，今夜半夜，蕨丛里会开一朵花，金色的，只开一眨眼。看见它的人，能听懂鸟说话，能找到埋在地下的金子，能看见自己的将来。' : '老人们说，今夜半夜，林子里的蕨丛会开一朵花，金色的，只开一眨眼。看见它的人，能看见自己的将来。'}`,
  chime:{petr:'<q>我找过七次，</q>彼得说，<q>没有找到。可是每一次都很高兴。</q>', matej:'<q>蕨类不开花，</q>马捷伊说，<q>它们用孢子繁殖。亚里士多德……</q>他看了看你的脸，<q>好吧，我们去找。</q>', katka:'<q>我娘说，看见蕨花的人，一辈子不愁吃，</q>卡佳说，<q>我娘一辈子都在愁吃。</q>', ilona:'伊洛娜说她们那里没有蕨花，有狼。狼在今夜会说话。', zden:'<q>施洗约翰的生日，</q>齐德涅克说，<q>不是用来找花的。</q>他说完，自己先往林子里看了一眼。', eliska:'<q>能找到地下的金子？</q>爱丽什卡说，<q>那还等什么。</q>'},
  opts:[

const _gossip2 = gossipLine;
gossipLine = function () {
  const d = S.day, pool = [];
  if (d >= FEAST.george - 10 && d < FEAST.george) pool.push('人们在说皮塞克的圣乔治节比武。头奖是一匹快马，黑色的，四蹄雪白。');
  if (d >= FEAST.stjohn - 10 && d < FEAST.stjohn) pool.push('女孩们在编花环，说圣约翰夜要放到河里去。老人们在说蕨花。');
  if (d >= FEAST.hus - 10 && d < FEAST.hus) pool.push('人们说，七月六日那天，要在每一座山头上点火。为了康斯坦茨的那堆火。');
  if (S.f.ustiBurned) pool.push('有人说起奥斯蒂，说烧城的那天夜里，卢日尼采河是红的。');
  if (S.f.vavraDead) pool.push('有人压低声音说起布杰约维采的大广场。说一个柳溪人在火里唱歌。');
  if (S.f.georgeWon) pool.push('有人在说皮塞克的比武，说柳溪的骑士赢了那匹快马。说的人看见你，脸红了。');
  if (S.f.roseBetrayed) pool.push('有人说，玫瑰堡的监护人最近夜里睡不着，他的信使一趟一趟地往莱特纳山上跑。');
  if (S.f.budejWanted) pool.push('有人说，布杰约维采的城门上贴着一张告示，画着一个柳树盾牌。说的人看了看你的盾牌，不说了。');
  return pool.length && Math.random() < .5 ? pick(pool) : _gossip2();
};

const pairKey = (a, b) => 'pair_' + [a, b].sort().join('_');
const pairOf = (a, b) => S.f[pairKey(a, b)];
function pairDef(o) {
  const [a, b] = o.who, k = pairKey(a, b), cond = o.if;
  def(Object.assign({mode:'camp', party:[a, b], prio:23}, o, {
    if: S => S.day - (S.f.lastPair || -9) >= 3 && (!cond || cond(S)),
    opts: o.opts.map(op => Object.assign({}, op, {run: (S, tier) => { S.f.lastPair = S.day; const v = typeof op.pair === 'function' ? op.pair(S, tier) : op.pair; if (v) S.f[k] = v; return op.run ? op.run(S, tier) : undefined; }}))
  }));
}

    {t:'<q>那你往里放过钱吗，爱丽什卡？</q>', chk:'grace', pair: (S, t) => t === 'bad' ? 'cold' : 'curious', app:{katka:3, eliska:2},
      r:'爱丽什卡愣了一下。卡佳也愣了一下。\n\n<q>放过，</q>爱丽什卡终于说，<q>去年冬天，新城的传道人在广场上放了一只木桶。我放了一袋。</q>她看着火，<q>我记了账的。记在一个叫“不知道”的格子里。</q>',
      f:'<q>我的钱都放在该放的地方，</q>爱丽什卡说，<q>比如你的酒杯里。</q>她给你倒满了。卡佳哼了一声。'}
  ]});
pairDef({id:'p_ek2', who:['eliska', 'katka'], if: S => pairOf('eliska', 'katka') && S.f.act >= 2 && S.f.v_tabor, t:'车轮', la:'Rotae',
  text:'卡佳拿着一张收据冲到火边，收据上盖着新城一个车匠铺的印。\n\n<q>塔博尔车阵上个月多了二十个新车轮，</q>她说，<q>长老们说是有人捐的，不留名字。我去车匠铺问了。</q>她把收据拍在爱丽什卡面前，<q>付钱的人，在酿酒坊对面住。</q>\n\n爱丽什卡看着那张收据，看了很久。',
  opts:[
    {t:'<q>让她自己说吧。</q>', pair:'friends', app:{katka:3, eliska:3},
      r:'<q>好生意需要一个明年还存在的波希米亚，</q>爱丽什卡说，<q>车阵要是散了，十字军进了布拉格，新城的酿酒坊第一个被烧。我算过的。</q>\n\n卡佳看着她。<q>你算过的。</q>\n\n<q>我算过的。</q>\n\n卡佳把收据折起来，塞回了怀里。她什么也没说，坐在了爱丽什卡旁边。她们俩看着火，看了一晚上，偶尔为一根柴该不该添吵两句。'},
    {t:'<q>卡佳，这是礼物。别问了。</q>', pair:'truce', app:{eliska:5, katka:-2},
      r:'卡佳咬着嘴唇，把收据扔进了火里。<q>我不要礼物，</q>她说，<q>我要她说出来。</q>\n\n爱丽什卡没有说。可是第二天早上，卡佳的车上多了一桶酿酒坊的啤酒，桶上用炭写着：<i>不记账</i>。'}
  ]});

// ---------- 伊洛娜和齐德涅克 ----------
pairDef({id:'p_iz1', who:['ilona', 'zden'], if: S => app('ilona') >= 10 && app('zden') >= 10 && S.f.campUp, t:'两个十字军', la:'Duo cruce signati',
  text:'今天路过的那个村子被十字军烧了。教堂也烧了，是一座天主教的教堂。\n\n齐德涅克一晚上没有说话。伊洛娜在擦她的弓，擦完了，说：<q>你在想，是谁烧的。</q>\n\n<q>是我们的人，</q>齐德涅克说，<q>是举着十字架来的人。</q>\n\n<q>我是为了钱和马来的，</q>伊洛娜说，<q>你是为了上帝来的。你说，我们俩谁烧的那个村子？</q>',
  opts:[
    {t:'<q>都不是。是那些不问为什么来的人。</q>', pair:'friends', fx:{mind:1}, app:{zden:5, ilona:4},
      r:'齐德涅克看着伊洛娜，伊洛娜看着火。过了很久，齐德涅克从脖子上摘下他的念珠，递给她。<q>我不用它了，</q>他说，<q>今天晚上不用。</q>\n\n伊洛娜接过来，看了看，挂在了她的弓上，和那些铜铃挂在一起。'},
    {t:'<q>伊洛娜，你这话太狠了。</q>', pair:'cold', app:{zden:4, ilona:-5}, r:'<q>狠的是那把火，</q>伊洛娜说，<q>不是我的话。</q>她拿着弓去了马那边，一夜没有回来。'},
    {t:'<q>齐德涅克，她说得对。</q>', pair:'cold', app:{ilona:5, zden:-6}, r:'齐德涅克站起来，走进了黑暗里。你听见他在不远的地方念经，念得很急，像在跑。'}
  ]});

// ---------- 马捷伊和爱丽什卡 ----------
pairDef({id:'p_me1', who:['matej', 'eliska'], if: S => app('matej') >= 10 && app('eliska') >= 10, t:'十四个格罗申', la:'Debitum',
  text:'爱丽什卡给每个人倒酒，倒到马捷伊，停了一下。\n\n<q>先生，</q>她说，<q>你还欠我十四个格罗申。一四〇九年的，那年你还是个穷学生，喝了我一冬天的酒，说等你当了硕士就还。</q>\n\n马捷伊的脸红了。<q>我当了硕士以后，</q>他说，<q>你说过不用还了。</q>\n\n<q>那是因为第二年，大主教的人来烧威克里夫的书，</q>爱丽什卡说，<q>你抱着一捆书跑进我的地窖。我把它们藏在了啤酒桶后面。我觉得那一捆书抵得上十四个格罗申。</q>她给他倒满了，<q>可是今天我想要回来。</q>',
  opts:[
    {t:'替马捷伊还：十四个格罗申', cost:14, pair:'old', fx:{mind:2}, app:{matej:6, eliska:4},
      r:'爱丽什卡把钱一个一个数了，数得很慢，数完了，又一个一个推回给马捷伊。<q>利息，</q>她说，<q>十一年的利息，正好这么多。</q>\n\n马捷伊看着那堆钱，不知道该拿还是不该拿。最后，他用它们买了第二天一整天的酒，请所有人喝。'},
    {t:'<q>那捆书后来呢？</q>', pair:'old', fx:{xp:{lore:1}}, app:{matej:3, eliska:3},
      r:'<q>还在,</q>马捷伊说，看着爱丽什卡，<q>在她的地窖里。十一年了，我一直没有去拿。</q>\n\n<q>为什么？</q>\n\n<q>因为那是全布拉格最安全的地方，</q>他说，<q>比大学安全，比教堂安全。一个酿酒寡妇的地窖。谁会想到呢。</q>\n\n爱丽什卡笑了：<q>我想到了。我每年都把它们搬出来晒一次。</q>'}
  ]});

// ---------- 彼得和伊洛娜 ----------
pairDef({id:'p_pi1', who:['petr', 'ilona'], if: S => app('petr') >= 10 && app('ilona') >= 10, t:'长生天', la:'Caelum',
  text:'伊洛娜躺在草地上看星星。彼得躺在她旁边。\n\n<q>你们的神住在哪里？</q>彼得问。\n\n<q>住在天上，</q>伊洛娜说，<q>整个天都是他。我奶奶叫他长生天。他不说话，不要祷告，只要你别在河里撒尿。</q>\n\n彼得想了一会儿。<q>他骑马吗？</q>\n\n<q>他就是马跑起来的时候，头顶上的那一块。</q>',
  opts:[
    {t:'也躺下来看', pair:'friends', fx:{mind:3, lens:1}, app:{petr:4, ilona:4},
      r:'你躺在他们俩中间。天很大，星星很多，草很软。\n\n<q>我觉得，</q>彼得过了很久说，<q>我们说的是同一个。</q>\n\n<q>不是，</q>伊洛娜说，<q>你的那个要你脱衣服，我的那个只要你别在河里撒尿。</q>\n\n你们三个笑得把旁边的马都吵醒了。'},
    {t:'<q>小心，彼得会让你脱衣服的。</q>', pair:'friends', app:{ilona:3, petr:1}, r:'伊洛娜坐起来，看看彼得，又看看你。<q>我们那里，</q>她说，<q>夏天本来就不穿。</q>彼得笑得很高兴，像找到了一个失散的亲戚。'}
  ]});

// ---------- 卡佳和彼得 ----------
pairDef({id:'p_kp1', who:['katka', 'petr'], if: S => app('katka') >= 10 && app('petr') >= 10, t:'举手', la:'Suffragium',
  text:'卡佳一整天都没有和彼得说话。晚上，她终于坐到了他对面。\n\n<q>长老们把你赶下山的那天，</q>她说，<q>广场上举了手。我也举了。</q>\n\n彼得点点头。<q>我看见了。</q>\n\n<q>你看见了，还跟我们走了这么多天，一个字都没说？</q>\n\n<q>说什么呢，</q>彼得说，<q>你举手的时候在哭。我也看见了。</q>',
  opts:[
    {t:'<q>卡佳，跟他说你想说的。</q>', pair:'forgiven', fx:{mind:1}, app:{katka:4, petr:4},
      r:'卡佳看着火，过了很久，说：<q>我怕。他们说你是魔鬼的人，我怕他们说得对，又怕他们说得不对。</q>\n\n彼得伸出手，碰了碰她的手背。<q>我也怕，</q>他说，<q>所以我走了。</q>\n\n那一夜，卡佳教彼得唱车阵里的歌，唱得很难听。彼得笑得滚进了草里。'},
    {t:'<q>那都是过去的事了。</q>', pair:'cold', app:{petr:2, katka:-2}, r:'卡佳站起来走了。彼得看着她的背影，轻轻地说：<q>对她来说，还没过去。</q>'}
  ]});

// ---------- 齐德涅克和马捷伊：窗口下面的人 ----------
pairDef({id:'p_zm1', who:['zden', 'matej'], prio:26, if: S => app('zden') >= 15 && app('matej') >= 15 && S.f.act >= 2, t:'窗口下面', la:'Sub fenestra',
  text: S => `马捷伊一晚上都在看齐德涅克。最后，他放下了手里的书。

<q>齐德涅克大人，</q>他说，<q>去年七月三十号，我在新市政厅的楼下。我是跟着游行的人去的，我想看热闹。我看见了你哥哥。他是第三个被扔下来的，他落在了长矛上。</q>

<q>我没有推任何人，</q>马捷伊说，声音很平，<q>我也没有拦任何人。我站在那里，看着。我想你应该知道。</q>

齐德涅克的手放在了剑柄上。${S.f.zdenForgave ? '可是他想起了雪地圣母堂里的那扇窗，手又松开了。' : S.f.zdenAvenged ? '他已经为那扇窗做过一件事了。你看见他的手指一根一根地收紧。' : ''}`,
  opts:[
    {t:'站到他们中间', chk:'nerve', pair: (S, t) => t === 'bad' ? 'broken' : 'forgiven', fx:{honor:2}, ffx:{hurt:1}, app:{zden:3, matej:3},
      r:'你站到了他们中间，背对着马捷伊，面对着齐德涅克。你什么也没说。\n\n齐德涅克看着你，看了很久。然后他的手从剑柄上拿了下来。<q>你为什么要告诉我？</q>他问马捷伊。\n\n<q>因为我们会一起去维特科夫，</q>马捷伊说，<q>我不想在山上，背对着一个不知道这件事的人。</q>\n\n齐德涅克点点头，走开了。第二天早上，他把自己的水壶递给了马捷伊。',
      f:'你站到了他们中间。齐德涅克一把推开了你，推得你摔在了地上。他没有拔剑。他只是走了，走进黑暗里，那一夜没有回来。\n\n马捷伊坐在那里，一直到天亮。<q>我该说的，</q>他说，<q>说出来，就是这样。</q>'},
    {t:'<q>齐德涅克，你自己决定。</q>', pair: S => S.f.zdenForgave || app('zden') >= 40 ? 'forgiven' : 'broken', app:{zden:4},
      r: S => S.f.zdenForgave || app('zden') >= 40 ? '齐德涅克站了很久。然后他在胸前画了一个十字，对着马捷伊。<q>我哥哥死前在念主祷文，</q>他说，<q>念到“免我们的债”。他没念完。我替他念完。</q>\n\n马捷伊低下了头。' : '齐德涅克拔出了剑，又插了回去，插得很重。<q>我不想再看见你，</q>他说。他没有离队，可是从那天起，他和马捷伊之间，总是隔着你。'}
  ]});

const dateDef = (id, at, o) => def(Object.assign({at, party:[id], prio:17, who:[id], if: S => isLover(id) && (!o.cond || o.cond(S)), la:'Tecum'}, o));
dateDef('katka', 'wagons', {id:'d_katka', ph:[2], t:'车板上', hint:'和卡佳在车阵里过一夜',
  text:'夜里，车阵安静了。卡佳拉着你爬上一辆空车，躺在车板上，车板上还有白天晒的热气。\n\n<q>传道人说，末日的时候只有五座城不会毁灭，</q>她指着天上，<q>我给它们找了五颗星。那颗最亮的是比尔森，那颗红的是扎泰茨，那颗……</q>她说到第五颗，停住了。<q>第五颗是柳溪，</q>她说，<q>我刚改的。</q>',
  opts:[
    {t:'<q>那塔博尔呢？</q>', fx:{mind:3}, app:{katka:6}, r:'<q>塔博尔不用星星，</q>她说，<q>塔博尔就在这里，在这块车板上。</q>她翻过身来，压在你身上，头发垂下来，挡住了所有的星星。\n\n车板很硬。没有人在乎。'},
    {t:'什么也不说，握住她的手', fx:{mind:3}, app:{katka:5}, r:'她的手很粗，指节上全是连枷磨出来的茧。她让你握着，过了一会儿，把你的手拉过去，放在了她的心口上。\n\n<q>听见了吗？</q>她说，<q>跳得跟打谷子一样。都怪你。</q>'}
  ]});
dateDef('zden', 'cmdry', {id:'d_zden', t:'小教堂', hint:'齐德涅克想带你去骑士团的小教堂',
  text:'齐德涅克带你走进骑士团的小教堂。墙上画着骑士们在海上打仗，颜色都褪了。\n\n<q>我十六岁的时候，</q>他说，<q>想在这里发愿，当一个修士骑士。守贞，守贫，服从。胡贝特修士都答应收我了。后来我哥哥写信来，说家里需要一个骑士，不需要一个修士。</q>\n\n他在祭坛前跪下来。<q>我从来没后悔过，</q>他说，<q>直到今天。今天我想，幸好。</q>',
  opts:[
    {t:'在他身边跪下', fx:{mind:3, lens:1}, app:{zden:6}, r:'你们并排跪着，谁也没有祷告。蜡烛烧得很慢。\n\n过了很久，齐德涅克说：<q>守贞，守贫，服从。我一样也守不住了。</q>他转过头来看你，<q>第三样，也许还可以。服从你。</q>\n\n你吻了他。在圣约翰的祭坛前面。墙上那些褪了色的骑士，没有一个回头。'},
    {t:'<q>你现在后悔吗？</q>', fx:{mind:2}, app:{zden:4}, r:'<q>后悔，</q>他说，<q>后悔我十六岁的时候不知道，世界上还有比发愿更难守的东西。</q>他站起来，握住了你的手，<q>也更值得。</q>'}
  ]});
dateDef('petr', 'kozi', {id:'d_petr', ph:[2], t:'荒堡的夜', hint:'彼得想在科齐堡过一夜',
  text: S => `彼得在讲道的那块石头上坐下来，摸着石头上被人坐出来的那个凹。

<q>他在这里讲富人和穷人，</q>彼得说，<q>我在林子里讲身体。他们说我们讲的不是一回事。</q>他抬头看你，<q>我觉得是。他说，看见门口躺着的人。我说，看见你自己。都是看见。</q>

${S.f.linden === 'cut' ? '坡下那棵椴树已经砍了，只剩一个树桩。' : '坡下那棵椴树开花了，整个山坡都是甜的。'}`,
  opts:[
    {t:'<q>我看见你了。</q>', fx:{mind:3, lens:1}, app:{petr:6}, r:'彼得笑了，站起来，解开了他的袍子。月光照在他身上，照在他手掌上那两道旧伤上。\n\n<q>那就看吧，</q>他说，<q>看完了，轮到我。</q>\n\n那一夜，荒堡里没有讲道的声音。只有风，和别的。'},
    {t:'在石头上和他并排坐着，等天亮', fx:{mind:4}, app:{petr:4}, r:'你们没有说话。风从箭孔里穿过去，呜呜地响。彼得把头靠在你肩上，睡着了，睡得像一个孩子。\n\n天亮的时候，他醒过来，第一句话是：<q>我梦见他了。他没有说话，他在笑。</q>'}
  ]});
dateDef('ilona', 'ponds', {id:'d_ilona', ph:[0], t:'塘底', hint:'伊洛娜要带你骑马',
  text:'天刚亮，伊洛娜把你叫醒，什么也不说，把缰绳塞进你手里。\n\n放干了水的鱼塘，塘底的泥已经干透了，硬得像打谷场，平得像草原。她骑着她的灰马冲下了塘堤，回头喊：<q>追上我！</q>',
  opts:[
    {t:'追', chk:'nerve', fx:{mind:3, xp:{nerve:1}}, ffx:{mind:2, hurt:1}, app:{ilona:6},
      r:'你追了三个鱼塘，没有追上。她在第四个塘的中间停下来，等你，在马背上转过身，张开了弓，一箭射向天上。\n\n<q>在我们那里，</q>她说，<q>一个人追上另一个人，就是要她了。</q>\n\n<q>我没追上。</q>\n\n<q>我等你了，</q>她说，<q>一样的。</q>她从马背上跳过来，跳到你的马上，两个人一匹马，马很不高兴。',
      f:'第二个鱼塘的塘底有一块没干的泥。你的马陷进去了，你从马头上飞了出去，摔进了泥里。\n\n伊洛娜笑得从马上掉了下来。她跑过来，把你从泥里拉出来，然后自己也坐进了泥里，笑着吻你，吻得两个人满脸是泥。'},
    {t:'不追，看着她跑', fx:{mind:3}, app:{ilona:4}, r:'你站在塘堤上看着她。她跑了一圈，又一圈，辫子上的铜铃一路响。太阳从她身后升起来，她和马变成了一个黑色的影子，在金色的塘底上飞。\n\n她跑回来的时候，满脸是汗。<q>你为什么不追？</q>\n\n<q>追了就看不见了。</q>\n\n她看了你很久，然后下马，把额头抵在了你的额头上。'}
  ]});
dateDef('matej', 'carolinum', {id:'d_matej', ph:[2], t:'图书馆', hint:'马捷伊有学院图书馆的钥匙',
  text:'学院的图书馆，夜里没有人。书用链子拴在斜面的书桌上，一排一排，像在睡觉的狗。\n\n马捷伊点了一根蜡烛，找到了一本很旧的书，翻开。<q>奥维德，</q>他说，<q>《爱的艺术》。大主教烧书的那年，这一本差点也进了火。我把它藏在了亚里士多德的《物理学》后面。没有人会去翻《物理学》。</q>\n\n他念了一段，用拉丁文，念得很慢。念完了，他没有翻译。',
  opts:[
    {t:'<q>翻译一下。</q>', fx:{mind:3, xp:{lore:1}}, app:{matej:6}, r:'马捷伊看着你，蜡烛在他的眼睛里跳。\n\n<q>它说，</q>他说，<q>爱是一种战争，懒惰的人不配打。</q>他合上书，<q>我一直觉得这句话很蠢。</q>\n\n<q>现在呢？</q>\n\n<q>现在我觉得，</q>他吹灭了蜡烛，<q>奥维德是个天才。</q>'},
    {t:'吻他，打断他', fx:{mind:3}, app:{matej:5}, r:'他的话断在了一个动词的中间。拉丁文的动词总是放在句子最后，所以那个句子永远没有说完。\n\n后来，他说，那是他这辈子唯一一个没有说完的句子。他不打算把它说完。'}
  ]});
dateDef('eliska', 'bbrew', {id:'d_eliska', ph:[1, 2], t:'国王的啤酒', hint:'爱丽什卡想尝尝对手的酒',
  text:'爱丽什卡要了布杰约维采行会最好的一桶啤酒，倒了两杯，推一杯给你，自己的那一杯，她先闻，再看，再尝一小口，含在嘴里很久。\n\n然后她放下了杯子，脸色很难看。\n\n<q>比我的好，</q>她说，压低了声音，<q>好一点。就一点。是水，这里的水比伏尔塔瓦的软。</q>她抓住你的手腕，<q>你要是跟别人说，我就把你泡进我的第七只桶里。</q>',
  opts:[
    {t:'<q>你的比他们的好。</q>', vow:'lie', fx:{mind:3}, app:{eliska:4}, r:'<q>骗子，</q>她说，可是她笑了，笑得很开心，又要了一杯。\n\n那天晚上她喝了六杯，喝到后来，她站在行会楼上客房的窗口，对着整个布杰约维采喊：<q>你们的水好！你们的啤酒一般！</q>然后她转过身来，把你推倒在床上。<q>我也一般，</q>她说，<q>你要说实话。</q>'},
    {t:'<q>那就把这里的水运回新城。</q>', chk:'grace', fx:{mind:3, money:20}, ffx:{mind:2}, app:{eliska:6},
      r:'爱丽什卡愣住了，然后眼睛亮了，亮得像在算一笔很大的账。<q>六十里路，</q>她说，<q>一桶水运回去，比一桶啤酒还贵。可是……</q>她拉着你上楼，一边走一边算，算到房间门口，忽然停下来，<q>算了，明天再算。</q>\n\n第二天早上，她在你枕头底下塞了二十个格罗申。<q>咨询费，</q>她说。',
      f:'<q>傻瓜，</q>她说，<q>水运到新城就臭了。</q>可是她很高兴你替她想办法。那天晚上，她没有再提啤酒。'}
  ]});

// ---------- 同伴在新地方 ----------
def(
  {id:'c_zden_strak', mode:'here', at:'cmdry', party:['zden'], prio:15, who:['zden', 'hubert'], t:'胡贝特修士认得他', la:'Agnitio',
    text:'胡贝特修士看见齐德涅克，愣住了，然后大步走过来，抓住了他的两只胳膊。\n\n<q>小齐德涅克！</q>他说，<q>十六岁那年来发愿的那个！你哥哥一封信就把你叫走了，我还以为你会回来。</q>\n\n齐德涅克的脸红了，红到耳朵。他行了个礼，很标准的骑士团的礼，像是十几年来一直在偷偷练习。',
    opts:[{t:'在旁边看着', fx:{t:{hubert:6}}, app:{zden:4}, r:'他们在井边说了一下午的话。你听见胡贝特修士在笑，齐德涅克也在笑。\n\n走的时候，胡贝特修士拍了拍你的肩膀。<q>他小时候，</q>他低声说，<q>是我见过最想当圣人的孩子。我很高兴他没当成。</q>'}]},
  {id:'c_matej_kozi', mode:'here', at:'kozi', party:['matej'], prio:15, who:['matej'], t:'先生的石头', la:'Lapis magistri',
    text:'马捷伊在那块讲道的石头前面站了很久。\n\n<q>他在伯利恒教堂讲道的时候，</q>他说，<q>我坐在最后面，记笔记。他讲得很快，我记不下来。后来他被赶出布拉格，来了这里。我没有跟来。我说我要留在大学里，守着他的书。</q>\n\n他蹲下来，摸了摸石头。<q>其实是我怕。</q>',
    opts:[
      {t:'<q>你守住了他的书。</q>', fx:{mind:1}, app:{matej:6}, r:'<q>书，</q>马捷伊说，<q>书是最容易守的东西。它们不会走，不会说话，不会被人烧死。</q>他站起来，拍了拍膝盖上的土，<q>可你说得对。我守住了。这也算一件事。</q>'},
      {t:'让他一个人待一会儿', fx:{}, app:{matej:4}, r:'你走开了，走到坡下。回头的时候，你看见马捷伊坐在了那块石头上，用手捂着脸。贝特卡老太太走过去，在他身边坐下，开始背一篇讲道。他没有抬头，可是你看见他的嘴唇在跟着动。'}
    ]},
  {id:'c_petr_sedlec', mode:'here', at:'sedlec', party:['petr'], prio:15, who:['petr'], t:'骨头也没有罪', la:'Ossa innocentia',
    text:'别人在骨堂里都低着头，只有彼得抬着头，一个一个地看那些头骨，看得很高兴。\n\n<q>你看这个，</q>他指着一个，<q>牙齿这么整齐，他一定很爱笑。这个，额头这么宽，他一定很固执。</q>他转过身来，<q>他们说肉身是罪。可你看，剥掉了肉，剩下的还是这么好看。</q>',
    opts:[
      {t:'<q>你不怕吗？</q>', fx:{lens:1}, app:{petr:4}, r:'<q>怕什么？</q>彼得说，<q>我们每个人身体里都有一副这样的骨头。它一直在那里，陪着我们走路，吃饭，亲嘴。我们只是没有见过它。</q>他把手放在你的胸口，<q>你的也在这里。我认识它了。</q>'},
      {t:'帮帕夫尔修士摆骨头', fx:{xp:{faith:1}}, app:{petr:3}, run: S => applyFx({t:{pavel:5}}), r:'彼得也来帮忙了。他摆得很随意，帕夫尔修士一开始皱眉，后来不管他了。走的时候，最上面一排的头骨，每一个都在笑。'}
    ]},
  {id:'c_katka_usti', mode:'here', at:'utown', party:['katka'], prio:15, who:['katka'], if: S => S.f.ustiBurned, t:'她点过的火', la:'Ignis',
    text: S => `卡佳在${S.f.ustiSaved ? '半座烧了的城' : '灰地'}里走着，走得很慢。

<q>烧城那天，我也在，</q>她说，<q>我扛着火把，点了三座房子。第三座里面有一个摇篮。我看见了，我还是点了。</q>她踢开了地上的一块炭，<q>传道人说，要让上了山的人再也回不去。可是那个摇篮，是要给还没出生的人用的。</q>`,
    opts:[
      {t:'<q>你那时候相信那是对的。</q>', fx:{}, app:{katka:4}, r:'<q>我那时候相信很多东西，</q>卡佳说，<q>现在还信一半。</q>她蹲下来，在灰里挖了一会儿，挖出了一个烧黑的铜铃铛，是挂在摇篮上的那种。她把它擦干净，挂在了自己的车上。'},
      {t:'帮她在灰里找那个摇篮', fx:{mind:-1}, app:{katka:6}, r:'你们找到了。只剩下两根烧黑的弯木头，弯得像两只手。卡佳把它们捡起来，抱在怀里，抱回了车阵。后来她用它们给自己的车做了一个扶手。'}
    ]}
);

// ---------- 火边的闲话 ----------
BANTER.push(
  {who:['katka', 'zden'], if: S => pairOf('katka', 'zden') === 'friends', t:'卡佳和齐德涅克又在火边吵架，吵的是连枷该用左手还是右手。吵着吵着，两个人拿起木棍去旁边比划了。你听见齐德涅克说：<q>不对，再来。</q>'},
  {who:['matej', 'petr'], if: S => pairOf('matej', 'petr') === 'respect', t:'马捷伊在教彼得认拉丁文，彼得在教马捷伊认草药。两个人都学得很慢，都假装不慢。'},
  {who:['eliska', 'katka'], if: S => pairOf('eliska', 'katka') === 'friends', t:'爱丽什卡和卡佳在算车阵一个月要吃多少面包。算出来的数不一样，她们吵了半夜，最后发现是卡佳把孩子也算成了一个人。<q>孩子就是一个人，</q>卡佳说。爱丽什卡想了想，把账改了。'},
  {who:['zden', 'matej'], if: S => pairOf('zden', 'matej') === 'forgiven', t:'齐德涅克和马捷伊坐在火边，一个念玫瑰经，一个读书。念完了，读完了，两个人一起把火盖灭。谁也没说话，像两个认识了很多年的人。'},
  {who:['zden', 'matej'], if: S => pairOf('zden', 'matej') === 'broken', t:'齐德涅克和马捷伊坐在火的两边，中间隔着你。他们都在看火，谁也不看谁。'},
  {who:['ilona', 'zden'], if: S => pairOf('ilona', 'zden') === 'friends', t:'伊洛娜的弓上挂着齐德涅克的念珠。他教她念了一句玫瑰经，她教他说了一句库曼话。你问那句库曼话是什么意思，他们俩都不告诉你。'},
  {who:['petr', 'ilona'], t:'彼得和伊洛娜在比谁能在马背上站得更久。彼得输了，摔进草里，躺着不起来，说他在和长生天说话。'},
  {who:['matej', 'eliska'], if: S => pairOf('matej', 'eliska'), t:'爱丽什卡在给马捷伊算他这辈子欠她的酒钱。算到一四一二年，马捷伊说那年的不算，那年他被开除了。<q>开除也要喝酒，</q>爱丽什卡说。'},
  {if: S => S.f.v_strak, t:'有人说起斯特拉科尼采的医院，说那里的床单是白的。大家都不太信。'},
  {if: S => S.f.v_budej, t:'有人在学布杰约维采城门口的卫兵说话：<q>你怎么领圣餐？</q>学得很像。大家笑了，笑完了，又不笑了。'},
  {if: S => S.f.ustiBurned, t:'火边有人说，奥斯蒂的灰里长出了豆子。烧过的地，豆子长得特别好。'}
);

// ---------- 结局里，同伴之间的事 ----------
const PAIR_END = {
  katka_zden:{friends:'后来，齐德涅克在玫瑰堡的城墙上教人用连枷。卡佳每年冬天都会收到一双手套，羊皮的，不是白的。', rivals:'很多年以后，有人问起齐德涅克，他说那个塔博尔的女车夫是他见过最可怕的敌人。他说得很骄傲。'},
  matej_petr:{respect:'马捷伊后来写了一篇论文，论柳树皮的退热作用。最后一段，他写：<i>然而，本文无法解释一个孩子为何在被触摸时停止哭泣。</i>'},
  eliska_katka:{friends:'塔博尔的车阵后来每年都会收到一批新车轮，不留名字。卡佳知道是谁，她从来不说。', truce:'卡佳的车上一直放着那只写着“不记账”的空桶。'},
  ilona_zden:{friends:'伊洛娜的弓上一直挂着一串念珠。草原上的人问她那是什么，她说，是一个骑士的朋友。'},
  eliska_matej:{old:'那一捆威克里夫的书，后来一直留在新城酿酒坊的地窖里，每年夏天搬出来晒一次。'},
  matej_zden:{forgiven:'齐德涅克和马捷伊后来一直有书信往来。信里不提那扇窗，只提天气，和书。', broken:'齐德涅克和马捷伊后来再也没有见过面。'},
  katka_petr:{forgiven:'卡佳后来在车阵里唱的那支林子里的歌，是彼得教的。她唱得还是很难听。'}
};
const _compFate3 = compFate;
compFate = function (id) {
  const t = _compFate3(id);
  if (!t || cm(id).dead) return t;
  const extra = Object.entries(PAIR_END).filter(([k]) => k.split('_')[0] === id).map(([k, m]) => m[S.f['pair_' + k]]).filter(Boolean);
  return t + extra.join('');
};
// ===== 更多路上的事 =====
def(
  {id:'r_salt', mode:'road', w:3, route:['budej', 'rose', 'usti', 'strak'], t:'盐车', la:'Via aurea', tag:'路上',
    text:'路上过来一溜驮马，十几匹，每匹背上都驮着两个鼓鼓的皮袋。赶马的人说，这是从帕绍来的盐，走的是“黄金小路”，翻过南边的大山，走了十二天。\n\n<q>一袋盐，</q>领头的人说，<q>到了布拉格，能换一头牛。路上要是碰上兵，就什么都换不来了。</q>他看着你的剑，<q>骑士老爷，往北走吗？</q>',
    opts:[
      {t:'护送他们一程', chk:'arm', fx:{money:30, rep:{crown:1, prague:1}, xp:{arm:1}}, ffx:{money:10, hurt:1},
        r:'一路上没有碰见兵，只碰见了三个想偷马的孩子，被你一瞪就跑了。分手的时候，领头的人给了你三十个格罗申，还有一小包盐，说是给你母亲腌肉的。',
        f:'林子里冲出来五六个人，拿着棍子。你挡住了他们，肩上挨了一棍。盐车跑了，跑得比你还快。后来领头的人回来，给了你十个格罗申，说剩下的跟着马跑了。'},
      {t:'给柳溪买两袋盐：二十个格罗申', cost:20, fx: S => ({set:{saltBought:1}, rep:{home:2}, inc:S.f.eInit ? {eGrain:10} : {}}),
        r:'两袋盐，够柳溪腌一冬天的肉，泡一冬天的酸菜。老人们说，有盐的冬天，就不算最难的冬天。'},
      {t:'让开路', r:'驮马一匹一匹从你身边走过去，皮袋上落满了白色的盐霜，在太阳底下亮晶晶的。'}
    ]},
  {id:'r_bell', mode:'road', w:2, t:'埋钟', la:'Campana sepulta', tag:'路上',
    text:'一个村子的人围在麦田边上挖坑。坑边放着一口钟，铜的，有半人高，钟口朝天，像一只张开的嘴。\n\n<q>兵来了会把它拉走，</q>村长说，<q>熔了，铸炮。不管是哪边的兵。</q>他们用绳子把钟吊起来，慢慢地放进坑里。钟碰到坑底的时候，响了一声，很闷，像在地底下咳嗽。',
    opts:[
      {t:'帮他们填土', fx:{mind:1, rep:{home:1}}, run: S => applyFx({app:Object.fromEntries(S.party.map(id => [id, 2]))}),
        r:'你们填了一下午。填平了，村长让人在上面种了一排豌豆，好让人看不出来。\n\n<q>仗打完了，</q>他说，<q>再挖出来。</q>他想了想，<q>要是我那时候死了，就没人知道它在这里了。</q>他看着你，<q>骑士老爷，你记着。第三排豌豆底下。</q>'},
      {t:'<q>为什么不拿去卖？</q>', fx:{lens:1}, r: S => S.lens > 0 ? '村长看着你，好像你问了一个很蠢的问题。<q>它是给死人敲的，</q>他说，<q>也给生孩子的敲。它认得村里每一个人。卖了，那些人就找不到回来的路了。</q>\n\n那天夜里，你在很远的地方，好像听见地底下响了一声。' : '<q>卖给谁？</q>村长说，<q>现在买铜的，都是铸炮的。</q>他拍了拍坑边的土，<q>它敲了一百年的丧钟，不能让它最后去杀人。</q>'}
    ]},
  {id:'r_minstrel', mode:'road', w:2, t:'瞎眼的歌手', la:'Cantor caecus', tag:'路上',
    text:'路边的石头上坐着一个瞎眼的老头，抱着一把破旧的琴，在唱一支新歌。歌里唱的是上帝的战士，唱的是不要怕敌人，不要看敌人有多少。\n\n这支歌你已经在很多地方听过了：车阵里，酒馆里，田里。可是老头唱得和别人不一样，很慢，很轻，像在唱一支摇篮曲。',
    chime:{katka:'卡佳跟着哼了起来，哼得比他快一倍。', zden:'齐德涅克的手指在剑柄上敲着拍子，自己都没有发现。', ilona:'<q>这支歌，</q>伊洛娜说，<q>我在营地里听匈牙利人骂过。他们说，听见它，马就会跑。</q>'},
    opts:[
      {t:'在他碗里放一个格罗申', cost:1, fx:{mind:2}, r:'老头听见钱落进碗里，停下来，朝你的方向点了点头。<q>你想听什么？</q>他问。\n\n你说，唱一支和打仗没关系的。他想了很久，唱了一支关于一只丢了的鹅的歌。唱得很好听。'},
      {t:'<q>为什么唱得这么慢？</q>', fx:{lens:-1, xp:{grace:1}}, r:'<q>他们唱得快，是要去打仗，</q>老头说，<q>我唱得慢，是要唱给打完了仗的人听。他们回来的时候，要有一支慢的。</q>'}
    ]},
  {id:'r_plague', mode:'road', w:2, act:[2, 3], t:'白十字的门', la:'Cruces albae', tag:'路上',
    text:'路边的村子很静。每一扇门上都用白灰画着一个十字。\n\n一个女人站在村口，用布蒙着嘴，朝你挥手，让你别过来。<q>血痢，</q>她喊，<q>兵带来的。一半的人倒下了。别进来！</q>\n\n她身后，有一扇门开着一条缝，一个小孩在门缝里看你。',
    chime:{petr:'彼得已经下了马，往村里走了。', zden:'<q>骑士团的人会来的，</q>齐德涅克说，<q>他们总是会来。</q>他自己也不信。', eliska:'<q>别进去，</q>爱丽什卡抓住你的袖子，<q>我求你。</q>'},
    opts:[
      {t:'把干粮和水留在村口', fx:{mind:1, honor:2, money:-5}, r:'你把身上的面包、奶酪和两皮袋水都留在了村口的石头上。女人等你走远了才过来拿。她没有说谢谢，只是朝你画了一个十字。'},
      {t:'进去帮忙', chk:'nerve', fx:{honor:5, mind:2, xp:{lore:1}}, ffx:{hurt:2, honor:5, mind:-1}, app:{petr:8, zden:4, eliska:-5},
        r:'你在村里待了一天，烧开水，挖坑，给病人喂盐水。盐水是卢卡什修士教过的法子：一把盐，一把蜂蜜，一锅开水。傍晚的时候，有三个人能坐起来喝粥了。\n\n你走的时候，那个门缝里的小孩跟到村口，塞给你一个木头雕的小马。',
        f:'你在村里待了一天。第三天，你在路上开始发烧，肚子疼得直不起腰。你在马背上趴了两天，以为自己要死了。你没有死。'},
      {t:'绕过去', fx:{mind:-1}, r:'你绕了很远的路。走出很远，你回头看了一眼。村子里升起了一缕烟，是在烧被褥。'}
    ]},
  {id:'r_courier', mode:'road', w:2, act:[2, 3], t:'沟里的信使', la:'Nuntius', tag:'路上',
    text:'路边的沟里躺着一个人，穿着王家信使的红号衣，后背上插着一支箭。马不见了。他的皮包还挂在身上，扣得很紧。\n\n包里是几封信，用蜡封着，蜡上印着双头鹰。',
    opts:[
      {t:'拆开看', chk:'lore', fx:{set:{courierRead:1}, xp:{lore:1}}, ffx:{set:{courierRead:1}}, r:'信是写给玫瑰堡、布杰约维采和几个南方领主的。国王要他们在七月之前带兵北上，到布拉格城下会合。最后一封信的末尾，有一行国王亲笔写的小字：<i>告诉他们，这一次，我不会坐船走。</i>', f:'信是拉丁文的，写得很潦草。你只看懂了一个日期：七月。', next:'r_courier2'},
      {t:'把他埋了，信也埋了', fx:{honor:3, mind:1}, r:'你在路边挖了一个坑，把他和他的信一起埋了。他很年轻，脸上还有雀斑。你在坟上插了一根树枝，挂上了他的红号衣，好让他的人找得到。'}
    ]},
  {id:'r_courier2', mode:'chain', t:'信', la:'Litterae',
    text:'你把信重新折好。蜡封已经破了，谁都看得出来。',
    opts:[
      {t:'带去布拉格，交给老城议会', fx:{rep:{prague:8, crown:-4}, set:{courierTo:'prague'}}, app:{matej:3, eliska:4}, r:'老城的议员们看了信，看了很久。一个老议员拍了拍你的肩膀：<q>七月，</q>他说，<q>我们还有时间挖沟。</q>'},
      {t:'交给最近的王家城', app:{zden:2, katka:-6}, r:'王家的人收下了信，看见蜡封破了，皱了皱眉，可还是给了你二十个格罗申。<q>信使死了，</q>他说，<q>你替他把路走完了。</q>', fx:{rep:{crown:8, prague:-3}, set:{courierTo:'crown'}, money:20}},
      {t:'烧了', fx:{set:{courierTo:'burned'}, lens:-1}, r:'信在火里卷起来，双头鹰的印化成了一滴红色的蜡，流进了灰里。不管里面写的是什么，七月照样会来。'}
    ]},
  {id:'r_wolves', mode:'road', w:2, act:[2, 3], t:'跟着军队的狼', la:'Lupi', tag:'路上 · 黄昏',
    text:'黄昏的时候，你发现有东西在跟着你。灰色的，三只，四只，在路边的灌木里，保持着一箭的距离。\n\n是狼。今年的狼不怕人。老人说，它们跟着军队走，军队走过的地方，总有东西可以吃。',
    opts:[
      {t:'停下来，点火', chk:'nerve', fx:{mind:1, xp:{nerve:1}}, ffx:{hurt:1, mind:-1},
        r:'你生了一堆火，坐在火边，剑横在膝盖上。狼在火光外面转了一夜，眼睛一对一对地亮着。天亮的时候，它们走了，像是终于明白，你今天还不是它们要等的东西。',
        f:'火还没生起来，一只狼就扑了上来，咬住了你的马腿。你砍了它一剑，它跑了，马也跑了。你追了半夜才把马追回来，小腿上多了一排牙印。'},
      {t:'加快赶路', fx:{}, r:'你催着马跑了一个时辰。回头的时候，路上什么也没有了。可是你知道，它们只是去了别的地方，等别的人。'}
    ]},
  {id:'r_pilgrims', mode:'road', w:2, if: S => !S.f.pilgrimBadge, t:'朝圣的人', la:'Peregrini', tag:'路上',
    text:'路上碰见一群从摩拉维亚来的人，十几个，男女老少，背着包袱，拄着棍子。他们的帽子上都别着一枚小锡牌，上面是一只鹅。\n\n<q>我们去科齐堡，</q>领头的老人说，<q>去看胡斯先生讲过道的那块石头。去年我们去了布拉格的伯利恒教堂，明年要去康斯坦茨，去莱茵河边上看一眼。</q>他问你认不认得去奥斯蒂的路。',
    opts:[
      {t:'给他们指路', fx:{set:{pilgrimBadge:1}, mind:1}, r:'你给他们指了路。老人从帽子上摘下那枚锡牌，别在了你的斗篷上。<q>我们还有很多，</q>他说，<q>路上见了好人就送一个。</q>\n\n锡牌上的鹅做得很粗，像一只鸭子。可它一路在你的斗篷上叮叮地响，像在说话。'},
      {t:'<q>去康斯坦茨？你们不怕吗？</q>', fx:{set:{pilgrimBadge:1}, lens:1}, r:'<q>怕什么？</q>老人笑了，<q>他们烧的是人。人烧了，石头还在，河还在。我们去看的是石头和河。</q>他把一枚锡牌塞进了你手里。'}
    ]},
  {id:'r_charcoal', mode:'road', w:2, route:['forest', 'usti', 'liuxi', 'strak'], t:'烧炭的人', la:'Carbonarii', tag:'林子里 · 夜',
    text:'天黑了，你在林子里迷了路，看见了一点火光。是一个炭窑，几个烧炭的人坐在旁边，脸是黑的，牙是白的。\n\n他们分给你一碗豆子汤，叮嘱你夜里别离开火光。<q>林子里有东西，</q>年纪最大的那个说，<q>夜里会喊“嘿”。你要是答应了，它就骑到你背上，你背着它走一夜，走到天亮就死了。</q>\n\n半夜，林子深处，真的有一个声音：<q>嘿——！</q>',
    opts:[
      {t:'不答应', lens:1, fx:{mind:1, lens:1}, r: S => S.lens > 0 ? '那个声音喊了一夜，从东边喊到西边，从远喊到近。最近的一次，就在炭窑后面，你闻到了一股湿苔藓的味道。\n\n烧炭的人们一个都没睡，都在火边坐着，谁也不说话。天亮的时候，炭窑后面的地上有一串脚印，像人，又不像。' : '那个声音喊了一夜。到后半夜，你听出来了：是一只雕鸮，叫得很像人在喊。\n\n你没有说出来。烧炭的人们坐在火边，谁也不说话。他们知道是雕鸮。他们只是喜欢有一个不答应的理由，好在夜里坐在一起。'},
      {t:'喊回去：<q>嘿！</q>', chk:'nerve', fx:{xp:{nerve:1}, mind:-1}, ffx:{mind:-2, lens:1}, r:'林子里安静了。安静了很久。然后那个声音在很远的地方喊了一声，像在笑。\n\n烧炭的人们看着你，好像你刚刚和一个老邻居打了个招呼。<q>它喜欢你，</q>年纪最大的说，<q>以后你在这片林子里不会迷路了。</q>', f:'林子里安静了。然后，很近，就在你的耳朵后面，有人轻轻地说了一声：<q>嘿。</q>\n\n你一夜没睡。'}
    ]},
  {id:'r_monks', mode:'road', w:2, act:[1, 2], t:'逃难的修士', la:'Monachi', tag:'路上',
    text:'路上碰见五个修士，穿着白袍子，袍子的下摆烧焦了。他们推着一辆小车，车上盖着一张毯子，毯子下面鼓鼓的。\n\n<q>修院烧了，</q>领头的老修士说，<q>塔博尔的人烧的。我们只带出来这些。</q>他掀开毯子的一角：书，一个银的圣髑匣，还有一个用布包着的、很小的东西，像一个孩子的鞋。\n\n远处的路上扬起了尘土。有人在追他们。',
    chime:{katka:'<q>修院的地窖里有一百年的粮食，</q>卡佳说，<q>饥荒的时候，他们一粒也没往外拿。</q>', matej:'马捷伊已经在看车上的书了，手在抖。', zden:'齐德涅克下了马，挡在了小车前面。'},
    opts:[
      {t:'把他们藏进林子里', fx:{rep:{rose:4, tabor:-4}, honor:3}, app:{zden:8, matej:6, katka:-6},
        r:'你把他们藏进了路边的林子。追来的是十几个拿连枷的人，问你有没有看见修士。你说没有。他们看了看你，走了。\n\n老修士从林子里出来，把那本最小的书塞给了你：<q>诗篇，</q>他说，<q>我们修院的第一个院长抄的。三百年了。</q>你不肯要，他就把它塞进了你的马鞍袋里。'},
      {t:'<q>往西走，去斯特拉科尼采。骑士团的医院会收留你们。</q>', fx:{rep:{rose:2}, honor:2}, app:{zden:5, matej:4},
        r:'老修士看着你，像在看一个从天上掉下来的人。他们推着车往西走了。\n\n后来你在斯特拉科尼采的医院里见过那辆小车，靠在墙边，车上的书一本一本地摆在窗台上晒太阳。'},
      {t:'让追他们的人过去', vow:'abandon', fx:{rep:{tabor:5}, mind:-2}, app:{katka:4, zden:-10, matej:-8},
        r:'你牵着马站到了路边。追兵从你身边跑过去。你没有回头看。\n\n那天晚上，你梦见了那个用布包着的、很小的东西。你一直不知道它是什么。'}
    ]}
);
// ===== 图鉴：新地方、新人物、新风俗 =====
CODEX.push(
  // ---------- 人物 ----------
  {id:'chlum', c:'people', n:'赫卢姆的扬', o:'Jan z Chlumu', y:'?—1425', u: () => !!S.q.q_father,
    t:`波希米亚骑士，胡斯的朋友和保护人。一四一四年，他受国王瓦茨拉夫之命护送胡斯去康斯坦茨大公会议。

胡斯到康斯坦茨不到一个月就被逮捕，尽管他持有西吉斯蒙德签发的安全通行证。赫卢姆的扬拿着通行证四处抗议，还在康斯坦茨的教堂门上张贴告示，指责这是背信。他一直陪胡斯到最后。后来他成了胡斯派贵族中的一员。`,
    g:'游戏里“你父亲”是他的侍从，这是虚构的。'},
  {id:'ottokar', c:'people', n:'普热米斯尔·奥托卡二世', o:'Přemysl Otakar II.', y:'约1233—1278', u: () => been('budej') || S.f.ferryCoin || S.f.coinShown,
    t:`波希米亚国王，人称“铁与金的国王”。他统治时，波希米亚的疆土一度从西里西亚延伸到亚得里亚海边。他建立了许多王家城市，布杰约维采就是其中之一（1265）。

一二七八年八月，他在维也纳以北的马希费尔德与哈布斯堡的鲁道夫交战，兵败被杀。`,
    g:'渡口那枚“奥托卡的钱”和夜里过河的客人是虚构的。'},
  // ---------- 城市与地方 ----------
  {id:'usti', c:'places', n:'塞济莫沃乌斯季（奥斯蒂）', o:'Sezimovo Ústí', y:'', u: () => been('usti'),
    t:`卢日尼采河畔的一座老城。一四二〇年春天，城里和周边的胡斯派搬到了附近河湾上的一座山上，在那里建起了新城，叫它塔博尔。

一四二〇年三月底，塔博尔人放火烧了旧城，好让上了山的人断了回头的念头。`,
    g:'游戏里叫它“奥斯蒂”。烧城的日子随你什么时候到而定；多罗塔、找猫的女孩是虚构的。'},
  {id:'kozi', c:'places', n:'科齐城堡', o:'Kozí hrádek', y:'1413—1414', u: () => been('usti'),
    t:`塞济莫沃乌斯季附近的一座小城堡，如今只剩废墟。一四一二年，布拉格因胡斯被处以禁行圣事，胡斯离开布拉格，一四一三到一四一四年间在南波希米亚流亡，主要就住在这里。

他在附近的田野、路口和村子里对农民讲道，听的人很多。他的不少捷克语著作，包括讲道集，都是在这段时间写成的。几年后，正是这一带的农民成了塔博尔的第一批人。`,
    g:'贝特卡、那棵椴树和墙根下的讲道石是虚构的。'},
  {id:'strakonice', c:'places', n:'斯特拉科尼采', o:'Strakonice', y:'', u: () => been('strak'),
    t:`奥塔瓦河与沃利尼卡河交汇处的城镇。十三世纪，当地的巴沃尔家族把城堡的一部分捐给了圣约翰医院骑士团，骑士团在这里设立了分团。

胡斯战争期间，骑士团在波希米亚的大修道长把驻地从布拉格迁到了这里，此后很长时间，斯特拉科尼采都是骑士团在波希米亚的中心。`,
    g:'胡贝特修士、卢卡什修士和医院里的瓦谢克是虚构的。'},
  {id:'budejovice', c:'places', n:'布杰约维采', o:'České Budějovice · Budweis', y:'1265年建城', u: () => been('budej'),
    t:`奥托卡二世建立的王家城市，用来牵制南波希米亚的大贵族维特科维奇家族，也就是后来的罗森堡家。城里多是说德语的市民，信天主教。

胡斯战争中，布杰约维采始终站在西吉斯蒙德一边，胡斯派从没有攻下过它。城中心的方形广场是中欧最大的广场之一；城市很早就得到了酿酒的特许权，后来外地人干脆用这座城的德语名字来称呼这里的啤酒。`,
    g:'城门塔、告示、瓦夫拉和海因里希修士是虚构的。'},
  {id:'sedlec', c:'places', n:'塞德莱茨', o:'Sedlec', y:'1142年建院', u: () => !!S.done.s_sedlec,
    t:`库特纳霍拉城外的熙笃会修院，是波希米亚最早的熙笃会修院。

传说一二七八年，院长亨利从耶路撒冷带回一把各各他山的土，撒在修院墓地上，从此中欧各地的人都想葬在这里。十四世纪的饥荒和黑死病时，这里埋葬了成千上万的人。大约一四〇〇年，墓地中间建起了一座小教堂，下层用来存放挖出来的骨头。

一四二一年四月，胡斯派攻占并烧毁了修院。骨堂留了下来。传说一五一一年，一个半瞎的修士开始把骨头一层一层地码起来。今天骨堂里的骨头装饰，是十九世纪才完成的。`,
    g:'游戏里的帕夫尔修士借用了“半瞎的修士”这个传说，把他放在了一四二〇年。'},
  {id:'nicopolis', c:'places', n:'尼科波利斯', o:'Nicopolis · Nikopol', y:'1396年9月25日', u: () => !!S.done.s_hubert,
    t:`多瑙河边的要塞，在今天的保加利亚。一三九六年，匈牙利国王西吉斯蒙德组织了一支十字军去打奥斯曼人，法兰西、勃艮第、德意志的骑士纷纷参加。

两军在尼科波利斯城下交战。法兰西骑士不等全军列阵就抢先冲锋，冲进了奥斯曼人的木桩和步兵阵里，十字军随即溃败。西吉斯蒙德乘船沿多瑙河逃走。战后，苏丹巴耶济德下令处死了大批俘虏。`},
  {id:'goldentrail', c:'places', n:'黄金小路', o:'Zlatá stezka · Goldener Steig', y:'', u: () => !!S.done.r_salt || been('budej'),
    t:`从巴伐利亚的帕绍翻越波希米亚森林，通往南波希米亚普拉哈季采等地的商路。驮马队从这条路把盐运进波希米亚，回程带着谷物、麦芽和别的货物。

盐是当时最赚钱的货物之一，所以这条路叫“黄金小路”。`},
  // ---------- 国家与势力 ----------
  {id:'hospitallers', c:'realms', n:'圣约翰医院骑士团', o:'Ordo Hospitalis Sancti Iohannis', y:'', u: () => been('strak'),
    t:`十一世纪在耶路撒冷为照顾朝圣者而设立的医院团体，十二世纪成为军事修会。修士骑士穿黑袍，胸前缝着白色的八角十字。十字军丢掉圣地以后，骑士团的总部先后迁到塞浦路斯和罗得岛。

骑士团在波希米亚很早就有了分团，在布拉格石桥边有修院。骑士团的规矩里，病人被称为“我们的主人”。`},
  {id:'dominicans', c:'realms', n:'多明我会', o:'Ordo Praedicatorum', y:'1216年', u: () => been('budej'),
    t:`西班牙人多明我创立的托钵修会，正式名称是“布道兄弟会”，穿白袍、黑斗篷。修士们重视学问，许多人是大学里的神学家。中世纪的宗教裁判所里，审讯异端的人常常出自这个修会。

拉丁文里，“多明我会士”（Dominicani）和“主的狗”（Domini canes）读起来很像。修会自己也用这个说法，说他们是守护羊群的狗。`},
  // ---------- 名词与传说 ----------
  {id:'salvus', c:'terms', n:'胡斯的安全通行证', o:'salvus conductus', y:'1414年10月', u: () => !!S.q.q_father,
    t:`一四一四年秋天，西吉斯蒙德给胡斯签发了一份安全通行证，命令沿途各地让他自由、安全地往来。胡斯带着它去了康斯坦茨。

同年十一月底，胡斯被大公会议逮捕。西吉斯蒙德起初表示愤怒，后来被会议说服，接受了“对异端不必守信”的说法。一四一五年七月六日，胡斯被烧死。在捷克人的记忆里，这张通行证成了背信的象征，也成了后来胡斯派不信任西吉斯蒙德的原因之一。`,
    g:'游戏里那张抄件和背面那行字，是虚构的。'},

这个习俗和德意志地区的瓦尔普吉斯之夜同源，比基督教还要古老。`},
  {id:'stjohn', c:'terms', n:'圣约翰夜与蕨花', o:'Svatojánská noc', y:'6月23日', u: () => !!S.done.f_stjohn,
    t:`施洗约翰节的前夜，一年中最短的一夜。人们点篝火，采草药，女孩把花环放进河里占卜姻缘。

斯拉夫人的传说里，这一夜的半夜，蕨丛里会开出一朵发光的花，只开一瞬间。找到它的人能听懂鸟兽的话，找到埋在地下的宝藏，或者看见将来。蕨类植物其实不开花。`},
  {id:'hejkal', c:'terms', n:'林中的喊声', o:'Hejkal', y:'', u: () => !!S.done.r_charcoal,
    t:`捷克民间传说里的林中精怪，夜里在林子里喊“嘿！”。走夜路的人要是答应了，它就会跳到人背上，让人背着它走，一直走到筋疲力尽。所以老人们说，夜里在林子里听见有人喊，千万别答应。`},
  {id:'husday', c:'terms', n:'七月六日', o:'Den upálení mistra Jana Husa', y:'', u: () => !!S.done.f_hus || S.day >= dayOf('七月', 6),
    t:`胡斯被烧死的日子。胡斯死后不久，波希米亚的胡斯派就开始把这一天当作殉道者的节日来纪念，在山头上点篝火。

今天，七月六日是捷克的国定假日。`},
  {id:'golgotha', c:'terms', n:'各各他的土', o:'Terra sancta', y:'1278年', u: () => S.clues.includes('b_soil') || !!S.f.golgotha,
    t:`各各他是耶路撒冷城外钉死耶稣的地方。中世纪的人相信，从圣地带回的土有神圣的力量，有好几处墓地都传说撒过各各他的土，据说埋在里面的尸体会很快化成白骨。

塞德莱茨的传说是其中最有名的一个。`}
);
// ===== 一四二〇年的爱情：第一夜、约会、之后的夜、私订终身 =====
// 那个时代的东西：系在上衣上的一排衣带、忏悔书里不许同房的日子、澡堂和戴绿花环的澡堂姑娘、
// 弥撒上的平安板、教会法里“用现在时说一句话就算结婚”、马鞭草的情药、神父的眼镜、麦芽房的热地板

// ---------- 日历：今天是星期几，是不是大节 ----------
const WEEK_N = ['主日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
const weekday = d => ((d - FEAST.easter) % 7 + 7) % 7;
const HOLY = {[dayOf('三月', 25)]:'圣母领报节', [FEAST.easter]:'复活节', [FEAST.easter + 1]:'复活节星期一', [FEAST.george]:'圣乔治节', [dayOf('五月', 1)]:'圣斐理伯和圣雅各伯的节日',
  [dayOf('五月', 16)]:'耶稣升天节', [FEAST.whitsun]:'五旬节', [dayOf('六月', 6)]:'圣体节', [dayOf('六月', 15)]:'圣维特的节日', [dayOf('六月', 24)]:'施洗约翰的诞辰',
  [dayOf('六月', 29)]:'圣彼得和圣保罗的节日', [dayOf('七月', 2)]:'圣母往见节', [dayOf('七月', 4)]:'圣普罗科普的节日', [FEAST.hus]:'胡斯先生的忌日'};
const forbiddenWhy = d => HOLY[d] ? `今天是${HOLY[d]}` : [0, 3, 5].includes(weekday(d)) ? `今天是${WEEK_N[weekday(d)]}` : '';

// ---------- 第一夜 ----------
const firstNight = (id, extra) => ({fx:fxm({rom:{[id]:3}, app:{[id]:10}, mind:3}, extra), run: S => { cm(id).lastNight = S.day; return []; }});

// 卡佳：一排衣带，和一个被挤到地上的皮匠
ST.c_katka_night.text = S => `${where(S) === 'camp' ? '她把你拉到营地外面的一个草垛后面。月亮很亮，草垛的影子很黑。' : where(S) === 'home' ? '半夜，她推开了你的房门，回身把门闩上了。隔壁，母亲咳嗽了一声。你们俩一起僵在那里，听了很久，直到母亲又打起了呼噜。' : '客栈只剩一张床，床上已经睡着一个从皮塞克来的皮匠。客栈的规矩，一张床睡三个人。卡佳摇醒他，往他手里塞了两个格罗申：<q>今晚你睡地上。</q>皮匠看了看她靠在墙上的连枷，抱着被子出去了，连门都替你们带上了。'}

她开始解你的衣带。这年头的衣服，上衣和下衣是用一排细皮带系在一起的，一根一根，每根的头上包着一小截铜，结打得死紧。

<q>我在赫鲁比给老爷太太们系了五年衣带，</q>她说，手指飞快，<q>解，比系快。</q>

她解到第七根，停了下来，抬头看你。

<q>我这辈子，从来没有自己选过一次。谁该碰我，什么时候碰，都是别人说了算。</q>她的手按在第八根上，<q>今天我选。</q>`;
ST.c_katka_night.opts = [
  Object.assign({t:'<q>那你选吧。</q>', r: S => `后来的事，${where(S) === 'camp' ? '月亮看见了，草垛也看见了' : where(S) === 'inn' ? '睡在门外地上的皮匠听见了一点，第二天早上他看你们的眼神很复杂' : '月亮看见了'}，它们都没有说。

天快亮的时候，她靠在你胸口，${where(S) === 'camp' ? '头发里全是干草' : '一条腿压在你身上，像压住一件会跑掉的东西'}。地上散着二十四根衣带，有两根被她咬断了。<q>别叫我卡特日娜，</q>她迷迷糊糊地说，<q>叫我卡佳。只有喜欢我的人才叫我卡佳。</q>`}, firstNight('katka')),
  Object.assign({t:'抓住她的手：<q>剩下的，我自己来。</q>', r: S => `你自己解。第八根的结打反了，第九根缠在了第十根上。卡佳先是忍着，然后笑出了声，然后笑得倒在了${where(S) === 'camp' ? '草垛上' : '床上'}。

<q>老爷，</q>她喘着气说，<q>你连自己的带子都解不开，还想打仗？</q>她把你拉下去，<q>算了。不解了。</q>

后来的事，没有人知道衣带最后是怎么解开的。第二天早上，你在${where(S) === 'camp' ? '草垛' : '床底下'}找到了其中的十一根。`}, firstNight('katka', {mind:1}))
];

// 齐德涅克：一本巴掌大的时辰祈祷书，和书后面的日历
ST.c_zden_night.text = S => `${where(S) === 'inn' ? '他订了一间客栈的房间，只订了一间，付的是三个人的钱，好让老板别再往里塞人。' : where(S) === 'home' ? '那天夜里，他敲了你在柳溪的房门。敲了三下，很轻，像怕吵醒你母亲。' : '他把自己的帐篷搭在了离篝火最远的地方，然后站在帐篷门口，等你。'}他把剑解下来，靠在一边，然后是锁甲，然后是那件绣着玫瑰的罩袍。

然后，他从怀里掏出了一本巴掌大的时辰祈祷书，翻到最后几页的日历。红字是大节，黑字是小节。

<q>忏悔书上说，</q>他的手指沿着一行一行往下找，声音越来越小，<q>主日不行，星期三不行，星期五不行。斋期不行，大节不行，圣母的节日不行。白天最好不行，天黑以后……也最好不行。</q>

他找到了今天，停住了。${forbiddenWhy(S.day) ? `<q>${forbiddenWhy(S.day)}。</q>他说。他看起来像是刚刚输掉了一场比武。` : `<q>今天是${WEEK_N[weekday(S.day)]}，</q>他说，<q>没有大节。</q>他又看了一遍，看了第三遍。<q>可以。</q>他看起来比刚才还要慌。`}`;
ST.c_zden_night.opts = [
  Object.assign({t:'<q>按教会的算法，一天从晚祷开始。晚祷已经过了，现在已经是明天了。</q>', if: S => !!forbiddenWhy(S.day), chk:'lore',
    r: S => { const tm = forbiddenWhy(S.day + 1); return `齐德涅克盯着你，张着嘴，很久。\n\n然后他低头去翻日历，翻到明天。${tm ? `<q>${tm.replace('今天', '明天')}，</q>他绝望地说。\n\n你们俩看着那一页，看了一会儿，一起笑了，笑得把蜡烛都吹歪了。<q>好吧，</q>他把书合上，扔到了罩袍底下，<q>让上帝自己去算吧。</q>` : '<q>明天可以，</q>他小声说，然后抬起头，眼睛亮得吓人，<q>你说得对。晚祷已经过了。</q>\n\n他从来没有这么快地同意过一个神学论证。'}\n\n后来的事，蜡烛看见了，它烧到了底。天亮时，他还睡着，眉头第一次没有皱着。那本时辰祈祷书压在罩袍底下，翻开在明天那一页。`; },
    f:'<q>那是修院的算法，</q>齐德涅克说，<q>俗人的一天从日出开始。</q>他想了想，<q>不过……我们都不是修士。</q>他把那本书合上，放在了窗台上，面朝着外面。\n\n后来的事，蜡烛看见了。天亮时，他还睡着，眉头第一次没有皱着。'}, firstNight('zden', {xp:{lore:1}})),
  Object.assign({t:'<q>那我们等到子夜。</q>', if: S => !!forbiddenWhy(S.day),
    r:'你们并排坐在床边，等子夜。他坐得笔直，像在守夜。等着等着，他的头一点一点地歪下去，靠在了你肩上，睡着了。\n\n远处，修院的钟敲了十二下。你轻轻推醒他。他睁开眼睛，看见你，愣了一下，然后很认真地说：<q>明天了。</q>\n\n后来的事，只有那十二下钟声知道开头。'}, firstNight('zden', {mind:1})),
  Object.assign({t:'从他手里把那本书拿过来，合上',
    r: S => `他看着你把书合上，没有拦你。\n\n<q>这件事，</q>他说，<q>我会去告解的。</q>他说这话的时候，一点也不像一个打算悔改的人。\n\n后来的事，蜡烛看见了，它烧到了底。天亮时，他还睡着，手搭在你的腰上。那本时辰祈祷书在${where(S) === 'camp' ? '帐篷门口的石头上' : '窗台上'}，被露水打湿了一个角。`}, firstNight('zden')),
  Object.assign({t:'<q>今天可以？那你为什么这么慌？</q>', if: S => !forbiddenWhy(S.day),
    r:'<q>因为，</q>他说，把那本书小心地放在一边，<q>没有理由再等了。</q>\n\n他摘下了胸前的十字架，放在窗边，面朝着外面，然后转过身来，像一个终于走上比武场的人。\n\n后来的事，蜡烛看见了，它烧到了底。天亮时，他醒得比你早，在你耳边用很小的声音念了一段晨祷，念到一半，又念成了你的名字。'}, firstNight('zden'))
];

// 彼得：亚当给万物起名字
ST.c_petr_night.text = S => `${where(S) === 'inn' ? '客栈的老板娘来敲门，问要不要再加一床被子。彼得说不用，我们是亚当和夏娃。老板娘说，亚当和夏娃也要付被子钱。彼得付了，又把被子送给了楼梯口睡着的一个乞丐。' : where(S) === 'home' ? '彼得说，柳溪的窗户要开着。<q>上帝想看，就让他看，</q>他说，<q>你母亲想看，就算了。</q>他把窗户开了一半。' : '彼得把篝火拨旺了。'}

<q>编年史家们写我们，</q>他说，一边慢慢地脱衣服，像一棵树在秋天落叶，<q>说我们光着身子围着火跳舞。</q>他笑了，<q>我们是光着。可是不跳。太冷了，跳一会儿就得回去穿衣服。</q>

他在你身边坐下来，火光照着他的肩膀和他手掌上的两道疤。

<q>你知道亚当在伊甸园里做的第一件事是什么吗？</q>他说，<q>不是吃苹果。是给万物起名字。</q>他的手指碰了一下你的锁骨，<q>这个，我叫它“柳溪”。</q>`;
ST.c_petr_night.opts = [
  Object.assign({t:'让他接着起名字', r:'他接着起。肩膀叫“早晨”。手腕叫“渡口”。耳朵后面那一小块，他想了很久，叫它“复活节第二天”。他起名字起得很慢，每起一个，都要确认一遍。\n\n后来的事，篝火看见了。它烧得很旺，一直烧到天亮。\n\n天亮时他醒过来，摸着你的脸说：<q>我不会只属于你，我也不要你只属于我。爱不是一只杯子，装满了就要盖上。</q>他顿了一下，<q>不过这些名字，只有你一个人有。</q>'}, firstNight('petr', {mind:1})),
  Object.assign({t:'抓住他的手：<q>轮到我给你起了。</q>', r:'他愣了一下，然后笑得倒在了草地上，把手掌摊开给你。<q>那这两道疤叫什么？</q>\n\n你想了想，叫它们“磨坊”和“齿轮”。他不笑了，看了你很久。<q>你知道它们是怎么来的，</q>他说，<q>你一直知道。</q>\n\n后来的事，篝火看见了。天亮时，他睡得像一个孩子，一只手还摊开着。'}, firstNight('petr', {lens:-1}))
];

// 伊洛娜：靴子最后脱，马在旁边看着
ST.c_ilona_night.text = S => `${where(S) === 'inn' ? '伊洛娜看了一眼客栈的床，按了按稻草床垫，摇摇头。<q>太软，</q>她说，<q>像陷在泥里。</q>她把她的皮袍铺在了地板上。' : where(S) === 'home' ? '伊洛娜不肯睡在庄园里。<q>墙太厚，</q>她说，<q>听不见马。</q>她拉着你去了马厩，把她的皮袍铺在干草上，铺得很平。' : '夜里很冷。伊洛娜把她的皮袍铺在草地上，铺得很平。'}

她从腰上解下一只皮囊，拔开塞子，自己喝了一口，递给你。是马奶酒，酸的，冲的，喝下去胃里像点了一把火。<q>库曼人成事之前要喝这个，</q>她说，<q>打仗，赛马，还有这个。</q>

她一件一件地脱，脱得很利落，像卸一副马鞍。最后剩下靴子，她没有脱。

<q>靴子最后脱，</q>她说，<q>万一要跑。</q>`;
ST.c_ilona_night.opts = [
  Object.assign({t:'<q>那我替你脱。</q>', r:'你替她脱。左靴里掉出来一把小刀，右靴里掉出来一个铜铃铛，还有一小把盐。她说盐是防狼的，铃铛是防你的。\n\n后来的事，只有马知道。它在不远的地方吃草，一直很安静，偶尔打一个响鼻，像在发表意见。\n\n天快亮的时候，她用库曼话在你耳边说了一句什么。你问她是什么意思。她说：<q>“我的毡帐朝东开门”。</q>她没有解释。'}, firstNight('ilona')),
  Object.assign({t:'<q>今晚，你不用跑。</q>', r:'她看着你，看了很久，然后弯下腰，把两只靴子都脱了，并排放好，靴尖朝着你。\n\n<q>在我们那里，</q>她说，<q>靴尖朝着谁，就是要在谁的毡帐里过冬。</q>\n\n后来的事，只有马知道。天快亮的时候，她冰凉的脚贴着你的腿，在你耳边说：<q>我们的一个国王，一百多年前，为了库曼女人，连教皇的人都敢关起来。</q>她笑了，<q>我一直觉得他是个傻子。</q>'}, firstNight('ilona', {mind:1}))
];

// 马捷伊：经院式的辩论，没有说完
ST.c_matej_night.text = S => `马捷伊坐在${where(S) === 'camp' ? '毯子' : '床'}边上，手放在膝盖上，像一个第一天上学的学生。他摘下那副从威尼斯买来的眼镜，用袖子擦了擦，又戴上了。

<q>我想，</q>他说，<q>我们应该先按照大学的规矩，把这个问题辩清楚。</q>他清了清嗓子，<q>问题：一个圣杯派的神父，今夜是否可以——</q>

<q>反方第一，教会法禁止神父……</q>

<q>反方第二，奥古斯丁说……</q>

<q>然而，《雅歌》说：<i>Osculetur me osculo oris sui</i>，愿他用口与我亲嘴。我的回答是——</q>`;
ST.c_matej_night.opts = [
  Object.assign({t:'打断他', r: S => `你没有让他说出他的回答。

后来的事，${where(S) === 'camp' ? '只有篝火看见了' : '只有那支蜡烛看见了'}。他的眼镜不知道什么时候掉了，半夜他在${where(S) === 'camp' ? '草' : '床'}上摸了很久才找到，压弯了一条腿。

const NIGHT_AT = {

Object.assign(PILLOW, {

  zden:PILLOW.zden.concat(['齐德涅克在念玫瑰经，念到第三端，被你打断了。他后来说，这一串他从来没有念完过，也不打算念完了。', '齐德涅克说他在日历上找到了一个漏洞：一位在柱子上站了三十七年的叙利亚隐修士。<q>他的节日不是今天，</q>他说，<q>可我觉得，他会站在我们这边。他站了三十七年，什么都明白了。</q>', '<q>比武的时候，骑士要戴一位夫人的袖子，</q>齐德涅克说，<q>我想好了。下一次，我戴你的。</q>你说你的袖子是缝死在衣服上的。他说：<q>那就整件。</q>']),
  petr:PILLOW.petr.concat(['彼得说，编年史家写亚当派的那些话，他都听说了。<q>他们写得比我们做得精彩多了，</q>他说，<q>我有点嫉妒。</q>', '彼得把你的手放在他的胸口，说今天这里叫“雨”。昨天叫“柳溪”。他说名字每天都要换，不然就旧了。', '<q>塔博尔的长老说，</q>彼得说，<q>没有结婚就睡在一起的人，要在广场上站一天。</q>他翻了个身，<q>那我们得站一辈子了。我不介意。广场上的太阳很好。</q>']),
  ilona:PILLOW.ilona.concat(['伊洛娜教你库曼话的数字。数到七，她说剩下的明天再教。你问为什么。<q>这样，</q>她说，<q>你明天还会来。</q>', '伊洛娜睡觉的时候，一只手总是放在弓上，另一只手放在你身上。她说这样她就知道，两样东西都还在。', '<q>神父说，跟异教徒睡觉的人要下地狱，</q>伊洛娜说，<q>我奶奶说，跟基督徒睡觉的人，要被长生天打雷劈。</q>她听了听外面，<q>没有打雷。</q>']),
  matej:PILLOW.matej.concat(['马捷伊把那副威尼斯眼镜放在枕头边，半夜摸不着，把你也摸醒了。他道歉，又摸了一会儿。眼镜在你那边。', '<q>大学的规矩，</q>马捷伊说，<q>硕士不许在外面过夜。我已经违反了十一天了。</q>他想了想，<q>今天是第十二天。</q>他好像很骄傲。', '马捷伊说，他以前在讲台上说过，爱是灵魂的一种运动。<q>我那时候不知道，</q>他说，<q>身体也会一起动。这一点亚里士多德讲得很不清楚。</q>']),

  ribbon:{n:'一根红丝带', p:2, katka:[3, '卡佳把丝带系在了她的连枷柄上。<q>这样，</q>她说，<q>我打人的时候也想着你。</q>'], zden:[6, '齐德涅克把丝带系在了左臂上，系得很仔细，像比武场上的骑士戴着夫人的袖子。<q>规矩又反了，</q>他说，<q>我不在乎。</q>'], petr:[5, '彼得没有把丝带系在自己身上。他把它系在了你的手腕上，打了一个很复杂的结。<q>这样，你就是我送给你的了，</q>他说。你没听懂，他也没解释。'], ilona:[2, '伊洛娜把丝带编进了她那匹灰马的鬃毛里。马很高兴，甩了一下午的头。'], matej:[4, '马捷伊把丝带夹进了他的奥维德里，当书签，夹在某一页。你问他是哪一页，他不告诉你。'], eliska:[1, '爱丽什卡摸了摸那根丝带，说：<q>两个格罗申？他收你两个？</q>她回头去找那个摊主算账了。丝带她收下了。']},
  mirror:{n:'一面纽伦堡的凸面小镜子', p:12, katka:[-2, '卡佳拿着镜子照了一下，吓了一跳，又照了一下。<q>我长这样？</q>她把镜子塞回给你，<q>不要。我天天看马屁股，够了。</q>可是那天晚上，你看见她偷偷拿去照了很久。'], zden:[1, '齐德涅克说虚荣是罪，把镜子收了起来。第二天早上，你看见他对着那面小镜子刮胡子，刮得特别仔细。'], petr:[3, '彼得照了一下镜子，说：<q>原来别人看见的我是这样的。</q>然后他把镜子送给了路边一个没见过自己长什么样的放鹅女孩。'], ilona:[6, '伊洛娜从来没有这么清楚地看过自己的脸。她对着镜子看了很久，然后笑了，笑得前仰后合：<q>我的鼻子！</q>她说，<q>我的鼻子这么大！</q>她把镜子挂在了脖子上，和铜铃挂在一起。'], matej:[-1, '马捷伊说他有那副威尼斯眼镜，够照了。他把镜子放进口袋里，后来拿它在书桌上聚光，点着了一张草稿。'], eliska:[8, '爱丽什卡把镜子翻过来看了看背面，又对着光看了看玻璃，点点头：<q>真的是纽伦堡的。不是假货。</q>她看着镜子里的自己，看着镜子里你在她身后，看了很久。<q>好看，</q>她说，不知道是说镜子还是说别的。']},
  knife:{n:'一把带鞘的好匕首', p:10, katka:[8, '卡佳拔出匕首，看了看刃，吹了一下，试了试她的拇指。<q>好钢，</q>她说。然后她踮起脚亲了你一下，很响，整个集市都听见了。'], zden:[0, '齐德涅克郑重地收下了，又郑重地说他已经有一把了。他把两把都挂在了腰上，走路的时候叮当响。'], petr:[1, '彼得收下了匕首，当天就用它给一个陷在泥里的农夫割断了缠住车轮的绳子，然后把匕首也送给了那个农夫。'], ilona:[9, '伊洛娜双手接过匕首，看着你，很严肃。<q>在我们那里，</q>她说，<q>送刀的人，是把命交给对方。</q>她把匕首插进了右靴里，和那个铜铃铛放在一起。'], matej:[2, '马捷伊用那把匕首削了一下午的鹅毛笔，削得很高兴。他说这是他用过的最好的削笔刀。'], eliska:[4, '爱丽什卡把匕首藏进了袖子里。<q>新城的寡妇，</q>她说，<q>早就该有一把了。</q>']},
  book:{n:'一本巴掌大的时辰祈祷书', p:20, katka:[5, '卡佳不认字。她翻了翻，看那些描金的小画，然后把书塞回你手里：<q>念给我听。</q>那天晚上你念了，她靠在你身上，听着听着睡着了。'], zden:[10, '齐德涅克捧着那本书，好像捧着一个婴儿。他翻到后面的日历，找到了今天，用指甲在旁边划了一道很小的记号。<q>以后每年的今天，</q>他说，<q>我都会为你念一遍。</q>'], petr:[2, '彼得说上帝不在书里。他把书送给了一个要去当修女的小姑娘，小姑娘高兴得哭了。<q>你看，</q>彼得说，<q>上帝在她那里。</q>'], ilona:[-2, '伊洛娜不认字。她把书翻了一遍，又翻回来，拿去垫马鞍了。<q>很软，</q>她说，<q>好东西。</q>'], matej:[10, '马捷伊捧着那本书，半天没说话。<q>你用自己的钱，</q>他终于说，<q>给我买了一本书。</q>他的声音有点哑，<q>你知道，二十个格罗申，能买多少面包吗？</q>他把书紧紧地抱在怀里，<q>我不管。</q>'], eliska:[0, '爱丽什卡翻了翻，说账本比祈祷书有用。可是她把它放在了床头，有一天你看见她在里面夹了一朵干了的花。']}
};
outingDef('gift', ['square', 'oldtown', 'bsq'], {t:'信物', la:'Pignus',
  text: S => `集市上有卖信物的摊子：丝带、骨梳、锡做的小徽章、纽伦堡来的凸面小镜子，还有一个老头在卖用柳条编的小戒指，一个铜板三个。

<q>给谁买？</q>摊主看了一眼你身边的${nm(dateWho('gift'))}，咧嘴笑了，<q>那就不用问了。</q>`,
  opts:Object.entries(GIFTS).map(([k, g]) => ({t:`买${g.n}`, cost:g.p, fx: S => ({app:{[dateWho('gift')]:g[dateWho('gift')][0]}, mind:1}), r: S => g[dateLast()][1]}))
    .concat([{t:'买三个柳条戒指，一人一个，剩下一个给摊主', cost:1, fx: S => ({app:{[dateWho('gift')]:3}, mind:2}), r:'柳条戒指戴了三天就干了，裂了。可是那三天里，你们谁也没有摘下来。'}])
});

// 弥撒上的平安板
const PAX_W = {
  katka:'卡佳从来没见过平安板。塔博尔的弥撒没有这些东西。她接过来，像接过一只啤酒杯，在上面重重地亲了一口，亲得响。',
  zden:'齐德涅克吻平安板吻得很郑重，闭着眼睛，像在吻一件圣物。他睁开眼，把板子递给你，然后忽然意识到了什么，脸一下子红了。',
  petr:'彼得吻了平安板，递给你。然后，当着整座教堂的面，他又倾过身来，吻了你。后排的几个老太太一齐倒吸了一口气。',
  ilona:'伊洛娜先闻了闻那块板子，皱了皱鼻子，才吻上去。<q>一百个人吻过，</q>她小声说，<q>你们基督徒真不怕生病。</q>',
  matej:'马捷伊吻平安板的时候，用拉丁文低声说<q>愿平安与你同在</q>。他把板子递给你的时候，又说了一句，声音更低。那一句不是拉丁文的弥撒里有的。',
  eliska:'爱丽什卡接过平安板，先用袖子擦了擦，才吻上去。她把板子递给你，手指在板子底下碰了一下你的手指，停了一下才松开。'
};
outingDef('pax', ['church', 'newtown'], {t:'平安板', la:'Osculatorium', cond: S => S.ph < 2,
  text: S => `弥撒做到一半，到了平安礼。神父吻了一下一块小木板，上面刻着十字架，叫平安板，然后把它递给第一排的人。每个人吻一下，传给下一个人。按照规矩，教堂里的男女不能互相亲吻，平安只能经过这块板子。

平安板传到了${nm(dateWho('pax'))}手里。

${PAX_W[dateWho('pax')]}`,
  opts:[
    {t:'吻在刚才那个地方', fx: S => ({app:{[dateWho('pax')]:5}, mind:2}),
      r: S => `板子上还是热的。\n\n${S.at === 'church' ? '弥撒散了以后，扬神父把你叫住了。<q>平安板，</q>他说，<q>是让人想上帝的。</q>他看了一眼在教堂门口等你的' + nm(dateLast()) + '，叹了口气，<q>当然，上帝也在别的地方。</q>' : '散了以后，' + nm(dateLast()) + '在教堂门口的台阶上等你，什么也没说，一直在笑。'}`},
    {t:'规规矩矩地吻，传给下一个人', fx: S => ({app:{[dateWho('pax')]:1}, xp:{faith:1}}), r:'你规规矩矩地吻了，传了下去。下一个人是一个满脸皱纹的老佃户，他吻得很响。'}
  ]});

// 夏天的河
const SWIM_W = {
  katka:'卡佳不会游泳。她站在齐腰深的地方，不肯再往前走一步，又不肯上岸。你教她，她一边骂一边学，学会了狗刨，刨得水花四溅，比连枷还响。',
  zden:'齐德涅克穿着衬衣和长袜下了水。衬衣在水里鼓起来，像一只白色的大水母，跟在他后面漂。他游的是骑士团的游法，规规矩矩，头一直露在水面上。',
  petr:'彼得早就在水里了，仰面浮着，手脚摊开，在给天上的云起名字。他说那一朵叫“爱丽什卡的账本”，那一朵叫“杰士卡的鼓”。',
  ilona:'伊洛娜骑着马直接下了河，马在水里游，她抓着马鬃，跟着马一起游，辫子上的铜铃在水里也响。',
  matej:'马捷伊不会游泳。<q>大学不教这个，</q>他说，站在浅水里，紧紧抓着你的胳膊，<q>亚里士多德说，重的东西往下沉。我很重。</q>',
  eliska:'爱丽什卡不肯把头发弄湿。她坐在岸边，把裙子撩到膝盖，两只脚泡在水里，看着你游。看了一会儿，她伸出手，你游过去，她一把把你拉了上来，又一把把自己推了下去。'
};
outingDef('swim', ['river', 'ponds', 'ferry'], {t:'夏天的河', la:'Natatio', cond: S => S.day >= 50 && S.ph < 2,
  text: S => `天很热。河湾里的水是绿的，很清，看得见底下的石头和小鱼。神父们说，光着身子在河里洗澡的人，会被水妖拖下去。村里的年轻人每年夏天还是照样洗，水妖每年夏天也没拖下去几个。

${SWIM_W[dateWho('swim')]}`,
  opts:[
    {t:'游到河中间去', fx: S => ({app:{[dateWho('swim')]:5}, mind:3, xp:{nerve:1}}),
      r: S => `你们游到了河中间，水深得踩不着底，凉得人直哆嗦。${S.lens > 0 ? '有什么东西碰了一下你的脚踝，凉凉的，像一只手，碰了一下就松开了。你没有告诉' + nm(dateLast()) + '。' : '一条大狗鱼从你们中间窜过去，吓得' + nm(dateLast()) + '一把抱住了你。'}\n\n后来你们躺在岸边的草地上晒太阳，晒到身上的水都干了，晒到太阳偏西，谁也不想起来穿衣服。`},
    {t:'坐在岸边，看着', fx: S => ({app:{[dateWho('swim')]:2}, mind:2}), r:'你坐在岸边的柳树底下，看着水，看着水里的人。水面上全是太阳的碎片。这个夏天到处都在打仗，可是这一段河湾里，只有水声。'}
  ]});

// 酒馆里跳舞
const DANCE_W = {
  katka:'塔博尔的传道人禁止跳舞，卡佳已经三个月没跳过了。她跳起来像一头关了一冬天的小马，跳得整个酒馆都在晃，跳到后来，吹风笛的都跟不上她了。',
  zden:'齐德涅克跳的是宫里的舞，慢步，一步一停，手举得很高。酒馆里的人看着他笑。他红着脸跳了半圈，然后忽然放下了手，学着旁边的农夫跺起脚来。他学得很快。',
  petr:'彼得光着脚跳，闭着眼睛，跳得不像舞，像祷告。跳着跳着，整个酒馆的人都跟着他闭上了眼睛，撞成了一团。',
  ilona:'伊洛娜跳的是平原上的舞，转圈，拍手，跺脚，越转越快。跳完，她跳上桌子，用德语喊：<q>谁敢跟我喝？</q>三个皮塞克的车夫被她喝到了桌子底下。',
  matej:'马捷伊跳舞的时候在心里数拍子，数出了声：<q>一二三，一二三。</q>他说这和波爱修的音乐论是一个道理。他踩了你四次脚，每一次都道歉，用的是拉丁文。',
  eliska:'爱丽什卡跳得很好，跳的时候还在你耳边说话：那个吹风笛的欠谁钱，那个胖老板娘的啤酒兑了多少水，那个跳得最起劲的人老婆在哪里。说着说着，她不说了，把头靠在了你肩上。'
};
outingDef('dance', ['tavern', 'mtavern', 'bbrew'], {t:'跳舞', la:'Chorea', cond: S => S.ph >= 1,
  text: S => `酒馆里，一个吹风笛的和一个拉三弦提琴的在比谁的声音大。桌子推到了墙边，人们拉成一个圈在跳。塔博尔的传道人说跳舞是魔鬼在转圈；酒馆老板说，那魔鬼的腿脚可真不错。

${DANCE_W[dateWho('dance')]}`,
  opts:[
    {t:'跳到天亮', cost:3, fx: S => ({app:{[dateWho('dance')]:6}, mind:3}), r:'你们跳到了天亮，跳到吹风笛的趴在桌上睡着了，拉琴的断了两根弦。出门的时候，天是蓝的，街是空的，你们的腿都在抖，还在笑。'},
    {t:'跳一支，就坐下来喝酒', cost:1, fx: S => ({app:{[dateWho('dance')]:3}, mind:2}), r:'你们跳了一支，就坐到角落里喝酒，看着别人跳。在吵吵嚷嚷的酒馆里，你们俩说话都要凑到对方耳边，凑着凑着，就不说话了。'}
  ]});

// 多罗塔的情药
const CHARM_W = {
  katka:'过了七天，卡佳说她这几天梦见的全是你。梦里你在赶车，赶得很烂。',
  zden:'过了七天，齐德涅克去告解，说他这七天犯了一种他说不出名字的罪：总是想着同一个人。神父问他想的是谁。他说，这个不在罪里。',
  petr:'过了几天，彼得在枕头里摸到了那个小布包，拆开闻了闻，笑了，又一针一针地缝了回去。<q>马鞭草，</q>他对你说，<q>不需要的。可是谢谢。</q>',
  ilona:'过了七天，伊洛娜说她的马这几天总是跟着你走。你没有告诉她，你也往马的草料里放了一点。',
  matej:'过了几天，马捷伊发现了那个布包。他写了一篇短文，驳斥爱情药的有效性，论证很严密。写完，他把布包缝回了枕头里。',
  eliska:'过了几天，爱丽什卡发现了那个布包，跑去问多罗塔要配方。她说要用马鞭草酿一种新啤酒，名字都想好了，叫“七天”。'
};
outingDef('charm', ['manor'], {t:'马鞭草', la:'Verbena', cond: S => S.f.dorota && S.f.dorotaSettled,
  text: S => `多罗塔把你叫进厨房，关上门，从围裙里掏出一个小布包。

<q>马鞭草，</q>她压低了声音，<q>圣约翰夜之前采的，晒干了。加一根你的头发，缝在${nm(dateWho('charm'))}的枕头里。七天之内，那双眼睛里就只有你。</q>她往窗外看了一眼，<q>扬神父知道了要骂我的。所以别让他知道。</q>`,
  opts:[
    {t:'缝进枕头里', lens:1, fx: S => ({app:{[dateWho('charm')]:6}, lens:1, set:{charmed:dateWho('charm')}}),
      r: S => `${S.lens > 0 ? '你拔了一根头发，和马鞭草一起缝了进去。那天夜里，你梦见了一片开满紫色小花的山坡。' : '你拔了一根头发，和马鞭草一起缝了进去。卢卡什修士说过，马鞭草泡水，能让人睡得好。'}\n\n${CHARM_W[dateLast()]}`},
    {t:'谢谢她，把布包塞回她的围裙里', r:'多罗塔哼了一声，把布包收了回去。<q>年轻人，</q>她说，<q>都以为自己用不着。</q>她往灶里添了一根柴，又说，<q>你父亲当年也是这么说的。后来他还是来找我要了。</q>'}
  ]});

// ---------- 私订终身：教会法里，用现在时说一句话就算结婚 ----------
const vowWho = () => S.lovers.find(id => inParty(id) && alive(id) && cm(id).rom >= 3 && app(id) >= 75);
const VOWS_TXT = {
  katka:{t:'车链子', text:'卡佳把你拉到车阵中间，车阵里的弟兄姐妹们围了一圈，有人举着火把，有人在笑。\n\n<q>塔博尔结婚不找神父，</q>卡佳说，脸红得像火把，<q>找弟兄姐妹。两个人站在大家面前，说一句话，就算数。</q>她手里攥着一截从车链上拆下来的铁环，用钳子掰开了一道口子，<q>戒指。别嫌难看。</q>',
    r:'你说了。她也说了。她把那截铁环掰弯了，套在你的手指上，又用钳子夹紧，夹得你龇牙咧嘴。\n\n车阵里的人一齐唱起歌来，唱的是上帝的战士。这不是一支婚礼的歌，可他们只会这一支。卡佳在歌声里吻你，吻得整个车阵都在敲车板。', end:'那年夏天，你们在塔博尔的车阵里，当着弟兄姐妹的面结了婚。你手上的戒指是一截车链，一直戴到老。'},
  zden:{t:'教堂门口', text:'齐德涅克把你带到了一座小教堂的门口。夜里，门关着。\n\n<q>按照教会法，</q>他说，声音很稳，像是练过很多遍，<q>两个人用现在时说出愿意，就是夫妻。不用神父，不用证人。亚历山大教皇定的。</q>他停了一下，<q>我知道不用。可我还是想在教堂门口说。我想让门里面的那一位听见。</q>\n\n他摘下了手上那枚刻着玫瑰的戒指。',
    r:'<q>我接受你，</q>他说，<q>现在。</q>你也说了。他把那枚玫瑰戒指戴在你的手上，戴得很慢。\n\n<q>玫瑰家的人知道了，会把我赶出去，</q>他说。他看起来一点也不担心。教堂的门关着，里面一点声音也没有。可是你们俩都觉得，有人听见了。', end:'那年夏天，你们在一座小教堂紧闭的门口私下结了婚。玫瑰家后来知道了。齐德涅克没有后悔过。'},
  petr:{t:'每天一次', text:'你说起教会法，说起用现在时说一句话就能结婚。彼得听完，摇了摇头。\n\n<q>我不娶你，</q>他说，<q>结婚是一只杯子，盖子一盖，一辈子。</q>他看着你，眼睛在火光里很亮，<q>我每天早上醒来的时候，娶你一次。用现在时。明天早上，再娶一次。你要是哪一天不想了，那天早上就别答应。</q>',
    r:'第二天早上，他醒来，看着你，说：<q>我接受你。今天。</q>你说：<q>我接受你。今天。</q>\n\n第三天早上，他又说了一遍。第四天也是。后来你们说成了习惯，像早上要喝水一样。有一天早上他忘了，你等了很久，他才想起来，跳起来补上，说他罪该万死。', end:'彼得没有娶你。他每天早上娶你一次，用现在时。他一次也没有漏过，除了那一天早上，他后来补上了。'},
  ilona:{t:'一支箭', text:'伊洛娜拿出她那只装马奶酒的皮囊，倒了一碗，一半是你的，一半是她的。\n\n<q>库曼人结婚，</q>她说，<q>两个人喝一碗酒，然后往天上射一支箭，箭落在哪里，就在哪里扎毡帐。</q>她把弓塞给你，<q>你射。射远一点。射近了，毡帐就扎在马粪上。</q>',
    r:'你们喝了那一碗酒，酸得你们都皱起了脸。你射了一箭，箭飞进黑暗里，不知道落在了哪里。\n\n<q>好，</q>伊洛娜说，<q>那就是到处。</q>她剪下你的一绺头发，编进了她的辫子里，在辫梢上系了一个新的铜铃。<q>长生天看见了，</q>她说，<q>你们的上帝要是没看见，你明天再告诉他。</q>', end:'那年夏天，你们按库曼人的规矩结了婚。那支箭一直没有找到。伊洛娜说，所以你们的毡帐扎在哪里都可以。'},
  matej:{t:'教会法第四卷', text:'马捷伊在火边坐了很久，一直在翻一本很厚的书。最后他合上书，摘下了眼镜。\n\n<q>按照教会法，</q>他说，<q>两个人用现在时说出愿意，就是有效的婚姻。不用神父。</q>他停了一下，<q>按照教会法，神父不能结婚。可是塔博尔已经有神父结婚了。按照圣经，彼得是有岳母的。</q>他深吸了一口气，<q>所以我的结论是——</q>\n\n他又停住了。<q>我是神父。神父可以证婚。</q>',
    r:'他自己给自己证婚。他先用拉丁文念了一段，然后转过来对着你，用捷克语说：<q>我接受你，现在。</q>你说了。他又转回去，用拉丁文宣布：你们是夫妻了。\n\n<q>这在逻辑上有一点问题，</q>他说，<q>我决定不去想它。</q>他想了一整夜，想到天亮，一直在笑。', end:'那年夏天，马捷伊给自己证了婚，新娘新郎之一是他自己。他后来说，这是他这辈子做过的最不合逻辑、也最正确的一件事。'},
  eliska:{t:'契约', text:'爱丽什卡从斗篷里掏出一张折好的羊皮纸，展开，铺在你面前。上面写满了字，一条一条，编了号。\n\n<q>我不能嫁人，</q>她说，<q>遗嘱上写着，寡妇再嫁，酿酒坊归他侄子。可是教会法说，两个人用现在时说一句话，就是夫妻。遗嘱管不着教会法。</q>她用手指点着那张纸，<q>第一条，酿酒坊归我。第二条，你的剑归你。第三条，地窖第七只桶，谁也不许碰……</q>',
    r:'你一条一条地听她念完。最后一条是第九条，她念得很快：<q>第九条，不记账。</q>\n\n你签了字。她也签了。然后她看着你，用现在时说了那句话，说得很轻，一点也不像在谈生意。\n\n她把那张契约折好，放进了地窖第七只桶里，和那本账本放在一起。', end:'那年夏天，你们签了一张九条的契约，用现在时说了一句话。那张契约一直锁在新城酿酒坊的地窖里。第九条，你们一直守着。'}
};

const MV_N = {cut:'劈', parry:'格', evade:'闪', bind:'撞'};
const HUSSITE_R = ['tabor', 'prague', 'pisek', 'usti'], ROMAN_R = ['rose', 'budej', 'kutna', 'camp'];
const slotOf = k => Object.keys(GEAR).find(s => GEAR[s].some(g => g.k === k));
const gOn = sl => GEAR_BY[(S.gear || {})[sl]] || GEAR_BY[GSLOT_DEF[sl]] || {};
function gearInit() {
  if (!S) return;
  for (const [sl, d] of Object.entries(GSLOT_DEF)) if (!S.gear[sl] || !GEAR_BY[S.gear[sl]]) S.gear[sl] = d;
  S.inv = S.inv || []; S.bag = S.bag || {};
}
const badgeMod = () => HUSSITE_R.includes(S.region) ? 1 : ROMAN_R.includes(S.region) ? -1 : 0;
// 随身物和马给检定加的点
function gearStat(stat) {
  const out = [];
  for (const sl of ['horse', 'charm']) {
    const g = gOn(sl); let d = (g.stat && g.stat[stat]) || 0;
    if (g.where && stat === 'grace') d += badgeMod();
    if (d) out.push([g.n, d]);
  }
  return out;
}
const gearMv = m => ['weapon', 'shield', 'armor'].reduce((a, sl) => a + ((gOn(sl).mv || {})[m] || 0), 0);
const gearBlock = () => Math.min(.7, (gOn('armor').b || 0) * .25 + (gOn('helm').blk || 0) + (gOn('shield').blk || 0));
const gearRead = () => (gOn('helm').read || 0) + (S.f.hubertDrill ? 1 : 0);
const fastRide = () => !!gOn('horse').fast && !gOn('pack').slow;
function gearEff(g, sl) {
  const e = [];
  if (sl === 'weapon' && g.b) e.push(`决斗 +${g.b}`);
  if (sl === 'armor' && g.b) e.push(`挡伤 ${g.b * 25}%`);
  if (g.blk) e.push(`挡伤 +${Math.round(g.blk * 100)}%`);
  for (const [m, d] of Object.entries(g.mv || {})) e.push(`${MV_N[m]} ${d > 0 ? '+' : '−'}${Math.abs(d)}`);
  if (g.read) e.push(`读兆 −${-g.read}`);
  if (g.fast) e.push('赶路快一倍');
  for (const [k, d] of Object.entries(g.stat || {})) e.push(`${STAT_N[k]} +${d}`);
  if (g.where) e.push('口才 ±1，看在哪里');
  if (g.trade) e.push('买卖时占便宜');
  if (g.cap) e.push(`能驮 ${g.cap} 担`);
  if (g.slow) e.push('快马拉不快');

    {t:'镇定地说：<q>就是些盐。</q>', chk:'grace', vow:'lie', fx:{xp:{grace:1}}, ffx: S => { delete S.cargo.silver; return {money:-20, rep:{crown:-3}, honor:-2}; },
      r:'他用刀尖捅了捅一只口袋，盐漏了出来。他尝了一点，皱着眉头走了。', f:'他用刀尖捅了捅一只口袋，掉出来的不是盐。他什么也没说，把你的银子一块一块地收走，又从你的钱袋里拿走了二十个格罗申。<q>罚金，</q>他说，<q>你该谢谢我没把你吊起来。</q>'},
    {t:'交出来', fx: S => { delete S.cargo.silver; return {rep:{crown:-2}, honor:-1}; }, r:'你把银子交了出来。他记下了你的名字和你的纹章，记得很仔细。'},

      r:'你一夹马肚子冲了过去，他们在后面喊，喊着喊着就不喊了：国王的马，也是国王的饷钱喂的，跑不了多远。', f:'你没冲过去。他们把你从马上拖下来，银子收走了，你的肋骨上挨了一下。'}

}, {

  opts:[

  t:'路上的买主', la:'Emptor',
  text: S => `路边歇着一辆车，车上坐着一个${pick(['纽伦堡来的布商', '赶着去布拉格的修院管事', '从林茨来的盐商', '一个说话很慢的犹太商人'])}。他看见你车上的${GOODS[S.f.buyerG].n}，站了起来。\n\n<q>这些我都要了，</q>他说，<q>一担 ${Math.round(GOODS[S.f.buyerG].p * 1.3)} 个格罗申。不用进城，不用交税，不用等。</q>`,
  opts:[

      return [`<span class="chip verd">格罗申 +${got}</span>`]; },
      r:'他数钱数得很快，数完了又数一遍，然后把钱袋放在你手里，连袋子都给了你。'},
    {t:'不卖', r:'他耸耸肩，坐回车上。<q>前面的价钱未必比我好，</q>他说，<q>前面的路也未必比这里太平。</q>'}
  ]
});

  sudomer:{at:'ponds', who:'塘长', d:'管鱼塘的人叫塘长，是全村唯一戴皮帽子的人。他说，鱼塘比城堡难管：城堡不会自己跑掉，鱼会。'},
  tabor:{at:'tubs', who:'公社的长老', d:'木桶边上坐着几个长老，管着桶里的钱。在塔博尔，干活不叫挣钱，叫“为兄弟们出力”。可是出了力，长老还是会从桶里抓一把给你。'},
  forest:{at:'mill', who:'磨坊主', d:'磨坊主不雇人。可是林子里的人有事都来磨坊说，磨坊主听着，记着，有时候就转过头来看你。'},
  rose:{at:'hall', who:'玫瑰家的管家', d:'管家穿着红白两色的号衣，手里一根银头的手杖。罗森堡家事多，人少，钱多。'},
  kutna:{at:'mint', who:'铸币官的书记', d:'意大利院的拱门底下，铸币官的书记坐在一张铺着绿呢子的桌子后面数钱。一枚一枚地数，数完了称，称完了再数。'},
  prague:{at:'oldtown', who:'老城市政厅', d:'老城市政厅的墙上贴着告示，一半是捷克文，一半是拉丁文，还有一张德文的，被人用刀划了一个大叉。'},
  camp:{at:'tents', who:'军需官', d:'军需官是个纽伦堡人，一张脸红得像他账本上的朱砂。全欧洲的骑士都来了，没有一个想到要带够燕麦。'},
  usti:{at:'ferry', who:'渡工', d:'渡工不说话，可是他什么都知道。两岸的人托他带东西、带信、带人。他收钱，也收托付。'},
  strak:{at:'cmdry', who:'骑士团的总管', d:'总管是个瘸腿的老修士，年轻的时候在罗得岛守过城墙。骑士团的地多，村子多，账也多。'},
  budej:{at:'bbrew', who:'酿酒行会', d:'行会大厅的长桌尽头坐着行会长，面前一大杯啤酒。从来没人见他喝完过，也从来没人见它空过。'}
};

  coins:{kind:'parcel', from:['kutna'], to:'pisek', at:'square', pay:45, sz:1, pn:'一袋新铸的格罗申', n:'新铸的格罗申',
    give:'铸币官的书记把一只沉甸甸的口袋放在绿呢子上，用火漆封了三道。<q>皮塞克市政厅的，</q>他说，<q>城墙上的兵三个月没发饷了。路上要是有人问你口袋里是什么，你就说是钉子。</q>',

  carp:{kind:'parcel', from:['sudomer'], to:'prague', at:'oldtown', pay:50, sz:2, days:3, pn:'两桶活鲤鱼', n:'活鲤鱼',
    give:'塘长挑了二十条最大的鲤鱼，放进两只装满水的木桶，桶口蒙着湿麻布。<q>老城的一个议员娶儿媳妇，</q>他说，<q>婚宴上一个人一条鲤鱼。三天，三天以后它们就翻白肚皮了，议员就要翻脸了。</q>',
    end:{t:'婚宴上的鲤鱼', la:'Nuptiae', text:'议员家的厨房里，厨子们已经在烧水了。管家掀开麻布，一条鲤鱼从桶里跳出来，在石头地上蹦，满厨房的人都在追它。\n\n议员本人下来看了一眼，很满意。<q>苏多梅日的鱼，</q>他说，<q>杰士卡在那里打赢了一仗，那里的鱼都比别处的有劲。</q>他请你留下来喝喜酒。',

  bolts:{kind:'parcel', from:['pisek'], to:'tabor', at:'wagons', pay:35, sz:2, pn:'两箱弩箭头', n:'两箱弩箭头',

  relic:{kind:'parcel', from:['kutna'], to:'budej', at:'dominic', pay:60, sz:1, act:2, pn:'一只镀金的圣物匣', n:'圣普罗科普的指骨', who:['heinrich'],
    if: S => !S.f.budejWanted && alive('heinrich'),
    give:'铸币官的书记把你领到后屋。一个穿白袍的老修士坐在那里，怀里抱着一只镀金的小匣子。<q>塞德莱茨的修士们怕塔博尔人来，</q>书记说，<q>要把一些东西送到布杰约维采的多明我会去。修院付钱，我们只是牵线。</q>\n\n匣子里，丝绒上躺着一截发黄的指骨。老修士说，那是圣普罗科普的。',
    end:{t:'指骨', la:'Reliquiae', text:'海因里希修士亲自出来接。他打开匣子看了很久，久到你以为他在祷告。\n\n<q>圣普罗科普，萨扎瓦修院的院长，死了快四百年了，</q>他终于说。他把匣子合上，<q>你知道这样的指骨全欧洲有多少截吗？够拼出三个圣普罗科普来。</q>他看着你，<q>可是信的人跪下去的时候，跪的不是骨头。这个，塔博尔人永远不懂。</q>',

    fail:'那只圣物匣没有按时送到布杰约维采。塞德莱茨的修士们以为它被塔博尔人抢走了，为它念了一台弥撒。'},
  // ---- 信 ----
  hedge:{kind:'letter', from:['pisek'], to:'rose', at:'hall', pay:30, n:'给玫瑰堡的信',
    give:'米库拉什书记把一封信塞进你手里，火漆上没有市政厅的印，只有一个拇指按出来的坑。<q>给玫瑰堡的管家，</q>他说，<q>亲手交给他。别给别人看，也别自己看。</q>',
    peek:{t:'信是拉丁文写的，写得很小心。皮塞克的三个议员向罗森堡老爷保证：十字军若来，皮塞克开城门；作为回报，老爷保住他们的房子、地和葡萄园。第一个签名的是米库拉什。',

    alt:{t:'皮塞克的信', la:'Proditio', text:'长老们传着看那封信，看完了，谁也没有说话。最后一个长老把信折起来放进怀里。\n\n<q>皮塞克，</q>他说，<q>迟早是兄弟们的。到那一天，这三个人的房子，就是兄弟们的房子。</q>',

    end:{t:'修女的信', la:'Soror', text:'她弟弟是个高个子的年轻人，站在一辆大车上讲道，讲的是巴比伦的大淫妇。看见你手里的信，他从车上跳下来，在裤子上擦了擦手，才接过去。\n\n他读得很慢。读到一半，他转过身去。车阵里的风很大，把他的头发吹得乱七八糟。',

  powder:{kind:'letter', from:['tabor'], to:'prague', at:'newtown', pay:25, act:2, n:'给热利夫斯基的信', who:['zeliv'],
    if: S => alive('zeliv'),
    give:'长老们把一封信缝在一块皮子里交给你。<q>给新城的热利夫斯基神父，</q>一个长老说，<q>亲手交给他。路上要是被人拦住，就把它吞下去。</q>他看你的样子不像在开玩笑。',
    peek:{t:'信上写着：塔博尔要四十桶火药、一百支手铳，七月以前运到维特科夫山下；塔博尔的兄弟们会来守布拉格。信的最后画了一张小地图，标着车阵要扎在哪里。',
      alt:{to:'camp', at:'tents', pay:60, t:'卖给十字军的军需官', d:'这张地图，有人愿意出大价钱'}},
    end:{t:'给热利夫斯基的信', la:'Epistola', text: j => `热利夫斯基读信读得很快。读完了，他把信凑到蜡烛上烧了。<q>写信的人以为纸会守秘密，</q>他说，<q>纸什么都不守。</q>\n\n他看着你。${j.x.peeked ? '你看过它，你自己知道。' : ''}<q>你看过吗？</q>`,
      opts: j => [{t:'<q>没有。</q>', vow: j.x.peeked ? 'lie' : undefined, fx: () => jobEnd(j, 1, 1, {rep:{tabor:3, prague:2}}), r:'他看了你很久，然后点了点头。<q>好，</q>他说，<q>不管是真的还是假的，你说得很好。</q>'},
        {t:'<q>看过。</q>', if: () => j.x.peeked, fx: () => jobEnd(j, 1, 1, {rep:{tabor:2, prague:1}, honor:2}), r:'他笑了，这是你第一次看见他笑。<q>那你就知道七月会发生什么了，</q>他说，<q>你也就有了选择。大多数人没有。</q>'}]},
    alt:{t:'莱特纳的买主', la:'Proditio', text:'纽伦堡人读完信，眼睛亮了。他把那张小地图凑到灯下看了很久，然后开始数钱，数得比平时大方。\n\n<q>上帝的事，</q>他说，<q>也要有人送信。</q>',
      opts: j => [{t:'收下钱', fx: () => jobEnd(j, 1, 0, {rep:{crown:8, tabor:-10}, honor:-6, mind:-2, set:{powderSold:1}, app:{katka:-10, zden:-3}}), r:'你走出帐篷的时候，天已经黑了。营地里到处是火，每一堆火边都有人在磨剑。七月还很远。七月也很近。'}]},
    fail:'那封信没有按时送到。塔博尔的长老们又派了一个人，这一回，他们没有用信。'},
  miner:{kind:'letter', from:['kutna'], to:'budej', at:'bbrew', pay:12, act:2, n:'矿工的情书', if: S => !S.f.budejWanted,
    give:'铸币官的书记递给你一封信，信上的字很漂亮。<q>不是我的，</q>他说，<q>是一个德意志矿工的。他不会写字，花了两个格罗申请我替他写。给布杰约维采酿酒行会的一个姑娘，叫格蕾特。他自己出不了城，矿上不放人。</q>',
    peek:{t:'<q>格蕾特：我又下井了。井底很黑，我就想你的头发。工头说这个夏天要往下再挖二十寻，挖到了，工钱加倍。如果这个夏天井不塌，秋天我就来娶你。</q>'},
    end:{t:'格蕾特', la:'Margareta', who:'grete', text:'格蕾特在行会的地窖里刷酒桶，袖子挽到胳膊肘，胳膊上全是酒糟。她听说有她的信，在围裙上擦了很久的手。\n\n她不识字。她把信递回给你：<q>您念给我听吧。</q>',
      opts: j => [{t:'一字一句地念', fx: () => jobEnd(j, 1, 1, {mind:1, set:{greteRead:'all'}}), r:'你念到“我就想你的头发”，她笑了，摸了摸自己的辫子。念到最后一句，她不笑了。\n\n<q>二十寻，</q>她说，<q>二十寻是多深？</q>你说了。她点点头，把信叠起来，放进围裙的口袋里，又去刷酒桶了。刷得比刚才用力。'},
        {t:'念到“秋天我就来娶你”，前面那半句不念', fx: () => jobEnd(j, 1, 1, {mind:1, set:{greteRead:'kind'}}), vow:'lie',
          r:'她听完了，脸红了，用沾着酒糟的手捂住了脸。<q>秋天，</q>她说，<q>秋天行会要酿十月的啤酒，最忙了。</q>她想了想，<q>那就冬天吧。冬天也好。</q>'}]},
    fail:'那封情书没有送到。格蕾特一直以为，他忘了她。'},
  mother:{kind:'letter', from:['usti'], to:'prague', at:'carolinum', pay:10, act:2, n:'母亲的信',
    give:'渡工从船舱底下摸出一封信，信封是一片桦树皮。<q>城里一个寡妇的，</q>他说，难得说了一整句话，<q>给她在布拉格读书的儿子。</q>',
    peek:{t: S => `树皮上的字是用炭写的：<q>儿子：${S.f.ustiBurned ? '城烧了。' : '他们说城要烧了。'}我们上了山。你父亲说你读书读成了德意志人，叫你别回来。我说你要回来。你回来吧，或者别回来，你自己定。别饿着。</q>`},
    end:{t:'树皮上的信', la:'Cortex', who:'student', text:'学生叫雅库布，十九岁，在查理学院读文学，袖口磨得发亮。他认出了那片树皮，脸一下子白了。\n\n他读完了，读了两遍，然后坐在台阶上，很久没有说话。<q>我父亲说得对，</q>他终于说，<q>我是读书读成了别的人。可是我不知道我读成了谁。</q>',
      opts: j => [{t:'<q>回去吧。</q>', fx: () => jobEnd(j, 1, 1, {set:{jakubHome:1}}), r:'他点点头，站起来，把树皮塞进怀里。<q>书带不走，</q>他说，<q>山上没有图书馆。</q>他想了想，<q>那就把它们背下来。</q>'},
        {t:'<q>留下来，把书读完。</q>', fx: () => jobEnd(j, 1, 1, {set:{jakubHome:0}, app:{matej:3}}), r:'他没有说话，只是把树皮夹进了一本书里，夹在奥古斯丁的《忏悔录》中间。你走的时候，他还坐在台阶上，书摊在膝盖上，一页也没有翻。'}]},
    fail:'那片桦树皮没有送到布拉格。雅库布一直不知道家里出了什么事，直到秋天。'},
  // ---- 护送 ----
  widow:{kind:'escort', from:['pisek'], to:'prague', at:'oldtown', pay:25, act:2, n:'朝圣的寡妇', who:'widow', pn:'一个朝圣的寡妇',
    give:'米库拉什书记身边站着一个老妇人，裹着一条黑头巾，手里拄着一根比她还高的棍子。<q>她要去布拉格，</q>书记说，<q>去伯利恒小教堂，胡斯讲道的地方。她丈夫五年前死在康斯坦茨的路上。一个人走，路上不太平。</q>',
    end:{t:'伯利恒小教堂', la:'Bethlehem', text:'伯利恒小教堂在老城的一条小街上，门很窄，里面很大，墙上写满了字。寡妇在门口站了很久，然后跪下去，亲了亲门槛。\n\n<q>他听过这里的每一场讲道，</q>她说，<q>回家就讲给我听，讲得不对，我就笑他。后来他跟着胡斯去了康斯坦茨，走到半路，死在了一个德意志的村子里。</q>她从怀里摸出一枚小小的锡章，铸着一只杯子，<q>这是他的。我老了，戴不动了。</q>',
      opts: j => [{t:'收下锡章，也收下工钱', fx: () => { if (!owns('badge')) stash('badge'); return jobEnd(j, 1, 1, {mind:2}); }, r:'你把锡章收好。它很轻，轻得像什么也没有。'},
        {t:'收下锡章，工钱不要了', fx: () => { if (!owns('badge')) stash('badge'); return jobEnd(j, 0, 2, {mind:3, honor:2}); }, r:'她看着你，像看着一个很久以前认识的人。<q>他也是这样，</q>她说，<q>讲道的人请他喝酒，他总是不喝。</q>'}]},
    fail:'那个寡妇等不及，自己走了。后来有人说在布拉格见过她，跪在一扇很窄的门前面。'},
  doctor:{kind:'escort', from:['budej'], to:'prague', at:'oldtown', pay:50, act:2, n:'犹太医生', who:'doctor', pn:'亚伯拉罕医生',
    give:'行会长指了指角落里的一个人：黑胡子，深色的斗篷，一只沉甸甸的皮箱子。<q>亚伯拉罕医生，</q>行会长说，<q>治好过我的痛风。他要回布拉格的犹太城，可是这条路上，十字军的人和塔博尔的人都不太喜欢犹太人。你骑马，你带剑。</q>',
    end:{t:'犹太城的门口', la:'Iudaeorum oppidum', text:'老城的北边，一道矮墙，一扇木门，门后面是一座很老的会堂，屋顶陡得像一顶尖帽子。亚伯拉罕在门口停下来，把皮箱子换到左手。\n\n<q>三十一年前的复活节，</q>他说，<q>这扇门外面的人冲了进来。我祖母那时候八岁，她藏在会堂的阁楼上，藏了三天。</q>他看了看老城的方向，那边的钟正在响，<q>你们的胡斯说，人应该读自己的语言写的《圣经》。我们这样读，已经读了两千年了。</q>',
      opts: j => [{t:'收下工钱', fx: () => jobEnd(j, 1, 1, {}), r:'他付了钱，又从皮箱子里拿出两小罐药膏塞给你。<q>不收钱，</q>他说，<q>是给路上的。路上总有人受伤。</q>', run: () => { S.bag.salve = (S.bag.salve || 0) + 2; return ['<span class="chip verd">药膏 +2</span>']; }},
        {t:'<q>你还会再走这条路吗？</q>', fx: () => jobEnd(j, 1, 1, {mind:2, lens:-1}), r:'<q>会，</q>他说，<q>病人在哪里，路就在哪里。</q>他推开木门，回头看了你一眼，<q>下回你病了，就来这里找我。门是开的。</q>'}]},
    fail:'亚伯拉罕医生等不及，跟着一支盐车队走了。后来你听说他平安到了布拉格。'},
  novice:{kind:'escort', from:['budej'], to:'tabor', at:'hill', pay:0, act:2, n:'逃出来的见习修女', who:'novice', pn:'见习修女玛格达', if: S => !S.f.budejWanted,
    give:'行会长没有说话，只是用下巴指了指地窖的门。地窖里坐着一个女孩，十六七岁，穿着见习修女的白袍子，袍子的下摆全是泥。\n\n<q>玛格达，</q>行会长小声说，<q>她父亲把她送进了修院，她不想待。她要去塔博尔，说那里女人也能讲道。没有钱。行会不能管这件事，所以我什么也没跟你说。</q>',
    end:{t:'塔博尔的姐妹', la:'Sorores', text:'布道场上，一群女人正在听一个女人讲道。讲道的是个寡妇，讲的是《使徒行传》，讲得比男人还响。\n\n玛格达站在人群最后面，听了一会儿，把头上的白头巾解了下来。她的头发剪得很短，是她自己在修院里拿剪羊毛的剪子剪的。',
      opts: j => [{t:'<q>到了。</q>', fx: () => jobEnd(j, 0, 1, {money:15, rep:{tabor:4, rose:-2}, honor:2, app:{katka:4, zden:-3}}), r:'她从手指上摘下一枚银戒指，塞进你手里：<q>修院的戒指，我嫁给基督的那一枚。</q>她笑了一下，<q>现在不嫁了。卖了吧，够你喝几回酒。</q>然后她挤进了人群，再也没有回头。'}]},
    fail:'玛格达等不及，一个人走了。你不知道她到没到塔博尔。'},
  groom:{kind:'escort', from:['strak'], to:'sudomer', at:'ponds', pay:20, n:'赶去婚礼的新郎', pn:'一个新郎',
    give:'总管身边站着一个年轻人，穿着他父亲的婚礼外套，袖子长了一截。<q>骑士团的佃户，</q>总管说，<q>要去苏多梅日娶塘长的女儿。他自己走，一准迷路。他上次去，走到了皮塞克。</q>',
    end:{t:'塘堤上的婚礼', la:'Nuptiae', text:'婚礼就在塘堤上办，桌子从这头摆到那头。塘长的女儿戴着麦穗编的花冠，比新郎高半个头，看见他来了，一把揪住他的袖子，把长出来的那截挽了上去。\n\n<q>迷路了没有？</q>她问。<q>没有，</q>新郎说，看了你一眼，<q>有人带着。</q>',
      opts: j => [{t:'留下来喝喜酒', takes:true, fx: () => jobEnd(j, 1, 1, {mind:3}),
          r: () => `塘里捞上来的鲤鱼用啤酒煮，煮了三大锅。天黑以后，人们在塘堤上跳舞，一直跳到塘里的青蛙都不叫了。有人说，这道塘堤，春天的时候死过人。那是另一回事了。${loverHere() ? `\n\n${nm(loverHere())}在塘堤上牵住了你的手，说这里的风比别处的好。` : ''}`},
        {t:'拿了工钱就走', fx: () => jobEnd(j), r:'你走的时候，新郎追出来，塞给你一块蜂蜜蛋糕，用一片很大的叶子包着。'}]},
    fail:'新郎等不及，一个人走了。他走到了斯特拉科尼采的另一头。'},
  kids:{kind:'escort', from:['usti'], to:'liuxi', at:'village', pay:0, n:'渡口的孩子', who:'kids', pn:'三个孩子', if: S => S.f.ustiBurned,
    give:'渡工的船上坐着三个孩子，最大的那个抱着最小的那个。渡工看了看孩子，又看了看你。<q>城里的，</q>他说，<q>爹娘上了山，没回来。</q>他想了想，又说了一句，<q>你家有地。</q>',
    end:{t:'柳溪的新人', la:'Advenae', text:'母亲站在村口，看着你从马上抱下来三个孩子。最小的那个已经睡着了，手里还攥着一根渡船上的缆绳头。\n\n母亲没有问什么。她把最小的那个接过去，用自己的围裙裹住。<q>老伊日，</q>她说，<q>烧水。</q>',
      opts: j => [{t:'<q>他们留在柳溪。</q>', fx: () => { estInit(); S.f.eRefugees = (S.f.eRefugees || 0) + 1; return jobEnd(j, 0, 1, {rep:{home:4}, mind:2, honor:2, t:{anna:6}, set:{ustiKids:1}}); }, r:'那天晚上，庄园的厨房里多了三张嘴。最大的那个孩子一直不说话，吃完了饭，自己把碗洗了，洗得很干净。'}]},
    fail:'那三个孩子等不及，跟着一辆去塔博尔的车走了。'},
  // ---- 讨债 ----
  brother:{kind:'debt', from:['pisek'], to:'tabor', at:'tubs', pay:25, n:'塔博尔的旧债',
    give:'<q>城里的染匠翁德热欠布商哈韦尔四十个格罗申，</q>米库拉什书记说，<q>欠了两年。去年冬天，他把染缸一卖，上了塔博尔的山。去把钱要回来，要回来一半归你。</q>',
    end:{t:'没有你的我的', la:'Debitum', text:'染匠翁德热的手还是蓝的，染缸卖了，颜色洗不掉。他听你说完，笑了。\n\n<q>在塔博尔，没有你的我的，</q>他说，<q>我上山的那天，把所有的东西都放进了木桶，连债也放进去了。哈韦尔要钱，让他上山来，自己去木桶里拿。</q>旁边的长老们没有说话，可是都在听。',
      opts: j => [{t:'<q>债就是债。</q>', chk:'grace', fx: () => jobEnd(j, 1, 1, {rep:{tabor:-1}}), ffx: () => jobEnd(j, .4, 0, {rep:{tabor:-2}}),
          r:'你说了很久。最后一个长老站起来，从木桶里数出了四十个格罗申。<q>欠的是欠的，</q>他说，<q>塔博尔不赖账。可是哈韦尔要是上了山，这钱还是要回到桶里来。</q>',
          f:'长老们听完了，只从桶里数出了十几个格罗申。<q>剩下的，</q>他们说，<q>算是哈韦尔为兄弟们出的力。</q>'},
        {t:'<q>那就算了。</q>', fx: () => jobEnd(j, 0, -1, {rep:{tabor:5}, honor:1, app:{katka:4}}), r:'翁德热用蓝色的手拍了拍你的肩膀。<q>兄弟，</q>他说。你回到皮塞克，哈韦尔骂了你一整个下午。'},
        {t:'<q>请长老们评评理。</q>', chk:'lore', fx: () => jobEnd(j, 1, 1, {rep:{tabor:1}, xp:{lore:1}}), ffx: () => jobEnd(j, 0, 0, {rep:{tabor:-3}}),
          r:'你引了《申命记》，七年一免债；又引了《罗马书》，凡事都不可亏欠人。长老们争了一下午，最后定下来：还一半，另一半等第七年。翁德热拿出了自己藏的二十个格罗申，原来他没全放进木桶。',
          f:'你引了《罗马书》。一个长老引了《马太福音》：免我们的债，如同我们免了人的债。大家都看着你。你没有别的经可以引了。'}]},
    fail:'那笔债没有要回来。哈韦尔说，你和翁德热一样，都是塔博尔人。'},
  knight:{kind:'debt', from:['budej'], to:'rose', at:'rtown', pay:30, n:'骑士的酒钱', who:'knight',
    give:'行会长把一张长长的清单摊在桌上：<q>齐博尔爵士，玫瑰家的骑士，在我们这里喝了一年，一个子儿也没给。四十二桶。</q>他用手指敲了敲最后一行，<q>他现在住在河湾小城。钱要回来，三成归你。</q>',
    end:{t:'齐博尔爵士', la:'Ctiborius', text:'齐博尔爵士在小城的酒馆里，面前一大杯啤酒，喝的是别家的。他听你念完了清单，打了一个很响的嗝。\n\n<q>四十二桶，</q>他说，<q>我记得是四十桶。那两桶是酸的。</q>他把手放在剑柄上，<q>你是来要钱的，还是来要命的？</q>',
      opts: j => [{t:'<q>来要钱的。酸的那两桶可以不算。</q>', chk:'grace', fx: () => jobEnd(j, 1, 1, {}), ffx: () => jobEnd(j, .5, 0, {}),
          r:'他想了想，大笑起来，从钱袋里数出了四十桶的钱。<q>行会长那个老东西，</q>他说，<q>替我告诉他，下个月我还去。</q>', f:'他讨价还价，最后只肯付一半。<q>另一半，</q>他说，<q>算是我替布杰约维采守了一年的路。</q>'},
        {t:'<q>来要钱的。你不给，我就去城堡里跟你的老爷说。</q>', chk:'nerve', fx: () => jobEnd(j, 1, 1, {rep:{rose:-2}}), ffx: () => jobEnd(j, 0, 0, {rep:{rose:-3}, honor:-1}),

  student:{kind:'debt', from:['prague'], to:'prague', at:'carolinum', pay:15, n:'学生的房钱', who:'student',
    give:'<q>新城的一个寡妇，房子租给了一个学生，</q>市政厅的书记说，<q>半年的房钱，十八个格罗申，一个子儿没给。学生在查理学院。寡妇说，他天天读书，读到半夜，蜡烛钱比房钱还多。</q>',
    end:{t:'学生的房钱', la:'Pensio', text:'学生在学院的回廊里，抱着一本比他胳膊还粗的书。听你说完，他把书放下，翻遍了所有的口袋，翻出来三个格罗申和一块面包。\n\n<q>我只有这个，</q>他说，然后看了看那本书，<q>还有这个。是我的，不是学院的。一本日课经，页边上有画，一个骑士在和一只蜗牛打架。</q>',
      opts: j => [{t:'收下那本书，不要钱', fx: () => { if (!owns('hours')) stash('hours'); return jobEnd(j, 0, 1, {app:{matej:3}}); }, r:'他把书递给你的时候，手指在封皮上停了一下。<q>蜗牛赢了，</q>他说，<q>在第三十七页。您别告诉别人。</q>'},
        {t:'收下三个格罗申，剩下的算了', fx: () => jobEnd(j, .3, 1, {honor:1, app:{matej:2}}), r:'他千恩万谢。你回去告诉寡妇，寡妇叹了口气：<q>他读书读到半夜，我也睡不着。算了，算了。</q>'},
        {t:'<q>去借，明天给。</q>', fx: () => jobEnd(j, 1, 1, {mind:-1, app:{matej:-3}}), r:'第二天他把钱送来了，一枚一枚的，有的是新的，有的磨得看不清国王的脸。你不知道他是从谁那里借的。你也没有问。'}]},
    fail:'那笔房钱没有要回来。寡妇说，读书人都一样。'},
  abbot:{kind:'debt', from:['kutna'], to:'kutna', at:'sedlec', pay:40, act:2, n:'塞德莱茨的账', who:['pavel'], if: S => alive('pavel'),
    give:'铸币官的书记翻开一本账，指着一行：<q>塞德莱茨修院，欠铸币坊一百二十个格罗申，修院墙的钱。</q>他合上账，<q>修士们怕塔博尔人，什么都在往外运，就是不还钱。去要。要回来，三分之一归你。</q>',
    end:{t:'修院的账', la:'Debitum', text:'帕夫尔修士听完，带你去了院长的房间。房间是空的，箱子都打好了包，墙上只剩下挂过画的钉子。\n\n<q>院长已经走了，</q>帕夫尔说，<q>钱也走了。剩下的就是这些。</q>他指了指墙角的一对银烛台，<q>拿去吧。反正塔博尔人来了也是要拿走的。至少你会把它们卖给一个还点蜡烛的地方。</q>',

        {t:'<q>那就记在账上。</q>', fx: () => jobEnd(j, .4, 0, {t:{pavel:6}, app:{zden:3}}), r:'帕夫尔修士在一张纸上写了一张欠条，签了院长的名字。<q>我替他签，</q>他说，<q>反正他也不会回来认了。</q>铸币官的书记看见欠条，叹了口气，还是给了你一点工钱。'}]},
    fail:'那笔账没有要回来。塞德莱茨的修士们走得一个不剩。'},
  // ---- 找人 ----
  son:{kind:'find', from:['pisek'], to:'tabor', at:'wagons', pay:35, n:'粮商的儿子', who:'son',
    give: S => `粮商哈韦尔亲自来找你，帽子拿在手里转。<q>我儿子，</q>他说，<q>${S.f.georgeWon ? '圣乔治节上被您打败的那个，' : ''}上个礼拜跑去了塔博尔。他娘天天哭。您去把他带回来。</q>`,
    end:{t:'车阵里的少爷', la:'Filius', text: S => `你在车阵里找到他的时候，他正在学甩连枷，甩得满头大汗，脸上有一道新的伤口。${inParty('katka') ? '卡佳在旁边看着，抱着胳膊。' : ''}\n\n<q>我不回去，</q>他说，<q>在家里，我是粮商的儿子。在这里，我是兄弟。</q>他看了看自己的手，手上全是泡，<q>他们说，末日来的时候，粮商都要下地狱。</q>`,
      opts: j => [{t:'<q>你娘天天哭。</q>', chk:'grace', fx: () => jobEnd(j, 1, 1, {set:{sonHome:1}}), ffx: () => jobEnd(j, 0, 0, {set:{sonHome:0}}),
          r:'他咬着嘴唇，咬了很久。最后他把连枷还给了车阵，跟你下了山。一路上他一句话也没说，快到皮塞克的时候，他问你：<q>末日要是真的来了，我是不是选错了？</q>',
          f:'他转过身去，又甩起了连枷。你回去告诉哈韦尔，哈韦尔没有说话，把帽子戴上了。'},
        {t:'把他捆回去', chk:'arm', fx: () => jobEnd(j, 1, 1, {rep:{tabor:-3}, honor:-1, set:{sonHome:2}, app:{katka:-5}}), ffx: () => jobEnd(j, 0, -1, {rep:{tabor:-4}, hurt:1}),

    fail:'你没有去塔博尔找粮商的儿子。他娘还在哭。'},
  daughter:{kind:'find', from:['budej'], to:'camp', at:'hungarians', pay:30, act:2, n:'酿酒师的女儿', if: S => S.f.campUp,

    end:{t:'库曼人的帐篷', la:'Cumani', text: S => `她叫莉泽尔，坐在一顶毡帐门口，用库曼人的法子编辫子，编得歪歪扭扭的。她身边的弓手很年轻，脸被太阳晒得黑红，看见你，把手放在了弓上。${inParty('ilona') ? '\n\n伊洛娜用库曼话跟他说了一句什么，他把手放下了，笑了。' : ''}\n\n<q>我父亲派你来的？</q>莉泽尔说，<q>告诉他，我很好。告诉他，这里的人不喝啤酒，喝马奶。</q>`,
