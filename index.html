<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="杯心：1420 年胡斯战争中的波西米亚，一个骑士的春天和夏天。"></head><body>
<title>杯心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+XiaoWei&family=UnifrakturMaguntia&display=swap">
<style>
/* 杯心: Bohemia, spring to high summer 1420. Warm walnut dark instead of 烛心's winter stone; chalice red and meadow green.
   Left: you, your companions, where you stand with each power. Middle: the place you're in and the road out. Right: the journal.
   (Original 烛心 note follows.) Layout: a besieged keep at the winter solstice. Left: you (portrait, arms, oath, the castle's open wounds).
   Middle: the room you stand in, written like a page of a chronicle. Right: the people, the omens, and two rival records of the siege.
   Candle gold = seeing (the uncanny reading), lapis = scrutiny (the reasoned reading), vermilion = rubric and blood.
   One deliberate dark world; the light shifts with the canonical hours (dawn frost, grey noon, candlelit night). */
:root{
  color-scheme:dark;
  --soot:#100e0b; --stone:#1a1712; --stone2:#221e18; --stone3:#2c2720; --line:#352f26; --line2:#463e33;
  --snow:#efe8dc; --ash:#b3aa9b; --dim:#7a7264;
  --flame:#e3a948; --flame-bg:#2e2310; --flame-dim:#9c7531;
  --lapis:#6f93e0; --lapis-bg:#141c30;
  --rubric:#d0402e; --rubric-bg:#2f1410;
  --verd:#7ab36a; --verd-bg:#18240f;
  --overlay:rgba(5,6,8,.82); --shadow:rgba(0,0,0,.5);
  --f-display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-latin:"UnifrakturMaguntia","Noto Serif SC",serif;
  --r:2px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--snow); background:var(--soot);
  font-family:var(--f-body); font-size:15px; line-height:1.75;
}
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:0; transition:opacity 1.2s;
  background:radial-gradient(90% 50% at 50% -10%, rgba(111,147,224,.13), transparent 70%)}
body[data-ph="1"]::after{background:radial-gradient(110% 55% at 50% -12%, rgba(240,214,150,.10), transparent 70%)}
body[data-ph="2"]::after{background:radial-gradient(80% 45% at 50% 110%, rgba(239,177,74,.14), transparent 70%)}
#app{position:relative; z-index:1; max-width:1360px; margin:0 auto; padding-block:14px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:.06em}
button,input,select,textarea{font:inherit; color:inherit}
b,strong{font-weight:600}
.lat{font-family:var(--f-latin); letter-spacing:.02em; color:var(--dim); font-weight:400}
.ash{color:var(--ash)} .dim{color:var(--dim)}
.flame{color:var(--flame)} .lapis{color:var(--lapis)} .rubric{color:var(--rubric)} .verd{color:var(--verd)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.stack{display:flex; flex-direction:column; gap:12px}
.spread{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
:focus-visible{outline:2px solid var(--flame); outline-offset:2px}

/* ---------- buttons ---------- */
.btn{cursor:pointer; border:1px solid var(--line2); background:var(--stone2); padding:8px 16px; border-radius:var(--r);
  letter-spacing:.06em; transition:border-color .15s, background .15s, color .15s}
.btn:hover:not(:disabled){border-color:var(--flame-dim); color:var(--flame)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.primary{background:var(--flame-bg); border-color:var(--flame-dim); color:var(--flame)}
.btn.primary:hover:not(:disabled){background:#3a2b12}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px; font-size:13px}
.btn.danger{border-color:#6a2a22; color:#f08a78; background:var(--rubric-bg)}

/* ---------- chips ---------- */
.chip{display:inline-flex; align-items:center; gap:4px; padding:1px 8px; border:1px solid var(--line2); border-radius:var(--r);
  font-size:12px; color:var(--ash); line-height:1.6; white-space:nowrap}
.chip.flame{color:var(--flame); border-color:var(--flame-dim); background:var(--flame-bg)}
.chip.lapis{color:var(--lapis); border-color:#34497a; background:var(--lapis-bg)}
.chip.rubric{color:#f08a78; border-color:#6a2a22; background:var(--rubric-bg)}
.chip.verd{color:var(--verd); border-color:#2d5a4e; background:var(--verd-bg)}
.chip.dead{text-decoration:line-through; opacity:.6}

/* ---------- cards ---------- */
.card{background:var(--stone); border:1px solid var(--line); border-radius:var(--r); padding:16px; position:relative; min-width:0}
.card.ruled{border-top:3px double var(--line2)}
.sec{display:flex; align-items:baseline; gap:8px; margin:0 0 8px}
.sec h3{font-size:17px}
.sec .lat{font-size:14px}
.sub{font-size:12px; color:var(--dim); letter-spacing:.12em; margin:14px 0 6px; display:flex; align-items:baseline; gap:8px}
.sub small{letter-spacing:0; font-size:12px}

/* ---------- title screen ---------- */
.title-wrap{min-height:92vh; display:grid; place-items:center; text-align:center}
.title-inner{max-width:620px; display:flex; flex-direction:column; align-items:center; gap:18px}
.candle{position:relative; width:22px; height:120px; margin:18px auto 6px}
.candle .wax{position:absolute; bottom:0; left:0; width:22px; height:86px; background:linear-gradient(90deg,#cfc6b0,#efe8d6 45%,#bdb39b); border-radius:2px 2px 0 0}
.candle .wax::before{content:""; position:absolute; top:-2px; left:3px; width:7px; height:16px; background:#e7dfcb; border-radius:0 0 5px 5px}
.candle .wick{position:absolute; bottom:86px; left:10px; width:2px; height:9px; background:#2a2420}
.candle .fl{position:absolute; bottom:92px; left:3px; width:16px; height:30px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%, #fff8e0 0 18%, #ffd27a 35%, rgba(239,140,40,.85) 62%, transparent 72%);
  filter:blur(.3px); transform-origin:50% 90%; animation:flick 2.6s infinite ease-in-out}
.candle .glow{position:absolute; bottom:60px; left:-90px; width:202px; height:202px; border-radius:50%;
  background:radial-gradient(circle, rgba(239,177,74,.22), transparent 65%); animation:glow 2.6s infinite ease-in-out}
@keyframes flick{0%,100%{transform:rotate(-2deg) scaleY(1)} 30%{transform:rotate(3deg) scaleY(1.06)} 60%{transform:rotate(-1deg) scaleY(.95)} 80%{transform:rotate(2deg) scaleY(1.03)}}
@keyframes glow{0%,100%{opacity:.85} 50%{opacity:1}}
.title-h{font-size:clamp(64px,12vw,112px); letter-spacing:.2em; line-height:1; margin-right:-.2em; color:var(--snow)}
.title-lat{font-family:var(--f-latin); font-size:22px; color:var(--flame); letter-spacing:.08em}
.title-p{color:var(--ash); max-width:34em; text-align:left; margin:0}
.title-p .first{display:block}
.title-p .first::first-letter{font-family:var(--f-display); float:left; font-size:3.1em; line-height:.95; margin:.06em .14em 0 0; color:var(--rubric)}
.title-btns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.motto{font-size:13px; color:var(--dim); letter-spacing:.3em}

/* ---------- creator ---------- */
.cr{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start}
.cr-main{display:flex; flex-direction:column; gap:14px; min-width:0}
.cr-prev{position:sticky; top:14px}
.field{display:flex; flex-direction:column; gap:6px}
.field>label,.field>.lbl{font-size:12px; color:var(--dim); letter-spacing:.14em}
input[type=text]{background:var(--soot); border:1px solid var(--line2); border-radius:var(--r); padding:8px 10px; width:100%}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{cursor:pointer; border:1px solid var(--line2); background:transparent; padding:3px 10px; border-radius:var(--r); font-size:13px; color:var(--ash)}
.opt:hover{border-color:var(--flame-dim)}
.opt.on{border-color:var(--flame); color:var(--flame); background:var(--flame-bg)}
.sw{width:26px; height:26px; border-radius:50%; border:2px solid var(--line2); cursor:pointer; padding:0}
.sw.on{border-color:var(--flame); box-shadow:0 0 0 2px var(--soot) inset}
.bgs{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px}
.bgc{cursor:pointer; text-align:left; border:1px solid var(--line2); background:var(--stone2); border-radius:var(--r); padding:10px 12px; display:flex; flex-direction:column; gap:4px}
.bgc:hover{border-color:var(--flame-dim)}
.bgc.on{border-color:var(--flame); background:var(--flame-bg)}
.bgc b{font-family:var(--f-display); font-size:16px; font-weight:400; letter-spacing:.06em}
.bgc small{color:var(--ash); font-size:12.5px; line-height:1.6}
.bgc .mods{color:var(--flame); font-size:12px}
.alloc{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:6px}
.al{display:flex; align-items:center; gap:8px; border:1px solid var(--line); padding:6px 8px; border-radius:var(--r); background:var(--stone2)}
.al .nm{flex:1}
.al .v{font-variant-numeric:tabular-nums; width:26px; text-align:center; font-weight:600}
.al button{width:26px; height:26px; padding:0; border:1px solid var(--line2); background:var(--soot); border-radius:var(--r); cursor:pointer}
.al button:disabled{opacity:.3; cursor:default}
.prev-ava{width:150px; height:150px; margin:0 auto}
.prev-row{display:flex; gap:12px; align-items:center; justify-content:center}
.shield{width:64px; height:77px; flex:none}
.shield.sm{width:30px; height:36px}

/* ---------- game layout ---------- */
.topbar{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; padding:10px 14px; margin-bottom:14px;
  background:var(--stone); border:1px solid var(--line); border-radius:var(--r)}
.when{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.when .dies{font-family:var(--f-latin); font-size:22px; color:var(--flame)}
.when b{font-family:var(--f-display); font-weight:400; font-size:20px; letter-spacing:.06em}
.when small{color:var(--ash); font-size:13px}
.cmeters{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center}
.cm{display:flex; flex-direction:column; gap:2px; min-width:58px}
.cm span{font-size:11px; color:var(--dim); letter-spacing:.14em}
.cm b{font-variant-numeric:tabular-nums; font-size:15px; line-height:1.2}
.cm b.low{color:var(--rubric)}
.cm .bar{width:58px}
.bar{height:4px; background:var(--soot); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ash)}
.flames{display:flex; gap:3px; align-items:end; height:18px}
.flames i{width:6px; border-radius:50% 50% 30% 30%; background:var(--flame); height:14px}
.flames i.off{background:var(--line2); height:6px; border-radius:1px}
.top-btns{display:flex; gap:6px}

.layout{display:grid; grid-template-columns:290px minmax(0,1fr) 330px; gap:14px; align-items:start}
.col{display:flex; flex-direction:column; gap:14px; min-width:0}

.me{display:flex; gap:12px; align-items:center}
.me-ava{width:78px; height:78px; flex:none}
.me h2{font-size:21px}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-top:10px}
.st{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px dotted var(--line2); padding:1px 0; font-size:14px}
.st b{font-variant-numeric:tabular-nums}
.st .xp{font-size:10px; color:var(--dim); margin-left:4px}
.pm{display:flex; flex-direction:column; gap:7px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.pmr{display:grid; grid-template-columns:44px 1fr auto; gap:8px; align-items:center; font-size:13px}
.pmr .bar{height:5px}
.pips{display:flex; gap:3px}
.pips i{width:12px; height:12px; border:1px solid var(--line2); transform:rotate(45deg) scale(.75)}
.pips i.on{background:var(--rubric); border-color:var(--rubric)}
.lens{position:relative; height:16px; display:flex; align-items:center}
.lens::before{content:""; position:absolute; left:0; right:0; height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--lapis), var(--line2) 45%, var(--line2) 55%, var(--flame))}
.lens i{position:absolute; width:12px; height:12px; border-radius:50%; background:var(--snow); border:2px solid var(--soot); transform:translateX(-50%); top:2px}
.lens-lbl{display:flex; justify-content:space-between; font-size:11px; letter-spacing:.1em}
.vow{font-size:12.5px; margin-top:8px; color:var(--ash)}
.vow.broken{color:#f08a78; text-decoration:line-through}

.fronts{display:flex; flex-direction:column; gap:10px}
.front{display:flex; flex-direction:column; gap:3px; padding-left:10px; border-left:2px solid var(--line2)}
.front.hot{border-left-color:var(--rubric)}
.front.warm{border-left-color:var(--flame-dim)}
.front .fh{display:flex; justify-content:space-between; gap:6px; align-items:baseline}
.front .fh b{font-size:14px; font-weight:600}
.front p{margin:0; font-size:12.5px; color:var(--ash); line-height:1.6}
.clock{display:flex; gap:2px}
.clock i{width:7px; height:7px; border-radius:50%; border:1px solid var(--line2)}
.clock i.on{background:var(--rubric); border-color:var(--rubric)}

/* ---------- place ---------- */
.place h2{font-size:30px; line-height:1.2}
.place .lat{font-size:18px}
.place-d{color:var(--ash); margin:6px 0 0; max-width:42em}
.echo{margin-top:12px; padding:10px 14px; border-left:2px solid var(--flame-dim); background:var(--stone2); font-size:14px}
.echo p{margin:0}
.acts{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px}
.act{cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:2px; padding:9px 12px; background:var(--stone2);
  border:1px solid var(--line); border-radius:var(--r); transition:border-color .15s}
.act:hover:not(:disabled){border-color:var(--flame-dim)}
.act:disabled{opacity:.4; cursor:not-allowed}
.act b{font-weight:600; font-size:14.5px}
.act small{color:var(--dim); font-size:12px; line-height:1.5}
.act.story{border-color:#5a4520; background:linear-gradient(180deg, var(--flame-bg), var(--stone2))}
.act.story b{color:var(--flame)}
.act.story b::before{content:"✦ "; font-size:11px}
.act.story.dark{border-color:#5a2a22; background:linear-gradient(180deg, var(--rubric-bg), var(--stone2))}
.act.story.dark b{color:#f08a78}
.people{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px}
.pc{display:flex; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--stone2); align-items:flex-start}
.pc-ava{width:52px; height:52px; flex:none; cursor:pointer}
.pc-b{min-width:0; flex:1; display:flex; flex-direction:column; gap:4px}
.pc-b .nm{display:flex; gap:6px; align-items:baseline; flex-wrap:wrap}
.pc-b .nm b{font-size:15px}
.pc-b .ro{font-size:11.5px; color:var(--dim)}
.pc-btns{display:flex; gap:4px; flex-wrap:wrap}
.moves{display:flex; flex-wrap:wrap; gap:6px}
.mv{cursor:pointer; border:1px solid var(--line2); background:transparent; padding:4px 10px; border-radius:var(--r); font-size:13px}
.mv:hover:not(:disabled){border-color:var(--flame-dim)}
.mv:disabled{opacity:.35; cursor:not-allowed}
.mv.here{border-color:var(--flame); color:var(--flame)}
.mv .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--flame); margin-left:5px; vertical-align:middle}
.mv .dot.news{background:var(--rubric)}

/* ---------- right column ---------- */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin:-4px 0 10px}
.tab{cursor:pointer; background:none; border:none; border-bottom:2px solid transparent; padding:6px 10px; color:var(--dim); font-size:14px; letter-spacing:.08em}
.tab.on{color:var(--snow); border-bottom-color:var(--flame)}
.plist{display:flex; flex-direction:column; gap:6px}
.pl{display:grid; grid-template-columns:36px 1fr auto; gap:8px; align-items:center; cursor:pointer; padding:4px; border-radius:var(--r); background:none; border:none; text-align:left; width:100%}
.pl:hover{background:var(--stone2)}
.pl .a{width:36px; height:36px}
.pl small{display:block; color:var(--dim); font-size:11.5px; line-height:1.4}
.pl.dead{opacity:.5}
.pl.dead .a{filter:grayscale(1)}
.trust{font-variant-numeric:tabular-nums; font-size:13px}
.myst{border-top:1px solid var(--line); padding:10px 0 4px}
.myst:first-child{border-top:none; padding-top:0}
.myst h4{margin:0 0 6px; font-family:var(--f-display); font-weight:400; font-size:16px; letter-spacing:.06em}
.mcols{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.mcol{font-size:12.5px; line-height:1.55; min-width:0}
.mcol .h{font-size:11px; letter-spacing:.12em; margin-bottom:3px}
.mcol.c .h{color:var(--lapis)} .mcol.j .h{color:var(--flame)}
.mcol p{margin:0 0 5px; padding-left:8px; border-left:2px solid var(--line2); color:var(--ash)}
.mcol.c p{border-left-color:#34497a} .mcol.j p{border-left-color:var(--flame-dim)}
.mcol .none{color:var(--dim); font-style:italic}
.chron{display:flex; flex-direction:column; gap:10px; max-height:560px; overflow-y:auto; padding-right:4px}
.cday{border-top:1px solid var(--line); padding-top:8px}
.cday .d{font-family:var(--f-latin); color:var(--dim); font-size:14px}
.cv{font-size:12.5px; line-height:1.6; margin:3px 0 0; padding-left:8px}
.cv.h{border-left:2px solid var(--flame-dim); color:#e8d9bb}
.cv.o{border-left:2px solid #34497a; color:#c3cde0}
.cv-who{font-size:11px; letter-spacing:.1em}
.log{display:flex; flex-direction:column; gap:4px; max-height:260px; overflow-y:auto; font-size:13px}
.log p{margin:0; color:var(--ash)}
.log p.new{color:var(--snow)}
.log .w{font-family:var(--f-latin); color:var(--dim); margin-right:6px}

/* ---------- modal & scene ---------- */
#modal-root:empty{display:none}
.overlay{position:fixed; inset:0; z-index:50; background:var(--overlay); display:flex; align-items:flex-start; justify-content:center; overflow-y:auto;
  padding-block:max(24px,env(safe-area-inset-top,0px)) 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene{width:100%; max-width:720px; background:var(--stone); border:1px solid var(--line2); border-radius:var(--r); padding:22px 24px 20px;
  box-shadow:0 20px 60px var(--shadow); display:flex; flex-direction:column; gap:14px; position:relative}
.scene::before{content:""; position:absolute; inset:5px; border:1px solid var(--line); pointer-events:none; border-radius:var(--r)}
.scene>*{position:relative}
.scene.council{max-width:820px}
.scene-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.scene-h h2{font-size:26px}
.scene-h .lat{font-size:17px}
.scene-tag{font-size:11px; letter-spacing:.2em; color:var(--rubric)}
.faces{display:flex; gap:8px; flex-wrap:wrap}
.face{width:64px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--ash)}
.face .a{width:64px; height:64px}
.prose{font-size:15.5px; line-height:1.95; max-width:40em}
.prose p{margin:0 0 .8em}
.prose p:last-child{margin-bottom:0}
.prose .cap::first-letter{font-family:var(--f-display); float:left; font-size:3em; line-height:1; margin:.08em .16em 0 0; padding:.04em .12em;
  color:var(--rubric); border:1px solid #6a2a22; background:var(--rubric-bg)}
.prose q{quotes:"“" "”"; color:var(--snow)}
.prose .see{color:#efd6a5}
.prose .exam{color:#b9c8ea}
.prose em{font-style:normal; color:var(--flame)}
.pos{display:flex; flex-direction:column; gap:8px}
.posi{display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:start}
.posi .a{width:44px; height:44px}
.posi .bub{background:var(--stone2); border:1px solid var(--line); border-radius:var(--r); padding:6px 10px; font-size:14px}
.posi .bub b{font-size:12px; color:var(--dim); font-weight:400; letter-spacing:.08em; display:block}
.choices{display:flex; flex-direction:column; gap:6px}
.ch{cursor:pointer; text-align:left; display:grid; grid-template-columns:30px 1fr; gap:6px; padding:9px 12px; border:1px solid var(--line2); background:var(--stone2); border-radius:var(--r); transition:border-color .15s, background .15s}

function outfitSVG(style, color, w, u) {
  const L = 60 - w, R = 60 + w;
  const torso = `M${L} 121 C${L} 101 ${L + 5} 91 60 88 C${R - 5} 91 ${R} 101 ${R} 121Z`;
  const dark = 'rgba(0,0,0,.32)', light = 'rgba(255,255,255,.55)', ink = '#16130f';
  switch (style) {
    case 'mail': // 锁子甲外罩纹章罩袍
      return `<path d="${torso}" fill="#8b9098"/><path d="${torso}" fill="url(#ml${u})"/>
        <path d="M${L + 9} 121 L${L + 11} 99 Q60 105 ${R - 11} 99 L${R - 9} 121Z" fill="${color}" stroke="${ink}" stroke-width=".8"/>
        <path d="M49 89 Q60 97 71 89 L72 95 Q60 102 48 95Z" fill="#767c85"/><path d="M49 89 Q60 97 71 89 L72 95 Q60 102 48 95Z" fill="url(#ml${u})"/>`;
    case 'plate': // 板甲与护颈
      return `<path d="${torso}" fill="url(#pl${u})" stroke="${ink}" stroke-width=".8"/>
        <path d="M47 90 Q60 99 73 90 M45 96 Q60 106 75 96" fill="none" stroke="${ink}" stroke-width="1" opacity=".55"/>
        <path d="M60 104 L60 121" stroke="${light}" stroke-width="1.2" opacity=".5"/>
        <path d="M${L + 3} 112 Q${L + 6} 100 ${L + 14} 96" fill="none" stroke="${light}" stroke-width="1.5" opacity=".45"/>
        <path d="M${L + 12} 121 L${L + 14} 109 Q60 113 ${R - 14} 109 L${R - 12} 121Z" fill="${color}" opacity=".9"/>`;
    case 'gambeson': // 棉甲：绗缝线
      return `<path d="${torso}" fill="${color}" stroke="${ink}" stroke-width=".8"/>
        <path d="M${L + 6} 102 L${R - 6} 102 M${L + 3} 110 L${R - 3} 110 M${L + 2} 118 L${R - 2} 118 M52 92 L50 121 M68 92 L70 121" stroke="${dark}" stroke-width="1"/>
        <path d="M50 89 Q60 94 70 89 L70 92 Q60 97 50 92Z" fill="${dark}"/>`;
    case 'habit': // 修士袍：兜帽褶、腰绳
      return `<path d="${torso}" fill="${color}" stroke="${ink}" stroke-width=".8"/>
        <path d="M44 92 Q60 104 76 92 L76 99 Q60 110 44 99Z" fill="${dark}"/>
        <path d="M56 104 L54 121 M64 104 L66 121" stroke="#c9b98f" stroke-width="1.3" opacity=".8"/>`;
    case 'gown': // 贵妇长裙：方领、金边
      return `<path d="${torso}" fill="${color}" stroke="${ink}" stroke-width=".8"/>
        <path d="M48 90 L50 99 L70 99 L72 90 Q60 94 48 90Z" fill="var(--skin)"/>
        <path d="M48 90 L50 99 L70 99 L72 90" fill="none" stroke="#d6a84a" stroke-width="1.6"/>
        <path d="M${L + 4} 116 L${R - 4} 116" stroke="#d6a84a" stroke-width="1.1" opacity=".75"/>`;
    case 'cloak': // 毛皮领斗篷
      return `<path d="${torso}" fill="${color}" stroke="${ink}" stroke-width=".8"/>
        ${[44, 50, 56, 62, 68, 74].map((x, i) => `<circle cx="${x + 1}" cy="${92 + (i % 2) * 2}" r="5.2" fill="#c9c2b4"/>`).join('')}
        <circle cx="60" cy="101" r="2.4" fill="#d6a84a" stroke="${ink}" stroke-width=".6"/>`;
    case 'apron': // 粗布衫外系皮围裙
      return `<path d="${torso}" fill="${color}" stroke="${ink}" stroke-width=".8"/>

      return `<path d="${torso}" fill="${color}" stroke="${ink}" stroke-width=".8"/>

        <path d="M58 106 L54 121 M62 106 L66 121" stroke="#7a6a58" stroke-width="2"/>`;

let avaUid = 0;
// look: {skin, hair, hairColor, eye, beard, outfit, outfitColor, build, acc:[], age}
// opts: {expr, bg, size, dead}
function avatarSVG(look, opts = {}) {
  const L = look || {};
  const skin = L.skin || '#e9c9a6', hc = L.hairColor || '#2a221c', eye = L.eye || '#2a2230';
  const acc = new Set(L.acc || []);
  const veiled = acc.has('veil') || acc.has('hood') || acc.has('coif');
  const hs = HAIR[L.hair] || HAIR.crop;
  const w = BUILD_W[L.build] || 33;
  const expr = opts.expr || L.expr || 'calm';
  const masked = acc.has('mask');
  const ink = '#16130f', u = ++avaUid;
  const child = L.age === 'child', old = L.age === 'old';
  let s = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="--skin:${skin}">
  <defs>
    <radialGradient id="nb${u}" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#f6cf74"/><stop offset=".55" stop-color="#c8913a"/><stop offset="1" stop-color="#6e4a1c"/></radialGradient>
    <pattern id="ml${u}" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.05" fill="none" stroke="#3b4048" stroke-width=".55"/></pattern>
    <linearGradient id="pl${u}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d636c"/><stop offset=".35" stop-color="#c4c9cf"/><stop offset=".6" stop-color="#8d939b"/><stop offset="1" stop-color="#4b5058"/></linearGradient>
    <clipPath id="cc${u}"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs><g clip-path="url(#cc${u})">`;
  // 金箔圆光（背景）
  if (opts.bg !== false) {
    s += opts.bg ? `<circle cx="60" cy="60" r="60" fill="${opts.bg}"/>` : `<circle cx="60" cy="60" r="60" fill="#211c15"/><circle cx="60" cy="50" r="44" fill="url(#nb${u})" opacity=".9"/>
      <circle cx="60" cy="50" r="44" fill="none" stroke="#f6dc98" stroke-width="1" opacity=".7"/><circle cx="60" cy="50" r="40" fill="none" stroke="#6e4a1c" stroke-width=".6" stroke-dasharray="1.2 2.2" opacity=".7"/>`;
  }
  const g0 = child ? '<g transform="translate(9 16) scale(.85)">' : '<g>';
  s += g0;
  // 头巾 / 兜帽 / 锁甲头罩的后层
  if (acc.has('veil')) s += `<path d="M27 104 Q20 40 60 17 Q100 40 93 104Z" fill="#e4dfd2" stroke="${ink}" stroke-width=".8"/>`;
  else if (acc.has('hood')) s += `<path d="M24 112 Q18 34 60 13 Q102 34 96 112Z" fill="${L.outfitColor || '#3a3328'}" stroke="${ink}" stroke-width=".8"/>`;
  else if (acc.has('coif')) s += `<path d="M27 104 Q21 36 60 17 Q99 36 93 104Z" fill="#8b9098"/><path d="M27 104 Q21 36 60 17 Q99 36 93 104Z" fill="url(#ml${u})"/>`;
  else if (hs.back) s += `<g fill="${hc}">${hs.back}</g>`;
  s += outfitSVG(L.outfit || 'gambeson', L.outfitColor || '#3b3a40', w, u);
  if (acc.has('cross')) s += `<path d="M60 96 L60 108 M56 100 L64 100" stroke="#d6a84a" stroke-width="2" stroke-linecap="round"/>`;
  if (acc.has('beads')) s += [0,1,2,3,4,5,6].map(i => `<circle cx="${48 + i * 4}" cy="${92 + Math.abs(3 - i) * -1.2 + 3.6}" r="1.6" fill="#b02a1e"/>`).join('');
  // 脖子、耳朵、脸
  s += `<rect x="52" y="72" width="16" height="19" rx="6" fill="${skin}"/><rect x="52" y="79" width="16" height="6" fill="rgba(0,0,0,.12)"/>`;
  if (!veiled) s += `<ellipse cx="35" cy="58" rx="4.5" ry="6.5" fill="${skin}" stroke="${ink}" stroke-width=".7"/><ellipse cx="85" cy="58" rx="4.5" ry="6.5" fill="${skin}" stroke="${ink}" stroke-width=".7"/>`;
  s += `<ellipse cx="60" cy="54" rx="25" ry="28" fill="${skin}" stroke="${ink}" stroke-width="1"/>`;
  s += `<ellipse cx="68" cy="58" rx="14" ry="22" fill="#2a1408" opacity=".07"/>`;
  if (acc.has('earring') && !veiled) s += `<circle cx="34.5" cy="66" r="2.2" fill="none" stroke="#d6a84a" stroke-width="1.2"/>`;
  if (old) s += `<path d="M42 48 Q48 46 54 48 M66 48 Q72 46 78 48 M43 66 Q46 70 46 74 M77 66 Q74 70 74 74 M52 38 Q60 36 68 38" fill="none" stroke="${ink}" stroke-width=".7" opacity=".45"/>`;
  // 胡须在嘴之前画
  const bd = BEARDS[L.beard] || BEARDS.none;
  if (bd.d && !child && !masked) s += `<path d="${bd.d}" fill="${hc}" opacity="${bd.op || 1}"/>`;
  if (masked) {
    // 白色珐琅面具：没有嘴，只有两道眼缝
    s += `<path d="M36 46 Q36 26 60 25 Q84 26 84 46 L83 64 Q80 80 60 84 Q40 80 37 64Z" fill="#f1eee8" stroke="${ink}" stroke-width="1.1"/>
      <path d="M41 56 Q48 52 55 56 Q48 58 41 56Z M65 56 Q72 52 79 56 Q72 58 65 56Z" fill="#0b0a09"/>
      <path d="M60 30 L60 76" stroke="#d8d3c8" stroke-width=".8"/><ellipse cx="50" cy="40" rx="7" ry="4" fill="#fff" opacity=".6"/>`;
  } else {
    // 眼睛
    if (expr === 'closed' || expr === 'dead') {
      s += `<path d="M45.5 58 Q50 61 54.5 58 M65.5 58 Q70 61 74.5 58" fill="none" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`;
    } else {
      const er = expr === 'fear' ? 1.15 : 1;
      for (const x of [50, 70]) {
        if (x === 70 && acc.has('patch')) continue;
        s += `<ellipse cx="${x}" cy="58" rx="${4.4 * er}" ry="${4.6 * er}" fill="#f4efe6" stroke="${ink}" stroke-width=".8"/><circle cx="${x}" cy="58.4" r="${2.7 * (expr === 'fear' ? .8 : 1)}" fill="${eye}"/><circle cx="${x}" cy="58.4" r="1.2" fill="#0d0b0a"/><circle cx="${x + 1.2}" cy="57.2" r=".7" fill="#fff"/>`;
      }
      s += `<path d="M45 55 Q50 52.5 55 55${acc.has('patch') ? '' : ' M65 55 Q70 52.5 75 55'}" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>`;
    }

    const H = a === S.region ? A : B, O = a === S.region ? B : A, lx = H.x + (O.x - H.x) * .42, ly = H.y + (O.y - H.y) * .42 - 5;

    <path d="M250 440 C 262 410 236 396 252 372 C 270 342 300 330 292 290 C 284 250 300 220 290 190 C 280 160 312 140 300 112 C 290 86 268 70 270 30 L 270 0" class="river"/>

}

let protoIdx = 0, protoNext = 'creator';
function renderPrologue(i, next) {
  if (next) protoNext = next;
  protoIdx = clamp(i, 0, PROLOGUE.length - 1);
  const c = PROLOGUE[protoIdx], last = protoIdx === PROLOGUE.length - 1;
  document.body.dataset.ph = protoIdx === PROLOGUE.length - 1 ? 0 : 2;
  $('#app').innerHTML = `<div class="proto">
    <div class="proto-dots" aria-hidden="true">${PROLOGUE.map((_, k) => `<i class="${k === protoIdx ? 'on' : k < protoIdx ? 'past' : ''}"></i>`).join('')}</div>
    <div class="proto-art" aria-hidden="true"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${PROLOGUE_ART[c.art]}</svg></div>
    <div class="proto-when">${c.when}</div>
    <h1 class="proto-where">${c.where}</h1>
    <div class="lat" style="font-size:17px">${c.la}</div>
    <div class="prose proto-text">${c.t.split(/\n\n+/).map((p, k) => `<p${k === 0 ? ' class="cap"' : ''}>${p}</p>`).join('')}</div>
    <div class="row" style="justify-content:center;gap:10px">
      ${protoIdx > 0 ? '<button class="btn ghost" data-pr="back">上一页</button>' : ''}
      <button class="btn primary" data-pr="next">${last ? (protoNext === 'creator' ? '上路之前' : '回到标题') : '继续'}</button>
      ${last ? '' : '<button class="btn ghost small" data-pr="skip">跳过序幕</button>'}
    </div></div>`;
  window.scrollTo(0, 0);
  $('#app').onclick = e => {
    const t = e.target.closest('[data-pr]');
    if (!t) return;
    const a = t.dataset.pr;
    if (a === 'back') return renderPrologue(protoIdx - 1);
    if (a === 'next' && !last) return renderPrologue(protoIdx + 1);
    if (protoNext === 'creator') { draft = newDraft(); return renderCreator(); }
    renderTitle();
  };
}

<q>石头是给车阵的，</q>她说，<q>杰士卡说，车板里塞了石头，骑士的马就撞不翻。</q>

她坐在车辕上，把连枷横在膝盖上。<q>你去塔博尔干什么？</q>`,
  opts:[
    {t:'<q>找我妹妹。</q>', fx:{join:'katka', t:{katka:5}}, r:'<q>那上车，</q>她拍了拍身边的车辕，<q>塔博尔山上一万个人，我认得一半。你妹妹叫什么？</q>'},
    {t:'<q>看看世界末日长什么样。</q>', fx:{join:'katka', t:{katka:8}}, r:'她大笑起来，笑得车都在晃。<q>长得像一群穷人，</q>她说，<q>终于吃饱了饭。上车。</q>'}
  ]
});
// 帮过卡佳之后，接上她入伙的那一段
ST.r_katka.opts.forEach((o, i) => { if (i < 2) o.next = (S, tier) => 's_katka_join'; });

def({
  id:'s_tabor_arrive', mode:'arrive', region:'tabor', act:[1, 2], t:'山', la:'Hradiště', tag:'塔博尔',
  text: S => `塔博尔不是一座城，是一座正在变成城的山。

到处是帐篷、草棚、刚砍下来的木头。没有领主，没有收税的人，男人们叫彼此“兄弟”，女人们叫彼此“姊妹”。广场上放着几只大木桶，人们走过去，把钱、戒指、袜子里的铜板倒进去。

一个传道人站在车板上喊：<q>城堡要倒，修院要烧，老爷们要像草一样被割下来！</q>

人群里，有人在哭，有人在唱。${cm('katka').met && inParty('katka') ? '\n\n卡佳在你身边，眼睛亮得像个孩子。<q>欢迎回家，</q>她说，不知道是对你，还是对她自己。' : ''}`,
  opts:[{t:'去找奥莲卡', fx:{q:{q_sister:2}}, r:'有人告诉你：新来的人，都在山顶的布道场。'}]
});

def({
  id:'s_olenka', at:'hill', act:[1, 2], prio:20, t:'丝带', la:'Taenia', who:['olenka'], hint:'奥莲卡坐在人群里听讲道',
  if: S => S.q.q_sister >= 1 && !S.f.olenkaTalked,
  text:`奥莲卡坐在草地上，和一群女人挨在一起，听传道人讲末日。她剪了头发，剪得很短，像个男孩。

她看见你，没有站起来。<q>母亲叫你来的。</q>

<q>她让我把这个给你。</q>你把那根丝带递过去。

她看着丝带，看了很久，没有接。<q>在这里，没有人要丝带，</q>她说，<q>在这里，我不是柳溪老爷家的女儿。我是姊妹。你懂吗？我这辈子第一次，只是一个人。</q>`,
  opts:[
    {t:'<q>你跟我回去。现在。</q>', chk:'nerve', app:{katka:-6, petr:-5, zden:3},
      fx:{set:{olenkaTalked:1, olenkaHome:1}, q:{q_sister:5}, t:{olenka:-25}, rep:{tabor:-8, home:5}},
      ffx:{set:{olenkaTalked:1, olenkaTabor:1}, t:{olenka:-15}, rep:{tabor:-5}},
      r:'你抓住她的手腕，把她拉了起来。她没有挣，她只是看着你，像看着父亲。\n\n回柳溪的一路上，她一句话也没说。到家的时候，母亲抱住她，她也没有抱回去。',
      f:'你去抓她的手腕，周围的“兄弟们”站了起来。十几个人，拿着连枷和草叉。奥莲卡挡在你和他们中间。<q>走吧，哥哥，</q>她说，<q>趁他们还当你是客人。</q>'},
    {t:'把丝带放在她手里：<q>想家了，就回来。</q>', app:{katka:6, petr:5}, fx:{set:{olenkaTalked:1, olenkaTabor:1}, q:{q_sister:4}, t:{olenka:20}, rep:{tabor:5}, meet:'olenka'},
      r:'她把丝带攥在手心里，攥得很紧。她没有哭，可她低下了头。\n\n<q>告诉母亲，</q>她说，<q>我在这里吃得饱。告诉她，这里的人不叫我小姐，叫我名字。</q>'},
    {t:'坐下来，和她一起听讲道', lens:1, fx:{set:{olenkaTalked:1, olenkaTabor:1}, q:{q_sister:4}, t:{olenka:12}, clue:['e_date', 'e_five'], lens:1, meet:'olenka'},
      r:`你在她旁边坐下。传道人在讲：二月的日子没有错，末日不是一天，是一个季节。到这个季节结束的时候，只有五座城能留下：比尔森、扎特茨、劳恩、斯拉尼、克拉托维。

奥莲卡的肩膀靠着你的肩膀。<q>你信吗？</q>她小声问。

你没有回答。天边的云是红的。`}
  ]
});

def({
  id:'s_zizka', at:'tent', act:[1], prio:15, t:'独眼的人', la:'Žižka', who:['zizka'], hint:'帐篷门口，有个独眼的老人在修鼓',
  text: S => `帐篷门口坐着一个独眼的老人，在给一面鼓绷新皮。他的手很大，指节上全是老茧，可他绷皮的样子很轻，像在给孩子盖被子。

${S.p.bg === 'veteran' ? '他抬起那只眼睛看你，看了很久。<q>格伦瓦尔德，</q>他说，<q>你是那个把条顿人的旗砍下来，然后坐在旗上哭的小子。</q>' : '<q>柳溪的骑士，</q>他没有抬头，<q>你的名字比你先上的山。</q>'}

他把鼓放下。

<q>铁领主们在追我们。博胡斯拉夫，还有罗森堡家借来的人。我们有四百个人，一半是女人，十二辆车。他们有两千，全是骑马的。</q>他用指头敲了敲鼓面，<q>我要去苏多梅日。那里有鱼塘。</q>`,
  opts:[
    {t:'<q>我跟你去。</q>', app:{katka:8, zden:-5}, fx:{rep:{tabor:12}, set:{offeredZizka:1}, t:{zizka:10}},
      r:'他点点头，像是早就知道。<q>不是为了我，</q>他说，<q>为了你妹妹。她在我的车上。</q>'},
    {t:'<q>为什么是鱼塘？</q>', chk:'lore', fx:{t:{zizka:6}, set:{knowsPonds:1}, xp:{cmd:1}}, ffx:{t:{zizka:2}},
      r:'他笑了，那只眼睛眯起来。<q>一边是满水的塘，一边是放干了的塘。中间一条堤，只够走一辆车。骑士喜欢冲锋。我让他们冲。</q>他拍了拍鼓，<q>泥会替我打仗。</q>',
      f:'<q>因为鱼塘里有鱼，</q>他说，<q>打完了可以吃。</q>你不知道他是不是在开玩笑。'},
    {t:'<q>我宣誓效忠了国王。</q>', if: S => S.f.sworeCrown, fx:{t:{zizka:-2}, set:{toldZizkaOath:1}},
      r:'<q>那你就该去告诉博胡斯拉夫，我们在哪里，</q>他平静地说，<q>你会去吗？</q>\n\n你没有回答。他又拿起了鼓。<q>苏多梅日，</q>他说，<q>你想告诉谁，就告诉谁。泥不在乎。</q>'}
  ]
});

def({
  id:'s_sky', mode:'auto', region:'tabor', ph:[2], act:[1, 2], prio:25, t:'北方的火', la:'Aurora', tag:'夜',
  text: S => `半夜，山上忽然一片哗然。

北边的天上烧起来了。不是火，是光：红的、绿的，一层一层地动，像有人在天幕后面举着火把走过。整座山的人都跪了下来。传道人站在车板上，张开双臂，一句话也说不出来。

${S.party.includes('katka') ? '卡佳抓住你的胳膊，指甲掐进了肉里。<q>来了，</q>她小声说，<q>是不是来了？</q>' : ''}${S.party.includes('matej') ? '马捷伊抬头看着，喃喃地说：<q>亚里士多德管这个叫“天上的裂缝”。他也解释不了。</q>' : ''}`,
  opts:[
    {t:'跪下，和他们一起看', lens:2, fx:{clue:'e_sky', lens:2, mind:-1, rep:{tabor:3}}, app:{katka:5, petr:4},
      r:'你跪了下来。天上的光在动，像一条河在流过天空。你忽然觉得，世界真的可以在今夜结束，而那也没什么可怕的。\n\n天亮时，光散了。世界还在。人们站起来，拍掉膝盖上的土，有人笑了，有人哭得更厉害了。'},
    {t:'站着，数它亮了多久', lens:-2, fx:{clue:['e_sky', 'e_cold'], lens:-2}, app:{matej:5, ilona:3},
      r:'你站着数。它亮了大约半个时辰，从北边慢慢退到了西北，然后淡了下去，像一块慢慢冷却的铁。\n\n你想起扬神父说过，他年轻时见过两次，都是在很冷的冬天。老人们叫它北方的火。它来过，它走了，世界没有完。\n\n可是那半个时辰里，整座山上一万个人，没有一个人说话。'}
  ]
});

def({
  id:'s_sudomer_call', mode:'auto', act:[1], prio:60, if: S => !S.f.sudomerCalled && (S.f.olenkaTalked || S.day >= 10),
  t:'追兵', la:'Persecutio', tag:'急报',
  text: S => `${S.region === 'tabor' ? '山上吹起了号角。' : '一个骑马的孩子满身是泥，冲进了院子。'}

<q>铁领主们出动了！</q>那孩子喊，<q>博胡斯拉夫、还有罗森堡家借来的骑兵，两千人，在追杰士卡的车队！车队往苏多梅日的鱼塘去了！</q>

${S.f.olenkaTabor ? '奥莲卡在那支车队里。' : '塔博尔山上的一半人都在那支车队里。'}${S.f.sworeCrown ? '\n\n第二个骑马的人也到了，穿着赫鲁比的号衣：<q>博胡斯拉夫老爷说，你宣过誓了。他在皮塞克的石桥边等你。</q>' : ''}`,
  opts:[
    {t:'去苏多梅日', fx: S => ({set:{sudomerCalled:1, sudomerBy:S.day + 4}, q:S.f.olenkaTabor ? {q_sudomer:1, q_sister:3} : {q_sudomer:1}})},
    {t:'这不是我的仗', vow:undefined, fx: S => ({set:{sudomerCalled:1, sudomerBy:S.day + 4, sudomerSkip:1}, q:{q_sudomer:1}}), r:'你没有动。可是那几天，你总是往西边看。'}
  ].map(o => Object.assign({r:'你让人备马。苏多梅日从柳溪走要一天，从皮塞克走半天。你得在四天之内赶到。'}, o))
});

// 苏多梅日：没赶到，仗就自己打完了
DAY_HOOKS.push(S => {
  if (S.f.act === 1 && S.f.sudomerCalled && !S.f.sudomerDone && S.day >= S.f.sudomerBy) {
    S.f.sudomerDone = 1; S.f.sudomerWin = 'tabor'; S.f.sudomerAbsent = 1; S.q.q_sudomer = 'fail';
    if (S.f.olenkaTabor && Math.random() < .3) { S.f.olenkaHurt = 1; }
    addLog('苏多梅日的仗打完了。车阵守住了。你不在那里。');
    S.queue.push({type:'story', id:'s_act2'});
  }
});

def({
  id:'s_sudomer', mode:'arrive', region:'sudomer', act:[1], prio:90, if: S => S.f.sudomerCalled && !S.f.sudomerDone,
  t:'苏多梅日', la:'Sudoměř', tag:'三月 · 黄昏', takes:true,
  text: S => `你赶到的时候，太阳已经斜了。

杰士卡的十二辆车停在一道窄窄的塘堤上，用铁链连成一排。堤的左边是满水的鱼塘，右边是放干了的塘，塘底是黑色的烂泥。女人们站在车阵后面，手里拿着连枷和长柄镰刀。

对面的田野上，铁领主们的骑兵排开了，阳光照在他们的甲上，亮得像一片燃烧的麦田。博胡斯拉夫在最前面，正在指着塘堤大喊大叫。

${S.f.sworeCrown ? '你宣过誓。博胡斯拉夫的人看见了你，朝你挥手。' : '车阵后面有人认出了你，喊了一声。'}`,
  opts:[
    {t:'走进车阵', fx:{set:{sudomerSide:'tabor'}}, app:{katka:8, petr:2, zden:-6}, r:'车阵里的人给你让开一条缝。杰士卡在最中间那辆车上，朝你点了一下头。', next:'s_sud_tabor'},
    {t:'骑到博胡斯拉夫那边', if: S => S.f.sworeCrown || S.rep.crown >= 10, fx:{set:{sudomerSide:'lords'}}, app:{katka:-15, zden:4, petr:-6}, r:'博胡斯拉夫用铁手套拍着你的背：<q>好！跟着我，今天晚上我们在杰士卡的车上喝酒！</q>', next:'s_sud_lords'},
    {t:'不站哪一边，只找奥莲卡', if: S => S.f.olenkaTabor, fx:{set:{sudomerSide:'none'}}, r:'你把马拴在一棵柳树后面，沿着塘边往车阵那边摸过去。', next:'s_sud_olenka'}
  ]
});

def({
  id:'s_sud_tabor', mode:'chain', t:'车阵', la:'Vozová hradba', tag:'苏多梅日',
  text: S => `铁领主们下了马。马在塘堤上冲不开车阵，他们要从放干的塘底走过来，从侧面绕。

杰士卡转过头，对车阵后面的女人们喊了一句话。女人们开始解头巾，解围裙，解披肩，把它们一块一块地铺在塘底的烂泥上，铺在骑士们要走过来的地方。

${inParty('katka') ? '卡佳也在解她的头巾。<q>你看着，</q>她对你说，<q>你看着。</q>' : ''}

太阳快沉下去了。`,
  opts:[
    {t:'帮她们铺', lens:-1, fx:{clue:'c_veils', lens:-1, rep:{tabor:6}}, app:{katka:5, matej:3},
      r:`你懂了。头巾在泥上不是垫子，是网。

骑士们穿着铁靴走进塘底，靴子踩进泥里，头巾缠住了靴子上的马刺，像水草缠住了脚踝。他们越挣，陷得越深。

车阵里的连枷就在那时候落下来。`, next:'s_sud_bohus'},
    {t:'守住车阵的缺口', chk:'arm', fx:{rep:{tabor:8}, honor:5, xp:{arm:1}}, ffx:{rep:{tabor:4}, hurt:1}, app:{katka:6, zden:-3},
      r:'两辆车之间有一个缺口，只够一个人站。你站了进去。一个铁领主的骑兵冲到你面前，你的剑比他的快。\n\n天色暗了。你只记得自己一直在砍，一直在砍，直到对面没有人了。',
      f:'你守住了缺口，代价是肩膀上的一道口子。血把你的袖子染透了，你都没有感觉到。', next:'s_sud_bohus'},
    {t:'站到举着圣杯的神父身边', lens:2, fx:{clue:'c_sunset', lens:2, rep:{tabor:5}, mind:-1}, app:{petr:5, katka:3},
      r:`车阵中间，一个瘦小的神父举着一只木头圣杯，站在最高的那辆车上。他没有甲，没有剑，只是举着那只杯子，在唱。

太阳沉下去的那一刻，铁领主们冲锋了。可是冲到一半，他们停住了。后来活下来的人说，他们看见车阵后面站着一排穿白衣服的人，比车还高。

你回头看了一眼。车阵后面，只有那些解下了头巾的女人。她们的白色衬裙，在暮色里很亮。`, next:'s_sud_bohus'}
  ]
});

def({
  id:'s_sud_lords', mode:'chain', t:'冲锋', la:'Impetus', tag:'苏多梅日',
  text: S => `博胡斯拉夫下了马，<q>马冲不开那些车，我们走过去！</q>他指着放干的塘底，<q>从侧面绕！</q>

两千个铁领主踩进了烂泥。你看见车阵后面的女人们在往泥上铺什么东西，白色的，一块一块。

${S.f.knowsPonds ? '你想起杰士卡的话：泥会替我打仗。' : '你不知道那是什么。可你后脖子的汗毛竖了起来。'}`,
  opts:[
    {t:'拉住博胡斯拉夫：<q>别下塘！</q>', chk:'grace', fx:{set:{warnedBohus:1, sudomerWin:'tabor'}, t:{bohus:10}, rep:{crown:5}}, ffx:{t:{bohus:-5}},
      r:'博胡斯拉夫看了你一眼，看了看那片烂泥，第一次犹豫了。他让一半的人留在了堤上。那一半人活了下来。',
      f:'<q>胆小鬼！</q>博胡斯拉夫甩开你的手，带头走进了泥里。', next:'s_sud_bohus'},
    {t:'跟着冲下去', chk:'arm', fx:{rep:{crown:8, tabor:-10}, honor:3}, ffx:{hurt:2, rep:{crown:4, tabor:-10}}, vow:undefined,
      r:'你走进了泥里。泥没过了膝盖，然后是大腿。脚下的白色头巾缠住了你的马刺。车阵里的连枷落下来的时候，你才明白那些女人在铺什么。\n\n你从泥里爬了出来。你身后，很多人没有爬出来。',
      f:'泥没过了你的腰。连枷砸在你的头盔上，你眼前一黑。等你醒过来，已经被人拖到了塘堤上。', next:'s_sud_bohus'},
    {t:'调转马头，冲进车阵那边', vow:'lie', fx:{set:{sudomerSide:'tabor', turnedCoat:1}, rep:{crown:-20, tabor:15, rose:-5}, honor:-3}, app:{katka:15, zden:-10},
      r:'你调转了马头。博胡斯拉夫在你身后喊你的名字，喊了三遍，一遍比一遍难听。\n\n车阵里的人看着你冲过来，有人举起了弩。杰士卡在车上喊了一声，弩放下了。', next:'s_sud_bohus'}
  ]
});

def({
  id:'s_sud_olenka', mode:'chain', t:'找她', la:'Quaerens', tag:'苏多梅日', who:['olenka'],
  text:'你沿着满水的鱼塘边摸过去，芦苇割破了你的手。车阵后面，奥莲卡和一群女人在往泥上铺头巾。她看见了你，愣了一下，然后朝你喊：<q>来帮忙！</q>',
  opts:[
    {t:'帮她', fx:{clue:'c_veils', set:{sudomerSide:'tabor'}, t:{olenka:15}, rep:{tabor:6}}, r:'你跪在烂泥边，和你妹妹一起，把一块一块的头巾铺开。她的手冻得通红，可她在笑。<q>你看，</q>她说，<q>你看。</q>', next:'s_sud_bohus'},
    {t:'把她拉走：<q>这里要死人的！</q>', chk:'nerve', fx:{set:{olenkaHome:1, olenkaTabor:0}, q:{q_sister:5}, t:{olenka:-20}}, ffx:{t:{olenka:-10}},
      r:'你把她扛在肩上，从芦苇里退了出去。她在你背上又踢又打，一直骂到天黑。身后，喊杀声响成了一片。',
      f:'她甩开了你。<q>要死，我也死在我自己选的地方！</q>她跑回了车阵。你只好跟了过去。', next:'s_sud_bohus'}
  ]
});

def({
  id:'s_sud_bohus', mode:'chain', t:'泥里的领主', la:'In luto', tag:'苏多梅日 · 天黑', who:['bohus'],
  text: S => `天黑了。铁领主们退了，丢下了一塘的人和马。

塘底的烂泥里，有一个人陷到了胸口，板甲太重，爬不出来。是博胡斯拉夫。他的头盔不见了，脸上全是泥，正在喘气。

${inParty('katka') ? '卡佳先看见了他。她拎着连枷，一步一步走过去，站在泥边上。她没有说话。' : '几个车阵里的人已经拎着连枷走过去了。'}`,
  opts:[
    {t:'把他拉上来', chk:'arm', fx:{set:{bohusSpared:1}, q:{q_bohus:'done'}, t:{bohus:20}, honor:5}, app:{zden:8, katka:-12, petr:5},
      r: S => `你趴在泥边，抓住他的手腕，把他一点一点拖了上来。他躺在塘堤上，像一条搁浅的大鱼，看着天，很久没有说话。

<q>为什么？</q>他终于说。

你也不知道为什么。${inParty('katka') ? '\n\n卡佳转身走了。她走了很远，才停下来，把连枷扔进了满水的那个鱼塘里。' : ''}`},
    {t:'看着卡佳', if: S => inParty('katka'), fx:{set:{bohusDead:1}, q:{q_bohus:'done'}, kill:'bohus', why:'死在苏多梅日的泥里。'}, app:{katka:12, zden:-8, petr:-6},
      r:`卡佳在泥边蹲下来，看着他。

<q>你还记得我吗？</q>她说，<q>那年冬天，你让我在雪地里跪了一夜，因为我打碎了你的一只杯子。</q>

博胡斯拉夫看着她，嘴唇在抖。他不记得。

她站起来，没有用连枷。她只是转过身，走开了。泥慢慢地没过了他的肩膀，然后是下巴。`},
    {t:'走开，让车阵的人去处置', vow:'abandon', fx:{set:{bohusDead:1}, q:{q_bohus:'done'}, kill:'bohus', why:'死在苏多梅日的泥里。'}, app:{katka:4, zden:-5},
      r:'你走开了。身后传来连枷的声音，三下。然后就没有声音了。'}
  ]
});
ST.s_sud_bohus.opts.forEach(o => { o.fx = fxm(o.fx, {set:{sudomerDone:1}, q:{q_sudomer:'done'}}); o.next = 's_sud_after'; });

def({
  id:'s_sud_after', mode:'chain', t:'鲤鱼', la:'Post proelium',
  text: S => `后来，人们把这一仗叫做苏多梅日。四百个人、十二辆车，打退了两千个骑士。

你坐在塘堤上，看着渔夫们划着小船，在满水的鱼塘里捞东西。捞上来的不只是鲤鱼。

${S.f.olenkaTabor ? '奥莲卡坐到了你旁边，膝盖上全是泥。她把头靠在你肩上，像小时候那样。<q>我还以为，</q>她说，<q>世界会在今天结束。</q>' : S.f.olenkaHome ? '奥莲卡在柳溪，在母亲身边。你想起她在你背上踢你的样子，忽然很想笑，又笑不出来。' : ''}

杰士卡从你身边走过，停了一下。<q>记住今天的泥，</q>他说，<q>夏天还会有更多的泥。</q>`,
  opts:[{t:'……', fx: S => ({set:{sudomerWin:S.f.sudomerSide === 'lords' && !S.f.turnedCoat ? 'lords' : 'tabor'}, q:{q_mill:S.q.q_mill === 1 ? 2 : S.q.q_mill}}), r:'那天夜里，你梦见了磨坊主的杯子，一只一只，倒扣着。', next:'s_act2'}]
});

def({
  id:'s_act2', mode:'chain', t:'初夏', la:'Aestas incipiens', tag:'第二幕',
  text: S => `春天过去得很快。

消息一个比一个坏。在布雷斯劳，西吉斯蒙德把一个布拉格的商人绑在马尾巴上拖过全城，然后烧了。全欧洲的骑士在往波希米亚走：迈森人、奥地利人、匈牙利人、西里西亚人，还有从更远的地方来的、为了赦罪和战利品来的人。

库特纳霍拉的德意志矿工在买俘虏，一个格罗申一个，买来扔进废矿井里。

布拉格在召唤所有领圣杯的人。

玫瑰堡的监护人在写信，给两边都写。

而在内扎尔卡河的林子里，有一群人脱光了衣服，说他们已经回到了伊甸园。`,
  opts:[{t:'整理行装', fx:{set:{act:2}, q:{q_prague:1, q_kutna:1}}, r:'布拉格和库特纳霍拉的路，现在可以走了。'}]
});
ST.s_act2.mode = 'chain';
// 第二幕也可以由“没赶到苏多梅日”触发，所以允许它作为队列里的片段出现
ST.s_act2.if = S => S.f.act === 1;

def({
  id:'s_katka_wagons', at:'wagons', act:[1, 2], prio:12, if: S => !cm('katka').met, t:'车夫', la:'Auriga', who:['katka'], hint:'有个女人在往车板里塞石头',
  text:`车阵边上，一个女人在往车板的夹层里塞石头，一块一块，塞得严严实实。她的连枷靠在车轮上，裙子掖在腰带里，胳膊上全是泥。

<q>别站着看，</q>她头也不抬，<q>要么帮忙，要么让开。骑士的马撞上来的时候，石头比祷告管用。</q>`,
  opts:[
    {t:'卷起袖子帮她塞石头', fx:{meet:'katka', t:{katka:12}, rep:{tabor:3}, xp:{arm:1}}, r:'你们塞完了一整辆车。她直起腰，擦了擦汗，第一次正眼看你。<q>骑士？骑士搬石头？</q>她笑了，<q>卡特日娜。叫我卡佳。</q>', next:'s_katka_join'},
    {t:'<q>你知道赫鲁比的博胡斯拉夫在找你吗？</q>', fx:{meet:'katka', t:{katka:6}}, r:'她的手停了一下。<q>让他找，</q>她说，<q>他找了我五年，从来没在他自己家里找到过我。</q>她拍掉手上的泥，<q>卡佳。你是哪家的？</q>', next:'s_katka_join'}
  ]
});
// ===== 第二幕 · 初夏：布拉格、库特纳霍拉、玫瑰、王冠 =====

    1:'库特纳霍拉的德意志矿工在买俘虏，买来扔进废矿井。库特纳霍拉在塔博尔北边三天的路上，从布拉格去是一天。',
    2:'坎克矿井在库特纳霍拉城边上。矿工们路过时都不往里看。',

// ---------- 布拉格 ----------
def({
  id:'s_prague_arrive', mode:'arrive', region:'prague', prio:50, t:'百塔之城', la:'Praha', tag:'布拉格',
  text:`你从南门进城的时候，所有的钟都在响。不是一座教堂，是一百座，各响各的，没有一座和别的合得上。

城里分成了好几块。河对岸的山上，城堡还在国王的人手里；南边的维舍赫拉德也是。老城的市民关着门做生意，新城的穷人在街上唱歌。到处都是杯子：画在墙上的、挂在门口的、刻在面包上的。

一个卖鱼的女人看见你的剑，问：<q>你是哪一边的？</q>不等你回答，她又说：<q>算了，别告诉我。明天说不定就换了。</q>`,
  opts:[{t:'走进老城', fx:{q:{q_prague:2}}, r:'老城广场上，有人在泰恩教堂的墙上画了一只巨大的圣杯，颜料还没干。'}]
});

def({
  id:'s_zeliv', at:'newtown', act:[2, 3], prio:10, t:'刀的时候', la:'Tempus gladii', who:['zeliv'], hint:'热利夫斯基在讲道',
  text:`雪地圣母堂里挤得连一根针都插不进去。热利夫斯基站在讲台上，瘦，脸色苍白，声音却像一口钟。

<q>主说，我来不是叫地上太平，乃是叫地上动刀兵！</q>他张开双臂，<q>修院里的金子，是从你们的骨头里刮下来的！圣像是偶像！教士的肥肚子里装的是你们孩子的面包！</q>

人群在吼。有人已经开始往外走了，手里拿着火把。`,
  chime:{zden:'<q>就是这个声音，</q>齐德涅克的手攥在剑柄上，指节发白，<q>去年夏天，就是这个声音，让他们冲上了市政厅。</q>',
    matej:'<q>他引的是马太福音第十章，</q>马捷伊低声说，<q>下一句是“人的仇敌就是自己家里的人”。他总是不念下一句。</q>',
    katka:'<q>他说得对，</q>卡佳说，眼睛亮亮的，<q>你没见过修院的粮仓。我见过。</q>'},
  opts:[
    {t:'站上长凳，大声反驳他', chk:'grace', fx:{rep:{prague:6, tabor:-6}, honor:5, t:{zeliv:-15}}, ffx:{rep:{tabor:-4}, hurt:1, t:{zeliv:-10}}, app:{matej:8, zden:8, katka:-6, eliska:4},
      r:'你说：火烧了修院，穷人的孩子也不会多吃一口面包，只会多一座废墟。人群静了一刻。热利夫斯基看着你，嘴角动了一下，像是在笑。<q>说得好，</q>他说，<q>可你说的是明天。我说的是今天。</q>\n\n人群还是走了。可是走的人少了一半。',
      f:'有人把你从长凳上拽了下来。你在人堆里挨了几拳，等你爬起来，人群已经举着火把往修院去了。'},
    {t:'跟着人群走', lens:1, fx:{rep:{tabor:8, prague:-3, rose:-5}, lens:1}, app:{katka:8, zden:-12, matej:-8, petr:-4},
      r:'你跟着火把走到了城边的一座修院。门被撞开，圣像被拖到院子里，堆成一堆。火点起来的时候，有人在唱圣杯派的歌。\n\n一个老修女坐在院子角落里，看着那堆火。她没有哭。她在数念珠。'},
    {t:'等散了，去找他单独说话', chk:'lore', fx:{set:{zelivTalked:1}, t:{zeliv:10}, clue:'e_date'}, ffx:{t:{zeliv:3}},
      r:`人散了以后，他一个人坐在讲台的台阶上，像一根被抽空了的蜡烛。

<q>你觉得我疯了，</q>他说，<q>也许吧。可是你见过二月的塔博尔吗？一万个人等着世界结束，结果太阳照常升起来。他们需要一个新的日子，骑士。我只是给他们一个。</q>

他看着自己的手。<q>我知道我会怎么死。他们会在市政厅里砍我的头，就在我扔人出去的那扇窗子下面。我梦见过。</q>`,
      f:'他看了你一眼，没有说话，起身走了。'}
  ]
});

def({
  id:'s_vysehrad', at:'pbridge', act:[2], prio:9, t:'维舍赫拉德', la:'Vyšehrad', hint:'城南的王家要塞还没投降',
  text:`维舍赫拉德的城墙上飘着国王的旗。布拉格的市民围了它一个月，里面的人开始饿了。

今夜，一条小船从上游漂下来，船上盖着帆布。桥头的哨兵说，那是给要塞送粮的，船上还有几个女人和孩子，是守军的家眷，想混进去和丈夫团聚。

<q>拦下它，</q>哨兵的队长说，<q>饿到他们开门为止。</q>`,
  chime:{zden:'<q>船上有孩子，</q>齐德涅克说。他没有说别的。', katka:'<q>守军的孩子也是孩子，</q>卡佳咬着嘴唇，<q>可他们的爹在墙上射我们的人。</q>'},
  opts:[
    {t:'拦下船，粮食充公，人放回去', chk:'cmd', fx:{rep:{prague:8}, honor:3}, ffx:{rep:{prague:4}, hurt:1}, app:{matej:5, eliska:4, katka:3},
      r:'你们拦下了船。粮食搬上了岸，女人和孩子被送回了上游。一个女人在船上回头看了很久，看要塞的墙。墙上有一个人也在看她。'},
    {t:'让船过去', vow:undefined, fx:{rep:{prague:-10, crown:8}, honor:4, set:{letBoat:1}}, app:{zden:10, petr:6, katka:-5},
      r:'你对哨兵说，那是你的命令。哨兵骂了一句，没有拦。小船慢慢漂过桥洞，漂向要塞的水门。水门开了一条缝，又关上了。\n\n第二天，市民们知道了。有人在你住的地方门口画了一个叉。'},
    {t:'把船上的女人和孩子留在城里，好好安置', chk:'grace', fx:{rep:{prague:5, crown:3}, honor:6}, ffx:{rep:{prague:2}}, app:{zden:6, petr:4, matej:4, katka:2},
      r:'你说服了哨兵，也说服了船上的女人：要塞撑不了多久了，城里至少有面包。她们留了下来，住在一个寡妇家里。后来要塞投降那天，她们是第一批跑到城门口的人。'}
  ]
});

def({
  id:'s_prague_pledge', at:'oldtown', act:[2], prio:14, if: S => S.rep.prague >= 25 && !S.f.path, t:'市政厅的誓', la:'Iuramentum', hint:'老城议会想请你留下',
  text:`老城的议员们请你去市政厅。他们穿着黑袍，戴着毛皮领子，说话很慢，像在称金子。

<q>布拉格需要骑士，</q>领头的议员说，<q>不是塔博尔那种拿连枷的，是懂规矩的。西吉斯蒙德来了，我们要守城，也要谈判。守得住，才谈得了。</q>

桌上摆着一份文书，四条款：自由布道，饼酒同领，教士不得拥有世俗财产，严惩一切公开的罪。`,
  opts:[
    {t:'在文书上签名', fx:{set:{path:'prague'}, q:{q_prague:3}, rep:{prague:15, crown:-10, tabor:3}}, app:{matej:8, eliska:6, zden:-4},
      r:'你签了。羽毛笔很软，墨水很黑。议员们一个一个和你握手，手都很软。'},
    {t:'<q>我还没想好。</q>', fx:{rep:{prague:-2}}, r:'议员们互相看了一眼，很客气地送你出了门。'}
  ]
});

def({
  id:'s_close_gates', at:'oldtown', act:[2], prio:13, if: S => S.f.campUp && S.day >= 72, t:'关城门', la:'Portae clausae', hint:'十字军就在城外。布拉格要关城门了',
  text: S => `城外莱特纳高地上的帐篷，已经多得数不清了。塔博尔的人也到了：杰士卡带着他的车，从南门进的城，${S.f.olenkaTabor ? '奥莲卡跟在车后面，' : ''}全城的人都出来看他们。

明天一早，城门就要关了。关了，就不知道什么时候才能再开。`,
  opts:[
    {t:'留在城里', fx:{set:{act:3}}, r:'你留了下来。城门在你身后合上，声音很闷，像一本很厚的书合上了。', next:'s_act3'},
    {t:'再等等（还有些事要办）', r:'你还有事没办完。城门不会今天就关。可也不会等太久了。'}
  ]
});

// ---------- 库特纳霍拉 ----------
def({
  id:'s_kutna_arrive', mode:'arrive', region:'kutna', prio:50, t:'银子的城', la:'Kuttenberg', tag:'库特纳霍拉',
  text:`库特纳霍拉的城门口站着德意志卫兵，问你话用的是德语。城里到处是矿渣堆，灰白色的，像一座座小坟。

圣芭芭拉教堂的脚手架上，石匠在雕一个矿工的像。教堂盖了三十年，还没盖完，矿工们说，等银子挖完了，它就盖完了。

你问路去坎克矿井，一个老矿工看了你很久，用捷克语说：<q>别往井里看。</q>`,
  opts:[{t:'……', fx:{q:{q_kutna:2}}, r:'他说完就走了。'}]
});

def({
  id:'s_shaft', at:'shaft', act:[2, 3], prio:12, t:'井口', la:'Os putei', hint:'围着木栏的废矿井',
  text: S => `坎克矿井的井口很窄，只够一个人下去。木栏上系着一些布条，红的、白的，风一吹就飘。

你趴在木栏上，往下看。什么也看不见。一股冷气从下面冒上来，带着铁锈和水的味道。

然后你听见了。

${L('叩。叩。叩。停。叩。叩。叩。很慢，很耐心，像在数什么人。', '嗒。嗒。嗒。是水，从很高的地方滴下来，滴在什么空的东西上。', '叩，叩，叩。你分不清是水，还是别的。')}`,
  chime:{matej:'<q>井下有暗河，</q>马捷伊说，<q>所有的矿都有。</q>他说得很快，像在说服自己。', katka:'卡佳没有说话。她把一根红布条系在了木栏上。', petr:'彼得跪了下来，把额头抵在木栏上。<q>他们还在，</q>他说，<q>他们在等人记得。</q>'},
  opts:[
    {t:'系一根绳子，下去看看', chk:'nerve', takes:true, fx:{clue:'s_alive', set:{survivor:1}, rep:{tabor:8}, honor:5, mind:-1}, ffx:{hurt:1, mind:-2, clue:'s_water'}, app:{katka:10, zden:6, ilona:5},
      r:`你下了四十丈。灯快灭了。井底是一条横巷，积着齐膝深的水，水面上漂着东西，你没有低头去看。

敲击声是从横巷深处来的。你顺着声音走过去，看见一个人，瘦得像一根柴，靠着石壁坐着，手里拿着一块石头，一下一下地敲着。

他看见你的灯，愣了很久。<q>我以为，</q>他说，<q>我已经死了。</q>

他在下面待了二十天。他说，和他一起扔下来的人，他每天数一遍。`,
      f:'你下到一半，绳子磨断了一股。你吊在黑暗里，听着下面的滴水声，嗒，嗒，嗒，终于没敢再往下。'},
    {t:'听它敲了多少下', lens:-1, fx:{lensClue:['s_knock', 's_water']}, app:{matej:3},
      r: S => seeing() ? '你数了。三下，停，三下。一直数到第一百下，它都没有乱过。矿工们说，那是被扔下去的人在数自己的人。' : '你数了。嗒，嗒，嗒。有时候快，有时候慢，跟着风。井下有暗河，水从石缝里滴下来，滴在一辆空矿车上。'},
    {t:'跪下来，为井下的人念经', lens:2, fx:{clue:'s_names', lens:2, mind:-2}, app:{petr:6, zden:4},
      r:`你跪在木栏前，开始念亡者经。

念到一半，你听见井下有人在跟着你念。很多人。声音很轻，像从很远的地方传上来。

然后他们开始念名字。一个，两个。第三个名字，是你父亲的名字。

你停下来。下面也停了。只有水声。`}
  ]
});

def({
  id:'s_vogt', at:'mint', act:[2], prio:11, t:'一个格罗申', la:'Grossus', who:['vogt'], hint:'韦伯矿长在院子里数银子',
  text:`韦伯矿长是个大块头，金色的胡子，说话很和气。他用捷克语和你说话，说得比你还好。

<q>俘虏？</q>他笑了，<q>是的，我们买。西吉斯蒙德的人在乡下抓异端，抓了太多，养不起，卖给我们，一个格罗申一个。</q>他把一枚刚铸好的格罗申放在你手心里，<q>就这么多。</q>

<q>你们拿他们做什么？</q>

他看着你，很平静。<q>你知道我们拿他们做什么。明天还有一车，从赫鲁比那边来的。</q>`,
  opts:[
    {t:'<q>那一车，我买了。</q>', fx:{q:{q_kutna:3}, set:{willBuy:1}, seed:[['s_prisoners', 1, 1]]}, r:'韦伯挑了挑眉毛。<q>十二个人，一个人五个格罗申，</q>他说，<q>对你，涨价了。明天中午，井口。</q>'},
    {t:'<q>你会下地狱的。</q>', chk:'nerve', fx:{q:{q_kutna:3}, seed:[['s_prisoners', 1, 1]], t:{vogt:-10}}, app:{katka:6, petr:4, eliska:-3},
      r:'<q>也许，</q>他说，<q>可在那之前，我先下矿井。我天天下。</q>他转过身，接着数他的银子。<q>明天中午，井口。你想看，就来看。</q>'},
    {t:'把那枚格罗申还给他，走了', fx:{q:{q_kutna:3}, seed:[['s_prisoners', 1, 1]]}, r:'他接过格罗申，在手里抛了抛。<q>你会回来的，</q>他说，<q>人都会回来看的。</q>'}
  ]
});

def({
  id:'s_prisoners', mode:'seed', t:'一车人', la:'Captivi', tag:'库特纳霍拉 · 正午', if: S => S.region === 'kutna',
  text:`正午，一辆牛车停在了坎克矿井边。车上坐着十二个人，手脚绑着，有男有女，最小的一个看起来不到十五岁。

韦伯矿长站在井口边，手里拿着一本账。矿工们围成一圈，没有人说话。

一个老人抬起头，看见了你。他认得你。他是柳溪的佃户，春天跟着去了塔博尔。`,
  chime:{katka:'卡佳的连枷已经从肩上滑到了手里。', zden:'<q>这不是战争，</q>齐德涅克低声说，<q>这是屠宰。</q>', eliska:'<q>五个格罗申一个，</q>爱丽什卡说，<q>六十个，买得起。别做傻事。</q>'},
  opts:[
    {t:'付钱，把人买下来', cost:60, fx:{set:{prisonersFreed:1}, q:{q_kutna:'done'}, rep:{tabor:12, home:8}, honor:4}, app:{eliska:6, zden:6, katka:4},
      r:'你把六十个格罗申一枚一枚放在韦伯的账本上。他数了两遍，在账本上画了一道线。<q>做生意，</q>他说，<q>总是要两边都满意。</q>\n\n你带着十二个人走出了库特纳霍拉。那个老佃户一路都在哭，哭得像个孩子。'},
    {t:'拔剑，抢人', chk:'arm', fx:{set:{prisonersFreed:1}, q:{q_kutna:'done'}, rep:{tabor:15, home:8, crown:-10}, honor:6}, pfx:{hurt:1}, ffx:{hurt:2, q:{q_kutna:'fail'}, rep:{tabor:5}}, app:{katka:12, ilona:5, eliska:-6, matej:-3},
      r:'你砍断了第一根绳子，然后是第二根。矿工们没有动。他们只是看着，像在看一场他们早就知道结局的戏。韦伯叫来的卫兵只有四个。你们带着十二个人冲出了城门。',
      p:'你们冲出了城门，十二个人一个也没少。你身上多了两道口子。',
      f:'卫兵来得太快了。你被打倒在井口边。等你醒过来，牛车已经空了。井下，有人在敲。'},
    {t:'转身走开', vow:'abandon', fx:{q:{q_kutna:'fail'}, set:{prisonersDied:1}, mind:-3, rep:{tabor:-8, home:-6}}, app:{katka:-20, zden:-8, petr:-10, ilona:-6},
      r:'你转身走了。你没有回头。\n\n那天夜里，你在矿工酒馆里喝醉了。德意志矿工们在唱歌，唱得很响。你听不见井里的声音。可是第二天早上，你走过坎克矿井，木栏上多了十二根布条。'}
  ]
});

// ---------- 玫瑰堡 ----------
def({
  id:'s_rose_arrive', mode:'arrive', region:'rose', prio:40, t:'河湾里的城堡', la:'Rosa', tag:'玫瑰堡', who:['warden'],
  text:`伏尔塔瓦河在这里拐了一个大弯，弯里是玫瑰家的城堡。城墙是粉色的，在夕阳里像一朵巨大的、开了很久的玫瑰。

监护人在大厅里接见你。他是个温和的老人，说话从不说满。长桌的另一头坐着少年领主，十七岁，脸上的胡子还是软的，一直在看你的剑。

<q>柳溪的骑士，</q>监护人说，<q>你父亲是个忠诚的人。忠于谁，我从来没弄清楚过。你呢？</q>`,
  opts:[{t:'<q>我忠于柳溪。</q>', fx:{q:{q_rose:1, q_lady:1}, rep:{rose:3}, meet:'warden'}, r:'监护人笑了。<q>好回答，</q>他说，<q>玫瑰家的人，也只忠于玫瑰。</q>'},
    {t:'<q>我还在找。</q>', fx:{q:{q_rose:1, q_lady:1}, meet:'warden'}, r:'<q>找吧，</q>他说，<q>找到了，告诉我。我也在找。</q>'}]
});

def({
  id:'s_lady', at:'gallery', ph:[2], prio:10, t:'长廊尽头', la:'Domina alba', hint:'夜里的长廊',
  text: S => `夜里，你睡不着，在长廊里走。月光从窗子里斜进来，一格一格地铺在地上，画像里的人都在看你。

长廊尽头站着一个女人。

白衣，赤脚，头发很长，一直垂到腰上。${L('她没有影子。月光穿过她，落在她身后的地上。', '她赤着脚，脚背冻得发青。月光下，她的影子长长地拖在地上。', '月光很亮，你看不清她有没有影子。')}

她看着你，然后转身，走进了墙边的一扇小门。`,
  opts:[
    {t:'跟上去', chk:'nerve', fx:{lensClue:['l_seen', 'l_sister'], seed:[['s_lady_death', 1, 0]]}, ffx:{mind:-2, lensClue:['l_seen', 'l_sister'], seed:[['s_lady_death', 1, 0]]},
      r: S => seeing() ? '你推开那扇小门。门后是一堵墙，砌死的，砖缝里长着青苔，至少有一百年没打开过了。' : '你推开那扇小门，是一道旋梯，往北塔去。旋梯上有一串湿的脚印，很小，很轻。',
      f:'你的腿不听使唤。等你走到那扇门前，门后只有一堵墙。'},
    {t:'站着不动，看着她走', lens:1, fx:{clue:'l_seen', lens:1, seed:[['s_lady_death', 1, 0]]}, r:'你没有动。她也没有回头。小门在她身后合上了，没有声音。'}
  ]
});
def({
  id:'s_lady_death', mode:'seed', t:'钟声', la:'Campana', region:'rose',
  text:'第二天早上，城堡的小钟响了。玫瑰家的一个老仆人死在了床上，没有病，没有伤，睡着就没有醒。他在玫瑰家干了五十年。\n\n仆人们在厨房里小声说话，说昨夜有人在长廊里看见了她。',
  opts:[{t:'……', fx:{mind:-1}, r:'你想说，那个老人七十岁了。你没有说。'}]
});
def({
  id:'s_lady_tower', at:'gallery', ph:[0, 1], prio:9, if: S => S.done.s_lady, t:'北塔', la:'Turris borealis', hint:'长廊尽头那扇小门',
  text:'白天，你又去了长廊尽头。小门后面是一道旋梯，你爬上去，北塔顶上有一间小屋，门从外面锁着。门里有人在唱歌，唱的是一首很老的玫瑰家的摇篮曲。',
  opts:[
    {t:'去问监护人', chk:'grace', fx:{clue:['l_sister', 'l_portrait'], q:{q_lady:'done'}, t:{warden:8}}, ffx:{clue:'l_portrait', q:{q_lady:'done'}, t:{warden:-5}},
      r:`监护人沉默了很久。<q>是我姐姐，</q>他终于说，<q>她二十岁那年疯了。夜里，她会穿着睡袍出来走。我们把门锁上，她总能找到别的门。</q>

他领你去看长廊里的一幅画像。一百年前的玫瑰家女主人，穿着白衣，赤着脚。

<q>她们长得一模一样，</q>他说，<q>我姐姐和画里的人。我小时候问过母亲，母亲说：玫瑰家的女人，每一代都有一个会变成她。</q>`,
      f:'<q>北塔？</q>监护人的脸色变了，<q>北塔里什么也没有。</q>可他第二天就让人把长廊尽头那扇小门砌死了。你再去看那幅一百年前的画像，画里的女人穿着白衣，赤着脚。'},
    {t:'隔着门跟她说话', lens:1, fx:{clue:'l_portrait', q:{q_lady:'done'}, lens:1, mind:-1},
      r:'歌停了。门里的人说：<q>你昨晚跟着我。</q>声音很年轻，年轻得不像住了几十年的人。<q>你父亲也跟过我，很多年前。他也没跟上。</q>\n\n你问她是谁。她又开始唱歌了。'}
  ]
});

def({
  id:'s_warden_choice', at:'hall', act:[2], prio:12, who:['warden'], t:'两封信', la:'Duae epistolae', hint:'监护人想听听你的意见',
  if: S => S.done.s_rose_arrive && !S.f.roseSide,
  text:`监护人把两封信摊在长桌上。一封盖着布拉格议会的圣杯印，一封盖着西吉斯蒙德的双头鹰。

<q>布拉格请玫瑰加入他们，守城，保卫圣杯，</q>他说，<q>国王请玫瑰加入他，讨伐异端，事后分地。</q>

少年领主坐在桌子的另一头，一直在看你。<q>我想去布拉格，</q>他忽然说，<q>我想看看他们怎么领圣杯。</q>

监护人没有理他。<q>你从两边都来过，柳溪的骑士。你说，玫瑰该站在哪里？</q>`,
  chime:{zden:'齐德涅克站在少年领主的椅子后面，什么也没说。可你看见他的手，按在胸前的十字架上。'},
  opts:[
    {t:'<q>圣杯。这是波希米亚人的仗。</q>', chk:'grace', fx:{set:{roseSide:'chalice'}, q:{q_rose:'done'}, rep:{rose:5, prague:10, tabor:5, crown:-10}}, ffx:{set:{roseSide:'neutral'}, q:{q_rose:'done'}, rep:{rose:-3}}, app:{katka:5, matej:6, zden:-8},
      r:'监护人看了少年领主很久。<q>你父亲会骂我的，</q>他说，然后在布拉格的那封信上盖了玫瑰的印。少年领主笑了，笑得像一个刚得到第一匹马的孩子。',
      f:'监护人听完，客气地谢了你，把两封信都收进了抽屉里。<q>再等一等，</q>他说，<q>玫瑰开得慢。</q>'},
    {t:'<q>王冠。教皇和国王站在一边，玫瑰不该站在对面。</q>', chk:'grace', fx:{set:{roseSide:'crown'}, q:{q_rose:'done'}, rep:{rose:5, crown:10, prague:-8, tabor:-8}}, ffx:{set:{roseSide:'neutral'}, q:{q_rose:'done'}}, app:{zden:8, katka:-10, matej:-5},
      r:'监护人点了点头，像是你说出了他心里的话。他在双头鹰的那封信上盖了玫瑰的印。少年领主低下头，没有再说话。',
      f:'监护人听完，客气地谢了你，把两封信都收进了抽屉里。'},
    {t:'<q>哪边都别站。等。</q>', fx:{set:{roseSide:'neutral'}, q:{q_rose:'done'}, rep:{rose:8}}, app:{eliska:6, zden:-3},
      r:'监护人笑了，笑得很真心。<q>你比你父亲聪明，</q>他说，<q>也比他冷。</q>他把两封信都收了起来。'},
    {t:'<q>我替玫瑰去打这一仗。</q>（为玫瑰效力）', if: S => S.rep.rose >= 20 && !S.f.path, fx:{set:{path:'rose', roseSide:'neutral'}, q:{q_rose:'done'}, rep:{rose:15}}, app:{zden:10},
      r:'监护人站了起来，第一次正眼看你。<q>那么，</q>他说，<q>你替玫瑰去看。到最后一刻，你告诉我，玫瑰该往哪边倒。</q>'}
  ]
});

def({
  id:'s_ilona_mob', at:'square', act:[2], prio:15, if: S => !cm('ilona').met, t:'库曼人', la:'Cumana', who:['ilona'], hint:'广场上一群人围着什么',
  text:`集市广场上围了一圈人。圈子中间，一个女人被绑在拴马桩上，脸上全是血。她穿着皮袍，头发编成很多根细辫子，辫梢上挂着铜铃。

<q>库曼人！</q>有人喊，<q>西吉斯蒙德的狗！探子！</q>一块石头砸在她额头上。她没有低头。

她用一种你听不懂的话说了一句什么，然后用很生硬的德语说：<q>我只是来看马。</q>`,
  chime:{katka:'<q>她是来打我们的，</q>卡佳说，可是她的手没有去拿石头。', petr:'彼得已经走进了人圈里。', zden:'<q>这不是审判，</q>齐德涅克说。'},
  opts:[
    {t:'走进人圈：<q>俘虏归我。</q>', chk:'cmd', fx:{meet:'ilona', t:{ilona:20}, honor:4, rep:{prague:-2}}, ffx:{meet:'ilona', t:{ilona:15}, hurt:1}, app:{zden:8, petr:8, katka:-3, matej:4},
      r:`人群散了。你割断了绳子，她顺着拴马桩滑下来，坐在地上，用手背擦脸上的血。

<q>你要我做什么？</q>她用德语问，<q>当奴隶？当妾？当探子？</q>

<q>我什么也不要。</q>

她看了你很久，忽然笑了，笑得很累。<q>伊洛娜，</q>她说，<q>库曼人。我的马被他们吃了。</q>`,
      f:'你挤进人圈，挨了好几块石头，有一块是冲着她去的。最后人群还是散了。她看着你额头上的血，笑了：<q>傻子。</q>她说她叫伊洛娜。'},
    {t:'<q>交给城里的法官。</q>', fx:{meet:'ilona', t:{ilona:5}, rep:{prague:3}}, app:{matej:3},
      r:'法官把她关进了石桥塔楼的牢房。三天后，你听说她撬开了窗栏，从塔上跳进了河里。没有人找到她的尸体。'},
    {t:'走开', vow:'abandon', fx:{meet:'ilona', t:{ilona:-20}}, app:{petr:-8, zden:-6},
      r:'你走开了。身后，石头一块一块落下去。第二天，拴马桩上只剩下一根断了的绳子和一个铜铃。'}
  ]
});
def({
  id:'s_ilona_join', mode:'chain', t:'铜铃', la:'Tintinnabulum', who:['ilona'],
  text:'伊洛娜坐在马槽边上，一边让你给她额头上药，一边编她散掉的辫子。<q>西吉斯蒙德的人说，波希米亚人吃小孩，</q>她说，<q>我来了才知道，你们只吃马。</q>她看了看你的老马，<q>这匹马太老了。你需要一个懂马的人。</q>',
  opts:[
    {t:'<q>那就跟着我。</q>', fx:{join:'ilona', t:{ilona:5}}, r:'<q>我跟着马，</q>她说，<q>马跟着你。就这样。</q>'},
    {t:'<q>回你的营地去吧。</q>', fx:{t:{ilona:3}}, r:'<q>营地里的人会问我，波希米亚人什么样，</q>她说，<q>我就说：有一个傻子。</q>她走了。后来你在十字军营的匈牙利营里又见到了她。'}
  ]
});
ST.s_ilona_mob.opts[0].next = (S, tier) => 's_ilona_join';

def({
  id:'s_camp_arrive', mode:'arrive', region:'camp', prio:40, t:'帐篷的海', la:'Castra', tag:'十字军营',
  text:`莱特纳高地上的帐篷连成一片海。全欧洲的骑士都来了，各自带着自己的旗、自己的神父、自己的厨子和自己的仇。

迈森人在和奥地利人吵架，吵的是谁先攻城。西里西亚人在卖从波希米亚村子里抢来的锅。一个法兰西骑士站在帐篷门口，问每一个路过的人：<q>异端在哪里？我走了两个月，还没见过一个。</q>

营地中间有一顶红色的大帐，门口站着两排卫兵。里面有人在笑，笑声很响，很好听。`,
  opts:[{t:'……', fx:{q:{q_crown:1}}, r:'有人问你是哪一边的。你说是柳溪的。他们就不问了，好像柳溪是一个国家。'}]
});

def({
  id:'s_sigis', at:'pavilion', act:[2, 3], prio:14, who:['sigis'], t:'罗马人的国王', la:'Rex Romanorum', hint:'皇帐里的人愿意见你',
  text: S => `西吉斯蒙德比你想的高，比你想的英俊。红胡子分成两股，像一条河在下巴上分了岔。他请你坐，亲手给你倒酒。

<q>柳溪，</q>他说，<q>我哥哥在的时候，你父亲来过宫里。他是个好人，有点笨。</q>他举起杯子，<q>你不笨。我看得出来。</q>

${S.f.bohusDead ? '<q>赫鲁比的博胡斯拉夫死了，</q>他说，<q>他的地空着。一个懂事的骑士，可以把两条溪合成一条。</q>' : '<q>我需要懂这片土地的人，</q>他说，<q>不是来抢锅的人。</q>'}

<q>帮我拿下布拉格，</q>他说，<q>我会记得你。</q>`,
  chime:{ilona:'伊洛娜站在帐篷门口，低着头。国王的眼睛从她身上滑过去，像滑过一件家具。', katka:'卡佳的手一直攥着连枷。卫兵一直盯着她的手。', matej:'<q>他也是这么对胡斯说话的，</q>马捷伊用拉丁语低声说，<q>在康斯坦茨。</q>'},
  opts:[
    {t:'<q>我为陛下效力。</q>', if: S => !S.f.path, fx:{set:{path:'crown'}, q:{q_crown:2}, rep:{crown:20, tabor:-15, prague:-12}, money:80}, app:{zden:4, katka:-15, matej:-10, ilona:-3, eliska:5},
      r:'他笑了，拍了拍你的手。<q>好，</q>他说，<q>好。</q>他给了你一袋格罗申，银子是库特纳霍拉铸的，还很新。'},
    {t:'<q>陛下，胡斯那张安全通行证，后来去哪儿了？</q>', chk:'nerve', fx:{rep:{crown:-10, tabor:8, prague:8}, honor:5, t:{sigis:-15}}, ffx:{rep:{crown:-15}, hurt:1}, app:{matej:12, katka:10, eliska:-5, zden:-4},
      r:'帐篷里静了下来。西吉斯蒙德慢慢放下了杯子。\n\n<q>烧掉了，</q>他说，<q>和他一起。</q>他笑了，笑声还是很好听。<q>柳溪的骑士，你可以走了。趁我还记得你父亲。</q>',
      f:'两个卫兵把你架了出去，扔在了营地外面的泥里。'},
    {t:'<q>我是来求陛下饶过柳溪的。</q>', chk:'grace', fx:{set:{homeSpared:1}, rep:{crown:5, home:10}}, ffx:{rep:{home:3}}, app:{eliska:5, zden:5},
      r:'<q>柳溪？</q>他想了想，叫来一个书记，在一张纸上写了几个字，盖了印。<q>拿着，</q>他说，<q>我的人看见这个，就不会碰你的溪。</q>他又给你倒了一杯酒。<q>我不是坏人，柳溪的骑士。我只是想要我的王冠。</q>',
      f:'<q>柳溪是什么？</q>他问身边的人。没有人知道。他笑着摇了摇头，让你走了。'}
  ]
});

def({
  id:'s_mill', at:'mill', prio:10, who:['miller'], t:'杯子', la:'Pocula', hint:'磨坊主的架子上全是倒扣的杯子',
  text:`磨坊主是个绿眼睛的老人，衣角总是湿的，像刚从水里出来。他的架子上摆满了杯子：陶的、木头的、锡的、一只裂了口的玻璃杯，全都倒扣着，一个挨一个。

<q>别碰，</q>他说，<q>它们睡着了。</q>`,
  opts:[
    {t:'翻开一只看看', lens:1, fx:{lensClue:['m_bubble', 'm_list'], q:{q_mill:1}, t:{miller:-5}},
      r: S => seeing() ? '你翻开一只锡杯。杯底下的桌面上，有一点水汽。一个很小的气泡从水汽里升起来，飘过你的鼻尖，飘出了窗外。磨坊主叹了口气：<q>你放走了一个。</q>' : '你翻开一只锡杯。杯底刻着一个名字和一个日子：马雷克，一四〇九年，春汛。磨坊主说：<q>他是在我的水闸里淹死的。每一只杯子，都是一个淹死的人用过的。</q>'},
    {t:'<q>这些杯子是谁的？</q>', fx:{clue:'m_drowned', q:{q_mill:1}, t:{miller:6}},
      r:'<q>淹死的人的，</q>他说，<q>我儿子是第一个。十年前，就在那个水闸里。</q>他指了指窗外，<q>从那以后，河里淹死一个人，我就去要一只他用过的杯子。杯子扣着，他们就不冷。</q>\n\n他看着你。<q>今年春天，鱼塘里会淹死很多人。你替我记下他们的名字，好吗？</q>'},
    {t:'坐下来，陪他喝一杯', fx:{mind:2, t:{miller:10}, q:{q_mill:1}},
      r:'他从架子上拿下来一只正着放的杯子，那是他自己的。你们喝的是河水，凉得刺牙。<q>你会活很久，</q>他喝完说，<q>水不收你。我看得出来。</q>'}
  ]
});
def({
  id:'s_mill_return', at:'mill', prio:12, who:['miller'], if: S => S.q.q_mill === 2, t:'名字', la:'Nomina', hint:'把苏多梅日的名字带给磨坊主',
  text:'你把苏多梅日的名字念给他听。有塔博尔的人，也有铁领主的人。他一个一个地听，每听一个，就从架子底下拿出一只新杯子，扣在桌上。念完了，桌上多了十九只杯子。',
  opts:[{t:'……', fx:{q:{q_mill:'done'}, set:{waterPromise:1}, mind:2, t:{miller:15}, clue:'m_list'},
    r:'<q>谢谢你，</q>他说，<q>现在他们不冷了。</q>他把一只小小的木杯塞进你手里，<q>你的。我先替你扣着。等你老了，再来拿。</q>'}]
});

def({
  id:'s_noon', at:'fields', ph:[1], act:[2, 3], prio:9, t:'正午', la:'Meridies', hint:'正午的麦田里没有人。也许有一个',
  text: S => `正午的太阳像一块烧红的铁。麦田里没有人，所有人都躲在树荫下。

只有一个女人还在割麦子，是佃户家的大女儿，叫玛日卡。她一个人在田中间，弯着腰，一下一下。

然后她直起腰，看着田的另一头，像在听什么人说话。她的嘴在动，在回答。

${L('田的另一头站着一个穿白衣服的高个子女人，手里拿着一把镰刀。', '田的另一头什么也没有，只有热气，一层一层地往上冒，把远处的树都烤弯了。', '田的另一头，热气在晃。')}`,
  opts:[
    {t:'冲过去，把她拖到树荫下', chk:'nerve', lens:-1, fx:{rep:{home:8}, lens:-1}, ffx:{rep:{home:4}, hurt:1},
      r:'你把她拖到柳树下，往她头上浇了一桶溪水。她醒过来，脸红得像烧过的砖，说她刚才在和一个女人说话，那个女人问她亚麻是怎么变成布的，她答不上来。\n\n老人们说，答不上正午女人的问题，就会被她割走。你说，是太阳。他们看着你，像看一个外国人。'},
    {t:'替她回答那个问题', chk:'faith', lens:2, fx:{rep:{home:10}, lens:2, mind:-1}, ffx:{rep:{home:3}, mind:-2},
      r:'你走进田里，站在玛日卡旁边，大声说：<q>亚麻先泡在水里，再晒，再打，再梳，再纺，再织。</q>\n\n热气晃了一下。玛日卡倒在你怀里，醒过来的时候说：<q>她笑了。她说，你答得对。</q>',
      f:'你张开嘴，不知道问题是什么。玛日卡倒了下去。你把她抱回村子，她烧了三天，醒来什么也不记得。'}
  ]
});

def({
  id:'s_act3', mode:'chain', t:'七月', la:'Iulius', tag:'第三幕', if: S => !S.f.act3Shown,
  text: S => `七月。

西吉斯蒙德的大军把布拉格围了三面。莱特纳高地上的帐篷多得像下了一场白色的雪。城堡里的王家守军从山上往城里射火箭。

塔博尔人进城了。杰士卡带着他的车，${S.f.olenkaTabor ? '奥莲卡跟在车后面，' : ''}从南门走进来，全城的人都出来看他们，像看一群从末日里走出来的人。

所有人都在看城东的那道山脊：维特科夫。谁守住它，谁就守住了布拉格的粮道。

${S.f.path ? '' : '你还没有向任何一边宣誓。现在，你得选了。'}`,
  opts:[
    {t:'和塔博尔人一起，守维特科夫', if: S => !S.f.path || S.f.path === 'tabor', fx:{set:{path:'tabor', act3Shown:1, act:3}, rep:{tabor:10}, q:{q_vitkov:1}}, app:{katka:10, zden:-8}, r:'杰士卡看见你，那只眼睛眯了一下。<q>维特科夫，</q>他说，<q>明天开始挖沟。</q>'},
    {t:'和布拉格的市民一起，守城', if: S => !S.f.path || S.f.path === 'prague', fx:{set:{path:'prague', act3Shown:1, act:3}, rep:{prague:10}, q:{q_vitkov:1}}, app:{matej:8, eliska:6}, r:'老城的议员们把你安排在城墙上。'},
    {t:'替玫瑰去看', if: S => S.f.path === 'rose' || (!S.f.path && S.rep.rose >= 15), fx:{set:{path:'rose', act3Shown:1, act:3}, q:{q_vitkov:1}}, app:{zden:6}, r:'玫瑰家的兵扎在城南的河边，不进城，也不进营。监护人说，玫瑰开得慢。'},
    {t:'去莱特纳的营地，为王冠效力', if: S => S.f.path === 'crown' || (!S.f.path && S.rep.crown >= 15), fx:{set:{path:'crown', act3Shown:1, act:3}, rep:{crown:10}, q:{q_vitkov:1}}, app:{katka:-12, zden:4}, r:'迈森人的元帅把你编进了攻打维特科夫的队伍。'},
    {t:'回柳溪。这不是我的仗。', fx:{set:{path:'home', act3Shown:1, act:3}, rep:{home:15}, q:{q_vitkov:1}}, app:{petr:6, eliska:3, katka:-6}, r:'你骑马回了柳溪。母亲站在门口等你，好像她早就知道你会回来。'}
  ]
});

def({
  id:'s_vit_dig', at:'vitkov', act:[3], prio:12, once:false, if: S => S.f.path === 'tabor' && !S.f.vitkovDone && (S.f.vitDug || 0) < 3, who:['zizka'],
  t:'挖沟', la:'Fossa', hint: S => `和杰士卡的人一起修工事（${S.f.vitDug || 0}/3）`,
  text: S => ['山脊最窄的地方，杰士卡让人挖一道沟，再在沟后面垒一道石墙和一座木头哨塔。<q>不用多高，</q>他说，<q>只要让骑士下马。骑士一下马，就是人了。</q>',
    '石墙垒到齐胸高了。女人们在沟里插削尖的木桩，孩子们在搬石头，一筐一筐往哨塔上运。<q>石头也是武器，</q>一个老妇人对你说，<q>你砸过人吗？</q>',
    '哨塔盖好了，小得像个鸡笼。杰士卡爬上去，用那只眼睛往北边看了很久。<q>二十六个人，</q>他说，<q>够了。山会替我们打。</q>'][Math.min(2, S.f.vitDug || 0)],

    {t:'带着人干', chk:'cmd', fx:{inc:{vitDug:1, vitDef:1}, rep:{tabor:4}, xp:{cmd:1}}, ffx:{inc:{vitDug:1}}, r:'你把人分成三班，一班挖，一班运，一班歇着唱歌。歌是塔博尔人的歌：你们是上帝的战士。唱到第三遍，连杰士卡都跟着哼了起来。', f:'人太多，地方太窄，大家挤在一起，干得不多。'}
  ]
});

def({

  text:`议员们在市政厅里吵了一整天。维特科夫山上只有杰士卡的几十个人，如果十字军上了山，城里就要准备援军。可是城门一开，王家守军就会从城堡里冲下来。

  chime:{matej:'<q>派一个神父，</q>马捷伊说，<q>举着圣体走在最前面。人会跟着圣体走，比跟着旗走得快。</q>', eliska:'<q>我知道迈森人哪一天动手，</q>爱丽什卡轻声说，<q>别问我怎么知道的。</q>'},

    {t:'<q>我带援军。神父走在前面，我走在神父前面。</q>', fx:{set:{vitCity:1}, inc:{vitDef:1}, rep:{prague:6}}, app:{matej:8}, r:'议员们互相看了一眼，同意了。马捷伊在你身边低声说：<q>你知道圣体挡不了箭。</q>你说你知道。'},
    {t:'请爱丽什卡说出那个日子', if: S => inParty('eliska'), fx:{set:{vitCity:1, vitIntel:1}, inc:{vitDef:2}, rep:{prague:4}}, app:{eliska:6, matej:-2},
      r:'爱丽什卡看了你一眼，叹了口气。<q>十四号，</q>她说，<q>中午之前。迈森人的元帅喜欢在饭前打仗。</q>议员们没有问她怎么知道的。他们只是把钟楼的钥匙交给了你。'},
    {t:'<q>山上撑不住，就让它撑不住。城门不能开。</q>', fx:{set:{vitCity:1, cityHeld:1}, rep:{prague:3, tabor:-8}}, app:{eliska:4, katka:-12, matej:-4}, r:'议员们松了一口气。他们不想冒险。你也是。'}
  ]

def({
  id:'s_vit_crown', at:'tents', act:[3], prio:12, if: S => S.f.path === 'crown' && !S.f.vitCrown && !S.f.vitkovDone, t:'迈森人的军议', la:'Consilium', hint:'迈森的元帅在帐篷里画图',
  text:`迈森的元帅在帐篷里铺开一张羊皮纸，用匕首尖指着城东的那道山脊。

  chime:{ilona:'伊洛娜在帐篷外面喂马。她看了你一眼，又低下了头。', katka:'卡佳没有跟你进帐篷。她在外面，背对着这座营地站着，一直站着。'},

    {t:'<q>北坡太窄，骑士上不去。走东边。</q>（骗他）', vow:'lie', chk:'grace', fx:{set:{vitCrown:'lied'}, inc:{vitDef:2}, rep:{crown:-3}}, ffx:{set:{vitCrown:'suspect'}, rep:{crown:-10}}, app:{katka:10, matej:6},
      r:'元帅皱着眉看了地图很久，然后把匕首往东边挪了一寸。他信了。至少，他信了一半。', f:'元帅看着你，看了很久。<q>波希米亚人，</q>他说，<q>都向着波希米亚人。</q>他没有再问你。'},
    {t:'夜里派人去山上报信', if: S => inParty('ilona') || inParty('eliska'), fx:{set:{vitCrown:'warned', vitWarned:1}, inc:{vitDef:3}, rep:{crown:-5, tabor:10}}, app:{ilona:8, eliska:4, zden:-6},
      r: S => `${inParty('ilona') ? '伊洛娜' : '爱丽什卡的一个伙计'}趁着夜色出了营。天亮之前回来了，只说了一句：<q>独眼的人说，知道了。</q>`}

def({

  text: S => `一队兵在往柳溪来，二十几个，穿着各色的号衣，有十字军的散兵，也有塔博尔的逃兵。他们不是来打仗的，是来抢粮的。

      r:'他们以为柳溪只有农民。他们没想到农民后面站着一个骑士，骑士后面站着整个村子。打了不到一刻钟，他们就跑了，丢下了两匹马。',

    {t:'把那张盖印的纸给他们看', if: S => S.f.homeSpared, fx:{set:{homeRaid:'paper'}, rep:{home:8}}, r:'领头的人认不得字，可他认得那个双头鹰的印。他骂了一句，带着人走了。母亲在门口看着你，没有问那张纸是哪里来的。'},

// ---------- 维特科夫 ----------
def({
  id:'s_vitkov', mode:'auto', act:[3], prio:95, if: S => S.day >= VIT_DAY && !S.f.vitkovDone, takes:true,
  t:'维特科夫', la:'Mons Vitkov', tag:'七月十四日',
  text: S => ({
    tabor:`天亮的时候，北坡上全是人。迈森人、图林根人、奥地利人，几千个，穿着甲，举着旗，像一条铁的河，慢慢往山上流。

山顶的沟后面，只有你们：二十几个男人，三个女人，一个孩子。杰士卡站在哨塔上，独眼眯着。${S.f.olenkaTabor ? '\n\n奥莲卡在你旁边，手里拿着一块石头。她没有发抖。' : ''}

<q>让他们上来，</q>杰士卡说，<q>山脊只有这么宽。</q>`,
    prague:`钟楼上的钟响了。不是报时，是乱敲，一声接一声。

维特科夫山上撑不住了。你站在城东的门里，身后是几百个市民，拿着长枪、草叉、锅铲。${inParty('matej') ? '马捷伊站在最前面，手里捧着一只银圣杯。他没有穿甲。' : '一个瘦小的神父站在最前面，手里捧着圣体。他没有穿甲。'}

城门开了。`,
    crown:`天亮的时候，你跟着迈森人爬上了维特科夫的北坡。坡很陡，越往上越窄，最后只够七八个人并排走。

山顶上，一道沟，一道石墙，一座小得可笑的木头哨塔。墙后面露出几十个脑袋，有男人，也有女人。

元帅在你身后喊：<q>上去！为了上帝和国王！</q>`,
    rose:`你站在城南的河边，玫瑰家的兵扎在你身后。从这里，能看见维特科夫的山脊，像一条躺着的龙。

山上在打。你看见北坡上的旗，一面一面往上挪；山顶上的人在往下扔石头。监护人的信使就在你身边，马备好了，只等你一句话。`,
    home:`七月十四号，柳溪下了一场雨。

你站在庄园门口，看着北边。布拉格在三天的路外面，你什么也看不见，什么也听不见。可是那天正午，村教堂的钟自己响了一下。扬神父发誓，他没有碰钟绳。`
  })[S.f.path || 'home'],
  opts:[
    // 塔博尔
    {t:'守住沟', if: S => S.f.path === 'tabor', chk:'arm', dc: S => Math.min(2, (S.f.vitDef || 0) - 1), fx:{set:{vitHold:'ok'}}, pfx:{hurt:1, set:{vitHold:'mid'}}, ffx:{hurt:2, set:{vitHold:'bad'}}, app:{katka:8},
      r:'第一个跳进沟里的骑士，被木桩钉住了。第二个，被你的剑。第三个看了看沟，看了看你，退了。可是后面的人推着他，他退不了。', p:'沟里全是人，你分不清是谁的胳膊、谁的血。你守住了，可是左肩被砍开了。', f:'他们太多了。沟被尸体填平了，他们踩着尸体爬上来。', next:'s_vit2'},
    {t:'和女人们一起扔石头', if: S => S.f.path === 'tabor', chk:'nerve', fx:{set:{vitHold:'ok'}}, pfx:{set:{vitHold:'mid'}}, ffx:{hurt:1, set:{vitHold:'bad'}}, app:{katka:6, petr:3},
      r:'你站在石墙后面，和三个女人一起，把一筐一筐的石头往下砸。一个女人一边砸一边骂，骂的是你听过最脏的话。山坡上的人一个一个往下滚。', f:'你扔得太慢了。他们爬到了墙根下。', next:'s_vit2'},
    {t:'唱：你们是上帝的战士', if: S => S.f.path === 'tabor', chk:'faith', lens:1, fx:{set:{vitHold:'ok'}, lens:1, clue:'c_priest'}, pfx:{set:{vitHold:'mid'}}, ffx:{set:{vitHold:'bad'}}, app:{petr:6, katka:6, matej:-2},
      r:'你开始唱。一个人，然后是两个，然后是整座山。<em>你们是上帝的战士，祈求祂的帮助，信靠祂……</em>\n\n北坡上的骑士停住了。后来活下来的人说，他们听见整座山都在唱，好像山下面也有人在唱。', f:'你唱了，可是声音被喊杀声吞掉了。', next:'s_vit2'},
    // 布拉格
    {t:'跟在神父后面冲', if: S => S.f.path === 'prague', chk:'nerve', lens:1, fx:{set:{vitHold:'ok'}, clue:'c_priest'}, pfx:{hurt:1, set:{vitHold:'mid'}}, ffx:{hurt:1, set:{vitHold:'mid'}}, app:{matej:10},
      r: S => `你们冲上了山坡。${inParty('matej') ? '马捷伊' : '神父'}走在最前面，举着圣杯，在唱。箭从他身边飞过去，一支，两支，十支。没有一支射中他。\n\n山脊上的十字军看见了你们，看见了那只杯子。他们开始往后退。`, next:'s_vit2'},
    {t:'带着人从侧面绕上去', if: S => S.f.path === 'prague', chk:'cmd', lens:-1, fx:{set:{vitHold:'ok'}, clue:'c_panic'}, ffx:{hurt:1, set:{vitHold:'mid'}}, app:{eliska:6, matej:3},
      r:'你带着一百个人从南边的葡萄园绕上去，从侧面扑向山脊。山脊太窄了。前面的骑士一转身，后面的人就被挤下了北坡的悬崖。他们不是被打败的，是被自己人挤下去的。', next:'s_vit2'},
    // 王冠
    {t:'冲上去', if: S => S.f.path === 'crown', chk:'arm', fx:{set:{vitHold:'lost'}, rep:{crown:5}}, ffx:{hurt:2, set:{vitHold:'lost'}}, app:{zden:3, katka:-8},
      r:'你冲到了沟边。沟后面的石墙上，一个女人拿着一块石头，看着你。她没有扔。她在等你再近一点。', next:'s_vit2'},
    {t:'停下，不往上走', if: S => S.f.path === 'crown', vow:'retreat', fx:{set:{vitHold:'lost'}, rep:{crown:-8}, honor:-3}, app:{katka:6, ilona:6, petr:6},
      r:'你停下来。身后的人推着你往上，你侧身让开，让他们过去。他们一个一个从你身边挤上去，挤上了那道窄得只能走七个人的山脊。', next:'s_vit2'},
    {t:'调转剑尖，冲进杰士卡的沟里', if: S => S.f.path === 'crown', vow:'lie', chk:'nerve', fx:{set:{vitHold:'ok', turnedVitkov:1, path:'tabor'}, rep:{crown:-30, tabor:20}}, ffx:{hurt:2, set:{vitHold:'ok', turnedVitkov:1, path:'tabor'}, rep:{crown:-30, tabor:15}}, app:{katka:20, zden:-15, ilona:8},
      r:'你跳过了沟。墙后面的人举起了连枷，杰士卡在哨塔上喊了一声，连枷停在了半空。你转过身，和他们站在了一起。', next:'s_vit2'},
    // 玫瑰
    {t:'让玫瑰从背后打西吉斯蒙德', if: S => S.f.path === 'rose', chk:'grace', fx:{set:{vitHold:'ok', roseSide:'chalice'}, rep:{rose:10, prague:15, crown:-20}}, ffx:{set:{vitHold:'ok', roseSide:'neutral'}, rep:{rose:-5}}, app:{katka:6, zden:-10},
      r:'信使骑马走了。半个时辰后，玫瑰家的骑兵出现在了十字军营地的南边。他们没有冲锋，只是排开了阵，让营地里的人看见。可是这就够了：迈森人的元帅回头看见了玫瑰，就再也没有心思往山上看了。', f:'信使走了，可监护人没有动。玫瑰开得太慢了。', next:'s_vit2'},
    {t:'让玫瑰等着，不动', if: S => S.f.path === 'rose', fx:{set:{vitHold:'ok', roseSide:'neutral'}, rep:{rose:8}}, app:{eliska:4}, r:'你对信使说：等。玫瑰家的兵在河边坐了一整天，看着山上的仗，像看一场骑马比武。', next:'s_vit2'},
    // 柳溪
    {t:'……', if: S => S.f.path === 'home', fx:{set:{vitHold:'far'}}, r:'你在门口站了一整天。母亲给你端来一碗汤，你也没有喝。', next:'s_vit2'}
  ]
});

def({
  id:'s_vit2', mode:'chain', t:'山脊', la:'Iugum', tag:'维特科夫',
  text: S => {
    if (S.f.path === 'home') return `三天后，一个骑马的人经过柳溪，在井边喝水。

<q>维特科夫守住了，</q>他说，<q>几十个人，守住了一座山。迈森人从北坡上滚下去，摔死的比打死的还多。</q>他擦了擦嘴，<q>城里的人说，是一个神父举着圣体冲上去，十字军就跑了。也有人说，是山脊太窄。</q>${S.f.olenkaTabor ? '\n\n<q>山上有个年轻女人，</q>他又说，<q>是南边来的，剪着短头发……</q>他看了看你的脸，没有说下去。' : ''}`;
    if (S.f.path === 'crown' && !S.f.turnedVitkov) return `你看着他们往山脊上挤。七个人并排，然后是五个，然后是三个。

然后城门开了。一个神父举着圣体，后面跟着几百个市民，从南边冲上山来。山脊上的骑士回头去看，前面的人往后退，后面的人往前挤，挤成一团。

然后他们开始往北坡下面掉。一个，两个，十个。北坡是悬崖。`;
    return `中午的时候，城门开了。

一个神父举着圣体走在最前面，后面是几百个布拉格的市民，拿着什么的都有。他们从南边冲上了山。山脊上的十字军回头去看，前面的人往后退，后面的人往前挤，挤成一团。

然后他们开始往北坡下面掉。

${L('后来人们说，那个神父没有穿甲，没有一支箭射中他。人们说，是上帝在那道山脊上。', '后来你想，山脊只有那么宽，北坡是悬崖。几千个穿着甲的人挤在一条只能走七个人的路上，往后退的时候，总有人要掉下去。', '你分不清，是那只杯子，还是那道山脊。')}`;
  },
  opts:[
    {t:'找奥莲卡', if: S => S.f.olenkaTabor && S.f.path === 'tabor', chk:'nerve',
      fx:{set:{olenkaAlive:1}, q:{q_sister:'done'}, t:{olenka:10}}, pfx:{set:{olenkaHurt:1}},
      ffx: S => S.f.vitHold === 'bad' ? {set:{olenkaDead:1}, q:{q_sister:'done'}, kill:'olenka', why:'死在维特科夫的石墙后面。她手里还攥着一块石头。', mind:-4} : {set:{olenkaAlive:1, olenkaHurt:1}, q:{q_sister:'done'}},
      r:'你在石墙后面找到了她。她坐在一堆石头上，满脸是土，手里还攥着最后一块石头，没有扔出去。<q>我还以为，</q>她说，<q>我会死在今天。</q>\n\n你把她抱住了。她终于哭了。',
      p:'你在石墙后面找到了她。她的腿被砍伤了，可她还活着。她看见你，笑了：<q>告诉母亲，我扔了很多石头。</q>',
      f: S => S.f.vitHold === 'bad' ? '你在石墙后面找到了她。她靠着墙坐着，眼睛睁着，手里还攥着一块石头。后来人们说，山上有一个女人，到死都不肯后退一步，她说：我虽然是女人，也不给反基督让路。\n\n人们说的是她。' : '你找了很久，最后在哨塔下面找到了她。她的头上缠着布，可是还活着。',
      fin:false, next:'s_vit_end'},
    {t:'救杰士卡', if: S => S.f.path === 'tabor' && S.f.vitHold !== 'ok', chk:'arm', fx:{set:{savedZizka:1}, t:{zizka:20}, rep:{tabor:15}, honor:8}, ffx:{hurt:1, t:{zizka:5}},
      r:'杰士卡从哨塔上摔了下来，被几个迈森人围住了。你冲过去，用肩膀撞开了一个，用剑挡住了另一个。他爬起来，用那只眼睛看了你一眼。<q>格伦瓦尔德之后，</q>他说，<q>你欠我的，还清了。</q>', f:'你冲过去的时候，市民们已经先到了。杰士卡被人扶起来，看了你一眼，点了点头。', next:'s_vit_end'},
    {t:'从北坡上拉一个迈森骑士上来', chk:'arm', fx:{honor:6, set:{savedMeissen:1}, mind:1}, ffx:{hurt:1}, app:{zden:8, petr:6, ilona:4, katka:-3},
      r:'悬崖边上，一个年轻的骑士抓着一丛灌木，脚下是几十丈的空。他的头盔掉了，你看见他的脸，比你还年轻。你把他拉了上来。他坐在地上，用德语说了一句谢谢，然后吐了。', f:'你伸手去拉他，灌木断了。他掉了下去，掉了很久。', next:'s_vit_end'},
    {t:'站着，看', lens:-1, fx:{clue:'c_panic', lens:-1}, r:'你站着看。你看见了所有的事，又好像什么也没看懂。', next:'s_vit_end'}
  ]
});

def({
  id:'s_vit_end', mode:'chain', t:'葡萄园', la:'Vinea', tag:'维特科夫 · 黄昏',
  text: S => `黄昏的时候，山脊安静了。葡萄园被踩烂了，青色的葡萄滚了一地，和别的东西混在一起。

${S.f.path === 'crown' && !S.f.turnedVitkov ? '你跟着溃兵退回了莱特纳的营地。元帅的帐篷里没有人说话。西吉斯蒙德在他的红帐篷里，笑声停了。' : '布拉格所有的钟都在响。这一次，它们响得一样。'}

${S.party.map(id => ({katka:'卡佳坐在一辆翻倒的车上，用裙角擦着她的连枷，一边擦一边哼歌。', zden:'齐德涅克跪在悬崖边，在为掉下去的人念经。不管是哪一边的。', petr:'彼得在给伤员包扎，不问是哪一边的。他的手上全是血，脸上却很平静。', ilona:'伊洛娜牵着一匹没有主人的马回来了。<q>它比你们都聪明，</q>她说，<q>它早就跑了。</q>', matej:'马捷伊坐在葡萄园的矮墙上，捧着那只圣杯，杯里没有酒。他看着它，很久没说话。', eliska:'爱丽什卡在数人。不是数死人，是数还欠她钱的人。数着数着，她停了下来。'})[id]).join('\n\n')}`,
  opts:[{t:'……', fx: S => ({set:{vitkovDone:1, vitkovWin:S.f.path !== 'crown' || S.f.turnedVitkov}, q:{q_vitkov:'done'}, rep:S.f.path === 'crown' && !S.f.turnedVitkov ? {crown:5} : {tabor:5, prague:5}}), r:'后来，人们把这座山叫做杰士卡山。', next:'s_coronation'}]
});

def({
  id:'s_coronation', mode:'chain', t:'加冕', la:'Coronatio', tag:'七月二十八日',
  text: S => `两个星期以后，西吉斯蒙德在山上的城堡里加冕了。

圣维特大教堂里一半是空的。波希米亚的大领主们来了几个，布拉格的市民一个也没有来。大主教的手在抖，王冠戴上去的时候歪了一下。

${S.f.path === 'crown' ? '你站在教堂里，离王冠只有十步远。' : '你站在石桥上，看着山上的城堡。教堂的钟在响，可是城里没有一座钟回应它。'}

加冕之后的第三天，他拔营走了。全欧洲的骑士跟着他走了，带着他们的旗、他们的神父、他们从波希米亚村子里抢来的锅。

莱特纳高地上的草，慢慢地又长了出来。`,
  opts:[
    {t:'跪下', if: S => S.f.path === 'crown', fx:{rep:{crown:10}, set:{knelt:1}}, r:'你跪下了。新王的手套碰了一下你的肩膀。<q>柳溪，</q>他说，<q>我记得你。</q>你不知道这是一个奖赏，还是一个威胁。', next:'s_after'},
    {t:'看着他戴上王冠', fx:{}, r:'你看着。王冠是金的，在烛光里很亮。可你觉得，它比你见过的任何一顶头盔都重。', next:'s_after'},
    {t:'转身走开', if: S => S.f.path !== 'crown', fx:{rep:{prague:3, tabor:3}}, r:'你转身走下了石桥。身后的钟声越来越远。桥下，伏尔塔瓦河照常流着，像什么也没有发生。', next:'s_after'}
  ]
});

def({
  id:'s_after', mode:'chain', t:'夏天的尽头', la:'Finis aestatis', tag:'八月',
  text: S => `八月了。麦子黄了，该收了。

这个夏天，你走过了很多路。${S.lovers.filter(alive).length ? `${S.lovers.filter(alive).map(nm).join('和')}在你身边。` : ''}${S.party.length ? `${S.party.filter(id => !S.lovers.includes(id)).map(nm).join('、')}${S.party.filter(id => !S.lovers.includes(id)).length ? '还跟着你。' : ''}` : '你一个人。'}

现在，你要去哪里？`,
  opts:[
    {t:'回柳溪，收麦子', fx:{set:{future:'home'}}, r:'你回了柳溪。', fin:true},
    {t:'跟着杰士卡走。仗还没打完。', if: S => S.rep.tabor >= 20 && S.f.path !== 'crown', fx:{set:{future:'tabor'}}, r:'杰士卡的车队往南走了。你骑着马，跟在最后一辆车后面。', fin:true},
    {t:'留在布拉格', if: S => S.rep.prague >= 15, fx:{set:{future:'prague'}}, r:'你留在了布拉格。', fin:true},
    {t:'跟着新王走', if: S => S.f.path === 'crown', fx:{set:{future:'crown'}}, r:'你跟着西吉斯蒙德的大军往北走了。回头看的时候，布拉格的塔尖在热气里晃。', fin:true},
    {t: S => `跟${nm(S.lovers.filter(alive)[0])}走，去${({katka:'塔博尔', zden:'玫瑰堡', petr:'林子里', ilona:'匈牙利的平原', matej:'一座有书的修院', eliska:'新城的酿酒坊'})[S.lovers.filter(alive)[0]]}`, if: S => S.lovers.filter(alive).length > 0, fx: S => ({set:{future:'lover', futureWith:S.lovers.filter(alive)[0]}}), r:'你们走了。没有回头。', fin:true}
  ]
});

// ===== 结局 =====
const TELL = {
  end:{q:'山上的人等的末日', j:'它来过。只是我们没有认出来。', c:'它没有来。传道人算错了日子。'},
  cup:{q:'苏多梅日和维特科夫', j:'上帝在那里。我看见了。', c:'是泥，是山脊，是人。'},
  mill:{q:'磨坊主的杯子', j:'杯子底下有人在呼吸。', c:'那是一个老人在想他的儿子。'},
  shaft:{q:'坎克矿井', j:'井下的人在数自己的人。', c:'井下有水，也有一个活下来的人。'},
  lady:{q:'玫瑰堡的白衣女人', j:'她一百年前就在那里了。', c:'她是监护人疯了的姐姐。'},
  touch:{q:'彼得的手', j:'他的手能治病。', c:'他的袖子里有柳树皮。'}
};
function finishGame() {
  S.ending = {kind:'end', tell:{}};
  clearSave(); closeModal();
  renderTelling();
}
function renderTelling() {
  document.body.dataset.ph = 1;
  const e = S.ending, ms = MYST.filter(m => S.mopen[m.id]);
  const has = (m, s) => S.clues.some(c => CLUES[c].m === m && CLUES[c].s === s);
  $('#app').innerHTML = `<div class="end">
    <div class="end-h"><span class="lat">Narratio</span><h1 style="font-size:40px">多年以后</h1></div>
    <p class="ash" style="max-width:36em">很多年以后，你的孙辈缠着你讲一四二〇年的夏天。你坐在柳溪的炉火边，想了很久，不知道从哪里讲起。</p>
    <div class="testi">${ms.map(m => { const T = TELL[m.id], cur = e.tell[m.id];

def(

    opts:[{t:'<q>他也是这么守着柳溪的。</q>', fx:{app:{zden:6}, mind:1}, r:'<q>你也会的，</q>他说，<q>我看得出来。你守誓的样子，和他一样笨。</q>他说“笨”的时候，声音很软。'}]},
  {id:'c_zden_flirt', mode:'camp', party:['zden'], prio:30, if: S => app('zden') >= 35 && cm('zden').rom === 0, t:'手套', la:'Chirotheca', who:['zden'],

def({

      r: S => S.f.zdenForgave ? '他站了很久。然后他松开了剑柄，转身走了出去。走到阳光里，他才停下来，靠着教堂的墙，慢慢地滑坐到地上。<q>他在念主祷文，</q>他说，<q>我哥哥。他在念主祷文。</q>' : '他拔剑的时候，热利夫斯基没有躲。他只是闭上了眼睛，像在等一件等了很久的事。'},
